name: SandHybrid Fix27 Moddable Scene Images Release

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - "include/epoch/sand/scene_image.hpp"
      - "src/scene_image.cpp"
      - "tests/scene_image_contract.cpp"
      - "scenes/README.txt"
      - "tools/apply_fix27.py"
      - "tools/patch_fix27_apply.py"
      - "tools/audit_fix27.py"
      - ".github/workflows/sandhybrid-fix27.yml"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: sandhybrid-fix27-release
  cancel-in-progress: true

jobs:
  build-test-release:
    runs-on: windows-2022
    timeout-minutes: 90

    steps:
      - name: Check out Fix27 branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Patch Fix27 correction matcher
        shell: pwsh
        run: |
          python tools/patch_fix27_apply.py
          if ($LASTEXITCODE -ne 0) { throw 'Fix27 matcher patch failed.' }

      - name: Apply Fix27 scene and GUI corrections
        shell: pwsh
        run: |
          python tools/apply_fix27.py
          if ($LASTEXITCODE -ne 0) { throw 'Fix27 correction pass failed.' }

      - name: Regenerate material and UI data
        shell: pwsh
        run: |
          python tools/generate_ui_text.py
          if ($LASTEXITCODE -ne 0) { throw 'UI/material generation failed.' }

      - name: Audit material contracts
        shell: pwsh
        run: |
          python tools/audit_material_behaviors.py
          if ($LASTEXITCODE -ne 0) { throw 'Material behavior audit failed.' }

      - name: Audit motion and ecology contracts
        shell: pwsh
        run: |
          python tools/audit_ecology_motion.py
          if ($LASTEXITCODE -ne 0) { throw 'Ecology/motion audit failed.' }

      - name: Audit Fix27 contracts
        shell: pwsh
        run: |
          python tools/audit_fix27.py
          if ($LASTEXITCODE -ne 0) { throw 'Fix27 audit failed.' }

      - name: Validate shader and CPU contracts
        shell: pwsh
        run: |
          python tools/validate_shader_contracts.py
          if ($LASTEXITCODE -ne 0) { throw 'Shader contract validation failed.' }

      - name: Bootstrap pinned vcpkg
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $vcpkgRoot = Join-Path $env:RUNNER_TEMP 'vcpkg'
          git clone --filter=blob:none https://github.com/microsoft/vcpkg.git $vcpkgRoot
          git -C $vcpkgRoot checkout 04a735608afac5844e86fc91d6ba2112cac613c1
          & (Join-Path $vcpkgRoot 'bootstrap-vcpkg.bat') -disableMetrics
          "VCPKG_ROOT=$vcpkgRoot" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Configure Windows x64 Release
        shell: pwsh
        run: |
          cmake -S . -B build/windows -G "Visual Studio 17 2022" -A x64 `
            -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake" `
            -DVCPKG_TARGET_TRIPLET=x64-windows `
            -DEPOCH_SAND_WARNINGS_AS_ERRORS=ON `
            -DEPOCH_SAND_ENABLE_VALIDATION=OFF `
            -DBUILD_TESTING=ON

      - name: Build Windows x64 and every SPIR-V shader
        shell: pwsh
        run: cmake --build build/windows --config Release --parallel

      - name: Run all C++23 contract tests
        shell: pwsh
        run: ctest --test-dir build/windows -C Release --output-on-failure

      - name: Commit verified source to main
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Remove-Item -LiteralPath 'tools/apply_fix27.py' -Force
          Remove-Item -LiteralPath 'tools/patch_fix27_apply.py' -Force
          Remove-Item -LiteralPath 'tools/audit_fix27.py' -Force
          Remove-Item -LiteralPath '.github/workflows/sandhybrid-fix27.yml' -Force
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'SandHybrid Fix27: add moddable scene images and structural minimums'
          git push origin HEAD:main
          $releaseSha = git rev-parse HEAD
          "RELEASE_SHA=$releaseSha" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Package verified Windows release
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $distRoot = Join-Path $env:GITHUB_WORKSPACE 'dist'
          $stage = Join-Path $distRoot 'SandHybrid_Windows_x64_Fix27'
          $archive = Join-Path $distRoot 'SandHybrid_Windows_x64_Fix27.zip'
          Remove-Item -LiteralPath $distRoot -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Path $stage | Out-Null
          Copy-Item 'build/windows/Release/epoch_sand.exe' (Join-Path $stage 'SandHybrid.exe') -Force
          Copy-Item 'build/windows/Release/shaders' (Join-Path $stage 'shaders') -Recurse -Force
          Copy-Item 'build/windows/Release/scenes' (Join-Path $stage 'scenes') -Recurse -Force
          Copy-Item README.md, LICENSE -Destination $stage -Force
          Set-Content -LiteralPath (Join-Path $stage 'run.bat') -Value @('@echo off', 'cd /d "%~dp0"', 'SandHybrid.exe') -Encoding ascii
          Compress-Archive -Path (Join-Path $stage '*') -DestinationPath $archive -CompressionLevel Optimal
          (Get-FileHash -Algorithm SHA256 $archive).Hash.ToLowerInvariant() + '  SandHybrid_Windows_x64_Fix27.zip' |
            Set-Content -LiteralPath (Join-Path $distRoot 'SHA256SUMS.txt') -Encoding ascii
          "RELEASE_ARCHIVE=$archive" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Upload verified artifact
        uses: actions/upload-artifact@v4
        with:
          name: SandHybrid_Windows_x64_Fix27
          path: |
            dist/SandHybrid_Windows_x64_Fix27.zip
            dist/SHA256SUMS.txt
          if-no-files-found: error

      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = 'v1.3.0-fix27'
          gh release view $tag --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) { gh release delete $tag --repo $env:GITHUB_REPOSITORY --yes --cleanup-tag }
          gh release create $tag $env:RELEASE_ARCHIVE 'dist/SHA256SUMS.txt' `
            --repo $env:GITHUB_REPOSITORY `
            --target $env:RELEASE_SHA `
            --title 'SandHybrid Windows Fix27' `
            --notes 'Verified Fix27: scenes save and load as editable 640x360 PPM images; missing built-in images export automatically after their procedural fallback is first reset; material_key.txt and material_key.ppm provide exact mod colors; F5/SAVE writes and F9/LOAD reloads the selected scene; structural material below 32 same-material pixels in an aligned 8x8 region crumbles, while 32-51 pixels receive reduced durability and 52+ receive full durability; one-pixel glass and structural minorities can no longer remain supported by an unrelated block; Eraser remains permanently visible below the element palette; a persistent keymap is placed directly between elements and the active material card.'

      - name: Close trigger PR and delete branch
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr close ${{ github.event.pull_request.number }} --repo $env:GITHUB_REPOSITORY --comment 'Fix27 verified build and release completed; source was pushed directly to main.'
          git push origin --delete ${{ github.event.pull_request.head.ref }}
