name: Record MC-070 completion

on:
  push:
    branches: [agent/complete-sandhybrid-library]

permissions:
  contents: write

concurrency:
  group: record-mc070
  cancel-in-progress: false

jobs:
  record:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/complete-sandhybrid-library

      - name: Record validated completion
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('missioncache.md')
          text = path.read_text(encoding='utf-8')
          marker = '## MC-070 — reusable SandHybrid core library'
          if marker in text:
              raise SystemExit(0)

          mc70 = '| MC-070 | PARTIAL | `SandHybrid` static library | CMake builds a C++23 `SandHybrid` static library with public headers under `include/sandhybrid`; native startup and `main` remain outside. Broader ownership/API review and downstream reuse acceptance remain required. |\n'
          mc71 = '| MC-071 | PARTIAL | Thin `SandHybrid_Demo` | `SandHybrid_Demo` is a separate executable linking the static library and owning native startup/events. Full thinning of renderer/UI host responsibilities and downstream embedding acceptance remain required. |'
          mc71_new = '| MC-071 | PARTIAL | Thin `SandHybrid_Demo` | `SandHybrid_Demo` owns native startup/events and links the optional in-tree `SandHybrid::VulkanRuntime`; Vulkan renderer code no longer enters the core archive. Exported runtime/native-host embedding acceptance remains required. |'
          mc72 = '| MC-072 | PARTIAL | Optional subsystems | `SANDHYBRID_BUILD_APP=OFF` cleanly builds/tests the core library without Vulkan/windowing. Independent switches for streaming, debug, UI, actors, ecology, and factories remain open. |'
          mc72_new = '| MC-072 | PARTIAL | Optional subsystems | `SANDHYBRID_BUILD_APP=OFF` with `SANDHYBRID_BUILD_VULKAN_RUNTIME=OFF` builds, tests, installs, and externally consumes a clean core package without configuring Vulkan, EpochGui, shaders, windowing, or native event sources. Independent switches for streaming, debug, UI, actors, ecology, and factories remain open. |'

          for required in (mc70, mc71, mc72):
              if text.count(required) != 1:
                  raise SystemExit(f'ledger source mismatch: {required[:32]}')

          text = text.replace(mc70, '')
          text = text.replace(mc71, mc71_new)
          text = text.replace(mc72, mc72_new)

          archive = '# Archived release history\n'
          evidence = '''\n## MC-070 — reusable SandHybrid core library\n\nValidated source: `402b744b1e92d6f3334665112b30fdd4a3cba590` on branch `agent/complete-sandhybrid-library`.\n\nAccepted CI:\n\n- Headless library/package matrix: GitHub Actions run `30736832042` passed on Windows 2022 and Ubuntu 24.04.\n- Full Vulkan/demo matrix: GitHub Actions run `30736832063` passed on Windows 2022 and Ubuntu 24.04, including shader compilation, demo build, tests, install, archive, and artifact upload.\n\nAcceptance evidence:\n\n- `SandHybrid::SandHybrid` is a platform-neutral C++23 static library containing only scene image I/O and section scheduling implementation units; it has no process entry point, native window source, Vulkan renderer source, Vulkan/Threads/EpochGui link dependency, or hidden application ownership.\n- The installed package exports `SandHybridConfig.cmake`, `SandHybridConfigVersion.cmake`, `SandHybridTargets.cmake`, and `SandHybrid::SandHybrid`.\n- A clean external project installs the package, resolves it with `find_package(SandHybrid CONFIG REQUIRED)`, links it, and runs without repository-private include paths.\n- The package contract rejects runtime-only application, shared-state, UI, Vulkan renderer, window, and EpochGui header leakage.\n- Ownership and consumption are documented in `LIBRARY.md`; compile-time public API and downstream package contracts run under strict warnings on both supported platforms.\n\nMC-070 is complete. MC-071 and MC-072 remain active for exported native-runtime embedding and independent subsystem switches.\n\n'''
          if text.count(archive) != 1:
              raise SystemExit('archive heading mismatch')
          path.write_text(text.replace(archive, archive + evidence, 1), encoding='utf-8')
          PY

          python tools/validate_mission_cache.py

      - name: Commit ledger evidence
        shell: bash
        run: |
          if git diff --quiet -- missioncache.md; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add missioncache.md
          git commit -m 'Record MC-070 library completion'
          git push origin HEAD:agent/complete-sandhybrid-library
