name: Correct Terrain Build and Release

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/correct-terrain-release-trigger'

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: epoch-sand-corrected-release
  cancel-in-progress: true

jobs:
  correct-build-release:
    runs-on: windows-2022
    timeout-minutes: 90

    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply exact terrain and laser rules
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          @'
          from pathlib import Path

          def replace_once(path_name: str, old: str, new: str) -> None:
              path = Path(path_name)
              text = path.read_text(encoding="utf-8")
              if old in text:
                  text = text.replace(old, new, 1)
                  path.write_text(text, encoding="utf-8")
                  return
              if new in text:
                  return
              raise SystemExit(f"Expected terrain contract not found in {path_name}: {old!r}")

          replace_once(
              "shaders/tiles.comp",
              "bool newlyStable = candidate && stableTicks >= TILE_STABILIZE_TICKS;",
              "bool stableRegion = candidate && stableTicks >= TILE_STABILIZE_TICKS;",
          )
          replace_once(
              "shaders/tiles.comp",
              "bool terrainStable = (structuralTile || newlyStable) && !collapsing;",
              "bool terrainStable = (structuralTile || stableRegion) && !collapsing;",
          )
          replace_once(
              "shaders/tiles.comp",
              "if (structuralTile || newlyStable) flags |= TILE_STRUCTURAL;",
              "if (structuralTile) flags |= TILE_STRUCTURAL;",
          )
          replace_once(
              "shaders/tiles.comp",
              "if (collapsing || newlyStable) cooldown = TILE_RESTABILIZE_COOLDOWN;",
              "if (collapsing) cooldown = TILE_RESTABILIZE_COOLDOWN;",
          )
          replace_once(
              "shaders/chemistry.comp",
              "result.aux |= AUX_STRUCTURAL | AUX_SUPPORTED;",
              "result.aux |= AUX_SUPPORTED;",
          )
          replace_once(
              "shaders/chemistry.comp",
              """    } else if (isStructural(source) && hasNeighbor(p, MAT_PLASMA_BOLT)) {
                  uint health = stateValue(source);
                  if (health <= 24u) {
                      result.aux &= ~(AUX_STRUCTURAL | AUX_SUPPORTED | AUX_MOVED);
                      setStateValue(result, 48u);
                      result.age = 0u;
                  } else {
                      setStateValue(result, health - 24u);
                  }
              }
          """,
              """    } else if (isStructural(source) && hasNeighbor(p, MAT_PLASMA_BOLT)) {
                  uint health = stateValue(source);
                  if (health == 0u) health = 255u;
                  const uint laserDamage = 144u;
                  if (health <= laserDamage) {
                      result.aux &= ~(AUX_STRUCTURAL | AUX_SUPPORTED | AUX_MOVED);
                      setStateValue(result, 48u);
                      result.age = 0u;
                  } else {
                      setStateValue(result, health - laserDamage);
                  }
              }
          """,
          )

          tiles = Path("shaders/tiles.comp").read_text(encoding="utf-8")
          chemistry = Path("shaders/chemistry.comp").read_text(encoding="utf-8")
          assert "if (structuralTile) flags |= TILE_STRUCTURAL;" in tiles
          assert "if (structuralTile || stableRegion) flags |= TILE_STRUCTURAL;" not in tiles
          assert "result.aux |= AUX_STRUCTURAL | AUX_SUPPORTED;" not in chemistry
          assert "const uint laserDamage = 144u;" in chemistry
          assert "structuralTile && previouslyDense && structural < TILE_COLLAPSE_OCCUPANCY" in tiles
          '@ | python -
          if ($LASTEXITCODE -ne 0) { throw 'Terrain correction failed.' }

      - name: Commit corrected source to main
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add shaders/tiles.comp shaders/chemistry.comp
          if (-not (git diff --cached --quiet)) {
            git commit -m 'Correct terrain stability and two-hit laser collapse'
            git push origin HEAD:main
            if ($LASTEXITCODE -ne 0) { throw 'Corrected source push failed.' }
          }
          $releaseSha = git rev-parse HEAD
          "RELEASE_SHA=$releaseSha" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Validate shader contracts
        shell: pwsh
        run: |
          python tools/validate_shader_contracts.py
          if ($LASTEXITCODE -ne 0) { throw 'Shader contract validation failed.' }

      - name: Bootstrap vcpkg
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = Join-Path $env:RUNNER_TEMP 'vcpkg'
          git clone --filter=blob:none https://github.com/microsoft/vcpkg.git $root
          git -C $root checkout 04a735608afac5844e86fc91d6ba2112cac613c1
          & (Join-Path $root 'bootstrap-vcpkg.bat') -disableMetrics
          if ($LASTEXITCODE -ne 0) { throw 'vcpkg bootstrap failed.' }
          "VCPKG_ROOT=$root" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Configure Windows x64 Release
        shell: pwsh
        run: |
          cmake -S . -B build/windows -G 'Visual Studio 17 2022' -A x64 `
            -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake" `
            -DVCPKG_TARGET_TRIPLET=x64-windows `
            -DVCPKG_HOST_TRIPLET=x64-windows `
            -DEPOCH_SAND_WARNINGS_AS_ERRORS=ON `
            -DEPOCH_SAND_ENABLE_VALIDATION=OFF `
            -DBUILD_TESTING=ON
          if ($LASTEXITCODE -ne 0) { throw 'CMake configuration failed.' }

      - name: Build Windows x64 Release
        shell: pwsh
        run: |
          cmake --build build/windows --config Release --parallel
          if ($LASTEXITCODE -ne 0) { throw 'Windows build failed.' }

      - name: Run C++23 contract tests
        shell: pwsh
        run: |
          ctest --test-dir build/windows -C Release --output-on-failure
          if ($LASTEXITCODE -ne 0) { throw 'C++23 contract tests failed.' }

      - name: Package release
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $dist = Join-Path $env:GITHUB_WORKSPACE 'dist'
          $stage = Join-Path $dist 'EpochSand_Windows_x64_Fix22'
          $archive = Join-Path $dist 'EpochSand_Windows_x64_Fix22.zip'
          Remove-Item $dist -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Path $stage | Out-Null
          cmake --install build/windows --config Release --prefix $stage
          if ($LASTEXITCODE -ne 0) { throw 'Release staging failed.' }
          Copy-Item README.md, LICENSE -Destination $stage -Force
          @('@echo off', 'cd /d "%~dp0bin"', 'epoch_sand.exe') |
            Set-Content -LiteralPath (Join-Path $stage 'run.bat') -Encoding ascii
          Compress-Archive -Path (Join-Path $stage '*') -DestinationPath $archive -CompressionLevel Optimal
          $hash = (Get-FileHash -Algorithm SHA256 $archive).Hash.ToLowerInvariant()
          "EpochSand_Windows_x64_Fix22.zip  SHA256: $hash" |
            Set-Content -LiteralPath (Join-Path $dist 'SHA256SUMS.txt') -Encoding ascii

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: EpochSand_Windows_x64_Fix22
          path: |
            dist/EpochSand_Windows_x64_Fix22.zip
            dist/SHA256SUMS.txt
          if-no-files-found: error

      - name: Publish corrected GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = 'v1.0.0-fix22'
          gh release view $tag --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release delete $tag --repo $env:GITHUB_REPOSITORY --yes --cleanup-tag
          }
          gh release create $tag `
            dist/EpochSand_Windows_x64_Fix22.zip `
            dist/SHA256SUMS.txt `
            --repo $env:GITHUB_REPOSITORY `
            --target $env:RELEASE_SHA `
            --title 'EpochSand Windows Fix22' `
            --notes 'Verified Windows x64 C++23 build. Aligned 8x8 regions never reconstruct: 52/64 occupied cells may qualify only for support and stability. A full structural pixel requires two ordinary laser hits to dislodge. Exactly 32 remaining pixels stay coherent; 31 remaining pixels means 33 were dislodged, so every remaining pixel drops immediately.'
          if ($LASTEXITCODE -ne 0) { throw 'GitHub Release publication failed.' }

      - name: Remove temporary branch and workflow
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD: ${{ github.event.pull_request.head.ref }}
        run: |
          $ErrorActionPreference = 'Stop'
          git pull --ff-only origin main
          Remove-Item '.github/workflows/correct-terrain-build-release.yml' -Force
          git add -A
          if (-not (git diff --cached --quiet)) {
            git commit -m 'Remove corrected release workflow [skip ci]'
            git push origin HEAD:main
            if ($LASTEXITCODE -ne 0) { throw 'Workflow cleanup push failed.' }
          }
          if ($env:PR_NUMBER) {
            gh pr close $env:PR_NUMBER --repo $env:GITHUB_REPOSITORY --delete-branch=false 2>$null
          }
          if ($env:PR_HEAD) {
            gh api -X DELETE "repos/$env:GITHUB_REPOSITORY/git/refs/heads/$env:PR_HEAD" 2>$null
          }
