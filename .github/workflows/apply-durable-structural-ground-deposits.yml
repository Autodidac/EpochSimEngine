name: Apply durable structural ground deposits

on:
  push:
    branches: [agent/durable-structural-ground-deposits-v254]

permissions:
  contents: write

jobs:
  apply:
    if: github.event.head_commit.message == 'Add durable structural and ground deposit applicator'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/durable-structural-ground-deposits-v254
          fetch-depth: 0

      - name: Apply durable structural and geology changes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text(encoding='utf-8')
              if old not in text:
                  raise SystemExit(f'missing replacement marker in {path}: {old[:140]!r}')
              file.write_text(text.replace(old, new, 1), encoding='utf-8')

          def insert_after(path: str, marker: str, addition: str) -> None:
              replace_once(path, marker, marker + addition)

          # Shared CPU world-layout contract: deterministic sparse deposits only
          # inside the real geology band, never in sky, scene, shells, or lava.
          structural_fn = '''[[nodiscard]] constexpr bool resident_substrate_is_structural(
              const Material material) noexcept {
              return material == Material::stone || material == Material::dirt ||
                     material == Material::sand || material == Material::silt;
          }
          '''
          deposit_helpers = '''
          [[nodiscard]] constexpr std::uint32_t resident_ground_hash(
              const std::uint32_t x, const std::uint32_t y) noexcept {
              auto value = x * 0x9e3779b9u ^ y * 0x85ebca6bu ^ 0xc2b2ae35u;
              value ^= value >> 16u;
              value *= 0x7feb352du;
              value ^= value >> 15u;
              value *= 0x846ca68bu;
              value ^= value >> 16u;
              return value;
          }

          [[nodiscard]] constexpr bool resident_ground_host_material(
              const Material material) noexcept {
              return material == Material::sand || material == Material::dirt ||
                     material == Material::silt || material == Material::mud ||
                     material == Material::stone;
          }

          [[nodiscard]] constexpr Material resident_ground_deposit_material(
              const Material base_material,
              const std::uint32_t x,
              const std::uint32_t y,
              const std::uint32_t depth) noexcept {
              if (!resident_ground_host_material(base_material)) return base_material;
              const auto roll = resident_ground_hash(x, y) & 4095u;
              if (roll < 24u) return Material::iron_ore;
              if (roll < 32u) return Material::copper;
              if (roll < 38u) return Material::aluminum;
              if (roll < 41u) return Material::gold;
              if (depth >= 160u && roll == 41u) return Material::uranium;
              return base_material;
          }
          '''
          insert_after('include/sandhybrid/world_layout.hpp', structural_fn, deposit_helpers)

          old_world_tail = '''    if (zone == 0u) {
              if (local_y < 96u) return Material::sand;
              if (local_y < 232u) return Material::dirt;
              if (((patch_x + patch_y * 3u) % 11u) == 0u) return Material::mud;
              return Material::silt;
          }

              if (zone == 1u) {
              if (local_y < 104u) return Material::dirt;
              if (local_y < 248u) {
                  if (((patch_x * 5u + patch_y) % 13u) == 0u) return Material::mud;
                  return Material::silt;
              }
              return ((patch_x + patch_y) % 7u) == 0u ? Material::stone : Material::sand;
          }

              if (local_y < 80u) {
              return ((patch_x * 3u + patch_y) % 9u) == 0u ? Material::mud : Material::silt;
          }
              if (local_y < 176u) return Material::dirt;
              if (local_y < 224u && ((patch_x + patch_y * 2u) % 5u) == 0u)
              return Material::sand;
              return Material::stone;
          }
          '''
          # Account for ordinary repository indentation rather than the YAML's
          # visual indentation in the literal above.
          old_world_tail = '\n'.join(line[10:] if line.startswith('          ') else line for line in old_world_tail.splitlines()) + '\n'
          new_world_tail = '''    Material geology = Material::stone;
              if (zone == 0u) {
              if (local_y < 96u) geology = Material::sand;
              else if (local_y < 232u) geology = Material::dirt;
              else if (((patch_x + patch_y * 3u) % 11u) == 0u) geology = Material::mud;
              else geology = Material::silt;
          } else if (zone == 1u) {
              if (local_y < 104u) geology = Material::dirt;
              else if (local_y < 248u) {
                  geology = ((patch_x * 5u + patch_y) % 13u) == 0u
                      ? Material::mud : Material::silt;
              } else {
                  geology = ((patch_x + patch_y) % 7u) == 0u
                      ? Material::stone : Material::sand;
              }
          } else if (local_y < 80u) {
              geology = ((patch_x * 3u + patch_y) % 9u) == 0u
                  ? Material::mud : Material::silt;
          } else if (local_y < 176u) {
              geology = Material::dirt;
          } else if (local_y < 224u && ((patch_x + patch_y * 2u) % 5u) == 0u) {
              geology = Material::sand;
          }
              return resident_ground_deposit_material(geology, x, y, depth);
          }
          '''
          new_world_tail = '\n'.join(line[10:] if line.startswith('          ') else line for line in new_world_tail.splitlines()) + '\n'
          replace_once('include/sandhybrid/world_layout.hpp', old_world_tail, new_world_tail)

          # GLSL reset uses the exact same hash, thresholds, and geology bounds.
          scene_boundary = '''uint sceneBoundaryMaterial(uint scene) {
              if (scene == SCENE_ENGINEERING) return MAT_INSULATOR;
              if (scene == SCENE_GOLD_MINE || scene == SCENE_DEMOLITION) return MAT_STEEL;
              return MAT_STONE;
          }
          '''
          scene_boundary = '\n'.join(line[10:] if line.startswith('          ') else line for line in scene_boundary.splitlines()) + '\n'
          glsl_deposits = '''
          uint residentGroundHash(ivec2 position) {
              uint value = uint(position.x) * 0x9e3779b9u ^
                           uint(position.y) * 0x85ebca6bu ^ 0xc2b2ae35u;
              value ^= value >> 16u;
              value *= 0x7feb352du;
              value ^= value >> 15u;
              value *= 0x846ca68bu;
              value ^= value >> 16u;
              return value;
          }

          bool residentGroundHostMaterial(uint material) {
              return material == MAT_SAND || material == MAT_DIRT ||
                     material == MAT_SILT || material == MAT_MUD ||
                     material == MAT_STONE;
          }

          uint residentGroundDepositMaterial(uint baseMaterial, ivec2 position, int depth) {
              if (!residentGroundHostMaterial(baseMaterial)) return baseMaterial;
              uint roll = residentGroundHash(position) & 4095u;
              if (roll < 24u) return MAT_IRON_ORE;
              if (roll < 32u) return MAT_COPPER;
              if (roll < 38u) return MAT_ALUMINUM;
              if (roll < 41u) return MAT_GOLD;
              if (depth >= 160 && roll == 41u) return MAT_URANIUM;
              return baseMaterial;
          }
          '''
          glsl_deposits = '\n'.join(line[10:] if line.startswith('          ') else line for line in glsl_deposits.splitlines()) + '\n'
          insert_after('shaders/reset.comp', scene_boundary, glsl_deposits)

          old_glsl_tail = '''    if (zone == 0) {
              if (localY < 96) return MAT_SAND;
              if (localY < 232) return MAT_DIRT;
              if (((geologyPatch.x + geologyPatch.y * 3) % 11) == 0) return MAT_MUD;
              return MAT_SILT;
          }
              if (zone == 1) {
              if (localY < 104) return MAT_DIRT;
              if (localY < 248) {
                  if (((geologyPatch.x * 5 + geologyPatch.y) % 13) == 0) return MAT_MUD;
                  return MAT_SILT;
              }
              return ((geologyPatch.x + geologyPatch.y) % 7) == 0 ? MAT_STONE : MAT_SAND;
          }
              if (localY < 80)
              return ((geologyPatch.x * 3 + geologyPatch.y) % 9) == 0 ? MAT_MUD : MAT_SILT;
              if (localY < 176) return MAT_DIRT;
              if (localY < 224 && ((geologyPatch.x + geologyPatch.y * 2) % 5) == 0) return MAT_SAND;
              return MAT_STONE;
          }
          '''
          old_glsl_tail = '\n'.join(line[10:] if line.startswith('          ') else line for line in old_glsl_tail.splitlines()) + '\n'
          new_glsl_tail = '''    uint geology = MAT_STONE;
              if (zone == 0) {
              if (localY < 96) geology = MAT_SAND;
              else if (localY < 232) geology = MAT_DIRT;
              else if (((geologyPatch.x + geologyPatch.y * 3) % 11) == 0) geology = MAT_MUD;
              else geology = MAT_SILT;
          } else if (zone == 1) {
              if (localY < 104) geology = MAT_DIRT;
              else if (localY < 248)
                  geology = ((geologyPatch.x * 5 + geologyPatch.y) % 13) == 0
                      ? MAT_MUD : MAT_SILT;
              else
                  geology = ((geologyPatch.x + geologyPatch.y) % 7) == 0
                      ? MAT_STONE : MAT_SAND;
          } else if (localY < 80) {
              geology = ((geologyPatch.x * 3 + geologyPatch.y) % 9) == 0
                  ? MAT_MUD : MAT_SILT;
          } else if (localY < 176) {
              geology = MAT_DIRT;
          } else if (localY < 224 && ((geologyPatch.x + geologyPatch.y * 2) % 5) == 0) {
              geology = MAT_SAND;
          }
              return residentGroundDepositMaterial(geology, worldPosition, depth);
          }
          '''
          new_glsl_tail = '\n'.join(line[10:] if line.startswith('          ') else line for line in new_glsl_tail.splitlines()) + '\n'
          replace_once('shaders/reset.comp', old_glsl_tail, new_glsl_tail)

          # Block-capable structural cells never auto-release because of tile
          # occupancy, minority status, or unsupported-neighbor heuristics.
          replace_once(
              'shaders/tiles.comp',
              '    bool structuralTile = structural > 0u;\n    bool fullLiquid = fullRegion && isLiquid(dominant) && !halfWater;\n',
              '    bool structuralTile = structural > 0u;\n    bool durableStructuralTile = structuralTile &&\n        (isBlockCapable(dominant) || isBlockCapable(previous.material));\n    bool fullLiquid = fullRegion && isLiquid(dominant) && !halfWater;\n')
          replace_once(
              'shaders/tiles.comp',
              '    bool macroPowder = fullRegion && isPowder(dominant);\n',
              '    bool macroPowder = fullRegion && isPowder(dominant) &&\n                       !structuralTile && !isBlockCapable(dominant);\n')
          replace_once(
              'shaders/tiles.comp',
              '    bool macroMovable = (macroLiquid || macroGas || macroPowder) &&\n                        !activeAgent && !hot && !reacting;\n',
              '    bool macroMovable = (macroLiquid || macroGas || macroPowder) &&\n                        !structuralTile && !activeAgent && !hot && !reacting;\n')
          replace_once(
              'shaders/tiles.comp',
              '    bool unsupportedStructural = structuralTile && !physicallySupported;\n    bool collapsing = structuralTile &&\n                      (dominantCount < TILE_MIN_COHESIVE_CELLS || unsupportedStructural);\n',
              '    bool unsupportedStructural = structuralTile && !durableStructuralTile &&\n                                 !physicallySupported;\n    bool collapsing = structuralTile && !durableStructuralTile &&\n                      (dominantCount < TILE_MIN_COHESIVE_CELLS || unsupportedStructural);\n')
          replace_once(
              'shaders/tiles.comp',
              '    bool supported = terrainStable && physicallySupported;\n',
              '    bool supported = terrainStable &&\n                     (physicallySupported || durableStructuralTile);\n')
          replace_once(
              'shaders/tiles.comp',
              '    bool sleepingTerrain = terrainStable && !damaged && !moving && !hot && !reacting &&\n                           !activeAgent && !activeContent;\n',
              '    bool sleepingTerrain = terrainStable && (!damaged || durableStructuralTile) &&\n                           !moving && !hot && !reacting && !activeAgent && !activeContent;\n')
          replace_once(
              'shaders/tiles.comp',
              '    uint packedOccupancy = packTileOccupancy(\n        structuralTile ? dominantCount : represented, queenLocal, flowerLocal, honeyLocal, beeCount);\n    tiles[index] = TileState(dominant, packedOccupancy, flags, packTileCounters(stableTicks, cooldown));\n',
              '    uint tileMaterial = durableStructuralTile && isBlockCapable(previous.material)\n        ? previous.material : dominant;\n    uint packedStructuralCells = durableStructuralTile ? structural : dominantCount;\n    uint packedOccupancy = packTileOccupancy(\n        structuralTile ? packedStructuralCells : represented,\n        queenLocal, flowerLocal, honeyLocal, beeCount);\n    tiles[index] = TileState(tileMaterial, packedOccupancy, flags,\n                             packTileCounters(stableTicks, cooldown));\n')

          replace_once(
              'shaders/chemistry.comp',
              '    bool minorityStructural = isStructural(source) && tile.material != source.material;\n    if (isStructural(source) && !minorityStructural && tileHas(tile, TILE_DAMAGED) &&\n',
              '    bool minorityStructural = isStructural(source) && tile.material != source.material;\n    bool durableStructural = isStructural(source) && isBlockCapable(source.material);\n    if (isStructural(source) && !durableStructural && !minorityStructural &&\n        tileHas(tile, TILE_DAMAGED) &&\n')
          replace_once(
              'shaders/chemistry.comp',
              '    } else if (isStructural(source) && (minorityStructural || tileHas(tile, TILE_COLLAPSING))) {\n',
              '    } else if (isStructural(source) && !durableStructural &&\n               (minorityStructural || tileHas(tile, TILE_COLLAPSING))) {\n')

          # Gold is block-capable in every shared classification, including the
          # movement shader's local table. Loose gold still moves because it has
          # no structural bit; tile-built gold remains structural.
          replace_once(
              'shaders/move.comp',
              '           material == MAT_IRON_ORE ||\n           material == MAT_COPPER || material == MAT_MAGNET || material == MAT_INSULATOR ||\n',
              '           material == MAT_IRON_ORE ||\n           material == MAT_COPPER || material == MAT_GOLD || material == MAT_MAGNET ||\n           material == MAT_INSULATOR ||\n')

          # The legacy occupancy threshold remains only for granular terrain.
          replace_once(
              'include/sandhybrid/simulation_policy.hpp',
              'inline constexpr std::uint32_t destroyed_cells_to_crumble = 31u;\n',
              '// Granular stabilized terrain may release below this occupancy.\n// Block-capable structural tile placements are explicitly exempt.\ninline constexpr std::uint32_t destroyed_cells_to_crumble = 31u;\n')
          replace_once(
              'include/sandhybrid/simulation_policy.hpp',
              '[[nodiscard]] constexpr bool should_collapse(const std::uint32_t represented_cells) noexcept {\n    return represented_cells < collapse_occupancy;\n}\n',
              '[[nodiscard]] constexpr bool should_collapse(\n    const std::uint32_t represented_cells,\n    const bool durable_structural = false) noexcept {\n    return !durable_structural && represented_cells < collapse_occupancy;\n}\n')
          replace_once(
              'shaders/tiles.glsl',
              '// 31 destroyed cells is 48.4375% of an 8x8 tile: the first representable\n// whole-cell count at or above the requested 48% destruction threshold.\n',
              '// This occupancy threshold applies only to stabilized granular terrain.\n// Block-capable structural tile placements never auto-crumble from occupancy.\n')
          replace_once(
              'shaders/materials.glsl',
              'const uint STRUCTURAL_DESTROYED_CELLS_TO_CRUMBLE = 31u;\n',
              '// Granular terrain threshold only; block-capable structural tiles are exempt.\nconst uint STRUCTURAL_DESTROYED_CELLS_TO_CRUMBLE = 31u;\n')

          # Deterministic contracts: all deposits occur, gold remains rare, and
          # shells/sky/lava remain untouched.
          Path('tests/world_layout_contract.cpp').write_text('''#include "sandhybrid/world_layout.hpp"\n\n#include <array>\n#include <cstddef>\n\nusing namespace sandhybrid;\n\nstatic_assert(authored_scene_origin_x(resident_world_width) == 960u);\nstatic_assert(authored_scene_origin_y(resident_world_height) == 720u);\nstatic_assert(authored_scene_origin_y(pre_expansion_world_height) == 0u);\nstatic_assert(authored_scene_sky_footprint_rows == 2u);\nstatic_assert(subterranean_zone_count == 3u);\nstatic_assert(authored_scene_foundation_cells == 8u);\nstatic_assert(resident_world_lava_cells == 16u);\n\nstatic_assert(resident_substrate_material(resident_world_width, resident_world_height, 1280u, 0u) == Material::empty);\nstatic_assert(resident_substrate_material(resident_world_width, resident_world_height, 0u, 719u) == Material::empty);\nstatic_assert(resident_substrate_material(resident_world_width, resident_world_height, 1280u, 720u) == Material::empty);\nstatic_assert(resident_substrate_material(resident_world_width, resident_world_height, 0u, 900u) == Material::stone);\nstatic_assert(resident_substrate_material(resident_world_width, resident_world_height, 1280u, 1072u) == Material::stone);\nstatic_assert(resident_substrate_material(resident_world_width, resident_world_height, 1280u, 1408u) == Material::stone);\nstatic_assert(resident_substrate_material(resident_world_width, resident_world_height, 1280u, 1416u) == Material::lava);\nstatic_assert(resident_substrate_material(resident_world_width, resident_world_height, 1280u, 1432u) == Material::stone);\n\nstatic_assert(resident_substrate_is_structural(Material::stone));\nstatic_assert(resident_substrate_is_structural(Material::dirt));\nstatic_assert(resident_substrate_is_structural(Material::sand));\nstatic_assert(resident_substrate_is_structural(Material::silt));\nstatic_assert(!resident_substrate_is_structural(Material::mud));\nstatic_assert(!resident_substrate_is_structural(Material::iron_ore));\nstatic_assert(!resident_substrate_is_structural(Material::copper));\nstatic_assert(!resident_substrate_is_structural(Material::aluminum));\nstatic_assert(!resident_substrate_is_structural(Material::gold));\nstatic_assert(!resident_substrate_is_structural(Material::uranium));\n\nint main() {\n    std::array<std::size_t, 5> deposits{};\n    constexpr auto scene_bottom = 1080u;\n    constexpr auto geology_end = 1408u;\n    for (std::uint32_t y = scene_bottom; y < geology_end; ++y) {\n        for (std::uint32_t x = resident_world_shell_cells;\n             x < resident_world_width - resident_world_shell_cells; ++x) {\n            switch (resident_substrate_material(resident_world_width, resident_world_height, x, y)) {\n            case Material::iron_ore: ++deposits[0]; break;\n            case Material::copper: ++deposits[1]; break;\n            case Material::aluminum: ++deposits[2]; break;\n            case Material::gold: ++deposits[3]; break;\n            case Material::uranium: ++deposits[4]; break;\n            default: break;\n            }\n        }\n    }\n    for (const auto count : deposits) {\n        if (count == 0u) return 1;\n    }\n    if (deposits[0] <= deposits[1] || deposits[1] <= deposits[3]) return 2;\n    return 0;\n}\n''', encoding='utf-8')

          replace_once(
              'tests/material_contract.cpp',
              'static_assert(sandhybrid::is_block_material(Material::iron_ore));\nstatic_assert(!sandhybrid::is_block_material(Material::mud));\n',
              'static_assert(sandhybrid::is_block_material(Material::iron_ore));\nstatic_assert(sandhybrid::is_block_material(Material::aluminum));\nstatic_assert(sandhybrid::is_block_material(Material::iron));\nstatic_assert(sandhybrid::is_block_material(Material::copper));\nstatic_assert(sandhybrid::is_block_material(Material::gold));\nstatic_assert(sandhybrid::is_block_material(Material::uranium));\nstatic_assert(sandhybrid::is_block_material(Material::steel));\nstatic_assert(!sandhybrid::is_block_material(Material::mud));\n')
          replace_once(
              'tests/material_contract.cpp',
              'static_assert(!sandhybrid::policy::should_collapse(34u));\nstatic_assert(sandhybrid::policy::should_collapse(33u));\n',
              'static_assert(!sandhybrid::policy::should_collapse(34u));\nstatic_assert(sandhybrid::policy::should_collapse(33u));\nstatic_assert(!sandhybrid::policy::should_collapse(1u, true));\n')

          # Update validator expectations from the retired auto-collapse policy
          # to durable block-capable structural retention and ground deposits.
          validator = Path('tools/validate_shader_contracts.py')
          v = validator.read_text(encoding='utf-8')
          v = v.replace(
              '        "bool unsupportedStructural = structuralTile && !physicallySupported;",\n        "dominantCount < TILE_MIN_COHESIVE_CELLS || unsupportedStructural",\n        "bool supported = terrainStable && physicallySupported;",\n',
              '        "bool durableStructuralTile = structuralTile &&",\n        "isBlockCapable(dominant) || isBlockCapable(previous.material)",\n        "bool unsupportedStructural = structuralTile && !durableStructuralTile",\n        "bool collapsing = structuralTile && !durableStructuralTile",\n        "bool supported = terrainStable &&",\n        "physicallySupported || durableStructuralTile",\n')
          v = v.replace(
              '            errors.append(f"settled-terrain release contract missing {token!r}")',
              '            errors.append(f"durable structural retention contract missing {token!r}")')
          v = v.replace(
              '    for token in ("previouslyDense", "tileOccupancy(previous) >= TILE_STABILITY_OCCUPANCY",\n                  "dominantCount < TILE_MIN_COHESIVE_CELLS",\n                   "structuralTile ? dominantCount"):\n        if token not in tiles:\n            errors.append(f"bounded structural collapse contract missing {token!r}")\n',
              '    for token in ("previouslyDense", "tileOccupancy(previous) >= TILE_STABILITY_OCCUPANCY",\n                  "durableStructuralTile ? structural : dominantCount",\n                  "!durableStructuralTile &&",\n                  "!structuralTile && !isBlockCapable(dominant)"):\n        if token not in tiles:\n            errors.append(f"durable structural tile contract missing {token!r}")\n')
          anchor = '    for token in ("authoredStructuralCell", "looseAuthoredCargo", "Large upper reservoir", "real sediment sifter"):\n'
          addition = '''    for token in (
              "residentGroundHash",
              "residentGroundDepositMaterial",
              "roll < 24u) return MAT_IRON_ORE",
              "roll < 32u) return MAT_COPPER",
              "roll < 38u) return MAT_ALUMINUM",
              "roll < 41u) return MAT_GOLD",
              "depth >= 160 && roll == 41u) return MAT_URANIUM",
          ):
              if token not in reset:
                  errors.append(f"resident ground deposit contract missing {token!r}")
          for token in (
              "resident_ground_hash",
              "resident_ground_deposit_material",
              "roll < 24u) return Material::iron_ore",
              "roll < 32u) return Material::copper",
              "roll < 38u) return Material::aluminum",
              "roll < 41u) return Material::gold",
              "depth >= 160u && roll == 41u) return Material::uranium",
          ):
              if token not in world_layout:
                  errors.append(f"CPU resident ground deposit contract missing {token!r}")
          for token in (
              "bool durableStructural = isStructural(source) && isBlockCapable(source.material);",
              "isStructural(source) && !durableStructural && !minorityStructural",
              "isStructural(source) && !durableStructural &&",
          ):
              if token not in chemistry:
                  errors.append(f"durable structural chemistry contract missing {token!r}")
          '''
          addition = '\n'.join(line[10:] if line.startswith('          ') else line for line in addition.splitlines()) + '\n'
          if anchor not in v:
              raise SystemExit('validator insertion anchor missing')
          v = v.replace(anchor, addition + anchor, 1)
          validator.write_text(v, encoding='utf-8')

          # Mission cache: supersede the old block-tile crumble threshold and
          # add natural deposits as a primary runtime acceptance item.
          replace_once(
              'missioncache.md',
              '- **P0 / primary release gate:** MC-038, MC-068, MC-074, MC-112, MC-114, MC-115, and MC-116. These are the current release blockers and must pass deterministic contracts plus Windows/Linux Release packaging before publication.\n',
              '- **P0 / primary release gate:** MC-038, MC-068, MC-074, MC-105, MC-112, MC-114, MC-115, MC-116, and MC-118. These are the current release blockers and must pass deterministic contracts plus Windows/Linux Release packaging before publication.\n')
          replace_once(
              'missioncache.md',
              '| MC-105 | PARTIAL | Structural solids are metadata only | Stone, iron ore, refined iron, and other block-capable solids use 8x8 support/cohesion/sleep metadata without whole-tile translation. At 31 destroyed cells of 64, the remaining 33 release individually. Runtime fracture and persistence acceptance remain required. |\n',
              '| MC-105 | PARTIAL | Durable structural solids are metadata only | Stone, iron ore, refined metals, glass, wood, plastics, machines, and every other block-capable material use 8x8 support/cohesion/sleep metadata without whole-tile translation. Once created through `TILES`, surviving cells never auto-release because of occupancy, minority-material, or support heuristics. Only direct per-cell destruction, corrosion, combustion, or a real softened/molten/vapor phase change removes structural state. Runtime fracture and persistence acceptance remain required. |\n')
          replace_once(
              'missioncache.md',
              '| MC-112 | PARTIAL | Stone, Iron Ore, and Iron cell/tile parity | Save ID 48 is canonically `Iron Ore`; no Iron Shavings identifier or alias remains. Stone, Iron Ore, and refined Iron use `CELLS` for loose individual pixels and `TILES` for supported structural 8x8 arrangements. Tile metadata never translates the solid wholesale, and at 31 destroyed cells the remainder releases as loose cells. Static ID, palette, phase, block-capability, and shader contracts pass; packaged placement/fracture proof remains required. |\n',
