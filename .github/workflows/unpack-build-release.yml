name: Transfer EpochSand Fix22 Archive

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: epoch-sand-fix22-transfer
  cancel-in-progress: false

jobs:
  transfer:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Assemble current ZIP bytes
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $partsRoot = Join-Path $env:GITHUB_WORKSPACE ".github/fix22_v2"
          $zip = Join-Path $env:GITHUB_WORKSPACE "EpochSand_Cpp23_Vulkan_WindowsFix22.zip"
          $parts = @(Get-ChildItem -LiteralPath $partsRoot -Filter "part_*.txt" -File | Sort-Object Name)
          if ($parts.Count -eq 0) {
              throw "No verified archive parts found"
          }

          $base64 = [System.Text.StringBuilder]::new()
          foreach ($part in $parts) {
              [void]$base64.Append((Get-Content -LiteralPath $part.FullName -Raw).Trim())
          }

          $bytes = [Convert]::FromBase64String($base64.ToString())
          [System.IO.File]::WriteAllBytes($zip, $bytes)
          Write-Host "Assembled $($parts.Count) parts into $($bytes.Length) bytes."

      - name: Upload ZIP bytes
        uses: actions/upload-artifact@v4
        with:
          name: EpochSand_Cpp23_Vulkan_WindowsFix22
          path: EpochSand_Cpp23_Vulkan_WindowsFix22.zip
          if-no-files-found: error
          retention-days: 1
