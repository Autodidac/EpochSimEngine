name: Assemble EpochSand Fix22 Archive

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: epoch-sand-fix22-transfer
  cancel-in-progress: false

jobs:
  assemble:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Assemble verified ZIP
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $false
          $partsRoot = Join-Path $env:GITHUB_WORKSPACE ".github/fix22_v2"
          $zip = Join-Path $env:GITHUB_WORKSPACE "EpochSand_Cpp23_Vulkan_WindowsFix22.zip"
          $ready = $false

          for ($attempt = 1; $attempt -le 150; ++$attempt) {
              git pull --ff-only origin main
              if ($LASTEXITCODE -ne 0) {
                  throw "Unable to fast-forward to current main"
              }

              $parts = @()
              if (Test-Path -LiteralPath $partsRoot) {
                  $parts = @(Get-ChildItem -LiteralPath $partsRoot -Filter "part_*.txt" -File | Sort-Object Name)
              }

              if ($parts.Count -gt 0) {
                  $base64 = [System.Text.StringBuilder]::new()
                  foreach ($part in $parts) {
                      [void]$base64.Append((Get-Content -LiteralPath $part.FullName -Raw).Trim())
                  }

                  try {
                      $bytes = [Convert]::FromBase64String($base64.ToString())
                      [System.IO.File]::WriteAllBytes($zip, $bytes)
                      & unzip -tqq $zip
                      if ($LASTEXITCODE -eq 0) {
                          Write-Host "Verified $($parts.Count) parts ($($bytes.Length) bytes)."
                          $ready = $true
                          break
                      }
                  }
                  catch {
                      Write-Host "Archive incomplete: $($_.Exception.Message)"
                  }
              }

              Remove-Item -LiteralPath $zip -Force -ErrorAction SilentlyContinue
              Start-Sleep -Seconds 10
          }

          if (-not $ready) {
              throw "Verified archive did not become complete"
          }

      - name: Upload original ZIP
        uses: actions/upload-artifact@v4
        with:
          name: EpochSand_Cpp23_Vulkan_WindowsFix22
          path: EpochSand_Cpp23_Vulkan_WindowsFix22.zip
          if-no-files-found: error
          retention-days: 1
