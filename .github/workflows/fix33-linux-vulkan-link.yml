name: Fix Fix33 Linux Vulkan Loader

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/fix33-linux-vulkan-link.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Select platform-capable Linux Vulkan loader
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('CMakeLists.txt')
          text = path.read_text(encoding='utf-8')
          old = '    target_include_directories(epoch_sand PRIVATE include)\n    target_link_libraries(epoch_sand PRIVATE Vulkan::Vulkan Threads::Threads Autodidac::EpochGui)\n'
          new = '''    target_include_directories(epoch_sand PRIVATE include)

    set(EPOCH_SAND_VULKAN_LIBRARY Vulkan::Vulkan)
    if(UNIX AND NOT APPLE)
        # vcpkg supplies Vulkan headers and shader tools, but its loader build may
        # omit host-window-system exports such as vkCreateXcbSurfaceKHR. Prefer
        # the distribution loader for Linux presentation while retaining the
        # same Vulkan headers and API contract.
        find_library(EPOCH_SAND_SYSTEM_VULKAN_LIBRARY
            NAMES vulkan
            PATHS /usr/lib/x86_64-linux-gnu /usr/lib64 /usr/lib
            NO_DEFAULT_PATH
            NO_CMAKE_FIND_ROOT_PATH
        )
        if(EPOCH_SAND_SYSTEM_VULKAN_LIBRARY)
            set(EPOCH_SAND_VULKAN_LIBRARY "${EPOCH_SAND_SYSTEM_VULKAN_LIBRARY}")
        endif()
    endif()

    target_include_directories(epoch_sand SYSTEM PRIVATE ${Vulkan_INCLUDE_DIRS})
    target_link_libraries(epoch_sand PRIVATE
        ${EPOCH_SAND_VULKAN_LIBRARY} Threads::Threads Autodidac::EpochGui)
'''
          if old not in text:
              raise RuntimeError('CMake Vulkan link marker not found')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Validate CMake syntax
        run: cmake -S . -B /tmp/fix33-cmake -DEPOCH_SAND_BUILD_APP=OFF -DBUILD_TESTING=ON
      - name: Commit loader fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add CMakeLists.txt
          git commit -m 'Prefer system Vulkan loader for Linux XCB presentation'
          git push origin HEAD:main
