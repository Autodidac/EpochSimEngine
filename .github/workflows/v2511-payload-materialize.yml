name: Materialize SandHybrid v2.5.11 World Save Source

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: sandhybrid-v2511-payload-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  materialize:
    if: github.event.pull_request.head.ref == 'agent/v2511-world-save-rewrite'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Detect compressed source payload
        id: detect
        shell: bash
        run: |
          if [[ -f tools/payload_world_save_cpp.gz.b64 ]]; then
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          else
            echo 'changed=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Materialize and verify world-save source
        if: steps.detect.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          base64 --decode tools/payload_world_save_cpp.gz.b64 | gzip --decompress > src/world_save.cpp
          echo '98ad37a11250d74fc0fd61440a939b5f05efe0c4c205b1540c7809e9d4dca5d5  src/world_save.cpp' | sha256sum --check
          rm -f tools/payload_world_save_cpp.gz.b64
          rm -f .github/workflows/v2511-payload-materialize.yml

      - name: Commit materialized source
        if: steps.detect.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Autodidac Release Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'Materialize exact v2.5.11 world-save implementation'
          git push origin HEAD:agent/v2511-world-save-rewrite
