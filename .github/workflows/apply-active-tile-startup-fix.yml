name: Apply active-tile startup fix

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: active-tile-startup-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  apply:
    if: github.head_ref == 'agent/durable-structural-ground-deposits-v254'
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Stop blanket activation of filled Atmosphere tiles
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          def replace_once(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text(encoding='utf-8')
              if old not in text:
                  raise SystemExit(f'missing replacement marker in {path}: {old[:140]!r}')
              file.write_text(text.replace(old, new, 1), encoding='utf-8')

          replace_once(
              'shaders/tiles.comp',
              '            moving = moving || (cell.aux & AUX_MOVED) != 0u || cell.age < 8u;\n',
              '            bool startupDynamic = cell.age < 8u &&\n'
              '                                  cell.material != MAT_ATMOSPHERE &&\n'
              '                                  cell.material != MAT_OXYGEN;\n'
              '            moving = moving || (cell.aux & AUX_MOVED) != 0u || startupDynamic;\n')
          replace_once(
              'shaders/tiles.comp',
              '    bool settledMedium = ((macroLiquid && liquidEnclosed) || (macroGas && gasEnclosed)) &&\n'
              '                         !moving && minimumAge >= 30u;\n',
              '    bool balancedAtmosphereTile = fullGas && gasEnclosed && !moving &&\n'
              '        (dominant == MAT_ATMOSPHERE || dominant == MAT_OXYGEN);\n'
              '    bool settledMedium = (((macroLiquid && liquidEnclosed) ||\n'
              '                           (macroGas && gasEnclosed)) &&\n'
              '                          !moving && minimumAge >= 30u) ||\n'
              '                         balancedAtmosphereTile;\n')

          validator = Path('tools/validate_shader_contracts.py')
          text = validator.read_text(encoding='utf-8')
          anchor = '    for token in ("if (!tileInside(p)) continue;", "supportedStructural > 0u", "STAT_STRUCTURAL_COLLAPSES", "STAT_GAS_EDGE_ACTIVE_TILES"):\n        if token not in tiles: errors.append(f"structure/atmosphere regression contract missing {token!r}")\n'
          addition = '''    for token in (
        "bool startupDynamic = cell.age < 8u &&",
        "cell.material != MAT_ATMOSPHERE",
        "cell.material != MAT_OXYGEN",
        "bool balancedAtmosphereTile = fullGas && gasEnclosed && !moving",
        "balancedAtmosphereTile;",
    ):
        if token not in tiles:
            errors.append(f"filled-atmosphere startup sleep contract missing {token!r}")
'''
          if addition not in text:
              if anchor not in text:
                  raise SystemExit('validator active-tile insertion anchor missing')
              text = text.replace(anchor, anchor + addition, 1)
          validator.write_text(text, encoding='utf-8')

          mission = Path('missioncache.md')
          text = mission.read_text(encoding='utf-8')
          pattern = re.compile(r'^\| MC-017 \|.*$', re.M)
          row = ('| MC-017 | REGRESSION | Prevent premature stabilization without blanket activation | '
                 'Liquid, mud, wet material, and gas sleep only after their material-specific equilibrium rules. '
                 'A freshly reset full enclosed Atmosphere/Oxygen tile is not marked moving merely because cell age is below eight; '
                 'it enters settled macro sleep immediately. Only exposed, displaced, density-sorting, heated, reacting, emitted, or otherwise disturbed medium tiles remain active. '
                 'The `ACTIVE TILES` counter must measure actual tile work, never all tiles inside the active-area gate. Packaged observation remains required. |')
          text, count = pattern.subn(row, text, count=1)
          if count != 1:
              raise SystemExit(f'MC-017 replacement count was {count}')
          mission.write_text(text, encoding='utf-8')

          changelog = Path('CHANGELOG.md')
          text = changelog.read_text(encoding='utf-8')
          note = '- Prevented freshly reset enclosed Atmosphere/Oxygen tiles from being blanket-marked active; only genuinely disturbed or exposed medium tiles now contribute to `ACTIVE TILES`.\n'
          if '## 2.5.4' in text and note not in text:
              marker = '## 2.5.4\n\n'
              text = text.replace(marker, marker + note, 1)
              changelog.write_text(text, encoding='utf-8')

          Path('.github/workflows/apply-active-tile-startup-fix.yml').unlink(missing_ok=True)
          PY

          python3 -m py_compile tools/validate_shader_contracts.py
          python3 tools/validate_no_simulation_coroutines.py
          python3 tools/validate_project_branding.py
          python3 tools/validate_mission_cache.py
          python3 tools/validate_shader_contracts.py

          cmake -S . -B build/active-tile-contract -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DSANDHYBRID_BUILD_APP=OFF \
            -DSANDHYBRID_BUILD_VULKAN_RUNTIME=OFF \
            -DBUILD_TESTING=ON \
            -DSANDHYBRID_WARNINGS_AS_ERRORS=ON
          cmake --build build/active-tile-contract --parallel
          ctest --test-dir build/active-tile-contract --output-on-failure

          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'Stop blanket Atmosphere tile activation'
          git push origin HEAD:${{ github.head_ref }}
