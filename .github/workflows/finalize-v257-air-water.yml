name: Finalize SandHybrid v2.5.7 air water terrain

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: finalize-v257-air-water-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  finalize:
    if: github.head_ref == 'agent/v257-air-water-equilibrium'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/v257-air-water-equilibrium
          fetch-depth: 0

      - name: Apply validated v2.5.7 patch
        shell: bash
        run: |
          set -euo pipefail
          if grep -q 'project(SandHybrid VERSION 2.5.7' CMakeLists.txt; then
            echo 'v2.5.7 source is already applied.'
            exit 0
          fi
          base64 --decode tools/v257-air-water.patch.gz.b64 \
            | gzip --decompress > /tmp/v257.patch
          git apply --check /tmp/v257.patch
          git apply /tmp/v257.patch

      - name: Validate source and reusable terrain contracts
        shell: bash
        run: |
          set -euo pipefail
          if ! grep -q 'project(SandHybrid VERSION 2.5.7' CMakeLists.txt; then
            echo 'Patch did not apply.' >&2
            exit 1
          fi
          python3 -m py_compile tools/validate_shader_contracts.py
          python3 tools/validate_shader_contracts.py
          python3 tools/validate_mission_cache.py
          python3 tools/validate_no_simulation_coroutines.py
          python3 tools/validate_project_branding.py
          cmake -S . -B build/v257-finalizer -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DSANDHYBRID_BUILD_APP=OFF \
            -DSANDHYBRID_BUILD_VULKAN_RUNTIME=OFF \
            -DSANDHYBRID_WARNINGS_AS_ERRORS=ON \
            -DBUILD_TESTING=ON
          cmake --build build/v257-finalizer --parallel
          ctest --test-dir build/v257-finalizer --output-on-failure

      - name: Commit permanent source
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A -- ':!tools/v257-air-water.patch.gz.b64' ':!.github/workflows/finalize-v257-air-water.yml'
          git commit -m 'Fix v2.5.7 air water lava and terrain generation'
          git push origin HEAD:agent/v257-air-water-equilibrium
