name: Fix v2.5.4 camera mission ledger

on:
  push:
    branches:
      - agent/fix-camera-ledger-v254
      - main

permissions:
  contents: write

concurrency:
  group: fix-camera-ledger-v254-${{ github.ref }}
  cancel-in-progress: false

jobs:
  reconcile:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.ref_name }}

      - name: Reconcile camera mission contracts
        if: github.ref_name == 'agent/fix-camera-ledger-v254'
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('missioncache.md')
          text = path.read_text(encoding='utf-8')

          old_mission = "| MC-075 | PARTIAL | Camera navigation and scope HUD | Middle-mouse drag, mouse-edge scrolling, and camera reset work at every zoom. Keyboard camera panning is permitted only when the current scene has no player; MC-076 owns that routing contract. The sidebar always shows current zoom, active-region mode, and active-region count, while debug draws map-area boundaries clearly. Drag, edge, reset, HUD, and boundary rendering remain runtime-unverified. |"
          new_mission = "| MC-075 | PARTIAL | Camera navigation and scope HUD | Middle-mouse drag and camera reset work at every zoom. Mouse-edge scrolling is forbidden. The live `PLAYER WASD`/`WASD PAN` control owns character-scene keyboard routing under MC-119, while non-player scenes always use camera WASD. Right-drag camera panning is available only in `WASD PAN` mode under MC-120. The sidebar always shows current zoom, active-region mode, and active-region count, while debug draws map-area boundaries clearly. Packaged drag, reset, toggle, HUD, and boundary rendering remain runtime-unverified. |"

          old_invariant = "- Directional keyboard input has exactly one owner: the player when present, otherwise the camera. Mouse-edge and middle-mouse camera input remain independent."
          new_invariant = "- Directional keyboard input has exactly one owner: character scenes default to the player, the live `WASD PAN` mode routes it to the camera without moving the player, and non-player scenes always route it to the camera. Mouse-edge movement is forbidden; middle drag always pans and right drag pans only in `WASD PAN` mode."

          replacements = ((old_mission, new_mission), (old_invariant, new_invariant))
          for old, new in replacements:
              if old in text:
                  text = text.replace(old, new, 1)
              elif new not in text:
                  raise SystemExit(f'Expected camera ledger text not found: {old}')

          path.write_text(text, encoding='utf-8')
          PY

          python3 tools/validate_mission_cache.py

          if git diff --quiet -- missioncache.md; then
            exit 0
          fi

          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add missioncache.md
          git commit -m "Reconcile v2.5.4 camera mission contracts"
          git push origin HEAD:agent/fix-camera-ledger-v254

      - name: Remove one-shot workflow and branch
        if: github.ref_name == 'main'
        shell: bash
        run: |
          python3 tools/validate_mission_cache.py
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/fix-camera-ledger-v254.yml
          git commit -m "Remove completed camera-ledger workflow"
          git push origin HEAD:main
          git push origin --delete agent/fix-camera-ledger-v254 || true
