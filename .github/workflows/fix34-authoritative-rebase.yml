name: Authoritative FastFreddyTestbed Fix34 Rebase

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - fix34-authoritative-trigger.txt

permissions:
  contents: write
  pull-requests: write

env:
  BASE_SHA: 19ff8e414859e07f11ee4969892453192dd0a6d1

jobs:
  rebase:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Fetch current FastFreddy Fix32 hierarchy source
        run: |
          set -euo pipefail
          git clone --filter=blob:none --no-checkout https://github.com/Autodidac/fastfreddy.git "$RUNNER_TEMP/fastfreddy"
          git -C "$RUNNER_TEMP/fastfreddy" fetch --depth 1 origin "$BASE_SHA"
          git -C "$RUNNER_TEMP/fastfreddy" checkout --detach "$BASE_SHA"
          cp tools/apply_fix34_half_water.py "$RUNNER_TEMP/apply_fix34_half_water.py"

      - name: Replace testbed and apply half-water
        run: |
          set -euo pipefail
          rsync -a --delete --exclude '.git/' "$RUNNER_TEMP/fastfreddy/" ./
          mkdir -p tools
          cp "$RUNNER_TEMP/apply_fix34_half_water.py" tools/apply_fix34_half_water.py
          python3 - <<'PY'
          from pathlib import Path
          path = Path('shaders/macro_move.comp')
          text = path.read_text()
          old = ('  if (cell.material != representative.material || !bulkMovable(cell) ||\n'
                 '      (cell.aux & AUX_MOVED) != 0u) return false;\n')
          new = ('            if (cell.material != representative.material || !bulkMovable(cell) ||\n'
                 '                (cell.aux & AUX_MOVED) != 0u) return false;\n')
          if old not in text:
              raise RuntimeError('macro source marker changed')
          path.write_text(text.replace(old, new, 1))
          PY
          python3 tools/apply_fix34_half_water.py
          grep -q 'AUX_WATER_HALF' shaders/materials.glsl
          grep -q 'water_ledge_can_release' include/epoch/sand/simulation_policy.hpp
          grep -q 'phase_index >= 9u' src/vulkan_renderer.cpp
          grep -q 'isHalfWater(cell)' shaders/macro_move.comp
          grep -q 'mix(backgroundColor(grid), base.rgb, 0.50)' shaders/fullscreen.frag

      - name: Validate shaders and C++ contracts
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y glslc gcc-14 g++-14
          mkdir -p /tmp/fix34-spv
          for shader in shaders/*.comp shaders/*.vert shaders/*.frag; do
            glslc --target-env=vulkan1.2 -O -I shaders "$shader" -o "/tmp/fix34-spv/$(basename "$shader").spv"
          done
          g++-14 -std=c++23 -Wall -Wextra -Wpedantic -Wconversion -Wshadow -Werror \
            -Iinclude tests/behavior_contract.cpp -o /tmp/fix34_behavior_contract
          /tmp/fix34_behavior_contract

      - name: Remove temporary and accidental infrastructure
        run: |
          set -euo pipefail
          rm -rf .github/workflows release dist
          rm -f tools/apply_fix34_half_water.py
          rm -f *status*.json fix34-*.json fix34-*.txt
          find . -maxdepth 1 -type f -name '*.zip' -delete
          find . -maxdepth 1 -type f -name '*.tar.gz' -delete
          find . -maxdepth 1 -type f -name '*.sha256' -delete

      - name: Force-publish clean corrected testbed source
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'FastFreddyTestbed Fix34: current Fix32 base with half-water hierarchy'
          git push --force origin HEAD:main

      - name: Close trigger PR and delete branch
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr close ${{ github.event.pull_request.number }} --repo "$GITHUB_REPOSITORY" \
            --comment 'Fix34 clean source replacement completed in fastfreddytestbed/main.' || true
          git push origin --delete '${{ github.event.pull_request.head.ref }}' || true
