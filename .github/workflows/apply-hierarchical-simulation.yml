          replace('shaders/tiles.comp', '#include "tiles.glsl"\n', '#include "tiles.glsl"\n#include "chunks.glsl"\n')
          replace('shaders/tiles.comp', 'layout(std430, binding = 4) buffer Tiles { TileState tiles[]; };\n',
