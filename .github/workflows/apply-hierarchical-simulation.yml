name: Apply Hierarchical Simulation

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/apply-hierarchical-simulation.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Implement macro-cell and chunk hierarchy
        run: |
          cat > /tmp/apply_hierarchy.py <<'PY'
          from pathlib import Path

          def read(path: str) -> str:
              return Path(path).read_text(encoding='utf-8')

          def write(path: str, content: str) -> None:
              target = Path(path)
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_text(content, encoding='utf-8')

          def replace(path: str, old: str, new: str, count: int = 1) -> None:
              text = read(path)
              if old not in text:
                  raise RuntimeError(f'missing replacement marker in {path}: {old[:120]!r}')
              text = text.replace(old, new, count)
              write(path, text)

          write('include/epoch/sand/simulation_policy.hpp', r'''#pragma once

#include <cstdint>

namespace epoch::sand::policy {

// Fine cells remain the canonical simulation state. An aligned 8x8 region may
// be transferred as one macro-cell only while every represented cell can make
// the same move. Any mixed or partially blocked region falls back to pixels.
inline constexpr std::uint32_t tile_size = 8u;
inline constexpr std::uint32_t tile_cells = tile_size * tile_size;
inline constexpr std::uint32_t macro_tile_size = tile_size;
inline constexpr std::uint32_t macro_tile_cells = tile_cells;

// Eight macro tiles form one 64x64-cell scheduling chunk. Chunks never replace
// cell storage; they cache activity so large inactive areas can be rejected by
// one lookup and their tile scans can be skipped until explicitly dirtied.
inline constexpr std::uint32_t chunk_tiles_per_axis = 8u;
inline constexpr std::uint32_t chunk_size = tile_size * chunk_tiles_per_axis;
inline constexpr std::uint32_t chunk_tile_count =
    chunk_tiles_per_axis * chunk_tiles_per_axis;
inline constexpr std::uint32_t chunk_sleep_ticks = 30u;

inline constexpr std::uint32_t stability_occupancy = 52u;
inline constexpr std::uint32_t collapse_occupancy = tile_cells / 2u;
inline constexpr std::uint32_t stability_ticks = 120u;
inline constexpr std::uint32_t restabilization_cooldown_ticks = 240u;
inline constexpr std::uint32_t terrain_cell_integrity = 255u;
inline constexpr std::uint32_t laser_damage_per_hit = 144u;
inline constexpr std::uint32_t laser_hits_to_dislodge =
    (terrain_cell_integrity + laser_damage_per_hit - 1u) / laser_damage_per_hit;
inline constexpr std::uint32_t water_pressure_depth = 8u;
inline constexpr std::uint32_t sunlight_update_interval = 4u;
inline constexpr std::uint32_t vent_eruption_pressure = 220u;
inline constexpr std::uint32_t vent_gas_release_pressure = 72u;

[[nodiscard]] constexpr bool bulk_region_eligible(
    const std::uint32_t represented_cells,
    const bool uniform_material,
    const bool structural,
    const bool reacting) noexcept {
    return represented_cells == macro_tile_cells && uniform_material &&
           !structural && !reacting;
}

[[nodiscard]] constexpr bool chunk_can_sleep(
    const std::uint32_t sleeping_tiles,
    const std::uint32_t present_tiles,
    const bool dirty,
    const std::uint32_t quiet_ticks) noexcept {
    return present_tiles != 0u && sleeping_tiles == present_tiles && !dirty &&
           quiet_ticks >= chunk_sleep_ticks;
}

[[nodiscard]] constexpr bool stability_ready(
    const std::uint32_t occupancy,
    const std::uint32_t settled_ticks,
    const bool compatible,
    const bool stable_phase,
    const bool moving,
    const bool reacting,
    const std::uint32_t cooldown) noexcept {
    return occupancy >= stability_occupancy && settled_ticks >= stability_ticks &&
           compatible && stable_phase && !moving && !reacting && cooldown == 0u;
}

[[nodiscard]] constexpr bool should_collapse(const std::uint32_t represented_cells) noexcept {
    return represented_cells < collapse_occupancy;
}

[[nodiscard]] constexpr std::uint32_t update_vent_pressure(
    const std::uint32_t pressure, const bool blocked, const bool open) noexcept {
    if (blocked) return pressure >= 252u ? 255u : pressure + 3u;
    if (open) return pressure > 4u ? pressure - 4u : 0u;
    return pressure == 255u ? 255u : pressure + 1u;
}

} // namespace epoch::sand::policy
''')

          write('shaders/chunks.glsl', r'''#ifndef EPOCH_SAND_CHUNKS_GLSL
#define EPOCH_SAND_CHUNKS_GLSL

const uint CHUNK_TILES_PER_AXIS = 8u;
const uint CHUNK_CELL_SIZE = TILE_SIZE * CHUNK_TILES_PER_AXIS;
const uint CHUNK_TILE_COUNT = CHUNK_TILES_PER_AXIS * CHUNK_TILES_PER_AXIS;
const uint CHUNK_SLEEP_TICKS = 30u;

const uint CHUNK_ACTIVE = 0x00000001u;
const uint CHUNK_SLEEPING = 0x00000002u;
const uint CHUNK_DIRTY = 0x00000004u;
const uint CHUNK_BOUNDARY = 0x00000008u;

struct ChunkState {
    uint flags;
    uint activeTiles;
    uint sleepingTiles;
    uint counters; // low 16: quiet ticks, high 16: present tile count
};

uint chunkColumns(uint width) {
    return (width + CHUNK_CELL_SIZE - 1u) / CHUNK_CELL_SIZE;
}

uint chunkRows(uint height) {
    return (height + CHUNK_CELL_SIZE - 1u) / CHUNK_CELL_SIZE;
}

uvec2 chunkCoordinate(ivec2 p) {
    return uvec2(max(p, ivec2(0))) / CHUNK_CELL_SIZE;
}

uint chunkIndex(ivec2 p, uint width) {
    uvec2 chunk = chunkCoordinate(p);
    return chunk.y * chunkColumns(width) + chunk.x;
}

uint chunkQuietTicks(ChunkState state) { return state.counters & 0xffffu; }
uint chunkPresentTiles(ChunkState state) { return state.counters >> 16u; }
uint packChunkCounters(uint quietTicks, uint presentTiles) {
    return min(quietTicks, 0xffffu) | (min(presentTiles, 0xffffu) << 16u);
}
bool chunkHas(ChunkState state, uint flag) { return (state.flags & flag) != 0u; }

#endif
''')

          write('shaders/chunks.comp', r'''#version 450
#extension GL_GOOGLE_include_directive : require
#include "materials.glsl"
#include "tiles.glsl"
#include "chunks.glsl"

layout(local_size_x = 8, local_size_y = 8) in;
layout(std430, binding = 4) readonly buffer Tiles { TileState tiles[]; };
layout(std430, binding = 7) buffer Chunks { ChunkState chunks[]; };

void main() {
    uvec2 chunk = gl_GlobalInvocationID.xy;
    uint columns = chunkColumns(pc.width);
    uint rows = chunkRows(pc.height);
    if (chunk.x >= columns || chunk.y >= rows) return;

    uint index = chunk.y * columns + chunk.x;
    ChunkState previous = chunks[index];
    uint tileColumnsValue = tileColumns(pc.width);
    uint tileRowsValue = (pc.height + TILE_SIZE - 1u) / TILE_SIZE;
    uvec2 tileOrigin = chunk * CHUNK_TILES_PER_AXIS;

    uint presentTiles = 0u;
    uint activeTiles = 0u;
    uint sleepingTiles = 0u;
    for (uint y = 0u; y < CHUNK_TILES_PER_AXIS; ++y) {
        for (uint x = 0u; x < CHUNK_TILES_PER_AXIS; ++x) {
            uvec2 tile = tileOrigin + uvec2(x, y);
            if (tile.x >= tileColumnsValue || tile.y >= tileRowsValue) continue;
            ++presentTiles;
            TileState state = tiles[tile.y * tileColumnsValue + tile.x];
            if (tileHas(state, TILE_SLEEPING)) ++sleepingTiles;
            if (tileHas(state, TILE_ACTIVE) || tileHas(state, TILE_COLLAPSING) ||
                tileHas(state, TILE_DAMAGED)) ++activeTiles;
        }
    }

    bool dirty = chunkHas(previous, CHUNK_DIRTY);
    bool quiet = presentTiles != 0u && sleepingTiles == presentTiles &&
                 activeTiles == 0u && !dirty;
    uint quietTicks = quiet ? min(chunkQuietTicks(previous) + 1u, CHUNK_SLEEP_TICKS) : 0u;
    bool sleeping = quiet && quietTicks >= CHUNK_SLEEP_TICKS;

    uint flags = sleeping ? CHUNK_SLEEPING : CHUNK_ACTIVE;
    if (presentTiles != CHUNK_TILE_COUNT) flags |= CHUNK_BOUNDARY;
    chunks[index] = ChunkState(flags, activeTiles, sleepingTiles,
                               packChunkCounters(quietTicks, presentTiles));
}
''')

          write('shaders/macro_move.comp', r'''#version 450
#extension GL_GOOGLE_include_directive : require
#define EPOCH_SAND_NO_SIM_PUSH
#include "materials.glsl"
#include "tiles.glsl"
#include "chunks.glsl"
#include "debug_stats.glsl"

// One workgroup owns one pair of 8x8 macro-cells. Thread zero validates the
// region; all 64 lanes then transfer the underlying canonical cells together.
layout(local_size_x = 8, local_size_y = 8) in;
layout(std430, binding = 0) buffer CurrentCells { Cell cells[]; };
layout(std430, binding = 4) readonly buffer Tiles { TileState tiles[]; };
layout(std430, binding = 5) buffer DebugStatsBuffer { uint debugStats[]; };
layout(std430, binding = 7) buffer Chunks { ChunkState chunks[]; };

layout(push_constant) uniform MovementPush {
    uint width;
    uint height;
    uint step;
    uint seed;
    int phase;
    int parity;
    uint collectDebug;
    uint reserved1;
} macroPc;

shared uint macroMoveAllowed;
shared ivec2 sourceTileShared;
shared ivec2 targetTileShared;

bool macroInside(ivec2 p) {
    return p.x >= 0 && p.y >= 0 && p.x < int(macroPc.width) && p.y < int(macroPc.height);
}
uint macroIndex(ivec2 p) { return uint(p.y) * macroPc.width + uint(p.x); }
Cell macroAt(ivec2 p) {
    return macroInside(p) ? cells[macroIndex(p)] : Cell(MAT_STONE, 0u, 20, AUX_STRUCTURAL);
}

uint macroHash(ivec2 tile, uint salt) {
    return hash32(uint(tile.x) * 73856093u ^ uint(tile.y) * 19349663u ^
                  macroPc.step * 83492791u ^ macroPc.seed ^ salt);
}

bool openAtmosphere(Cell cell) {
    return cell.material == MAT_EMPTY || cell.material == MAT_OXYGEN;
}

bool bulkMovable(Cell cell) {
    if ((cell.aux & AUX_STRUCTURAL) != 0u || isCellGas(cell)) return false;
    return isCellLiquid(cell) || isCellPowder(cell);
}

bool bulkMovementAllows(uint material, uint randomValue) {
    if (material == MAT_DIRT) return (randomValue & 3u) == 0u;
    if (material == MAT_MUD) return (randomValue % 24u) == 0u;
    if (material == MAT_HONEY) return (randomValue & 3u) == 0u;
    if (material == MAT_LAVA) return (randomValue & 1u) == 0u;
    return true;
}

bool sourceRegion(ivec2 origin, out uint material) {
    Cell first = macroAt(origin);
    material = first.material;
    if (!bulkMovable(first) || !materialEnabled(material)) return false;
    for (int y = 0; y < int(TILE_SIZE); ++y) {
        for (int x = 0; x < int(TILE_SIZE); ++x) {
            Cell cell = macroAt(origin + ivec2(x, y));
            if (cell.material != material || !bulkMovable(cell)) return false;
            // Half-water is intentionally resolved by the fine passes. A macro
            // move never hides or duplicates half-unit volume state.
            if (material == MAT_WATER && isHalfWater(cell)) return false;
        }
    }
    return true;
}

bool regionOpen(ivec2 origin) {
    for (int y = 0; y < int(TILE_SIZE); ++y)
        for (int x = 0; x < int(TILE_SIZE); ++x)
            if (!openAtmosphere(macroAt(origin + ivec2(x, y)))) return false;
    return true;
}

bool materialCanDisplace(uint sourceMaterial, uint targetMaterial) {
    if (targetMaterial == MAT_EMPTY || targetMaterial == MAT_OXYGEN) return true;
    Cell source = Cell(sourceMaterial, 0u, 20, 0u);
    Cell target = Cell(targetMaterial, 0u, 20, 0u);
    if (isCellGas(target) && !isCellGas(source)) return true;
    if (isCellPowder(source))
        return isCellLiquid(target) && materialDensity(sourceMaterial) > materialDensity(targetMaterial);
    if (isCellLiquid(source))
        return isCellGas(target) ||
               (isCellLiquid(target) && materialDensity(sourceMaterial) > materialDensity(targetMaterial));
    return false;
}

bool targetRegionAllows(ivec2 origin, uint sourceMaterial) {
    if (regionOpen(origin)) return true;
    Cell first = macroAt(origin);
    uint targetMaterial = first.material;
    if ((first.aux & AUX_STRUCTURAL) != 0u || !materialCanDisplace(sourceMaterial, targetMaterial)) return false;
    for (int y = 0; y < int(TILE_SIZE); ++y) {
        for (int x = 0; x < int(TILE_SIZE); ++x) {
            Cell cell = macroAt(origin + ivec2(x, y));
            if (cell.material != targetMaterial || (cell.aux & AUX_STRUCTURAL) != 0u) return false;
        }
    }
    return true;
}

TileState tileStateAt(ivec2 tile) {
    uint columns = tileColumns(macroPc.width);
    return tiles[uint(tile.y) * columns + uint(tile.x)];
}

bool macroSupported(ivec2 sourceTile, uint sourceMaterial) {
    uint rows = (macroPc.height + TILE_SIZE - 1u) / TILE_SIZE;
    ivec2 belowTile = sourceTile + ivec2(0, 1);
    if (belowTile.y >= int(rows)) return true;
    TileState below = tileStateAt(belowTile);
    if (below.occupancy == 0u && below.material == MAT_EMPTY) return false;
    if (below.occupancy == TILE_CELL_COUNT && materialCanDisplace(sourceMaterial, below.material)) return false;
    return true;
}

bool pairCoordinates(out ivec2 sourceTile, out ivec2 targetTile) {
    uint columns = tileColumns(macroPc.width);
    uint rows = (macroPc.height + TILE_SIZE - 1u) / TILE_SIZE;
    ivec2 pair = ivec2(gl_WorkGroupID.xy);
    if (macroPc.phase == 0) {
        sourceTile = ivec2(pair.x, pair.y * 2 + macroPc.parity);
        targetTile = sourceTile + ivec2(0, 1);
    } else if (macroPc.phase == 1 || macroPc.phase == 2) {
        sourceTile = ivec2(pair.x, pair.y * 2 + macroPc.parity);
        targetTile = sourceTile + ivec2(macroPc.phase == 1 ? -1 : 1, 1);
    } else {
        int baseX = pair.x * 2 + macroPc.parity;
        sourceTile = macroPc.phase == 3 ? ivec2(baseX, pair.y) : ivec2(baseX + 1, pair.y);
        targetTile = macroPc.phase == 3 ? sourceTile + ivec2(1, 0) : sourceTile + ivec2(-1, 0);
    }
    return sourceTile.x >= 0 && sourceTile.y >= 0 && targetTile.x >= 0 && targetTile.y >= 0 &&
           sourceTile.x < int(columns) && targetTile.x < int(columns) &&
           sourceTile.y < int(rows) && targetTile.y < int(rows);
}

void markMacroChunkDirty(ivec2 p) {
    atomicOr(chunks[chunkIndex(p, macroPc.width)].flags, CHUNK_DIRTY | CHUNK_ACTIVE);
}

void main() {
    if (gl_LocalInvocationIndex == 0u) {
        macroMoveAllowed = 0u;
        ivec2 sourceTile;
        ivec2 targetTile;
        if (pairCoordinates(sourceTile, targetTile)) {
            sourceTileShared = sourceTile;
            targetTileShared = targetTile;
            ivec2 sourceOrigin = sourceTile * int(TILE_SIZE);
            ivec2 targetOrigin = targetTile * int(TILE_SIZE);
            uint sourceMaterial = MAT_EMPTY;
            uint randomValue = macroHash(sourceTile, uint(macroPc.phase) + 1u);
            bool validSource = sourceRegion(sourceOrigin, sourceMaterial) &&
                               bulkMovementAllows(sourceMaterial, randomValue);
            bool allowed = false;
            if (validSource && macroPc.phase == 0) {
                allowed = targetRegionAllows(targetOrigin, sourceMaterial);
            } else if (validSource && (macroPc.phase == 1 || macroPc.phase == 2)) {
                allowed = macroSupported(sourceTile, sourceMaterial) &&
                          targetRegionAllows(targetOrigin, sourceMaterial);
            } else if (validSource) {
                Cell source = macroAt(sourceOrigin);
                allowed = isCellLiquid(source) && macroSupported(sourceTile, sourceMaterial) &&
                          regionOpen(targetOrigin);
            }
            macroMoveAllowed = allowed ? 1u : 0u;
        }
    }
    barrier();
    if (macroMoveAllowed == 0u) return;

    ivec2 local = ivec2(gl_LocalInvocationID.xy);
    ivec2 source = sourceTileShared * int(TILE_SIZE) + local;
    ivec2 target = targetTileShared * int(TILE_SIZE) + local;
    uint sourceIndex = macroIndex(source);
    uint targetIndex = macroIndex(target);
    Cell a = cells[sourceIndex];
    Cell b = cells[targetIndex];
    a.age = 0u;
    b.age = 0u;
    a.aux |= AUX_MOVED;
    b.aux |= AUX_MOVED;
    cells[sourceIndex] = b;
    cells[targetIndex] = a;

    if (gl_LocalInvocationIndex == 0u) {
        markMacroChunkDirty(source);
        markMacroChunkDirty(target);
        if (macroPc.collectDebug != 0u) {
            atomicAdd(debugStats[STAT_MACRO_TILE_MOVES], 1u);
            atomicAdd(debugStats[STAT_MACRO_CELL_MOVES], TILE_CELL_COUNT);
        }
    }
}
''')

          # CMake shader list and dependency graph.
          replace('CMakeLists.txt', '        tiles.comp\n        chemistry.comp\n        move.comp\n',
