          replace('shaders/tiles.comp', '    for (uint material = 1u; material < MATERIAL_COUNT; ++material) {\n        if (counts[material] > dominantCount) {\n            dominantCount = counts[material];\n            dominant = material;\n        }\n    }\n\n    uint cooldown',
                  '    for (uint material = 1u; material < MATERIAL_COUNT; ++material) {\n        if (counts[material] > dominantCount) {\n            dominantCount = counts[material];\n            dominant = material;\n        }\n    }\n    if (occupied == 0u && represented > 0u && uniformRepresented) {\n        dominant = representedMaterial;\n        dominantCount = represented;\n    }\n\n    uint cooldown')
          replace('shaders/tiles.comp', '    bool uniformMaterial = dominant != MAT_EMPTY && dominantCount == occupied;\n',
                  '    uint uniformPopulation = occupied != 0u ? occupied : represented;\n    bool uniformMaterial = dominant != MAT_EMPTY && dominantCount == uniformPopulation;\n')
          replace('shaders/tiles.comp', '    uint stableCells = structuralTile ? dominantCount : occupied;\n    bool sleeping = terrainStable && !damaged && !moving && !hot && !reacting &&\n                     !activeContent && dominantCount == stableCells;\n',
