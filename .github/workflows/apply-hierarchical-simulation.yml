          replace('shaders/tiles.comp', '            Cell cell = cells[indexOf(p)];\n            if (cell.material == MAT_EMPTY) continue;\n            if (isCellGas(cell) || isCellLiquid(cell)) {\n                activeContent = true;\n                moving = true;\n                continue;\n            }\n            ++occupied;\n',
