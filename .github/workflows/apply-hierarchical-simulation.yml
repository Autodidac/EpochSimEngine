          replace('shaders/chemistry.comp', '#include "tiles.glsl"\n', '#include "tiles.glsl"\n#include "chunks.glsl"\n')
          replace('shaders/chemistry.comp', 'layout(std430, binding = 4) readonly buffer Tiles { TileState tiles[]; };\n',
