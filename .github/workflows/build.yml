name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Bootstrap vcpkg
        shell: pwsh
        run: |
          $root = Join-Path $env:RUNNER_TEMP 'vcpkg'
          git clone --filter=blob:none https://github.com/microsoft/vcpkg.git $root
          git -C $root checkout 04a735608afac5844e86fc91d6ba2112cac613c1
          & (Join-Path $root 'bootstrap-vcpkg.bat') -disableMetrics
          "VCPKG_ROOT=$root" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Configure MSVC project
        run: cmake --preset windows-msvc -DFASTFREDDY_WARNINGS_AS_ERRORS=ON

      - name: Build
        run: cmake --build --preset windows-release --parallel

      - name: Test
        run: ctest --preset windows-release

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: fastfreddy-testbed-windows-x64
          path: |
            build/windows/Release/fastfreddy_testbed.exe
            build/windows/Release/*.dll
          if-no-files-found: error

  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      CC: gcc-14
      CXX: g++-14
    steps:
      - uses: actions/checkout@v4

      - name: Install prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build gcc-14 g++-14 \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev \
            libxi-dev libxfixes-dev libxkbcommon-dev

      - name: Bootstrap vcpkg
        run: |
          root="$RUNNER_TEMP/vcpkg"
          git clone --filter=blob:none https://github.com/microsoft/vcpkg.git "$root"
          git -C "$root" checkout 04a735608afac5844e86fc91d6ba2112cac613c1
          "$root/bootstrap-vcpkg.sh" -disableMetrics
          echo "VCPKG_ROOT=$root" >> "$GITHUB_ENV"

      - name: Configure
        run: cmake --preset linux-ninja -DFASTFREDDY_WARNINGS_AS_ERRORS=ON

      - name: Build
        run: cmake --build --preset linux-release --parallel

      - name: Test
        run: ctest --preset linux-release

      - name: Upload Linux build
        uses: actions/upload-artifact@v4
        with:
          name: fastfreddy-testbed-linux-x64
          path: build/linux/fastfreddy_testbed
          if-no-files-found: error
