name: Build Full FastFreddy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      publish_release:
        description: Publish a GitHub release after successful builds
        required: false
        default: true
        type: boolean

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Bootstrap pinned vcpkg
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = Join-Path $env:RUNNER_TEMP 'vcpkg'
          git clone --filter=blob:none https://github.com/microsoft/vcpkg.git $root
          git -C $root checkout 04a735608afac5844e86fc91d6ba2112cac613c1
          & (Join-Path $root 'bootstrap-vcpkg.bat') -disableMetrics
          "VCPKG_ROOT=$root" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Configure Visual Studio project
        shell: pwsh
        run: cmake --preset windows -DBUILD_TESTING=ON -DEPOCH_SAND_WARNINGS_AS_ERRORS=ON

      - name: Build Release
        shell: pwsh
        run: cmake --build --preset windows-release --parallel

      - name: Run contracts
        shell: pwsh
        run: ctest --preset windows-release

      - name: Package Windows release
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $dist = Join-Path $env:GITHUB_WORKSPACE 'dist'
          $stage = Join-Path $dist 'FastFreddyOptimized_Windows_x64'
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item 'build/windows/Release/epoch_sand.exe' $stage -Force
          Copy-Item 'build/windows/Release/shaders' $stage -Recurse -Force
          Copy-Item 'build/windows/Release/scenes' $stage -Recurse -Force
          Copy-Item 'README.md','WATER_OPTIMIZATION.md','LICENSE' -Destination $stage -Force
          Set-Content -LiteralPath (Join-Path $stage 'run.bat') -Encoding ascii -Value @(
            '@echo off',
            'cd /d "%~dp0"',
            'epoch_sand.exe'
          )
          Compress-Archive -Path (Join-Path $stage '*') -DestinationPath (Join-Path $dist 'FastFreddyOptimized_Windows_x64.zip') -CompressionLevel Optimal -Force

      - name: Upload Windows package
        uses: actions/upload-artifact@v4
        with:
          name: fastfreddy-optimized-windows-x64
          path: dist/FastFreddyOptimized_Windows_x64.zip
          if-no-files-found: error

  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      CC: gcc-14
      CXX: g++-14
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ninja-build gcc-14 g++-14 pkg-config \
            libvulkan-dev libxcb1-dev libx11-xcb-dev

      - name: Bootstrap pinned vcpkg
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/vcpkg"
          git clone --filter=blob:none https://github.com/microsoft/vcpkg.git "$root"
          git -C "$root" checkout 04a735608afac5844e86fc91d6ba2112cac613c1
          "$root/bootstrap-vcpkg.sh" -disableMetrics
          echo "VCPKG_ROOT=$root" >> "$GITHUB_ENV"

      - name: Configure Ninja build
        run: cmake --preset linux-release -DBUILD_TESTING=ON -DEPOCH_SAND_WARNINGS_AS_ERRORS=ON

      - name: Build Release
        run: cmake --build --preset linux-release --parallel

      - name: Run contracts
        run: ctest --test-dir build/linux-release --output-on-failure

      - name: Package Linux release
        run: |
          set -euo pipefail
          stage='dist/FastFreddyOptimized_Linux_x64'
          mkdir -p "$stage"
          cp build/linux-release/epoch_sand "$stage/"
          cp -a build/linux-release/shaders "$stage/"
          cp -a build/linux-release/scenes "$stage/"
          cp README.md WATER_OPTIMIZATION.md LICENSE "$stage/"
          cat > "$stage/run.sh" <<'SCRIPT'
          #!/usr/bin/env bash
          set -euo pipefail
          cd "$(dirname "$0")"
          exec ./epoch_sand
          SCRIPT
          chmod +x "$stage/run.sh"
          tar -C dist -czf dist/FastFreddyOptimized_Linux_x64.tar.gz FastFreddyOptimized_Linux_x64

      - name: Upload Linux package
        uses: actions/upload-artifact@v4
        with:
          name: fastfreddy-optimized-linux-x64
          path: dist/FastFreddyOptimized_Linux_x64.tar.gz
          if-no-files-found: error

  release:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && contains(github.event.head_commit.message, '[release]'))
    needs: [windows, linux]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Generate checksums
        run: |
          cd dist
          sha256sum FastFreddyOptimized_Windows_x64.zip FastFreddyOptimized_Linux_x64.tar.gz > SHA256SUMS.txt

      - name: Select release tag
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag='v2.0.0'
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            tag="v2.0.${GITHUB_RUN_NUMBER}"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Publish full optimized release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          gh release create "$RELEASE_TAG" \
            dist/FastFreddyOptimized_Windows_x64.zip \
            dist/FastFreddyOptimized_Linux_x64.tar.gz \
            dist/SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "FastFreddy Optimized Water Simulation $RELEASE_TAG" \
            --notes "Full FastFreddy Vulkan application architecture with its original scenes, EpochGui menus, material cards, scene I/O, mining/build controls, diagnostics, tile sleeping, and debug statistics. The visible palette is reduced to terrain, retained liquids, and oxygen. Empty space is oxygen. Fresh water uses conserved half-volume cells, a 1.5-cell ledge release threshold, and additional half-water-only horizontal passes."
