name: Apply SandHybrid v2.4.9 Release Fixes

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'agent/atmosphere-fill-split-v249'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Apply and validate release fixes
        shell: bash
        run: |
          set -euo pipefail
          applied=0
          for script in tools/apply_v249.py tools/apply_v249_solid_policy.py; do
            if [[ -f "$script" ]]; then
              python3 "$script"
              applied=1
            fi
          done
          if [[ "$applied" -eq 0 ]]; then
            echo 'All v2.4.9 release fixes are already applied.'
            exit 0
          fi

          python3 - <<'PY'
          from pathlib import Path
          path = Path('tools/validate_shader_contracts.py')
          text = path.read_text(encoding='utf-8')
          text = text.replace('.github/workflows/v248-ci.yml', '.github/workflows/v249-ci.yml')
          text = text.replace(
              'if "material == Material::atmosphere) cell.aux |= 54u" not in renderer:',
              'if "material == Material::atmosphere) cell.aux |= 54u" not in renderer_cpp:',
          )
          path.write_text(text, encoding='utf-8')
          PY

          python3 tools/validate_shader_contracts.py
          python3 tools/validate_mission_cache.py
          cmake -S . -B build/contracts -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DSANDHYBRID_BUILD_APP=OFF \
            -DSANDHYBRID_WARNINGS_AS_ERRORS=ON \
            -DBUILD_TESTING=ON
          cmake --build build/contracts --parallel
          ctest --test-dir build/contracts --output-on-failure
          rm -rf build/contracts

          if git diff --quiet; then
            echo 'All v2.4.9 release fixes are already applied.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Apply SandHybrid v2.4.9 release fixes'
          git push origin HEAD:${{ github.head_ref }}
