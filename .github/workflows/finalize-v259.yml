name: Finalize SandHybrid v2.5.9 material recovery

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: finalize-v259-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  finalize:
    if: github.head_ref == 'agent/v259-macro-water-volcano-pressure'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/v259-macro-water-volcano-pressure
          fetch-depth: 0

      - name: Apply validated v2.5.9 source patch
        shell: bash
        run: |
          set -euo pipefail
          if grep -q 'project(SandHybrid VERSION 2.5.9' CMakeLists.txt; then
            echo 'v2.5.9 source is already applied.'
            exit 0
          fi
          cat tools/v259_patch.part* | base64 --decode | gzip --decompress > /tmp/v259.patch
          git apply --check /tmp/v259.patch
          git apply /tmp/v259.patch

      - name: Validate contracts and headless package
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'project(SandHybrid VERSION 2.5.9' CMakeLists.txt
          python3 tools/validate_shader_contracts.py
          python3 tools/validate_mission_cache.py
          python3 tools/validate_no_simulation_coroutines.py
          python3 tools/validate_project_branding.py
          cmake -S . -B build/v259-finalizer -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DSANDHYBRID_BUILD_APP=OFF \
            -DSANDHYBRID_BUILD_VULKAN_RUNTIME=OFF \
            -DSANDHYBRID_WARNINGS_AS_ERRORS=ON \
            -DBUILD_TESTING=ON
          cmake --build build/v259-finalizer --parallel
          ctest --test-dir build/v259-finalizer --output-on-failure

      - name: Commit permanent v2.5.9 source
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A -- \
            ':!.github/workflows/finalize-v259.yml' \
            ':!.github/workflows/ci-release.yml' \
            ':!tools/v259_patch.part*'
          git commit -m 'Recover v2.5.9 material behavior water volcano hive and UI'
          git push origin HEAD:agent/v259-macro-water-volcano-pressure
