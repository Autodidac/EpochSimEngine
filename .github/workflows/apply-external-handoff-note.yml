name: Apply External Handoff Priority Note

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'agent/external-handoff-priority-note'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Apply mission-cache note
        shell: bash
        run: python3 tools/apply_external_handoff_note.py

      - name: Validate canonical mission cache
        shell: bash
        run: python3 tools/validate_mission_cache.py

      - name: Commit mission-cache note
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout HEAD -- .github/workflows/apply-external-handoff-note.yml
          git add -A
          git commit -m 'Prioritize protected external branch integration'
          git push origin HEAD:${{ github.head_ref }}
