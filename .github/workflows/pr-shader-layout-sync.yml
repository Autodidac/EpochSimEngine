name: PR shader layout sync

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: pr-shader-layout-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  apply:
    if: github.head_ref == 'agent/debug-map-inventory-v256'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: agent/debug-map-inventory-v256

      - name: Synchronize shader and C++ layout geometry
        run: python3 tools/v256_shader_layout_sync.py

      - name: Validate source contracts
        run: |
          python3 tools/validate_shader_contracts.py
          python3 tools/validate_mission_cache.py
          python3 tools/validate_no_simulation_coroutines.py
          python3 tools/validate_project_branding.py

      - name: Build and test headless C++23 core
        run: |
          cmake -S . -B build/shader-layout -G Ninja -DCMAKE_BUILD_TYPE=Release -DSANDHYBRID_BUILD_APP=OFF -DSANDHYBRID_BUILD_VULKAN_RUNTIME=OFF -DSANDHYBRID_WARNINGS_AS_ERRORS=ON -DBUILD_TESTING=ON
          cmake --build build/shader-layout --parallel
          ctest --test-dir build/shader-layout --output-on-failure

      - name: Commit validated permanent source
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm -f tools/v256_shader_layout_sync.py
          git add -A
          git commit -m "Synchronize redesigned sidebar rendering and hitboxes"
          git push origin HEAD:agent/debug-map-inventory-v256
