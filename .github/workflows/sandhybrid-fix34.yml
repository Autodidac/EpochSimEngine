name: SandHybrid Fix34 Bees and Brick Scenes

on:
  pull_request:
    branches: [main]
    paths:
      - 'tools/fix34.py'
      - 'tools/fix34_post.py'
      - '.github/workflows/sandhybrid-fix34.yml'

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: sandhybrid-fix34
  cancel-in-progress: true

env:
  VCPKG_COMMIT: 04a735608afac5844e86fc91d6ba2112cac613c1

jobs:
  linux-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Check out Fix34 branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Apply Fix34 source patch
        run: |
          python3 tools/fix34.py
          python3 tools/fix34_post.py

      - name: Run source audits
        run: |
          python3 tools/audit_material_behaviors.py
          python3 tools/audit_ecology_motion.py
          python3 tools/validate_shader_contracts.py
          python3 tools/audit_fix34.py

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build gcc-14 g++-14 glslc libvulkan-dev libxcb1-dev

      - name: Configure Linux x64 Release
        env:
          CC: gcc-14
          CXX: g++-14
        run: |
          cmake -S . -B build/linux -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DEPOCH_SAND_WARNINGS_AS_ERRORS=ON \
            -DEPOCH_SAND_ENABLE_VALIDATION=OFF \
            -DBUILD_TESTING=ON

      - name: Build Linux and every SPIR-V shader
        run: cmake --build build/linux --parallel

      - name: Run Linux C++23 contract tests
        run: ctest --test-dir build/linux --output-on-failure

      - name: Package Linux x64 Release
        run: |
          rm -rf dist stage-linux
          cmake --install build/linux --prefix "$PWD/stage-linux"
          cp README.md LICENSE stage-linux/
          cat > stage-linux/run.sh <<'EOF'
          #!/usr/bin/env bash
          cd "$(dirname "$0")/bin"
          exec ./epoch_sand "$@"
          EOF
          chmod +x stage-linux/run.sh
          mkdir -p dist
          tar -C stage-linux -czf dist/SandHybrid_Linux_x64_Fix34.tar.gz .

      - name: Upload Linux package
        uses: actions/upload-artifact@v4
        with:
          name: SandHybrid-Linux-x64-Fix34
          path: dist/SandHybrid_Linux_x64_Fix34.tar.gz
          if-no-files-found: error

  windows-build:
    runs-on: windows-2022
    timeout-minutes: 90
    steps:
      - name: Check out Fix34 branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Apply Fix34 source patch
        shell: pwsh
        run: |
          python tools/fix34.py
          if ($LASTEXITCODE -ne 0) { throw 'Fix34 source patch failed.' }
          python tools/fix34_post.py
          if ($LASTEXITCODE -ne 0) { throw 'Fix34 post-patch correction failed.' }

      - name: Run source audits
        shell: pwsh
        run: |
          python tools/audit_material_behaviors.py
          if ($LASTEXITCODE -ne 0) { throw 'Material audit failed.' }
          python tools/audit_ecology_motion.py
          if ($LASTEXITCODE -ne 0) { throw 'Ecology audit failed.' }
          python tools/validate_shader_contracts.py
          if ($LASTEXITCODE -ne 0) { throw 'Shader contract validation failed.' }
          python tools/audit_fix34.py
          if ($LASTEXITCODE -ne 0) { throw 'Fix34 audit failed.' }

      - name: Bootstrap pinned vcpkg
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = Join-Path $env:RUNNER_TEMP 'vcpkg'
          git clone --filter=blob:none https://github.com/microsoft/vcpkg.git $root
          git -C $root checkout $env:VCPKG_COMMIT
          & (Join-Path $root 'bootstrap-vcpkg.bat') -disableMetrics
          if ($LASTEXITCODE -ne 0) { throw 'vcpkg bootstrap failed.' }
          "VCPKG_ROOT=$root" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Configure Windows x64 Release
        shell: pwsh
        run: |
          cmake -S . -B build/windows -G 'Visual Studio 17 2022' -A x64 `
            -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake" `
            -DVCPKG_TARGET_TRIPLET=x64-windows `
            -DVCPKG_HOST_TRIPLET=x64-windows `
            -DEPOCH_SAND_WARNINGS_AS_ERRORS=ON `
            -DEPOCH_SAND_ENABLE_VALIDATION=OFF `
            -DBUILD_TESTING=ON
          if ($LASTEXITCODE -ne 0) { throw 'Windows CMake configuration failed.' }

      - name: Build Windows and every SPIR-V shader
        shell: pwsh
        run: |
          cmake --build build/windows --config Release --parallel
          if ($LASTEXITCODE -ne 0) { throw 'Windows build failed.' }

      - name: Run Windows C++23 contract tests
        shell: pwsh
        run: |
          ctest --test-dir build/windows -C Release --output-on-failure
          if ($LASTEXITCODE -ne 0) { throw 'Windows tests failed.' }

      - name: Package Windows x64 Release
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Remove-Item dist, stage-windows -Recurse -Force -ErrorAction SilentlyContinue
          cmake --install build/windows --config Release --prefix stage-windows
          Copy-Item README.md, LICENSE -Destination stage-windows -Force
          @('@echo off', 'cd /d "%~dp0bin"', 'epoch_sand.exe') |
            Set-Content -LiteralPath stage-windows/run.bat -Encoding ascii
          New-Item -ItemType Directory -Path dist | Out-Null
          Compress-Archive -Path 'stage-windows/*' -DestinationPath dist/SandHybrid_Windows_x64_Fix34.zip -CompressionLevel Optimal

      - name: Upload Windows package
        uses: actions/upload-artifact@v4
        with:
          name: SandHybrid-Windows-x64-Fix34
          path: dist/SandHybrid_Windows_x64_Fix34.zip
          if-no-files-found: error

  finalize-release:
    needs: [linux-build, windows-build]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out verified Fix34 branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Rebase on current main and apply verified patch
        run: |
          git fetch origin main
          git rebase origin/main
          python3 tools/fix34.py
          python3 tools/fix34_post.py
          python3 tools/audit_material_behaviors.py
          python3 tools/audit_ecology_motion.py
          python3 tools/validate_shader_contracts.py
          python3 tools/audit_fix34.py

      - name: Commit verified source to main
        env:
          PR_HEAD: ${{ github.event.pull_request.head.ref }}
        run: |
          rm -f tools/fix34.py tools/fix34_post.py .github/workflows/sandhybrid-fix34.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'SandHybrid Fix34: moving biohazard bees and aligned brick scenes'
          git push origin HEAD:main
          echo "RELEASE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Download verified packages
        uses: actions/download-artifact@v4
        with:
          pattern: SandHybrid-*-Fix34
          path: dist
          merge-multiple: true

      - name: Publish Fix34 release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd dist
          sha256sum SandHybrid_Linux_x64_Fix34.tar.gz SandHybrid_Windows_x64_Fix34.zip > SHA256SUMS.txt
          cd ..
          tag='v1.8.1-fix34'
          gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 && \
            gh release delete "$tag" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag || true
          gh release create "$tag" \
            dist/SandHybrid_Linux_x64_Fix34.tar.gz \
            dist/SandHybrid_Windows_x64_Fix34.zip \
            dist/SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" \
            --target "$RELEASE_SHA" \
            --title 'SandHybrid Fix34: Moving Biohazard Bees and Brick Scenes' \
            --notes 'Fixes bee serialization and sleeping-chunk movement rejection, replaces the propeller with a fixed three-lobed biohazard swarm whose individual bees visibly circulate, and rebuilds all nine canonical scenes from globally aligned 8x8 structural bricks. PPM scene loading remains available through the explicit Load control.'

      - name: Close PR and delete temporary branch
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD: ${{ github.event.pull_request.head.ref }}
        run: |
          gh pr close "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --delete-branch=false 2>/dev/null || true
          git push origin --delete "$PR_HEAD" 2>/dev/null || true
