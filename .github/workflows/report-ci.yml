name: Record CI Result

on:
  workflow_run:
    workflows: ["Build and Release"]
    types: [completed]

permissions:
  contents: write

jobs:
  record:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Remove accidental duplicate releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for tag in v1.0.10 v1.0.11; do
            if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              gh release delete "$tag" --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes
            fi
          done
          for tag in v1.0.10 v1.0.11; do
            if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              echo "Failed to remove duplicate release $tag" >&2
              exit 1
            fi
          done

      - name: Record completed run
        env:
          RUN_ID: ${{ github.event.workflow_run.id }}
          RUN_NUMBER: ${{ github.event.workflow_run.run_number }}
          CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
        run: |
          cat > ci-status.json <<EOF
          {
            "run_id": ${RUN_ID},
            "run_number": ${RUN_NUMBER},
            "conclusion": "${CONCLUSION}",
            "head_sha": "${HEAD_SHA}",
            "run_url": "${RUN_URL}",
            "canonical_release": "v1.0.0",
            "duplicate_releases_removed": true
          }
          EOF
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ci-status.json
          git commit -m 'Record CI result [skip ci]' || exit 0
          git push origin HEAD:main
