name: Finalize v2.5.6 aspect-correct viewport

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: finalize-v256-aspect-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  finalize:
    if: github.head_ref == 'agent/debug-map-inventory-v256'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/debug-map-inventory-v256
          fetch-depth: 0

      - name: Apply aspect-correct camera and map viewport
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          def replace_once(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text(encoding='utf-8')
              if old not in text:
                  raise SystemExit(f'missing marker in {path}: {old[:180]!r}')
              file.write_text(text.replace(old, new, 1), encoding='utf-8')

          replace_once(
              'include/sandhybrid/ui_layout.hpp',
              '''    if (panel_width < tile_columns || panel_height < tile_rows) return {layout.simulation, 0u};
    const auto tile_pixels = (std::max)(1u, (std::min)(panel_width / tile_columns, panel_height / tile_rows));
''',
              '''    if (panel_width < tile_columns || panel_height < tile_rows) {
        const auto safe_width = (std::max)(grid_width, 1u);
        const auto safe_height = (std::max)(grid_height, 1u);
        std::uint32_t viewport_width = panel_width;
        std::uint32_t viewport_height = panel_height;
        if (static_cast<std::uint64_t>(panel_width) * safe_height <=
            static_cast<std::uint64_t>(panel_height) * safe_width) {
            viewport_height = (std::max)(1u, static_cast<std::uint32_t>(
                static_cast<std::uint64_t>(panel_width) * safe_height / safe_width));
        } else {
            viewport_width = (std::max)(1u, static_cast<std::uint32_t>(
                static_cast<std::uint64_t>(panel_height) * safe_width / safe_height));
        }
        const auto left = layout.simulation.position.x +
                          float((panel_width - viewport_width) / 2u);
        const auto top = layout.simulation.position.y +
                         float((panel_height - viewport_height) / 2u);
        return {{{left, top}, {float(viewport_width), float(viewport_height)}}, 0u};
    }
    const auto tile_pixels = (std::max)(1u, (std::min)(panel_width / tile_columns, panel_height / tile_rows));
''')

          replace_once(
              'src/app.cpp',
              '''        const auto layout = ui::make_layout(input.width, input.height);
        const auto simulation_viewport = ui::make_simulation_viewport(
            layout, simulation_config.grid_width, simulation_config.grid_height);
        const epochengine::gui_lib::Vec2 pointer{
''',
              '''        const auto layout = ui::make_layout(input.width, input.height);
        const bool map_view_enabled =
            shared_state.map_view.load(std::memory_order_relaxed);
        const auto visible_view = camera_view(
            shared_state, simulation_config, map_view_enabled);
        const auto simulation_viewport = ui::make_simulation_viewport(
            layout, visible_view.width, visible_view.height);
        const epochengine::gui_lib::Vec2 pointer{
''')
          replace_once(
              'src/app.cpp',
              '''        const bool map_view_enabled =
            shared_state.map_view.load(std::memory_order_relaxed);
        const auto directional_input = route_directional_input(
''',
              '''        const auto directional_input = route_directional_input(
''')

          replace_once(
              'src/vulkan_renderer.cpp',
              '''        const auto layout = ui::make_layout(width, height);
        const auto viewport = ui::make_simulation_viewport(layout, config.grid_width, config.grid_height);
        const auto viewport_width = (std::max)(static_cast<std::uint32_t>(viewport.rect.size.x), 1u);
''',
              '''        const auto layout = ui::make_layout(width, height);
        const auto view = render_grid_view(state);
        const auto viewport = ui::make_simulation_viewport(layout, view.width, view.height);
        const auto viewport_width = (std::max)(static_cast<std::uint32_t>(viewport.rect.size.x), 1u);
''')
          replace_once(
              'src/vulkan_renderer.cpp',
              '''        const auto view = render_grid_view(state);
        const auto grid_x = static_cast<std::int32_t>(view.origin_x +
''',
              '''        const auto grid_x = static_cast<std::int32_t>(view.origin_x +
''')
          replace_once(
              'src/vulkan_renderer.cpp',
              '''        const auto [cursor_x, cursor_y] = grid_cursor(state);
        const auto layout = ui::make_layout(swapchain_extent.width, swapchain_extent.height);
        const auto simulation_viewport = ui::make_simulation_viewport(
            layout, config.grid_width, config.grid_height);
        const auto view = render_grid_view(state);
''',
              '''        const auto [cursor_x, cursor_y] = grid_cursor(state);
        const auto layout = ui::make_layout(swapchain_extent.width, swapchain_extent.height);
        const auto view = render_grid_view(state);
        const auto simulation_viewport = ui::make_simulation_viewport(
            layout, view.width, view.height);
''')

          test = Path('tests/ui_layout_contract.cpp')
          text = test.read_text(encoding='utf-8')
          anchor = '''    const auto compact = sandhybrid::ui::make_layout(480u, 320u);
'''
          addition = '''    const auto wide_map = sandhybrid::ui::make_simulation_viewport(
        layout, sandhybrid::resident_world_width, sandhybrid::resident_world_height);
    if (static_cast<std::uint32_t>(wide_map.rect.size.x) != 896u ||
        static_cast<std::uint32_t>(wide_map.rect.size.y) != 126u ||
        wide_map.tile_pixel_size != 0u) return 10;

'''
          if addition not in text:
              if anchor not in text:
                  raise SystemExit('ui test insertion marker missing')
              text = text.replace(anchor, addition + anchor, 1)
              text = text.replace('return 10;', 'return 11;', 1)
              text = text.replace('return 11;', 'return 12;', 1)
              text = text.replace('return 12;', 'return 13;', 1)
              text = text.replace('return 13;', 'return 14;', 1)
          test.write_text(text, encoding='utf-8')

          validator = Path('tools/validate_shader_contracts.py')
          text = validator.read_text(encoding='utf-8')
          anchor = '''    for token in (
        "preferred_sidebar_width = 384u",
'''
          addition = '''    for token in (
        "static_cast<std::uint64_t>(panel_width) * safe_height",
        "layout, visible_view.width, visible_view.height",
        "layout, view.width, view.height",
    ):
        if token not in ui_layout + app_cpp + renderer_cpp:
            errors.append(f"aspect-correct live-view viewport contract missing {token!r}")
'''
          if addition not in text:
              if anchor not in text:
                  raise SystemExit('validator viewport marker missing')
              text = text.replace(anchor, addition + anchor, 1)
          validator.write_text(text, encoding='utf-8')

          mission = Path('missioncache.md')
          text = mission.read_text(encoding='utf-8')
          text, count = re.subn(
              r'^\| MC-121 \|.*$',
              '| MC-121 | PARTIAL | Independent slow-refresh fullscreen debug map | MAP renders the complete 10240x1440 resident world from a separate 4 Hz snapshot, independent from simulation LOD and the main camera. It owns separate pan/zoom state, defaults to the full 16x4 frame, preserves the true 64:9 world aspect with letterboxing instead of stretching, shades inactive areas, outlines the live contiguous 4x4 active window, and draws the main-camera rectangle. Moving the map never changes scheduling. Static contracts pass; packaged clarity/refresh acceptance remains required. |',
              text, count=1, flags=re.M)
          if count != 1:
              raise SystemExit(f'MC-121 replacement count was {count}')
          mission.write_text(text, encoding='utf-8')

          changelog = Path('CHANGELOG.md')
          text = changelog.read_text(encoding='utf-8')
          note = '- Aspect-fitted both the live camera and full-world map view from their actual visible dimensions; the 16x4 map now renders at its true 64:9 shape instead of stretching to the simulation panel.\n'
          marker = '## 2.5.6\n\n'
          if note not in text:
              text = text.replace(marker, marker + note, 1)
          changelog.write_text(text, encoding='utf-8')
          PY

      - name: Validate source and headless contracts
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile tools/validate_shader_contracts.py
          python3 tools/validate_shader_contracts.py
          python3 tools/validate_mission_cache.py
          python3 tools/validate_no_simulation_coroutines.py
          python3 tools/validate_project_branding.py
          cmake -S . -B build/aspect-fit -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DSANDHYBRID_BUILD_APP=OFF \
            -DSANDHYBRID_BUILD_VULKAN_RUNTIME=OFF \
            -DSANDHYBRID_WARNINGS_AS_ERRORS=ON \
            -DBUILD_TESTING=ON
          cmake --build build/aspect-fit --parallel
          ctest --test-dir build/aspect-fit --output-on-failure

      - name: Commit permanent source and remove workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm -f .github/workflows/finalize-v256-aspect-fit.yml
          git add -A
          git commit -m 'Preserve camera and map viewport aspect'
          git push origin HEAD:agent/debug-map-inventory-v256
