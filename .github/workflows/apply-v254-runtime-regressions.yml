'''
          validator, count = block_pattern.subn(corrected_block, validator, count=1)
          if count != 1:
              raise SystemExit(f'validator malformed block replacement count was {count}')
          scene_validation_anchor = (
              '    if "% 224u" in scene_image_cpp or "scene_color(" in scene_image_cpp:\n'
              '        errors.append("obsolete hashed scene palette remains")\n'
          )
          regression_checks = r'''
    bee_swarm = (SHADERS / "bee_swarm.glsl").read_text(encoding="utf-8")
    for token in (
        "BEE_AUTHORED_WORLD_CELLS.y * 3",
