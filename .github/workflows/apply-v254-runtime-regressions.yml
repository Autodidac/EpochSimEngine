name: Apply v2.5.4 runtime regression closeout

on:
  push:
    branches: [agent/durable-structural-ground-deposits-v254]

permissions:
  contents: write

concurrency:
  group: apply-v254-runtime-regressions
  cancel-in-progress: true

jobs:
  apply:
    if: github.event.head_commit.message == 'Apply v2.5.4 runtime regression closeout'
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/durable-structural-ground-deposits-v254
          fetch-depth: 0

      - name: Apply structural, geology, bee, wet-sand, and medium settling fixes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          import textwrap

          # Reuse the already-reviewed structural/geology applicator, including
          # its robust world-layout replacement, but stop before its broken
          # validator is executed by the outer workflow.
          v2_path = Path('.github/workflows/apply-durable-structural-ground-deposits-v2.yml')
          v2_text = v2_path.read_text(encoding='utf-8')
          marker = "          python3 - <<'PY'\n"
          start = v2_text.index(marker) + len(marker)
          end = v2_text.index("\n          PY", start)
          exec(compile(textwrap.dedent(v2_text[start:end]), str(v2_path), 'exec'))

          def replace_once(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text(encoding='utf-8')
              if old not in text:
                  raise SystemExit(f'missing replacement marker in {path}: {old[:160]!r}')
              file.write_text(text.replace(old, new, 1), encoding='utf-8')

          def replace_mission(mission_id: str, row: str) -> None:
              file = Path('missioncache.md')
              text = file.read_text(encoding='utf-8')
              pattern = re.compile(rf'^\| {re.escape(mission_id)} \|.*$', re.M)
              text, count = pattern.subn(row, text, count=1)
              if count != 1:
                  raise SystemExit(f'mission row {mission_id} replacement count was {count}')
              file.write_text(text, encoding='utf-8')

          # Gold remains authored/special and is not part of random geology.
          replace_once(
              'include/sandhybrid/world_layout.hpp',
              '    if (roll < 38u) return Material::aluminum;\n'
              '    if (roll < 41u) return Material::gold;\n'
              '    if (depth >= 160u && roll == 41u) return Material::uranium;\n',
              '    if (roll < 38u) return Material::aluminum;\n'
              '    if (depth >= 160u && roll < 41u) return Material::uranium;\n')
          replace_once(
              'shaders/reset.comp',
              '    if (roll < 38u) return MAT_ALUMINUM;\n'
              '    if (roll < 41u) return MAT_GOLD;\n'
              '    if (depth >= 160 && roll == 41u) return MAT_URANIUM;\n',
              '    if (roll < 38u) return MAT_ALUMINUM;\n'
              '    if (depth >= 160 && roll < 41u) return MAT_URANIUM;\n')

          # Scene-local bee metadata must decode at the same Y=720 authored
          # origin used by reset, camera home, and scene-image upload.
          replace_once(
              'shaders/bee_swarm.glsl',
              'ivec2 beeAuthoredWorldOrigin(uint width, uint height) {\n'
              '    return ivec2(max((int(width) - BEE_AUTHORED_WORLD_CELLS.x) / 2, 0),\n'
              '                 max(int(height) - BEE_AUTHORED_WORLD_CELLS.y, 0));\n'
              '}\n',
              'ivec2 beeAuthoredWorldOrigin(uint width, uint height) {\n'
              '    int skyHeight = int(height) >= BEE_AUTHORED_WORLD_CELLS.y * 3\n'
              '        ? BEE_AUTHORED_WORLD_CELLS.y * 2\n'
              '        : 0;\n'
              '    return ivec2(max((int(width) - BEE_AUTHORED_WORLD_CELLS.x) / 2, 0),\n'
              '                 skyHeight);\n'
              '}\n')

          scene_path = Path('src/scene_image.cpp')
          scene = scene_path.read_text(encoding='utf-8')
          scene = scene.replace(
              'constexpr std::uint32_t bee_metadata_mask = 0x00ffffffu;\n',
              'constexpr std::uint32_t bee_metadata_mask = 0x00ffffffu;\n'
              'constexpr std::uint32_t bee_authored_home_slot_bit = 0x80u;\n'
              'constexpr std::int32_t beehive_shell_min_radius_squared = 28;\n'
              'constexpr std::int32_t beehive_shell_max_radius_squared = 108;\n'
              'constexpr std::int32_t beehive_chamber_radius_squared = 28;\n'
              'constexpr std::int32_t beehive_exit_min_x = 1;\n'
              'constexpr std::int32_t beehive_exit_max_x = 12;\n'
              'constexpr std::int32_t beehive_exit_half_height = 1;\n',
              1)
          scene = scene.replace(
              '    const auto metadata = packed_home_x | (packed_home_y << 8u) | ((slot & 255u) << 15u);\n',
              '    const auto packed_slot = (slot & 127u) | bee_authored_home_slot_bit;\n'
              '    const auto metadata = packed_home_x | (packed_home_y << 8u) | (packed_slot << 15u);\n',
              1)
          helper_marker = 'bool structural_candidate(const Material material) noexcept {\n'
          if helper_marker not in scene:
              raise SystemExit('scene image helper insertion marker missing')
          scene_helpers = r'''Material fix28_beehive_material(const std::int32_t offset_x,
                                const std::int32_t offset_y,
                                const std::uint32_t entropy) noexcept {
    const auto radius_squared = offset_x * offset_x + offset_y * offset_y;
    if (radius_squared == 0) return Material::queen_bee;
    if (offset_x >= beehive_exit_min_x && offset_x <= beehive_exit_max_x &&
        std::abs(offset_y) <= beehive_exit_half_height)
        return Material::empty;
    if (radius_squared < beehive_chamber_radius_squared) {
        if ((entropy & 3u) == 0u) return Material::empty;
        return (entropy & 4u) == 0u ? Material::honey : Material::pollen;
    }
    if (radius_squared >= beehive_shell_min_radius_squared &&
        radius_squared < beehive_shell_max_radius_squared)
        return Material::beehive;
    return Material::count;
}

bool legacy_hive_material(const Material material) noexcept {
    return material == Material::beehive || material == Material::honey ||
           material == Material::pollen || material == Material::queen_bee;
}

void normalize_fix28_hives(std::vector<std::uint32_t>& materials,
                           const std::uint32_t width,
                           const std::uint32_t height) {
    std::vector<std::size_t> queens;
    for (std::size_t index = 0; index < materials.size(); ++index) {
        if (materials[index] == static_cast<std::uint32_t>(Material::queen_bee))
            queens.push_back(index);
    }
    for (const auto queen_index : queens) {
        const auto queen_x = static_cast<std::int32_t>(queen_index % width);
        const auto queen_y = static_cast<std::int32_t>(queen_index / width);
        for (std::int32_t offset_y = -16; offset_y <= 16; ++offset_y) {
            for (std::int32_t offset_x = -16; offset_x <= 16; ++offset_x) {
                const auto x = queen_x + offset_x;
                const auto y = queen_y + offset_y;
                if (x < 0 || y < 0 || x >= static_cast<std::int32_t>(width) ||
                    y >= static_cast<std::int32_t>(height))
                    continue;
                const auto index = static_cast<std::size_t>(y) * width +
                                   static_cast<std::size_t>(x);
                const auto existing = static_cast<Material>(materials[index]);
                if (legacy_hive_material(existing))
                    materials[index] = static_cast<std::uint32_t>(Material::empty);
            }
        }
        for (std::int32_t offset_y = -11; offset_y <= 11; ++offset_y) {
            for (std::int32_t offset_x = -11; offset_x <= 12; ++offset_x) {
                const auto x = queen_x + offset_x;
                const auto y = queen_y + offset_y;
                if (x < 0 || y < 0 || x >= static_cast<std::int32_t>(width) ||
                    y >= static_cast<std::int32_t>(height))
                    continue;
                const auto index = static_cast<std::size_t>(y) * width +
                                   static_cast<std::size_t>(x);
                const auto material = fix28_beehive_material(
                    offset_x, offset_y, hash32(static_cast<std::uint32_t>(index) ^ 0xb33u));
                if (material != Material::count)
                    materials[index] = static_cast<std::uint32_t>(material);
            }
        }
    }
}

'''
          scene = scene.replace(helper_marker, scene_helpers + helper_marker, 1)
          counts_anchor = '    for (std::uint32_t y = 0u; y < height; ++y) {\n'
          counts_start = scene.index(counts_anchor, scene.index('std::vector<std::uint16_t> counts'))
          second_loop = scene.index(counts_anchor, counts_start + len(counts_anchor))
          recount = r'''    normalize_fix28_hives(materials, width, height);
    std::fill(counts.begin(), counts.end(), 0u);
    for (std::uint32_t y = 0u; y < height; ++y) {
        for (std::uint32_t x = 0u; x < width; ++x) {
            const auto index = static_cast<std::size_t>(y) * width + x;
            const auto material = materials[index];
            const auto typed = static_cast<Material>(material);
            if (material != 0u && structural_candidate(typed)) {
                const auto tile = static_cast<std::size_t>(y / tile_size) * tile_columns + x / tile_size;
                ++counts[tile * material_count + material];
            }
        }
    }

'''
          scene = scene[:second_loop] + recount + scene[second_loop:]
          scene_path.write_text(scene, encoding='utf-8')

          # Wet granular cells release stale structural state when wetted and
          # can sink through liquids even during the macro-only wet-material pass.
          replace_once(
              'shaders/chemistry.comp',
              '        if (shallowSandContact) result.aux |= AUX_WET;\n',
              '        if (shallowSandContact) {\n'
              '            result.aux |= AUX_WET | AUX_MOVED;\n'
              '            result.aux &= ~(AUX_STRUCTURAL | AUX_SUPPORTED);\n'
              '            result.age = 0u;\n'
              '        }\n')
          replace_once(
              'shaders/move.comp',
              'bool supportedAt(ivec2 position, Cell cell) {\n',
              'bool wetGranularSinkMove(Cell moving, Cell target) {\n'
              '    bool wetGranular = (moving.aux & AUX_WET) != 0u &&\n'
              '        (moving.material == MAT_SAND || moving.material == MAT_DIRT ||\n'
              '         moving.material == MAT_SILT);\n'
              '    return wetGranular && !isStructural(moving) && isCellLiquid(target) &&\n'
              '           effectiveDensity(moving) > effectiveDensity(target);\n'
              '}\n\n'
              'bool supportedAt(ivec2 position, Cell cell) {\n')
          replace_once(
              'shaders/move.comp',
              '    if ((isCellPowder(a) || isCellLiquid(a) || isLooseSolid(a)) && canCellFallInto(a, b) &&\n'
              '        movementAllows(a, randomValue)) {\n',
              '    if ((isCellPowder(a) || isCellLiquid(a) || isLooseSolid(a)) && canCellFallInto(a, b) &&\n'
              '        (wetGranularSinkMove(a, b) || movementAllows(a, randomValue))) {\n')
          replace_once(
              'shaders/move.comp',
              '        supportedAt(sourcePosition, source) && canCellFallInto(source, target) &&\n'
              '        movementAllows(source, randomValue)) {\n',
              '        supportedAt(sourcePosition, source) && canCellFallInto(source, target) &&\n'
              '        (wetGranularSinkMove(source, target) || movementAllows(source, randomValue))) {\n')

          # A lone surface cell no longer creates a half-water edge oscillation.
          replace_once(
              'shaders/move.comp',
              'bool isMovementHazard(uint material) {\n',
              'bool fullWaterSplitSupplied(ivec2 sourcePosition, int direction) {\n'
              '    Cell trailing = sampleAt(sourcePosition - ivec2(direction, 0));\n'
              '    return trailing.material == MAT_WATER && !isHalfWaterCell(trailing);\n'
              '}\n\n'
              'bool isMovementHazard(uint material) {\n')
          replace_once(
              'shaders/move.comp',
              '        bool keepLeft = (randomValue & 1u) == 0u;\n',
              '        bool leftSupported = solidSupportsWaterAt(left);\n'
              '        bool rightSupported = solidSupportsWaterAt(right);\n'
              '        bool keepLeft = leftSupported != rightSupported\n'
              '            ? leftSupported : (randomValue & 1u) == 0u;\n')
          replace_once(
              'shaders/move.comp',
              '        if (a.material == MAT_WATER && !isHalfWaterCell(a) &&\n'
              '            solidLedgePrecedesDrop(right, 1)) splitFullWaterPair(left, right, a, b);\n'
              '        else swapCells(left, right);\n',
              '        if (a.material == MAT_WATER && !isHalfWaterCell(a) &&\n'
              '            solidLedgePrecedesDrop(right, 1)) {\n'
              '            if (fullWaterSplitSupplied(left, 1)) splitFullWaterPair(left, right, a, b);\n'
              '        } else {\n'
              '            swapCells(left, right);\n'
              '        }\n')
          replace_once(
              'shaders/move.comp',
              '        if (b.material == MAT_WATER && !isHalfWaterCell(b) &&\n'
              '            solidLedgePrecedesDrop(left, -1)) splitFullWaterPair(right, left, b, a);\n'
              '        else swapCells(left, right);\n',
              '        if (b.material == MAT_WATER && !isHalfWaterCell(b) &&\n'
              '            solidLedgePrecedesDrop(left, -1)) {\n'
              '            if (fullWaterSplitSupplied(right, -1)) splitFullWaterPair(right, left, b, a);\n'
              '        } else {\n'
              '            swapCells(left, right);\n'
              '        }\n')

          # Balanced Atmosphere/Oxygen expansion is bounded. Density sorting
          # against another gas remains active, but vacuum-edge motion ages out.
          replace_once(
              'shaders/move.comp',
              'bool gasHorizontalAllows(Cell cell, uint randomValue) {\n',
              'bool gasExpansionAllows(Cell cell) {\n'
              '    if (cell.material == MAT_ATMOSPHERE || cell.material == MAT_OXYGEN)\n'
              '        return cell.age < 24u;\n'
              '    if (cell.material == MAT_CARBON_DIOXIDE || cell.material == MAT_STEAM ||\n'
              '        cell.material == MAT_DIRTY_STEAM || cell.material == MAT_SMOKE)\n'
              '        return cell.age < 96u;\n'
              '    return true;\n'
              '}\n\n'
              'bool gasHorizontalAllows(Cell cell, uint randomValue) {\n')
          replace_once(
              'shaders/move.comp',
              '    if (cell.age >= 48u) return false;\n',
              '    if (!gasExpansionAllows(cell) || cell.age >= 48u) return false;\n')
          replace_once(
              'shaders/move.comp',
              '    if (isCellGas(b) && (a.material == MAT_EMPTY ||\n'
              '        (isCellGas(a) && densityOf(b.material) < densityOf(a.material)))) {\n',
              '    bool emptyGasRise = a.material == MAT_EMPTY && gasExpansionAllows(b);\n'
              '    bool densityGasRise = isCellGas(a) &&\n'
              '        densityOf(b.material) < densityOf(a.material);\n'
              '    if (isCellGas(b) && (emptyGasRise || densityGasRise)) {\n')
          replace_once(
              'shaders/move.comp',
              '    if (upward && isCellGas(source) &&\n'
              '        (target.material == MAT_EMPTY ||\n'
              '         (isCellGas(target) && effectiveDensity(source) < effectiveDensity(target)))) {\n',
              '    bool emptyGasDiagonal = target.material == MAT_EMPTY && gasExpansionAllows(source);\n'
              '    bool densityGasDiagonal = isCellGas(target) &&\n'
              '        effectiveDensity(source) < effectiveDensity(target);\n'
              '    if (upward && isCellGas(source) &&\n'
              '        (emptyGasDiagonal || densityGasDiagonal)) {\n')

          # Boundary packets transition to fine ownership once, then sleep when
          # unchanged instead of re-entering breakup/active state every frame.
          replace_once(
              'shaders/tiles.comp',
              '    bool liquidBreakup = fullLiquid && !moving && !liquidEnclosed;\n'
              '    bool gasBreakup = fullGas && !moving && !gasEnclosed;\n'
              '    bool mediumBreakup = liquidBreakup || gasBreakup;\n',
              '    bool liquidBoundaryFine = fullLiquid && !moving && !liquidEnclosed;\n'
              '    bool gasBoundaryFine = fullGas && !moving && !gasEnclosed;\n'
              '    bool boundaryFineMedium = liquidBoundaryFine || gasBoundaryFine;\n'
              '    bool liquidBreakup = liquidBoundaryFine &&\n'
              '        !tileHas(previous, TILE_MEDIUM_BREAKUP);\n'
              '    bool gasBreakup = gasBoundaryFine &&\n'
              '        !tileHas(previous, TILE_MEDIUM_BREAKUP);\n'
              '    bool mediumBreakup = liquidBreakup || gasBreakup;\n')
          replace_once(
              'shaders/tiles.comp',
              '    bool settledMedium = ((macroLiquid && liquidEnclosed) || (macroGas && gasEnclosed)) &&\n'
              '                         !moving && minimumAge >= 30u;\n',
              '    bool settledMedium = ((macroLiquid && liquidEnclosed) || (macroGas && gasEnclosed)) &&\n'
              '                         !moving && minimumAge >= 30u;\n'
              '    bool settledFineMedium = boundaryFineMedium && minimumAge >= 48u;\n')
          replace_once(
              'shaders/tiles.comp',
              '    if (mediumBreakup) flags |= TILE_MEDIUM_BREAKUP;\n',
              '    if (boundaryFineMedium) flags |= TILE_MEDIUM_BREAKUP;\n')
          replace_once(
              'shaders/tiles.comp',
              '    bool sleeping = sleepingTerrain || sleepingAtmosphere || settledMedium;\n',
              '    bool sleeping = sleepingTerrain || sleepingAtmosphere ||\n'
              '                    settledMedium || settledFineMedium;\n')

          # Repair the malformed validator block produced by the superseded
