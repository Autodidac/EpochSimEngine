name: SandHybrid Fix25 Verified Motion and Ecology Release

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - "tools/apply_fix25_motion_ecology.py"
      - ".github/workflows/sandhybrid-fix25.yml"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: sandhybrid-fix25-release
  cancel-in-progress: true

jobs:
  build-test-release:
    runs-on: windows-2022
    timeout-minutes: 75

    steps:
      - name: Check out correction branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Apply motion and ecology correction
        shell: pwsh
        run: |
          python tools/apply_fix25_motion_ecology.py
          if ($LASTEXITCODE -ne 0) { throw 'Fix25 correction pass failed.' }

      - name: Audit every material contract
        shell: pwsh
        run: |
          python tools/audit_material_behaviors.py
          if ($LASTEXITCODE -ne 0) { throw 'Material behavior audit failed.' }

      - name: Audit ecology and movement contracts
        shell: pwsh
        run: |
          python tools/audit_ecology_motion.py
          if ($LASTEXITCODE -ne 0) { throw 'Ecology and movement audit failed.' }

      - name: Validate generated shader contracts
        shell: pwsh
        run: |
          python tools/validate_shader_contracts.py
          if ($LASTEXITCODE -ne 0) { throw 'Shader contract validation failed.' }

      - name: Bootstrap pinned vcpkg
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $vcpkgRoot = Join-Path $env:RUNNER_TEMP 'vcpkg'
          git clone --filter=blob:none https://github.com/microsoft/vcpkg.git $vcpkgRoot
          git -C $vcpkgRoot checkout 04a735608afac5844e86fc91d6ba2112cac613c1
          & (Join-Path $vcpkgRoot 'bootstrap-vcpkg.bat') -disableMetrics
          "VCPKG_ROOT=$vcpkgRoot" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Configure Windows x64 Release
        shell: pwsh
        run: |
          cmake -S . -B build/windows -G "Visual Studio 17 2022" -A x64 `
            -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake" `
            -DVCPKG_TARGET_TRIPLET=x64-windows `
            -DEPOCH_SAND_WARNINGS_AS_ERRORS=ON `
            -DEPOCH_SAND_ENABLE_VALIDATION=OFF `
            -DBUILD_TESTING=ON

      - name: Build Windows x64 Release and all SPIR-V shaders
        shell: pwsh
        run: cmake --build build/windows --config Release --parallel

      - name: Run C++23 contract tests
        shell: pwsh
        run: ctest --test-dir build/windows -C Release --output-on-failure

      - name: Commit verified source to main
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Remove-Item -LiteralPath 'tools/apply_fix25_motion_ecology.py' -Force
          Remove-Item -LiteralPath '.github/workflows/sandhybrid-fix25.yml' -Force
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'SandHybrid Fix25: restore movement, insects, bees, and plant lifecycle'
          git push origin HEAD:main
          $releaseSha = git rev-parse HEAD
          "RELEASE_SHA=$releaseSha" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Package verified Windows release
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $distRoot = Join-Path $env:GITHUB_WORKSPACE 'dist'
          $stage = Join-Path $distRoot 'SandHybrid_Windows_x64_Fix25'
          $archive = Join-Path $distRoot 'SandHybrid_Windows_x64_Fix25.zip'
          Remove-Item -LiteralPath $distRoot -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Path $stage | Out-Null
          Copy-Item 'build/windows/Release/epoch_sand.exe' (Join-Path $stage 'SandHybrid.exe') -Force
          Copy-Item 'build/windows/Release/shaders' (Join-Path $stage 'shaders') -Recurse -Force
          Copy-Item README.md, LICENSE -Destination $stage -Force
          Set-Content -LiteralPath (Join-Path $stage 'run.bat') -Value @('@echo off', 'cd /d "%~dp0"', 'SandHybrid.exe') -Encoding ascii
          Compress-Archive -Path (Join-Path $stage '*') -DestinationPath $archive -CompressionLevel Optimal
          (Get-FileHash -Algorithm SHA256 $archive).Hash.ToLowerInvariant() + '  SandHybrid_Windows_x64_Fix25.zip' |
            Set-Content -LiteralPath (Join-Path $distRoot 'SHA256SUMS.txt') -Encoding ascii
          "RELEASE_ARCHIVE=$archive" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Upload verified workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: SandHybrid_Windows_x64_Fix25
          path: |
            dist/SandHybrid_Windows_x64_Fix25.zip
            dist/SHA256SUMS.txt
          if-no-files-found: error

      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = 'v1.1.1-fix25'
          gh release view $tag --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) { gh release delete $tag --repo $env:GITHUB_REPOSITORY --yes --cleanup-tag }
          gh release create $tag $env:RELEASE_ARCHIVE 'dist/SHA256SUMS.txt' `
            --repo $env:GITHUB_REPOSITORY `
            --target $env:RELEASE_SHA `
            --title 'SandHybrid Windows Fix25' `
            --notes 'Verified motion/ecology repair: dynamic 8x8 regions no longer sleep through liquids, gases, loose resources, seeds, bees, ants, or beetles; plant stems are ordinary cool organic cells instead of obsolete charged projectiles; grass spreads only across sunlit moist dirt; seeds grow short stems before flowers; flowers shed individual seeds; bee workers follow bounded flower/nest/honey gradients with a synchronized curved wave; insects walk, fall, climb small steps, seek ecosystem feedstock, and spawn at a useful bounded rate.'

      - name: Close trigger PR and delete branch
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr close ${{ github.event.pull_request.number }} --repo $env:GITHUB_REPOSITORY --comment 'Fix25 verified build and release completed; source was pushed directly to main.'
          git push origin --delete ${{ github.event.pull_request.head.ref }}
