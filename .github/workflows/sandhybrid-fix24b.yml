name: SandHybrid Fix24b Verified Build and Release

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - "tools/fix24b_parts/**"
      - "tools/fix24b_patch.py"
      - ".github/workflows/sandhybrid-fix24b.yml"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: sandhybrid-fix24b-release
  cancel-in-progress: true

jobs:
  build-test-release:
    runs-on: windows-2022
    timeout-minutes: 75

    steps:
      - name: Check out correction branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Assemble verified correction payload
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $partFiles = Get-ChildItem -LiteralPath 'tools/fix24b_parts' -Filter '*.b64' | Sort-Object Name
          if ($partFiles.Count -ne 4) { throw "Expected 4 Fix24b payload parts, found $($partFiles.Count)." }
          $encoded = ($partFiles | ForEach-Object { (Get-Content -LiteralPath $_.FullName -Raw).Trim() }) -join ''
          $compressed = [Convert]::FromBase64String($encoded)
          [IO.File]::WriteAllBytes((Join-Path $env:RUNNER_TEMP 'sandhybrid_fix24b.zlib'), $compressed)
          @'
          import hashlib
          import pathlib
          import zlib
          source = zlib.decompress(pathlib.Path(r"${{ runner.temp }}\sandhybrid_fix24b.zlib").read_bytes())
          expected = "f9f55163d177e8fd3f84b7c0f306b4844aa7e8f7edea0824e6dc5bcd3331addd"
          actual = hashlib.sha256(source).hexdigest()
          if actual != expected:
              raise SystemExit(f"Fix24b payload checksum mismatch: {actual}")
          pathlib.Path("tools/apply_sandhybrid_fix24.py").write_bytes(source)
          '@ | python -
          python -m py_compile tools/apply_sandhybrid_fix24.py

      - name: Patch palette regeneration contract
        shell: pwsh
        run: |
          python tools/fix24b_patch.py
          if ($LASTEXITCODE -ne 0) { throw 'Palette-regeneration patch failed.' }
          python -m py_compile tools/apply_sandhybrid_fix24.py

      - name: Apply SandHybrid correction pass
        shell: pwsh
        run: |
          python tools/apply_sandhybrid_fix24.py
          if ($LASTEXITCODE -ne 0) { throw 'SandHybrid correction pass failed.' }

      - name: Audit every material contract
        shell: pwsh
        run: |
          python tools/audit_material_behaviors.py
          if ($LASTEXITCODE -ne 0) { throw 'Material behavior audit failed.' }

      - name: Validate generated shader contracts
        shell: pwsh
        run: |
          python tools/validate_shader_contracts.py
          if ($LASTEXITCODE -ne 0) { throw 'Shader contract validation failed.' }

      - name: Bootstrap pinned vcpkg
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $vcpkgRoot = Join-Path $env:RUNNER_TEMP 'vcpkg'
          git clone --filter=blob:none https://github.com/microsoft/vcpkg.git $vcpkgRoot
          git -C $vcpkgRoot checkout 04a735608afac5844e86fc91d6ba2112cac613c1
          & (Join-Path $vcpkgRoot 'bootstrap-vcpkg.bat') -disableMetrics
          "VCPKG_ROOT=$vcpkgRoot" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Configure Windows x64 Release
        shell: pwsh
        run: |
          cmake -S . -B build/windows -G "Visual Studio 17 2022" -A x64 `
            -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake" `
            -DVCPKG_TARGET_TRIPLET=x64-windows `
            -DEPOCH_SAND_WARNINGS_AS_ERRORS=ON `
            -DEPOCH_SAND_ENABLE_VALIDATION=OFF `
            -DBUILD_TESTING=ON

      - name: Build Windows x64 Release
        shell: pwsh
        run: cmake --build build/windows --config Release --parallel

      - name: Run C++23 contract tests
        shell: pwsh
        run: ctest --test-dir build/windows -C Release --output-on-failure

      - name: Commit verified source to main
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Remove-Item -LiteralPath 'tools/apply_sandhybrid_fix24.py' -Force
          Remove-Item -LiteralPath 'tools/fix24b_patch.py' -Force
          Remove-Item -LiteralPath 'tools/fix24b_parts' -Recurse -Force
          Remove-Item -LiteralPath '.github/workflows/sandhybrid-fix24b.yml' -Force
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'SandHybrid Fix24: systems, materials, ecology, progression, and tile-aligned viewport'
          git push origin HEAD:main
          $releaseSha = git rev-parse HEAD
          "RELEASE_SHA=$releaseSha" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Package verified Windows release
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $distRoot = Join-Path $env:GITHUB_WORKSPACE 'dist'
          $stage = Join-Path $distRoot 'SandHybrid_Windows_x64_Fix24'
          $archive = Join-Path $distRoot 'SandHybrid_Windows_x64_Fix24.zip'
          Remove-Item -LiteralPath $distRoot -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Path $stage | Out-Null
          Copy-Item 'build/windows/Release/epoch_sand.exe' (Join-Path $stage 'SandHybrid.exe') -Force
          Copy-Item 'build/windows/Release/shaders' (Join-Path $stage 'shaders') -Recurse -Force
          Copy-Item README.md, LICENSE -Destination $stage -Force
          Set-Content -LiteralPath (Join-Path $stage 'run.bat') -Value @('@echo off', 'cd /d "%~dp0"', 'SandHybrid.exe') -Encoding ascii
          Compress-Archive -Path (Join-Path $stage '*') -DestinationPath $archive -CompressionLevel Optimal
          (Get-FileHash -Algorithm SHA256 $archive).Hash.ToLowerInvariant() + '  SandHybrid_Windows_x64_Fix24.zip' |
            Set-Content -LiteralPath (Join-Path $distRoot 'SHA256SUMS.txt') -Encoding ascii
          "RELEASE_ARCHIVE=$archive" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Upload verified workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: SandHybrid_Windows_x64_Fix24
          path: |
            dist/SandHybrid_Windows_x64_Fix24.zip
            dist/SHA256SUMS.txt
          if-no-files-found: error

      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = 'v1.1.0-fix24'
          gh release view $tag --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) { gh release delete $tag --repo $env:GITHUB_REPOSITORY --yes --cleanup-tag }
          gh release create $tag $env:RELEASE_ARCHIVE 'dist/SHA256SUMS.txt' `
            --repo $env:GITHUB_REPOSITORY `
            --target $env:RELEASE_SHA `
            --title 'SandHybrid Windows Fix24' `
            --notes 'Verified SandHybrid correction pass: tile-aligned aspect-correct viewport with complete 8x8 terrain regions, explicit std::thread ownership, full material audit, aluminum and dense metal shavings, element-linked progression, reliable stone mining, readable inspection cards, active volcano pressure, dedicated plant stems, insects, and closed-loop reclamation.'

      - name: Close trigger PR and delete branch
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr close ${{ github.event.pull_request.number }} --repo $env:GITHUB_REPOSITORY --comment 'Fix24 verified build and release completed; source was pushed directly to main.'
          git push origin --delete ${{ github.event.pull_request.head.ref }}
