name: EpochSimEngine Source Export

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact PR source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Package source
        id: source
        shell: bash
        run: |
          set -euo pipefail
          version="$(python3 -c 'import re, subprocess; text = subprocess.check_output(["git", "show", "HEAD:CMakeLists.txt"], text=True); print(re.search(r"project\(EpochSimEngine\s+VERSION\s+([0-9]+\.[0-9]+\.[0-9]+)", text).group(1))')"
          archive_name="EpochSimEngine-v${version}-source"
          echo "archive_name=${archive_name}" >> "$GITHUB_OUTPUT"
          git archive --format=tar.gz --prefix="EpochSimEngine-v${version}/" --output="${RUNNER_TEMP}/${archive_name}.tar.gz" HEAD
          cd "$RUNNER_TEMP"
          sha256sum "${archive_name}.tar.gz" > "${archive_name}.tar.gz.sha256"

      - name: Upload source artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.source.outputs.archive_name }}
          path: |
            ${{ runner.temp }}/${{ steps.source.outputs.archive_name }}.tar.gz
            ${{ runner.temp }}/${{ steps.source.outputs.archive_name }}.tar.gz.sha256
          if-no-files-found: error
          retention-days: 1
