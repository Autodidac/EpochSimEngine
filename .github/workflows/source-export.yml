name: EpochSimEngine Source Export

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  export:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact PR source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Package source
        shell: bash
        run: |
          set -euo pipefail
          git archive --format=tar.gz --output="${RUNNER_TEMP}/EpochSimEngine-source.tar.gz" HEAD
          sha256sum "${RUNNER_TEMP}/EpochSimEngine-source.tar.gz" > "${RUNNER_TEMP}/EpochSimEngine-source.tar.gz.sha256"

      - name: Upload source artifact
        uses: actions/upload-artifact@v4
        with:
          name: EpochSimEngine-source
          path: |
            ${{ runner.temp }}/EpochSimEngine-source.tar.gz
            ${{ runner.temp }}/EpochSimEngine-source.tar.gz.sha256
          if-no-files-found: error
          retention-days: 1

  final_cleanup:
    if: github.head_ref == 'agent/final-cleanup'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout cleanup branch
        uses: actions/checkout@v4
        with:
          ref: agent/final-cleanup
          fetch-depth: 0

      - name: Archive mission and delete temporary branches
        shell: bash
        run: |
          cp .github/final-cleanup.sh "${RUNNER_TEMP}/final-cleanup.sh"
          git fetch origin main
          git checkout main
          bash "${RUNNER_TEMP}/final-cleanup.sh"
