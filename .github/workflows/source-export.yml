name: EpochSimEngine Source Export

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply_v244:
    if: github.event_name == 'pull_request' && github.head_ref == 'agent/v244-gpu-stability'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout patch branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Apply bounded GPU workload patch
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/apply_v244.py
          python3 tools/validate_shader_contracts.py
          c++ -std=c++23 -Iinclude tests/behavior_contract.cpp -o /tmp/epoch_behavior
          /tmp/epoch_behavior
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Bound resident GPU workload for v2.4.4"
          git push origin HEAD:${{ github.head_ref }}

  export:
    if: github.head_ref != 'agent/v244-gpu-stability' || !hashFiles('.github/apply_v244.py')
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact PR source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Package source
        shell: bash
        run: |
          set -euo pipefail
          git archive --format=tar.gz --output="${RUNNER_TEMP}/EpochSimEngine-source.tar.gz" HEAD
          sha256sum "${RUNNER_TEMP}/EpochSimEngine-source.tar.gz" > "${RUNNER_TEMP}/EpochSimEngine-source.tar.gz.sha256"
      - name: Upload source artifact
        uses: actions/upload-artifact@v4
        with:
          name: EpochSimEngine-source
          path: |
            ${{ runner.temp }}/EpochSimEngine-source.tar.gz
            ${{ runner.temp }}/EpochSimEngine-source.tar.gz.sha256
          if-no-files-found: error
          retention-days: 1
