name: EpochSimEngine Source Export

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  export:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact PR source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Package source
        shell: bash
        run: |
          set -euo pipefail
          git archive --format=tar.gz --output="${RUNNER_TEMP}/EpochSimEngine-source.tar.gz" HEAD
          sha256sum "${RUNNER_TEMP}/EpochSimEngine-source.tar.gz" > "${RUNNER_TEMP}/EpochSimEngine-source.tar.gz.sha256"

      - name: Upload source artifact
        uses: actions/upload-artifact@v4
        with:
          name: EpochSimEngine-source
          path: |
            ${{ runner.temp }}/EpochSimEngine-source.tar.gz
            ${{ runner.temp }}/EpochSimEngine-source.tar.gz.sha256
          if-no-files-found: error
          retention-days: 1

  apply_context_wasd:
    if: github.head_ref == 'agent/fix-context-wasd'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout correction branch
        uses: actions/checkout@v4
        with:
          ref: agent/fix-context-wasd
          fetch-depth: 0

      - name: Apply source, tests, documentation, and mission updates
        shell: bash
        run: python .github/apply-context-wasd.py

      - name: Commit canonical correction
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'EpochSimEngine Input Agent'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'Route WASD exclusively to player or camera'
          git push origin agent/fix-context-wasd
