name: Finalize v2.5.14 metadata

on:
  pull_request:
    branches:
      - main
    types: [synchronize]

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Align metadata and restore permanent workflow
        shell: bash
        run: |
          set -euo pipefail
          python tools/finalize_v2514_metadata.py
          python tools/validate_release_tree.py
          python tools/validate_v2513_contract.py
          python tools/validate_mission_cache.py
          git rm tools/finalize_v2514_metadata.py
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add CMakeLists.txt CHANGELOG.md tools/validate_v2513_contract.py .github/workflows/source-export.yml
          git commit -m 'Align v2.5.14-test.2 package metadata'
          git push origin HEAD:${{ github.head_ref }}
