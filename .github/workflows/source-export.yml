name: EpochSimEngine Source Export

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  actions: read
  contents: write

jobs:
  export:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact PR source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Package source
        shell: bash
        run: |
          set -euo pipefail
          git archive --format=tar.gz --output="${RUNNER_TEMP}/EpochSimEngine-source.tar.gz" HEAD
          sha256sum "${RUNNER_TEMP}/EpochSimEngine-source.tar.gz" > "${RUNNER_TEMP}/EpochSimEngine-source.tar.gz.sha256"

      - name: Upload source artifact
        uses: actions/upload-artifact@v4
        with:
          name: EpochSimEngine-source
          path: |
            ${{ runner.temp }}/EpochSimEngine-source.tar.gz
            ${{ runner.temp }}/EpochSimEngine-source.tar.gz.sha256
          if-no-files-found: error
          retention-days: 1

  publish_v243:
    if: github.head_ref == 'agent/publish-v243'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout publication branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Publish verified v2.4.3
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/publish-v243.sh
