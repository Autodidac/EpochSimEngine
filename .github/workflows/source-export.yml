name: EpochSimEngine Source Export

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  export:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact PR source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Package source
        shell: bash
        run: |
          set -euo pipefail
          git archive --format=tar.gz --output="${RUNNER_TEMP}/EpochSimEngine-source.tar.gz" HEAD
          sha256sum "${RUNNER_TEMP}/EpochSimEngine-source.tar.gz" > "${RUNNER_TEMP}/EpochSimEngine-source.tar.gz.sha256"

      - name: Upload source artifact
        uses: actions/upload-artifact@v4
        with:
          name: EpochSimEngine-source
          path: |
            ${{ runner.temp }}/EpochSimEngine-source.tar.gz
            ${{ runner.temp }}/EpochSimEngine-source.tar.gz.sha256
          if-no-files-found: error
          retention-days: 1

  apply_debug_map_patch:
    if: github.head_ref == 'agent/epochsim-debug-map-placement'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact implementation branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Verify and apply implementation patch
        id: patch
        shell: bash
        run: |
          set -euo pipefail
          staged='.github/debug-map.patch.xz.b64'
          if [[ ! -f "$staged" ]]; then
            echo 'applied=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          base64 --decode "$staged" > "${RUNNER_TEMP}/debug-map.patch.xz"
          echo 'ce04982a6b5d9103b1b95339986d7284104178d0e22c517acf4d5007de501d03  '"${RUNNER_TEMP}/debug-map.patch.xz" | sha256sum -c -
          xz --decompress --stdout "${RUNNER_TEMP}/debug-map.patch.xz" > "${RUNNER_TEMP}/debug-map.patch"
          echo '04d581fb71385fba445f2d1d0070c567d0753fb118609977f72b24500680c2e6  '"${RUNNER_TEMP}/debug-map.patch" | sha256sum -c -
          git apply --check "${RUNNER_TEMP}/debug-map.patch"
          git apply --index "${RUNNER_TEMP}/debug-map.patch"
          rm -f "$staged"
          git add -A
          echo 'applied=true' >> "$GITHUB_OUTPUT"

      - name: Commit clean source tree
        if: steps.patch.outputs.applied == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'EpochSimEngine Runtime Agent'
          git config user.email 'actions@users.noreply.github.com'
          git commit -m 'Fix map placement, debug layout, active scope, and camera controls'
          git push origin "HEAD:${{ github.head_ref }}"
