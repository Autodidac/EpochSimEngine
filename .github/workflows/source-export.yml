name: Apply v2.5.14 Phase 2 ledger

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact Phase 2 branch
        uses: actions/checkout@v4
        with:
          ref: agent/v2.5.14-phase2-atmosphere-life
          fetch-depth: 0

      - name: Reconstruct and verify ledger patch
        shell: bash
        run: |
          set -euo pipefail
          cat .github/phase2-ledger/part-* > /tmp/phase2-ledger.patch.b64
          echo 'e87ba82d94a2d6d604f853c77a9636980945177c340376bf2e9cda5b71be69ff  /tmp/phase2-ledger.patch.b64' | sha256sum -c -
          base64 --decode /tmp/phase2-ledger.patch.b64 > /tmp/phase2-ledger.patch
          echo '284b77cb519969f1640b41a737e06df6c82f3e6a0695ef569177edcf25779562  /tmp/phase2-ledger.patch' | sha256sum -c -

      - name: Apply evidence, validate, and clean transport
        shell: bash
        run: |
          set -euo pipefail
          git apply --check /tmp/phase2-ledger.patch
          git apply --index /tmp/phase2-ledger.patch
          git rm -r .github/phase2-ledger
          git fetch origin main
          git checkout origin/main -- .github/workflows/source-export.yml
          python tools/validate_mission_cache.py
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Record v2.5.14 Phase 2 evidence and test version'
          git push origin HEAD:agent/v2.5.14-phase2-atmosphere-life
