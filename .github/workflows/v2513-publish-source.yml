name: Publish v2.5.13 source

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]

permissions:
  contents: write

concurrency:
  group: publish-v2513-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    if: github.event.pull_request.head.ref == 'agent/v2513-p0-tranche-1' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Reconstruct validated patch
        shell: bash
        run: |
          set -euo pipefail
          cat .release-transport/v2513-* > "$RUNNER_TEMP/v2513.patch.b64"
          test "$(wc -c < "$RUNNER_TEMP/v2513.patch.b64")" -eq 95288
          echo '9843c04e23dbd2976842e60138c6ac6bc67e0bdb6fc6200a5398d87d5ee59447  v2513.patch.b64' \
            | (cd "$RUNNER_TEMP" && sha256sum --check -)
          base64 --decode "$RUNNER_TEMP/v2513.patch.b64" | xz --decompress > "$RUNNER_TEMP/v2513.patch"

      - name: Restore exact exported baseline
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/source-artifact" "$RUNNER_TEMP/source-tree"
          curl --fail --location --silent --show-error \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/actions/artifacts/8907409511/zip" \
            --output "$RUNNER_TEMP/source.zip"
          unzip -q "$RUNNER_TEMP/source.zip" -d "$RUNNER_TEMP/source-artifact"
          cd "$RUNNER_TEMP/source-artifact"
          expected="$(awk '{print $1; exit}' SandHybrid-source.tar.gz.sha256)"
          actual="$(sha256sum SandHybrid-source.tar.gz | awk '{print $1}')"
          test "$actual" = "$expected"
          tar -xzf SandHybrid-source.tar.gz -C "$RUNNER_TEMP/source-tree"
          cd "$GITHUB_WORKSPACE"
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a "$RUNNER_TEMP/source-tree/." .
          git apply "$RUNNER_TEMP/v2513.patch"
          rm -f \
            release/SandHybrid_Linux_x64_Fix33.sha256 \
            release/SandHybrid_Linux_x64_Fix33.tar.gz \
            release/SandHybrid_Windows_x64_Fix33.sha256 \
            release/SandHybrid_Windows_x64_Fix33.zip

      - name: Validate transported source
        shell: bash
        run: |
          set -euo pipefail
          python tools/validate_mission_cache.py
          python tools/validate_shader_contracts.py
          python tools/validate_v2510_contract.py
          python tools/validate_v2511_contract.py
          python tools/validate_v2512_contract.py
          python tools/validate_v2513_contract.py
          python tools/audit_ecology_motion.py
          python tools/audit_fix34.py
          python tools/validate_no_simulation_coroutines.py
          python tools/validate_project_branding.py
          git diff --check

      - name: Commit coherent source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Release v2.5.13 first P0 tranche"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
