name: Fix Linux XCB demo definition

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  fix:
    if: github.head_ref == 'agent/epochsim-v242-runtime'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Give the demo its platform Vulkan definition
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('CMakeLists.txt')
          text = path.read_text(encoding='utf-8')
          anchor = '    target_link_libraries(EpochSimEngine_Demo PRIVATE EpochSimEngine)\n'
          insertion = anchor + '    target_compile_definitions(EpochSimEngine_Demo PRIVATE\n        $<$<PLATFORM_ID:Windows>:VK_USE_PLATFORM_WIN32_KHR>\n        $<$<PLATFORM_ID:Linux>:VK_USE_PLATFORM_XCB_KHR>\n    )\n'
          if 'target_compile_definitions(EpochSimEngine_Demo PRIVATE' not in text:
              if anchor not in text:
                  raise SystemExit('demo definition insertion point missing')
              text = text.replace(anchor, insertion, 1)
              path.write_text(text, encoding='utf-8')
          PY
          rm -f .github/workflows/fix-linux-xcb-demo.yml
          git add -A

      - name: Commit the clean build fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'EpochSimEngine Runtime Agent'
          git config user.email 'actions@users.noreply.github.com'
          if git diff --cached --quiet; then
              exit 0
          fi
          git commit -m 'Define Vulkan XCB platform for the Linux demo target'
          git push origin "HEAD:${{ github.head_ref }}"
