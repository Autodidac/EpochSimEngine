name: FastFreddyTestbed Fix34 Release

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - fix34-release-trigger.txt
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: read

concurrency:
  group: fastfreddytestbed-fix34-release
  cancel-in-progress: true

env:
  SOURCE_SHA: c44bc623cf4708cbb3d2f9005049eaf7810b56df
  VCPKG_COMMIT: 04a735608afac5844e86fc91d6ba2112cac613c1

jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_SHA }}
      - name: Bootstrap pinned vcpkg
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = Join-Path $env:RUNNER_TEMP 'vcpkg'
          git clone --filter=blob:none https://github.com/microsoft/vcpkg.git $root
          git -C $root checkout $env:VCPKG_COMMIT
          & (Join-Path $root 'bootstrap-vcpkg.bat') -disableMetrics
          "VCPKG_ROOT=$root" | Out-File -FilePath $env:GITHUB_ENV -Append
      - name: Configure Windows Release
        shell: pwsh
        run: |
          cmake -S . -B build/windows -G "Visual Studio 17 2022" -A x64 `
            -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake" `
            -DVCPKG_TARGET_TRIPLET=x64-windows `
            -DVCPKG_HOST_TRIPLET=x64-windows `
            -DEPOCH_SAND_WARNINGS_AS_ERRORS=ON `
            -DEPOCH_SAND_ENABLE_VALIDATION=OFF `
            -DBUILD_TESTING=ON
      - name: Build Windows and all shaders
        shell: pwsh
        run: cmake --build build/windows --config Release --parallel
      - name: Run Windows contracts
        shell: pwsh
        run: ctest --test-dir build/windows -C Release --output-on-failure
      - name: Package Windows x64
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $dist = Join-Path $env:GITHUB_WORKSPACE 'dist'
          $stage = Join-Path $dist 'FastFreddyTestbed_Windows_x64_v2.2.0'
          $archive = Join-Path $dist 'FastFreddyTestbed_Windows_x64_v2.2.0.zip'
          New-Item -ItemType Directory -Path $stage -Force | Out-Null
          Copy-Item 'build/windows/Release/epoch_sand.exe' (Join-Path $stage 'FastFreddyTestbed.exe') -Force
          Copy-Item 'build/windows/Release/shaders' (Join-Path $stage 'shaders') -Recurse -Force
          Copy-Item 'build/windows/Release/scenes' (Join-Path $stage 'scenes') -Recurse -Force
          Copy-Item README.md, HALF_WATER.md, HIERARCHICAL_SIMULATION.md, LICENSE -Destination $stage -Force
          Set-Content -LiteralPath (Join-Path $stage 'run.bat') -Value @('@echo off', 'cd /d "%~dp0"', 'FastFreddyTestbed.exe') -Encoding ascii
          Compress-Archive -Path (Join-Path $stage '*') -DestinationPath $archive -CompressionLevel Optimal
          $hash = (Get-FileHash -Algorithm SHA256 $archive).Hash.ToLowerInvariant()
          Set-Content -LiteralPath (Join-Path $dist 'FastFreddyTestbed_Windows_x64_v2.2.0.sha256') -Value "$hash  FastFreddyTestbed_Windows_x64_v2.2.0.zip" -Encoding ascii
      - uses: actions/upload-artifact@v4
        with:
          name: FastFreddyTestbed_Windows_x64_v2.2.0
          path: |
            dist/FastFreddyTestbed_Windows_x64_v2.2.0.zip
            dist/FastFreddyTestbed_Windows_x64_v2.2.0.sha256
          if-no-files-found: error

  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      CC: gcc-14
      CXX: g++-14
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_SHA }}
      - name: Install Linux prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build gcc-14 g++-14 pkg-config libvulkan-dev libxcb1-dev libx11-xcb-dev
      - name: Bootstrap pinned vcpkg
        run: |
          root="$RUNNER_TEMP/vcpkg"
          git clone --filter=blob:none https://github.com/microsoft/vcpkg.git "$root"
          git -C "$root" checkout "$VCPKG_COMMIT"
          "$root/bootstrap-vcpkg.sh" -disableMetrics
          echo "VCPKG_ROOT=$root" >> "$GITHUB_ENV"
      - name: Configure Linux Release
        run: |
          cmake -S . -B build/linux -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE="$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake" \
            -DVCPKG_TARGET_TRIPLET=x64-linux \
            -DVCPKG_HOST_TRIPLET=x64-linux \
            -DEPOCH_SAND_WARNINGS_AS_ERRORS=ON \
            -DEPOCH_SAND_ENABLE_VALIDATION=OFF \
            -DBUILD_TESTING=ON \
            -DCMAKE_CXX_FLAGS=-Wno-missing-field-initializers
      - name: Build Linux and all shaders
        run: cmake --build build/linux --parallel
      - name: Run Linux contracts
        run: ctest --test-dir build/linux --output-on-failure
      - name: Package Linux x64
        run: |
          set -euo pipefail
          stage='dist/FastFreddyTestbed_Linux_x64_v2.2.0'
          mkdir -p "$stage"
          cp build/linux/epoch_sand "$stage/FastFreddyTestbed"
          cp -R build/linux/shaders "$stage/shaders"
          cp -R build/linux/scenes "$stage/scenes"
          cp README.md HALF_WATER.md HIERARCHICAL_SIMULATION.md LICENSE "$stage/"
          printf '#!/usr/bin/env sh\ncd -- "$(dirname -- "$0")"\nexec ./FastFreddyTestbed "$@"\n' > "$stage/run.sh"
          chmod +x "$stage/FastFreddyTestbed" "$stage/run.sh"
          tar -C dist -czf dist/FastFreddyTestbed_Linux_x64_v2.2.0.tar.gz FastFreddyTestbed_Linux_x64_v2.2.0
          cd dist
          sha256sum FastFreddyTestbed_Linux_x64_v2.2.0.tar.gz > FastFreddyTestbed_Linux_x64_v2.2.0.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: FastFreddyTestbed_Linux_x64_v2.2.0
          path: |
            dist/FastFreddyTestbed_Linux_x64_v2.2.0.tar.gz
            dist/FastFreddyTestbed_Linux_x64_v2.2.0.sha256
          if-no-files-found: error

  release:
    needs: [windows, linux]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: FastFreddyTestbed_*_v2.2.0
          path: release
          merge-multiple: true
      - name: Verify package hashes
        run: |
          cd release
          sha256sum -c FastFreddyTestbed_Windows_x64_v2.2.0.sha256
          sha256sum -c FastFreddyTestbed_Linux_x64_v2.2.0.sha256
      - name: Publish v2.2.0
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag='v2.2.0'
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release delete "$tag" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag
          fi
          gh release create "$tag" \
            release/FastFreddyTestbed_Windows_x64_v2.2.0.zip \
            release/FastFreddyTestbed_Windows_x64_v2.2.0.sha256 \
            release/FastFreddyTestbed_Linux_x64_v2.2.0.tar.gz \
            release/FastFreddyTestbed_Linux_x64_v2.2.0.sha256 \
            --repo "$GITHUB_REPOSITORY" \
            --target "$SOURCE_SHA" \
            --title 'FastFreddyTestbed v2.2.0 — Current Fix32 Base + Half Water' \
            --notes 'Correct target repository: fastfreddytestbed. Rebuilt from the current FastFreddy Fix32 application while preserving the full GUI, all 65 material buttons, current bee/cursor/keymap behavior, 8x8 macro-cell movement, 64x64 sleeping chunks, and hierarchy diagnostics. Fresh water alone uses conserved half-volume cells, a full-plus-half ledge threshold, and twice the horizontal movement passes. Windows and Linux Release builds, every Vulkan shader, package checksums, and all C++23 contracts passed.'

  cleanup:
    needs: release
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Close trigger PR and delete temporary branches
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr close ${{ github.event.pull_request.number }} --repo "$GITHUB_REPOSITORY" \
            --comment 'Fix34 Windows/Linux build, tests, packaging, and v2.2.0 publication completed.' || true
          git push origin --delete '${{ github.event.pull_request.head.ref }}' || true
          git push origin --delete fix34-current-base-trigger || true
          git push origin --delete fix34-authoritative-trigger || true
