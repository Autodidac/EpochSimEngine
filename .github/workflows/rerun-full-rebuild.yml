name: Rebuild From Full FastFreddy

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/rerun-full-rebuild.yml

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Extract existing transformation payload
        shell: bash
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          workflow = Path('.github/workflows/rebuild-from-fastfreddy.yml').read_text()
          line = next(line for line in workflow.splitlines() if line.lstrip().startswith('PATCH_B64:'))
          Path(os.environ['RUNNER_TEMP'], 'fastfreddy_patch.b64').write_text(line.split('PATCH_B64:', 1)[1].strip())
          PY
          cp -a .github/workflows "$RUNNER_TEMP/preserved-workflows"

      - name: Clone complete FastFreddy source
        run: git clone --depth 1 https://github.com/Autodidac/fastfreddy.git "$RUNNER_TEMP/fastfreddy"

      - name: Replace stripped testbed and apply bounded water patch
        shell: bash
        run: |
          set -euo pipefail
          rsync -a --delete \
            --exclude '.git/' \
            --exclude '.github/workflows/' \
            "$RUNNER_TEMP/fastfreddy/" ./
          base64 --decode "$RUNNER_TEMP/fastfreddy_patch.b64" | gzip --decompress > "$RUNNER_TEMP/patch_full_repo.py"
          python3 "$RUNNER_TEMP/patch_full_repo.py"
          rm -rf .github/workflows
          mkdir -p .github
          cp -a "$RUNNER_TEMP/preserved-workflows" .github/workflows

      - name: Commit full architecture replacement
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Replace stripped testbed with full optimized FastFreddy build [release]'
          git push origin HEAD:main
