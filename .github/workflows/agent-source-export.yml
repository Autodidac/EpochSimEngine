name: Agent source export

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  export-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Pack repository source
        shell: bash
        run: |
          tar --exclude=.git --exclude=repo-source.tar.gz -czf repo-source.tar.gz .
      - name: Upload repository source
        uses: actions/upload-artifact@v4
        with:
          name: epochsimengine-source
          path: repo-source.tar.gz
          if-no-files-found: error
          retention-days: 1
