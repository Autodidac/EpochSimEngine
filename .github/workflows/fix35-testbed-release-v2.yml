name: FastFreddyTestbed Fix35 Release v2

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - 'tools/apply_fix35_half_water.py'
      - '.github/workflows/fix35-testbed-release-v2.yml'

permissions:
  contents: write
  pull-requests: write
  actions: read

concurrency:
  group: fastfreddytestbed-fix35-release-v2
  cancel-in-progress: true

env:
  SOURCE_REPOSITORY: Autodidac/fastfreddy
  SOURCE_SHA: 5505bdfb3cd77c955d5a4b9804338c6fdf6b9789
  RELEASE_TAG: v2.3.0
  VCPKG_COMMIT: 04a735608afac5844e86fc91d6ba2112cac613c1

jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 90
    steps:
      - name: Check out release controls
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: control

      - name: Check out exact FastFreddy Fix35 source
        uses: actions/checkout@v4
        with:
          repository: ${{ env.SOURCE_REPOSITORY }}
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 0
          path: work

      - name: Apply only conserved half-volume fresh water
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ((git -C work rev-parse HEAD).Trim() -ne $env:SOURCE_SHA) { throw 'Wrong FastFreddy source SHA.' }
          Copy-Item control/tools/apply_fix35_half_water.py work/tools/apply_fix35_half_water.py -Force
          Push-Location work
          python tools/apply_fix35_half_water.py
          if ($LASTEXITCODE -ne 0) { throw 'Half-water patch failed.' }
          Remove-Item tools/apply_fix35_half_water.py -Force
          Pop-Location

      - name: Audit preserved Fix35 and narrow delta
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Push-Location work
          python tools/audit_material_behaviors.py
          if ($LASTEXITCODE -ne 0) { throw 'Material audit failed.' }
          python tools/audit_ecology_motion.py
          if ($LASTEXITCODE -ne 0) { throw 'Ecology and movement audit failed.' }
          python tools/validate_shader_contracts.py
          if ($LASTEXITCODE -ne 0) { throw 'Shader contract audit failed.' }
          $allowed = @(
            'HALF_WATER.md', 'README.md', 'include/epoch/sand/simulation_policy.hpp',
            'shaders/chemistry.comp', 'shaders/fullscreen.frag', 'shaders/macro_move.comp',
            'shaders/materials.glsl', 'shaders/move.comp', 'src/vulkan_renderer.cpp',
            'tests/behavior_contract.cpp'
          ) | Sort-Object
          $changed = @((git status --porcelain=v1) | ForEach-Object { $_.Substring(3) }) | Sort-Object
          if (Compare-Object $allowed $changed) { throw "Unexpected source delta: $($changed -join ', ')" }
          Pop-Location

      - name: Bootstrap pinned vcpkg
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = Join-Path $env:RUNNER_TEMP 'vcpkg'
          git clone --filter=blob:none https://github.com/microsoft/vcpkg.git $root
          git -C $root checkout $env:VCPKG_COMMIT
          & (Join-Path $root 'bootstrap-vcpkg.bat') -disableMetrics
          if ($LASTEXITCODE -ne 0) { throw 'vcpkg bootstrap failed.' }
          "VCPKG_ROOT=$root" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Configure Windows x64 C++23 Release
        shell: pwsh
        working-directory: work
        run: |
          cmake -S . -B build/windows -G 'Visual Studio 17 2022' -A x64 `
            -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake" `
            -DVCPKG_TARGET_TRIPLET=x64-windows `
            -DVCPKG_HOST_TRIPLET=x64-windows `
            -DEPOCH_SAND_WARNINGS_AS_ERRORS=ON `
            -DEPOCH_SAND_ENABLE_VALIDATION=OFF `
            -DBUILD_TESTING=ON
          if ($LASTEXITCODE -ne 0) { throw 'Windows configure failed.' }

      - name: Compile every Vulkan shader and C++23 target
        shell: pwsh
        working-directory: work
        run: |
          cmake --build build/windows --config Release --parallel
          if ($LASTEXITCODE -ne 0) { throw 'Windows build failed.' }
          $shaders = @('reset.comp','paint.comp','sunlight.comp','tiles.comp','chunks.comp','chemistry.comp','macro_move.comp','move.comp','actor.comp','debug_stats.comp','fullscreen.vert','fullscreen.frag')
          foreach ($shader in $shaders) {
            $path = Join-Path 'build/windows/Release/shaders' ($shader + '.spv')
            if (-not (Test-Path $path)) { throw "Missing compiled shader: $path" }
          }

      - name: Run Windows C++23 contracts
        shell: pwsh
        working-directory: work
        run: |
          ctest --test-dir build/windows -C Release --output-on-failure
          if ($LASTEXITCODE -ne 0) { throw 'Windows tests failed.' }

      - name: Package Windows Release
        shell: pwsh
        working-directory: work
        run: |
          $ErrorActionPreference = 'Stop'
          $dist = Join-Path $PWD 'dist/windows'
          $stage = Join-Path $dist 'FastFreddyTestbed_Windows_x64_Fix35'
          $archive = Join-Path $dist 'FastFreddyTestbed_Windows_x64_Fix35.zip'
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item 'build/windows/Release/epoch_sand.exe' (Join-Path $stage 'FastFreddyTestbed.exe') -Force
          Copy-Item 'build/windows/Release/shaders' (Join-Path $stage 'shaders') -Recurse -Force
          Copy-Item 'build/windows/Release/scenes' (Join-Path $stage 'scenes') -Recurse -Force
          Copy-Item README.md, HALF_WATER.md, LICENSE -Destination $stage -Force
          @('@echo off','cd /d "%~dp0"','FastFreddyTestbed.exe') | Set-Content (Join-Path $stage 'run.bat') -Encoding ascii
          Compress-Archive -Path (Join-Path $stage '*') -DestinationPath $archive -CompressionLevel Optimal -Force
          $hash = (Get-FileHash -Algorithm SHA256 $archive).Hash.ToLowerInvariant()
          "$hash  FastFreddyTestbed_Windows_x64_Fix35.zip" | Set-Content (Join-Path $dist 'SHA256SUMS-Windows.txt') -Encoding ascii

      - uses: actions/upload-artifact@v4
        with:
          name: FastFreddyTestbed-Windows-x64-Fix35
          path: |
            work/dist/windows/FastFreddyTestbed_Windows_x64_Fix35.zip
            work/dist/windows/SHA256SUMS-Windows.txt
          if-no-files-found: error

  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      CC: gcc-14
      CXX: g++-14
    steps:
      - name: Check out release controls
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: control

      - name: Check out exact FastFreddy Fix35 source
        uses: actions/checkout@v4
        with:
          repository: ${{ env.SOURCE_REPOSITORY }}
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 0
          path: work

      - name: Apply and audit narrow half-water delta
        run: |
          set -euo pipefail
          test "$(git -C work rev-parse HEAD)" = "$SOURCE_SHA"
          cp control/tools/apply_fix35_half_water.py work/tools/
          cd work
          python3 tools/apply_fix35_half_water.py
          rm -f tools/apply_fix35_half_water.py
          python3 tools/audit_material_behaviors.py
          python3 tools/audit_ecology_motion.py
          python3 tools/validate_shader_contracts.py
          expected=$(printf '%s\n' HALF_WATER.md README.md include/epoch/sand/simulation_policy.hpp shaders/chemistry.comp shaders/fullscreen.frag shaders/macro_move.comp shaders/materials.glsl shaders/move.comp src/vulkan_renderer.cpp tests/behavior_contract.cpp | sort)
          actual=$(git status --porcelain=v1 | cut -c4- | sort)
          test "$actual" = "$expected" || { printf 'Unexpected source delta:\n%s\n' "$actual"; exit 1; }

      - name: Install Linux build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build gcc-14 g++-14 pkg-config libvulkan-dev libxcb1-dev libx11-xcb-dev

      - name: Bootstrap pinned vcpkg
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/vcpkg"
          git clone --filter=blob:none https://github.com/microsoft/vcpkg.git "$root"
          git -C "$root" checkout "$VCPKG_COMMIT"
          "$root/bootstrap-vcpkg.sh" -disableMetrics
          echo "VCPKG_ROOT=$root" >> "$GITHUB_ENV"

      - name: Configure Linux x64 C++23 Release
        working-directory: work
        run: |
          cmake -S . -B build/linux -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE="$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake" \
            -DVCPKG_TARGET_TRIPLET=x64-linux \
            -DVCPKG_HOST_TRIPLET=x64-linux \
            -DEPOCH_SAND_WARNINGS_AS_ERRORS=ON \
            -DEPOCH_SAND_ENABLE_VALIDATION=OFF \
            -DBUILD_TESTING=ON

      - name: Compile every Vulkan shader and C++23 target
        working-directory: work
        run: |
          set -euo pipefail
          cmake --build build/linux --parallel
          for shader in reset.comp paint.comp sunlight.comp tiles.comp chunks.comp chemistry.comp macro_move.comp move.comp actor.comp debug_stats.comp fullscreen.vert fullscreen.frag; do
            test -f "build/linux/shaders/$shader.spv"
          done

      - name: Run Linux C++23 contracts
        working-directory: work
        run: ctest --test-dir build/linux --output-on-failure

      - name: Package Linux Release
        working-directory: work
        run: |
          set -euo pipefail
          dist="$PWD/dist/linux"
          stage="$dist/FastFreddyTestbed_Linux_x64_Fix35"
          archive="$dist/FastFreddyTestbed_Linux_x64_Fix35.tar.gz"
          mkdir -p "$stage"
          cp build/linux/epoch_sand "$stage/FastFreddyTestbed"
          cp -R build/linux/shaders "$stage/shaders"
          cp -R build/linux/scenes "$stage/scenes"
          cp README.md HALF_WATER.md LICENSE "$stage/"
          printf '#!/usr/bin/env bash\nset -euo pipefail\ncd "$(dirname "$0")"\nexec ./FastFreddyTestbed\n' > "$stage/run.sh"
          chmod +x "$stage/run.sh" "$stage/FastFreddyTestbed"
          tar -C "$dist" -czf "$archive" FastFreddyTestbed_Linux_x64_Fix35
          sha256sum "$archive" | sed 's# .*/#  #' > "$dist/SHA256SUMS-Linux.txt"

      - uses: actions/upload-artifact@v4
        with:
          name: FastFreddyTestbed-Linux-x64-Fix35
          path: |
            work/dist/linux/FastFreddyTestbed_Linux_x64_Fix35.tar.gz
            work/dist/linux/SHA256SUMS-Linux.txt
          if-no-files-found: error

  release:
    needs: [windows, linux]
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out release controls
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: control

      - name: Check out exact verified FastFreddy Fix35 source
        uses: actions/checkout@v4
        with:
          repository: ${{ env.SOURCE_REPOSITORY }}
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 0
          path: work

      - name: Materialize clean testbed source
        run: |
          set -euo pipefail
          test "$(git -C work rev-parse HEAD)" = "$SOURCE_SHA"
          cp control/tools/apply_fix35_half_water.py work/tools/
          cd work
          python3 tools/apply_fix35_half_water.py
          rm -f tools/apply_fix35_half_water.py
          python3 tools/audit_material_behaviors.py
          python3 tools/audit_ecology_motion.py
          python3 tools/validate_shader_contracts.py
          expected=$(printf '%s\n' HALF_WATER.md README.md include/epoch/sand/simulation_policy.hpp shaders/chemistry.comp shaders/fullscreen.frag shaders/macro_move.comp shaders/materials.glsl shaders/move.comp src/vulkan_renderer.cpp tests/behavior_contract.cpp | sort)
          actual=$(git status --porcelain=v1 | cut -c4- | sort)
          test "$actual" = "$expected"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'FastFreddyTestbed Fix35: exact Fix35 source with conserved half-water'
          echo "RELEASE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          git remote set-url origin "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force origin HEAD:main

      - name: Download verified packages
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Verify package checksums and publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          win_dir='artifacts/FastFreddyTestbed-Windows-x64-Fix35'
          linux_dir='artifacts/FastFreddyTestbed-Linux-x64-Fix35'
          (cd "$win_dir" && sha256sum -c SHA256SUMS-Windows.txt)
          (cd "$linux_dir" && sha256sum -c SHA256SUMS-Linux.txt)
          mkdir -p release
          cp "$win_dir/FastFreddyTestbed_Windows_x64_Fix35.zip" release/
          cp "$linux_dir/FastFreddyTestbed_Linux_x64_Fix35.tar.gz" release/
          (cd release && sha256sum FastFreddyTestbed_Windows_x64_Fix35.zip FastFreddyTestbed_Linux_x64_Fix35.tar.gz > SHA256SUMS.txt)
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 && \
            gh release delete "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag || true
          gh release create "$RELEASE_TAG" \
            release/FastFreddyTestbed_Windows_x64_Fix35.zip \
            release/FastFreddyTestbed_Linux_x64_Fix35.tar.gz \
            release/SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" \
            --target "$RELEASE_SHA" \
            --title 'FastFreddyTestbed v2.3.0 — Fix35 + Conserved Half Water' \
            --notes 'Started from exact FastFreddy Fix35 source commit 5505bdfb3cd77c955d5a4b9804338c6fdf6b9789. Preserves the full GUI and material palette, live colony-mask bee behavior, cursor shapes, zoom/pan/fill input, readable keymap, 8x8 macro-cell hierarchy, 64x64 sleeping chunks, scenes, and diagnostics. The only simulation change is conserved half-volume fresh water: full cells split laterally into two faint halves, adjacent halves merge back into one full cell plus oxygen, ledge release requires three half-units, half-water receives eight horizontal passes, macro movement excludes half cells, and chemistry clears the half flag across conversions. Every Vulkan shader, Windows and Linux Release build, C++23 contract, and package checksum passed.'

      - name: Remove trigger branch and close PR
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          TRIGGER_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          gh pr close ${{ github.event.pull_request.number }} --repo "$GITHUB_REPOSITORY" \
            --comment 'Fix35 testbed source and v2.3.0 release published; temporary release controls removed.' || true
          git -C work push origin --delete "$TRIGGER_BRANCH" || true
