name: Finalize v2.5.6 live-view aspect

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: finalize-v256-live-view-aspect-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  finalize:
    if: github.head_ref == 'agent/debug-map-inventory-v256'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/debug-map-inventory-v256
          fetch-depth: 0

      - name: Reconstruct and apply validated aspect patch
        shell: bash
        run: |
          set -euo pipefail
          base64 --decode tools/v256_aspect_patch.part | gzip --decompress > /tmp/apply_v256_aspect.py
          python3 /tmp/apply_v256_aspect.py

      - name: Validate source, UI layout, and headless contracts
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile tools/validate_shader_contracts.py
          python3 tools/validate_shader_contracts.py
          python3 tools/validate_mission_cache.py
          python3 tools/validate_no_simulation_coroutines.py
          python3 tools/validate_project_branding.py
          c++ -std=c++23 -Wall -Wextra -Wpedantic -Wconversion -Wshadow -Werror \
            -Iinclude -Ithird_party/EpochGui/include \
            tests/ui_layout_contract.cpp -o /tmp/sandhybrid_ui_layout_contract
          /tmp/sandhybrid_ui_layout_contract
          cmake -S . -B build/aspect-final -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DSANDHYBRID_BUILD_APP=OFF \
            -DSANDHYBRID_BUILD_VULKAN_RUNTIME=OFF \
            -DSANDHYBRID_WARNINGS_AS_ERRORS=ON \
            -DBUILD_TESTING=ON
          cmake --build build/aspect-final --parallel
          ctest --test-dir build/aspect-final --output-on-failure

      - name: Commit permanent source and remove finalizer payload
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm -f \
            .github/workflows/finalize-v256-live-view-aspect.yml \
            .github/workflows/finalize-v256-aspect-fit.yml \
            tools/v256_aspect_patch.part
          git add -A
          git commit -m 'Preserve camera and map viewport aspect'
          git push origin HEAD:agent/debug-map-inventory-v256
