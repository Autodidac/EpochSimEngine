name: Publish EpochSimEngine v2.4.4

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  actions: read
  pull-requests: write

jobs:
  publish:
    if: github.head_ref == 'agent/publish-v244'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout merged release source
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Download accepted Windows and Linux packages
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf release-assets
          mkdir -p release-assets/windows release-assets/linux
          gh run download 30684121727 --repo "$GITHUB_REPOSITORY" --name EpochSimEngine-Windows-x64-v2.4.4 --dir release-assets/windows
          gh run download 30684121727 --repo "$GITHUB_REPOSITORY" --name EpochSimEngine-Linux-x64-v2.4.4 --dir release-assets/linux
          find release-assets -maxdepth 3 -type f -print

      - name: Create or repair v2.4.4 release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t assets < <(find release-assets -maxdepth 3 -type f | sort)
          test "${#assets[@]}" -eq 2
          if gh release view v2.4.4 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload v2.4.4 "${assets[@]}" --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create v2.4.4 "${assets[@]}" \
              --repo "$GITHUB_REPOSITORY" \
              --target de0154cf4453ebb490b398301593ee7f17d9a62b \
              --title "EpochSimEngine v2.4.4" \
              --notes-file RELEASE_NOTES_v2.4.4.md
          fi

      - name: Close publisher PR and remove temporary branches
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        shell: bash
        run: |
          set -euo pipefail
          gh pr close "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --comment "v2.4.4 published; cleanup completed."
          git push origin --delete agent/v244-gpu-stability || true
          git push origin --delete agent/publish-v244 || true

      - name: Remove one-shot publisher from main
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/publish-v244.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .github/workflows/publish-v244.yml
          git commit -m "Remove one-shot v2.4.4 publisher"
          git push origin HEAD:main
