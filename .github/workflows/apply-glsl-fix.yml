name: Apply GLSL Identifier Fix

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/apply-glsl-fix.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Rename reserved half identifiers
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path

          materials = Path('shaders/materials.glsl')
          text = materials.read_text()
          text = text.replace('bool half)', 'bool half_state)')
          text = text.replace('if (half) ', 'if (half_state) ')
          materials.write_text(text)

          movement = Path('shaders/move.comp')
          text = movement.read_text()
          text = text.replace('bool half)', 'bool half_state)')
          text = text.replace('if (half) ', 'if (half_state) ')
          text = re.sub(r'\bhalf\b', 'half_cell', text)
          movement.write_text(text)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add shaders/materials.glsl shaders/move.comp
          git commit -m 'Remove remaining reserved GLSL half identifiers [release]'
          git push origin HEAD:main
