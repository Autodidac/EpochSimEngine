name: Cleanup After Fix22 Release

on:
  release:
    types: [published]

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  cleanup:
    if: github.event.release.tag_name == 'v1.0.0-fix22'
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Remove temporary branches and conversations
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh pr close 3 --repo "$GITHUB_REPOSITORY" --delete-branch=false || true
          gh issue close 2 --repo "$GITHUB_REPOSITORY" --reason completed || true
          for branch in run-fix22-release trigger-fix22-release; do
            gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/$branch" || true
          done

      - name: Remove cleanup scaffolding from main
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .github/fix22 .github/fix22_v2
          rm -f .github/release-trigger .github/test-small.txt
          rm -f .github/workflows/unpack-build-release.yml
          rm -f .github/workflows/fix22-salvage-release.yml
          rm -f .github/workflows/cleanup-after-fix22-release.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m 'Remove Fix22 transfer and release scaffolding'
            git push origin HEAD:main
          fi
