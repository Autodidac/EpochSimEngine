name: Rebuild From Full FastFreddy

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/rebuild-from-fastfreddy.yml

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Clone complete FastFreddy source
        run: git clone --depth 1 https://github.com/Autodidac/fastfreddy.git "$RUNNER_TEMP/fastfreddy"

      - name: Replace stripped testbed and apply bounded water patch
        shell: bash
        env:
          PATCH_B64: 
        run: |
          set -euo pipefail
          rsync -a --delete \
            --exclude '.git/' \
            --exclude '.github/workflows/' \
            "$RUNNER_TEMP/fastfreddy/" ./
          printf '%s' "$PATCH_B64" | base64 --decode | gzip --decompress > "$RUNNER_TEMP/patch_full_repo.py"
          python3 "$RUNNER_TEMP/patch_full_repo.py"

      - name: Commit full architecture replacement
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Replace stripped testbed with full optimized FastFreddy build [release]'
          git push origin HEAD:main
