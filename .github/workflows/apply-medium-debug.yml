name: Apply transient medium and debug patch

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'agent/epochsim-v242-runtime'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact runtime branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Verify and apply patch
        id: patch
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -f .github/medium-debug.patch.part.00 ]]; then
            echo "applied=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          cat \
            .github/medium-debug.patch.part.00 \
            .github/medium-debug.patch.part.01 \
            .github/medium-debug.patch.part.02 \
            .github/medium-debug.patch.part.03 \
            .github/medium-debug.patch.part.04 \
            .github/medium-debug.patch.part.05 \
            .github/medium-debug.patch.part.06 \
            > "${RUNNER_TEMP}/medium-debug.patch.xz.b64"
          base64 --decode "${RUNNER_TEMP}/medium-debug.patch.xz.b64" > "${RUNNER_TEMP}/medium-debug.patch.xz"
          echo "ce0e9284b86916bf8815441b7c53b546601fe6dfcf354f42b273c395a9c0c180  ${RUNNER_TEMP}/medium-debug.patch.xz" | sha256sum -c -
          xz --decompress --stdout "${RUNNER_TEMP}/medium-debug.patch.xz" > "${RUNNER_TEMP}/medium-debug.patch"
          echo "ec93795a4ea713437ff04c1b508ed372010f8f2a601a10324a223997d37719aa  ${RUNNER_TEMP}/medium-debug.patch" | sha256sum -c -
          git apply --check "${RUNNER_TEMP}/medium-debug.patch"
          git apply --index "${RUNNER_TEMP}/medium-debug.patch"
          rm -f \
            .github/medium-debug.patch.part.00 \
            .github/medium-debug.patch.part.01 \
            .github/medium-debug.patch.part.02 \
            .github/medium-debug.patch.part.03 \
            .github/medium-debug.patch.part.04 \
            .github/medium-debug.patch.part.05 \
            .github/medium-debug.patch.part.06
          git add -A
          echo "applied=true" >> "$GITHUB_OUTPUT"

      - name: Commit clean source tree
        if: steps.patch.outputs.applied == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "EpochSimEngine Runtime Agent"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "Transient medium tiles and readable debug diagnostics"
          git push origin "HEAD:${{ github.head_ref }}"
