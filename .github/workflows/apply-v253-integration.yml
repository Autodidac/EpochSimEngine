name: Apply v2.5.3 integration

on:
  push:
    branches: [main]

permissions:
  contents: write
  actions: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Cancel superseded v2.5.2 main release run
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          while read -r run_id; do
            [[ -z "$run_id" ]] || gh run cancel "$run_id" || true
          done < <(gh run list --commit "$GITHUB_SHA" --json databaseId,name,status --jq '.[] | select(.name == "SandHybrid CI and Release" and .status != "completed") | .databaseId')
      - name: Apply integration and release metadata
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          cache = Path('missioncache.md')
          text = cache.read_text()
          text = text.replace("- **P0 / next external handoff integration:** MC-117. When Adam's other thread publishes its completion branch, record the exact branch and head SHA, preserve it, and integrate it before starting another broad feature pass. It is not part of the current v2.5.2 publication.\n", "")
          text = text.replace("| MC-117 | OPEN | Preserve and integrate external completion branch | The branch produced by Adam's other thread is a protected handoff. Once it appears, record its exact branch name and head SHA in this row; do not delete, force-update, or include it in release-branch cleanup before integration. Diff it against `main` and this mission cache, reconcile completed and unfinished work without dropping missions, integrate the valid changes, run source/shader/cache validation plus Windows and Linux Release builds, and delete the handoff branch only after the integration is merged and accepted. |\n", "")
          text = text.replace("| MC-065 | PARTIAL | Coroutine review | The current simulation has no hidden coroutine execution path; section scheduling is explicit and deterministic. Coroutines remain reserved for bounded asynchronous streaming or I/O after MC-063 defines ownership and cancellation. |\n", "")
          text = text.replace("| MC-083 | PARTIAL | SandHybrid-only project branding | Remove this project's legacy project-owned names from UI, logs, namespaces, include paths, CMake targets, binaries, packages, workflows, docs, and tests. Preserve proper external names such as `EpochGui`, `EpochEngine`, and the external `epochengine::gui_lib` namespace. Repository-host rename is separate if GitHub settings cannot be changed through available tooling. |\n", "")
          marker = "| MC-070 | Reusable platform-neutral `SandHybrid::SandHybrid` core library, optional Vulkan runtime, thin demo host, installed CMake package, and downstream consumer contract. | `CHANGELOG.md`; Windows/Linux CI history. |\n"
          additions = marker + "| MC-065 | Deterministic simulation code has no coroutine execution path. CI rejects coroutine machinery across production C++ until bounded streaming or I/O ownership and cancellation are defined under MC-063. | `tools/validate_no_simulation_coroutines.py`; `.github/workflows/core-hygiene-contracts.yml`; CI history. |\n| MC-083 | `SandHybrid` is the only project-owned product identity across production code, build files, workflows, docs, and tests. Proper external names and the current repository-host URL remain explicitly allowed. | `tools/validate_project_branding.py`; `HALF_WATER.md`; `.github/workflows/core-hygiene-contracts.yml`; CI history. |\n| MC-117 | Protected handoff `agent/nonoverlap-core-hygiene` at `bf2d052a9dbd275ce968cab9453b70b26b6a2771` was reconciled onto current main without dropping later mission-cache work. The source branch remains preserved by Adam's instruction. | PR #45 validation history; v2.5.3 integration PR and Windows/Linux Release CI. |\n"
          if marker not in text:
              raise SystemExit('accepted-foundation marker missing')
          text = text.replace(marker, additions)
          cache.write_text(text)

          cmake = Path('CMakeLists.txt')
          cmake.write_text(cmake.read_text().replace('project(SandHybrid VERSION 2.5.2', 'project(SandHybrid VERSION 2.5.3'))

          changelog = Path('CHANGELOG.md')
          c = changelog.read_text()
          section = "## 2.5.3\n\n- Integrated the protected `agent/nonoverlap-core-hygiene` handoff without deleting its source branch.\n- Completed MC-065 with a deterministic CI contract rejecting coroutine machinery from simulation code.\n- Completed MC-083 with a repository-wide SandHybrid branding contract while preserving proper external EpochGui/EpochEngine names.\n- Added both contracts to pull-request, main, Windows, and Linux release validation.\n\n"
          changelog.write_text(c.replace('# Changelog\n\n', '# Changelog\n\n' + section, 1))

          workflow = Path('.github/workflows/ci-release.yml')
          w = workflow.read_text().replace('v2.5.2', 'v2.5.3').replace('v252', 'v253')
          needle = "      - name: Validate canonical mission cache\n        run: python tools/validate_mission_cache.py\n"
          extra = needle + "\n      - name: Reject simulation coroutines\n        run: python tools/validate_no_simulation_coroutines.py\n\n      - name: Enforce SandHybrid branding\n        run: python tools/validate_project_branding.py\n"
          if needle not in w:
              raise SystemExit('release validation marker missing')
          w = w.replace(needle, extra, 1)
          w = w.replace("          git push origin --delete agent/scene-geology-stack-v251 || true\n", "          git push origin --delete agent/scene-geology-stack-v251 || true\n          git push origin --delete agent/integrate-core-hygiene-release-v253 || true\n          git push origin --delete agent/external-handoff-priority-note || true\n          git push origin --delete agent/tmp-noop || true\n          # Preserve agent/nonoverlap-core-hygiene per Adam's explicit instruction.\n")
          workflow.write_text(w)

          Path('.github/workflows/apply-v253-integration.yml').unlink()
          PY
          python3 tools/validate_no_simulation_coroutines.py
          python3 tools/validate_project_branding.py
          python3 tools/validate_mission_cache.py
          python3 tools/validate_shader_contracts.py
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'Integrate core hygiene missions and prepare v2.5.3'
          git push origin HEAD:main
      - name: Dispatch v2.5.3 release validation
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run ci-release.yml --ref main
