name: Capture v2.5.12 runtime and workspace feedback

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize

permissions:
  contents: write

jobs:
  capture:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Update canonical mission cache
        run: python3 tools/capture_v2512_feedback.py
      - name: Remove one-shot capture machinery
        run: rm tools/capture_v2512_feedback.py .github/workflows/v2512-capture-feedback.yml
      - name: Commit durable feedback ledger
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add missioncache.md tools/capture_v2512_feedback.py .github/workflows/v2512-capture-feedback.yml
          git commit -m "Capture v2.5.12 runtime and blueprint regressions"
          git push origin HEAD:main
