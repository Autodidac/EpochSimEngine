name: PR interface and medium correction

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: pr-interface-medium-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  apply:
    if: github.head_ref == 'agent/debug-map-inventory-v256'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: agent/debug-map-inventory-v256

      - name: Apply interface and medium correction
        run: |
          python3 tools/v256_interface_medium_fix.py
          python3 tools/v256_validator_dimensions_fix.py

      - name: Validate source contracts
        run: |
          python3 tools/validate_shader_contracts.py
          python3 tools/validate_mission_cache.py
          python3 tools/validate_no_simulation_coroutines.py
          python3 tools/validate_project_branding.py

      - name: Build and test headless C++23 core
        run: |
          cmake -S . -B build/interface-medium -G Ninja -DCMAKE_BUILD_TYPE=Release -DSANDHYBRID_BUILD_APP=OFF -DSANDHYBRID_BUILD_VULKAN_RUNTIME=OFF -DSANDHYBRID_WARNINGS_AS_ERRORS=ON -DBUILD_TESTING=ON
          cmake --build build/interface-medium --parallel
          ctest --test-dir build/interface-medium --output-on-failure

      - name: Commit validated permanent source
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm -f tools/v256_interface_medium_fix.py tools/v256_validator_dimensions_fix.py
          git add -A
          git commit -m "Fix medium regressions and redesign the editor sidebar"
          git push origin HEAD:agent/debug-map-inventory-v256
