name: Apply v2.5.6 water and atmosphere regression fix

on:
  push:
    branches: [agent/debug-map-inventory-v256]

permissions:
  contents: write

concurrency:
  group: apply-v256-water-air
  cancel-in-progress: false

jobs:
  apply:
    if: github.event.head_commit.message == 'Apply v2.5.6 water and atmosphere regression fix'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/debug-map-inventory-v256
          fetch-depth: 0

      - name: Apply screenshot-driven medium fixes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          def replace_once(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text(encoding='utf-8')
              if old not in text:
                  raise SystemExit(f'missing replacement marker in {path}: {old[:180]!r}')
              file.write_text(text.replace(old, new, 1), encoding='utf-8')

          replace_once(
              'shaders/move.comp',
              '''bool fullWaterSplitSupplied(ivec2 sourcePosition, int direction) {
    Cell trailing = sampleAt(sourcePosition - ivec2(direction, 0));
    return trailing.material == MAT_WATER && !isHalfWaterCell(trailing);
}
''',
              '''bool fullWaterSplitSupplied(ivec2 sourcePosition, int direction) {
    if (!solidSupportsWaterAt(sourcePosition)) return false;
    Cell trailing = sampleAt(sourcePosition - ivec2(direction, 0));
    Cell reserve = sampleAt(sourcePosition - ivec2(direction * 2, 0));
    return trailing.material == MAT_WATER && !isHalfWaterCell(trailing) &&
           reserve.material == MAT_WATER && !isHalfWaterCell(reserve);
}
''')

          replace_once(
              'shaders/move.comp',
              '''    // Half-water is a pre-fall solid-ledge state only. It never hops along
    // exposed water edges and never crawls after entering open air.

    if ((movePc.reserved1 & 1u) != 0u && !isHalfWaterCell(a) && !isHalfWaterCell(b)) return;
''',
              '''    // Half-water is a supplied pre-fall ledge state only. Two halves may
    // consolidate, but an isolated half never crawls horizontally or chases an edge.
    if (isHalfWaterCell(a) || isHalfWaterCell(b)) return;

    if ((movePc.reserved1 & 1u) != 0u) return;
''')

          replace_once(
              'shaders/tiles.comp',
              '''    bool settledFineMedium = boundaryFineMedium && minimumAge >= 48u;
    bool fineActive = represented != 0u && !macroMovable &&
                      (activeAgent || moving || reacting || hot || mediumBreakup ||
                       !uniformMaterial || represented < TILE_CELL_COUNT);
''',
              '''    // An exposed full packet performs one fine-ownership handoff. If the
    // represented cells remain unchanged on the next tile pass, it sleeps instead
    // of cycling through breakup/fine-active states for dozens of frames.
    bool settledFineMedium = boundaryFineMedium && !moving && !reacting && !hot &&
                             !mediumBreakup;
    // Fractional water is legal only as a supported pre-fall ledge remainder.
    // Once unchanged, it is a sleeping fine state rather than a permanently active
    // mixed tile that paints the debug view as an 8x8 checkerboard.
    bool settledHalfWater = halfWater && !moving && !reacting && !hot &&
                            minimumAge >= 12u;
    bool fineActive = represented != 0u && !macroMovable && !settledHalfWater &&
                      (activeAgent || moving || reacting || hot || mediumBreakup ||
                       !uniformMaterial || represented < TILE_CELL_COUNT);
''')

          replace_once(
              'shaders/tiles.comp',
              '''    bool sleeping = sleepingTerrain || sleepingAtmosphere ||
                    settledMedium || settledFineMedium;
''',
              '''    bool sleeping = sleepingTerrain || sleepingAtmosphere ||
                    settledMedium || settledFineMedium || settledHalfWater;
''')

          replace_once(
              'shaders/fullscreen.frag',
              '''    float cohesion = float(sameNeighbors) * 0.045;
    float restrained = 0.08 + densityField * 0.13 + cohesion;
''',
              '''    float cohesion = float(sameNeighbors) * 0.045;
    if (cell.material == MAT_ATMOSPHERE || cell.material == MAT_OXYGEN) {
        // Balanced air is a coherent field, not per-cell visual noise. Composition
        // remains stored per cell; only presentation is smoothed.
        base.rgb = mix(vec3(0.22, 0.46, 0.70), base.rgb, 0.22);
        base.a = clamp(0.075 + densityField * 0.075 + cohesion * 0.32, 0.065, 0.22);
        return base;
    }
    float restrained = 0.08 + densityField * 0.13 + cohesion;
''')

          replace_once(
              'shaders/fullscreen.frag',
              '''        if (activeArea && (activeLocal.x == 0 || activeLocal.y == 0))
            color.rgb = mix(color.rgb, vec3(0.18, 0.95, 1.00), 0.78);
''',
              '''        if (activeArea && (activeLocal.x == 0 || activeLocal.y == 0)) {
            float boundaryAlpha = renderPc.mapMode != 0u ? 0.38 : 0.58;
            color.rgb = mix(color.rgb, vec3(0.18, 0.95, 1.00), boundaryAlpha);
        }
''')

          replace_once(
              'shaders/fullscreen.frag',
              '''        } else if (tileHas(tile, TILE_MEDIUM_BREAKUP)) {
            overlay = debugKeyColor(9u); alpha = 0.58;
''',
              '''        } else if (tileHas(tile, TILE_MEDIUM_BREAKUP) &&
                   !tileHas(tile, TILE_SLEEPING)) {
            overlay = debugKeyColor(9u); alpha = 0.58;
''')

          replace_once(
              'shaders/fullscreen.frag',
              '''        if (renderPc.mapMode != 0u) {
            alpha *= mediumCell ? 0.12 : 0.30;
            if (!stateEdge) alpha *= 0.16;
        } else if (mediumCell) {
            alpha *= stateEdge ? 0.28 : 0.06;
        }
''',
              '''        if (renderPc.mapMode != 0u) {
            alpha *= mediumCell ? (stateEdge ? 0.055 : 0.0) : 0.30;
            if (!mediumCell && !stateEdge) alpha *= 0.16;
        } else if (mediumCell) {
            alpha *= stateEdge ? 0.10 : 0.0;
        }
''')

          replace_once(
              'shaders/fullscreen.frag',
              '''        float chunkAlpha = renderPc.mapMode != 0u
            ? (mediumCell ? 0.015 : 0.045)
            : (mediumCell ? 0.025 : (chunkHas(chunk, CHUNK_SLEEPING) ? 0.10 : 0.06));
''',
              '''        float chunkAlpha = renderPc.mapMode != 0u
            ? (mediumCell ? 0.0 : 0.045)
            : (mediumCell ? 0.0 : (chunkHas(chunk, CHUNK_SLEEPING) ? 0.10 : 0.06));
''')

          validator = Path('tools/validate_shader_contracts.py')
          text = validator.read_text(encoding='utf-8')
          anchor = '''

    app_cpp = (ROOT / "src/app.cpp").read_text(encoding="utf-8")
'''
          addition = '''
    fullscreen_medium = (SHADERS / "fullscreen.frag").read_text(encoding="utf-8")
    for token in (
        "if (isHalfWaterCell(a) || isHalfWaterCell(b)) return;",
        "Cell reserve = sampleAt(sourcePosition - ivec2(direction * 2, 0));",
    ):
        if token not in move:
            errors.append(f"half-water no-crawl/supply contract missing {token!r}")
    for token in (
        "bool settledHalfWater = halfWater && !moving",
        "!macroMovable && !settledHalfWater",
        "settledMedium || settledFineMedium || settledHalfWater",
        "!mediumBreakup;",
    ):
        if token not in tiles:
            errors.append(f"stable fine-medium contract missing {token!r}")
    for token in (
        "cell.material == MAT_ATMOSPHERE || cell.material == MAT_OXYGEN",
        "!tileHas(tile, TILE_SLEEPING)",
        "stateEdge ? 0.10 : 0.0",
        "mediumCell ? 0.0 : 0.045",
    ):
        if token not in fullscreen_medium:
            errors.append(f"medium presentation contract missing {token!r}")
'''
          if addition not in text:
              if anchor not in text:
                  raise SystemExit('validator insertion anchor missing')
              text = text.replace(anchor, '\n' + addition + anchor, 1)
          validator.write_text(text, encoding='utf-8')

          mission = Path('missioncache.md')
          text = mission.read_text(encoding='utf-8')
          rows = {
              'MC-013': ('| MC-013 | REGRESSION | True liquid settling | Water levels quickly, reaches zero motion, and wakes only from support, pressure, volume, heat, reaction, actor, or tool disturbance. Exposed full liquid packets perform one fine-ownership breakup, then an unchanged packet sleeps on the next tile pass instead of cycling for 48 frames. v2.5.6 screenshot-driven fix also prevents stable half-water tiles from remaining permanently fine-active. Packaged observation remains required. |'),
              'MC-017': ('| MC-017 | REGRESSION | Prevent premature stabilization without blanket activation | Liquid, mud, wet material, and gas sleep only after material-specific equilibrium. Fresh enclosed Atmosphere/Oxygen tiles enter settled macro sleep immediately; exposed full gas packets perform one fine handoff and then sleep when unchanged. `ACTIVE TILES` measures actual work rather than the active-area gate. v2.5.6 adds the one-pass exposed-medium rest contract; packaged observation remains required. |'),
              'MC-020': ('| MC-020 | REGRESSION | Composite Atmosphere | An append-only `Atmosphere` material represents normal authored air with breathable oxygen rather than aliasing pure Oxygen. v2.5.6 smooths balanced-air presentation and stops settled exposed full-gas packets from repeatedly advertising breakup while preserving per-cell composition. Packed production storage, pressure exchange, saves, shaders, and rendering migration remain active. |'),
              'MC-084': ('| MC-084 | REGRESSION | Half-water solid-ledge behavior and card identity | Inspected fractional fresh water is titled `HALF WATER`. Fractional water exists only as a supplied pre-fall solid-ledge state: creation requires three contiguous supported full-water cells, two halves consolidate deterministically, and any half is forbidden from horizontal crawling. An unchanged half-water tile sleeps after a short fine-state confirmation instead of producing checkerboard activity. Packaged observation remains required. |'),
          }
          for mission_id, row in rows.items():
              pattern = re.compile(rf'^\| {re.escape(mission_id)} \|.*$', re.M)
              text, count = pattern.subn(row, text, count=1)
              if count != 1:
                  raise SystemExit(f'{mission_id} replacement count was {count}')
          invariant = '- Half Water never moves horizontally: it may fall, consolidate with another half, or remain as a supported pre-fall ledge remainder; no edge chasing or checkerboard activity is permitted.\n'
          marker = '- Debug and map overlays must preserve the visible identity of Atmosphere, Water, and Half Water; hierarchy state uses restrained edges/markers rather than replacing whole medium fields with opaque status colors.\n'
          if invariant not in text:
              if marker not in text:
                  raise SystemExit('mission invariant insertion marker missing')
              text = text.replace(marker, marker + invariant, 1)
          mission.write_text(text, encoding='utf-8')

          changelog = Path('CHANGELOG.md')
          text = changelog.read_text(encoding='utf-8')
          notes = (
              '- Fixed Half Water horizontal crawling and tightened ledge splitting to require a supported three-cell water supply.\n'
              '- Made exposed full Water/Atmosphere packets perform one fine handoff and then sleep immediately when unchanged, eliminating long-lived 8x8 checkerboard activity.\n'
              '- Smoothed balanced Atmosphere rendering and reduced medium debug/map overlays to restrained edge markers so Water, Half Water, and air remain visible.\n'
          )
          marker = '## 2.5.6\n\n'
          if notes not in text:
              if marker not in text:
                  raise SystemExit('2.5.6 changelog marker missing')
              text = text.replace(marker, marker + notes, 1)
          changelog.write_text(text, encoding='utf-8')
          PY

      - name: Validate source and headless contracts
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile tools/validate_shader_contracts.py
          python3 tools/validate_shader_contracts.py
          python3 tools/validate_mission_cache.py
          python3 tools/validate_no_simulation_coroutines.py
          python3 tools/validate_project_branding.py
          cmake -S . -B build/water-air -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DSANDHYBRID_BUILD_APP=OFF \
            -DSANDHYBRID_BUILD_VULKAN_RUNTIME=OFF \
            -DSANDHYBRID_WARNINGS_AS_ERRORS=ON \
            -DBUILD_TESTING=ON
          cmake --build build/water-air --parallel
          ctest --test-dir build/water-air --output-on-failure

      - name: Commit permanent fix and remove applicator
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm -f .github/workflows/apply-v256-water-air-fix.yml
          git add shaders/move.comp shaders/tiles.comp shaders/fullscreen.frag \
            tools/validate_shader_contracts.py missioncache.md CHANGELOG.md
          git commit -m 'Fix v2.5.6 Water and Atmosphere regressions'
          git push origin HEAD:agent/debug-map-inventory-v256
