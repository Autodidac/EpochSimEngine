name: Fix Fix33 Linux Validation-Off Warning

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/fix33-linux-warning-fix.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Patch validation-only helper
        run: |
          python3 -c "from pathlib import Path; p=Path('src/vulkan_renderer.cpp'); s=p.read_text(); old='bool contains_layer(const std::vector<VkLayerProperties>& layers, const char* name) {'; new='[[maybe_unused]] bool contains_layer(const std::vector<VkLayerProperties>& layers, const char* name) {'; assert old in s; p.write_text(s.replace(old,new,1))"
      - name: Validate strict GCC 14 renderer
        run: |
          sudo apt-get update
          sudo apt-get install -y g++-14 libvulkan-dev libxcb1-dev libx11-xcb-dev
          g++-14 -std=c++23 -Wall -Wextra -Wpedantic -Wconversion -Wshadow -Werror -Wno-missing-field-initializers -DEPOCH_SAND_ENABLE_VALIDATION=0 -DVK_USE_PLATFORM_XCB_KHR -Iinclude -Ithird_party/EpochGui/include -fsyntax-only src/vulkan_renderer.cpp
      - name: Commit source fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/vulkan_renderer.cpp
          git commit -m 'Mark validation-only layer helper maybe-unused'
          git push origin HEAD:main
