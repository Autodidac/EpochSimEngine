name: Apply v2.5.4 final closeout

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: v254-final-closeout-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  apply:
    if: github.head_ref == 'agent/durable-structural-ground-deposits-v254'
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Apply complete v2.5.4 source closeout
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          import textwrap

          def replace_once(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text(encoding='utf-8')
              if old not in text:
                  raise SystemExit(f'missing marker in {path}: {old[:180]!r}')
              file.write_text(text.replace(old, new, 1), encoding='utf-8')

          def replace_regex(path: str, pattern: str, replacement: str, flags: int = 0) -> None:
              file = Path(path)
              text = file.read_text(encoding='utf-8')
              text, count = re.subn(pattern, replacement, text, count=1, flags=flags)
              if count != 1:
                  raise SystemExit(f'regex replacement count for {path} was {count}: {pattern[:120]!r}')
              file.write_text(text, encoding='utf-8')

          def replace_mission(mission_id: str, row: str) -> None:
              file = Path('missioncache.md')
              text = file.read_text(encoding='utf-8')
              pattern = re.compile(rf'^\| {re.escape(mission_id)} \|.*$', re.M)
              text, count = pattern.subn(row, text, count=1)
              if count != 1:
                  raise SystemExit(f'mission row {mission_id} replacement count was {count}')
              file.write_text(text, encoding='utf-8')

          # Apply the staged structural/geology, wet-sand, bee-home, Fix28-load,
          # water-edge, atmosphere-edge, mission-cache, and v2.5.4 metadata work.
          staged = Path('.github/workflows/apply-v254-runtime-regressions.yml')
          if staged.exists():
              staged_text = staged.read_text(encoding='utf-8')
              marker = "          python3 - <<'PY'\n"
              start = staged_text.index(marker) + len(marker)
              end = staged_text.index("\n          PY", start)
              exec(compile(textwrap.dedent(staged_text[start:end]), str(staged), 'exec'))

          # Repair the two validator insertions from the superseded staging path.
          validator_path = Path('tools/validate_shader_contracts.py')
          validator = validator_path.read_text(encoding='utf-8')
          scene_block = '''    bee_swarm = (SHADERS / "bee_swarm.glsl").read_text(encoding="utf-8")
    for token in (
        "BEE_AUTHORED_WORLD_CELLS.y * 3",
        "BEE_AUTHORED_WORLD_CELLS.y * 2",
        "return beeUsesAuthoredHome(aux) ? home + beeAuthoredWorldOrigin",
    ):
        if token not in bee_swarm:
            errors.append(f"authored bee-home origin contract missing {token!r}")
    for token in (
        "bee_authored_home_slot_bit",
        "normalize_fix28_hives",
        "fix28_beehive_material",
        "beehive_shell_min_radius_squared = 28",
        "beehive_shell_max_radius_squared = 108",
    ):
        if token not in scene_image_cpp:
            errors.append(f"loaded Fix28 Beehive contract missing {token!r}")
    for token in (
        "wetGranularSinkMove",
        "fullWaterSplitSupplied",
        "gasExpansionAllows",
        "emptyGasRise",
        "emptyGasDiagonal",
    ):
        if token not in move:
            errors.append(f"wet-sand/medium settling contract missing {token!r}")
    for token in (
        "boundaryFineMedium",
        "settledFineMedium",
        "!tileHas(previous, TILE_MEDIUM_BREAKUP)",
        "settledMedium || settledFineMedium",
    ):
        if token not in tiles:
            errors.append(f"one-shot medium-boundary settling contract missing {token!r}")
'''
          scene_pattern = re.compile(
              r'\n\s*bee_swarm = \(SHADERS / "bee_swarm\.glsl"\).*?'
              r'(?=\n\s*ui_text = \(SHADERS / "ui_text\.glsl"\))', re.S)
          validator, scene_count = scene_pattern.subn('\n' + scene_block, validator, count=1)
          if scene_count != 1:
              raise SystemExit(f'scene validator repair count was {scene_count}')

          deposit_block = '''    for token in (
        "residentGroundHash",
        "residentGroundDepositMaterial",
        "roll < 24u) return MAT_IRON_ORE",
        "roll < 32u) return MAT_COPPER",
        "roll < 38u) return MAT_ALUMINUM",
        "depth >= 160 && roll < 41u) return MAT_URANIUM",
    ):
        if token not in reset:
            errors.append(f"resident ground deposit contract missing {token!r}")
    for token in (
        "resident_ground_hash",
        "resident_ground_deposit_material",
        "roll < 24u) return Material::iron_ore",
        "roll < 32u) return Material::copper",
        "roll < 38u) return Material::aluminum",
        "depth >= 160u && roll < 41u) return Material::uranium",
    ):
        if token not in world_layout:
            errors.append(f"CPU resident ground deposit contract missing {token!r}")
    for token in (
        "bool durableStructural = isStructural(source) && isBlockCapable(source.material);",
        "isStructural(source) && !durableStructural && !minorityStructural",
        "isStructural(source) && !durableStructural &&",
    ):
        if token not in chemistry:
            errors.append(f"durable structural chemistry contract missing {token!r}")
'''
          deposit_pattern = re.compile(
              r'\n\s*for token in \(\s*\n\s*"residentGroundHash".*?'
              r'(?=\n\s*for token in \("authoredStructuralCell")', re.S)
          validator, deposit_count = deposit_pattern.subn('\n' + deposit_block, validator, count=1)
          if deposit_count != 1:
              raise SystemExit(f'deposit validator repair count was {deposit_count}')
          validator_path.write_text(validator, encoding='utf-8')

          # Filled enclosed Atmosphere/Oxygen must not blanket-activate because
          # their reset age is below eight. Only actual movement or disturbance
          # keeps them active.
          replace_once(
              'shaders/tiles.comp',
              '            moving = moving || (cell.aux & AUX_MOVED) != 0u || cell.age < 8u;\n',
              '            bool startupDynamic = cell.age < 8u &&\n'
              '                                  cell.material != MAT_ATMOSPHERE &&\n'
              '                                  cell.material != MAT_OXYGEN;\n'
              '            moving = moving || (cell.aux & AUX_MOVED) != 0u || startupDynamic;\n')
          replace_once(
              'shaders/tiles.comp',
              '    bool settledMedium = ((macroLiquid && liquidEnclosed) || (macroGas && gasEnclosed)) &&\n'
              '                         !moving && minimumAge >= 30u;\n'
              '    bool settledFineMedium = boundaryFineMedium && minimumAge >= 48u;\n',
              '    bool balancedAtmosphereTile = fullGas && gasEnclosed && !moving &&\n'
              '        (dominant == MAT_ATMOSPHERE || dominant == MAT_OXYGEN);\n'
              '    bool settledMedium = (((macroLiquid && liquidEnclosed) ||\n'
              '                           (macroGas && gasEnclosed)) &&\n'
              '                          !moving && minimumAge >= 30u) ||\n'
              '                         balancedAtmosphereTile;\n'
              '    bool settledFineMedium = boundaryFineMedium && minimumAge >= 48u;\n')

          # Explicit input-mode state: character scenes default to PLAYER WASD;
          # the GUI toggle switches WASD and right-drag to camera control.
          replace_once(
              'include/sandhybrid/shared_state.hpp',
              '    std::atomic_bool debug_visualization{false};\n',
              '    std::atomic_bool debug_visualization{false};\n'
              '    std::atomic_bool camera_controls{false};\n')
          replace_once(
              'include/sandhybrid/input_routing.hpp',
              '[[nodiscard]] constexpr DirectionalInputRouting route_directional_input(\n',
              '[[nodiscard]] constexpr bool player_wasd_enabled(\n'
              '    const bool player_present, const bool camera_controls) noexcept {\n'
              '    return player_present && !camera_controls;\n'
              '}\n\n'
              '[[nodiscard]] constexpr bool camera_wasd_enabled(\n'
              '    const bool player_present, const bool camera_controls) noexcept {\n'
              '    return !player_present || camera_controls;\n'
              '}\n\n'
              '[[nodiscard]] constexpr DirectionalInputRouting route_directional_input(\n')

          # Four compact top-row controls: BUILD/MINE, RUNNING/PAUSED,
          # PLAYER WASD/WASD PAN, and DEBUG.
          replace_once(
              'include/sandhybrid/ui_layout.hpp',
              '    epochengine::gui_lib::Rect mode_toggle{}, debug_toggle{}, atmosphere{}, fill{}, eraser{}, keymap{}, cursor_editor{}, material_card{};\n',
              '    epochengine::gui_lib::Rect mode_toggle{}, pause_toggle{}, camera_controls_toggle{}, debug_toggle{};\n'
              '    epochengine::gui_lib::Rect atmosphere{}, fill{}, eraser{}, keymap{}, cursor_editor{}, material_card{};\n')
          replace_once(
              'include/sandhybrid/ui_layout.hpp',
              '    layout.mode_toggle = {{left + 8.0f, 100.0f}, {(std::max)(112.0f, side * 0.46f), 22.0f}};\n'
              '    layout.debug_toggle = {{layout.mode_toggle.position.x + layout.mode_toggle.size.x + 4.0f, 100.0f},\n'
              '                           {(std::max)(1.0f, side - layout.mode_toggle.size.x - 24.0f), 22.0f}};\n',
              '    const float top_control_gap = 3.0f;\n'
              '    const float top_control_width = (std::max)(\n'
              '        1.0f, (side - 16.0f - top_control_gap * 3.0f) / 4.0f);\n'
              '    layout.mode_toggle = {{left + 8.0f, 100.0f}, {top_control_width, 22.0f}};\n'
              '    layout.pause_toggle = {{layout.mode_toggle.position.x + top_control_width + top_control_gap, 100.0f},\n'
              '                           {top_control_width, 22.0f}};\n'
              '    layout.camera_controls_toggle = {{layout.pause_toggle.position.x + top_control_width + top_control_gap, 100.0f},\n'
              '                                    {top_control_width, 22.0f}};\n'
              '    layout.debug_toggle = {{layout.camera_controls_toggle.position.x + top_control_width + top_control_gap, 100.0f},\n'
              '                           {(std::max)(1.0f, left + side - 8.0f -\n'
              '                               (layout.camera_controls_toggle.position.x + top_control_width + top_control_gap)), 22.0f}};\n')

          app_path = Path('src/app.cpp')
          app = app_path.read_text(encoding='utf-8')
          pan_pattern = re.compile(
              r'        const auto zoom = shared_state\.camera_zoom\.load\(std::memory_order_relaxed\);\n'
              r'.*?'
              r'        const auto camera_now = std::chrono::steady_clock::now\(\);', re.S)
          pan_replacement = '''        const bool scene_player_present = scene_has_character(scene);
        const bool camera_controls_enabled =
            shared_state.camera_controls.load(std::memory_order_relaxed);
        const bool player_controls =
            player_wasd_enabled(scene_player_present, camera_controls_enabled);
        const bool camera_mode =
            camera_wasd_enabled(scene_player_present, camera_controls_enabled);
        const auto zoom = shared_state.camera_zoom.load(std::memory_order_relaxed);
        const bool pan_button_down = input.middle_down ||
                                     (camera_mode && input.secondary_down);
        if (zoom >= camera_zoom_min && pan_button_down &&
            (over_simulation || pan_dragging)) {
            if (!pan_dragging) {
                pan_dragging = true;
                pan_last_x = input.mouse_x;
                pan_last_y = input.mouse_y;
                pan_remainder_x = 0;
                pan_remainder_y = 0;
            } else {
                const auto view = camera_view(shared_state, simulation_config, zoom);
                const auto viewport_width = (std::max)(
                    static_cast<std::int64_t>(simulation_viewport.rect.size.x), std::int64_t{1});
                const auto viewport_height = (std::max)(
                    static_cast<std::int64_t>(simulation_viewport.rect.size.y), std::int64_t{1});
                const auto dx = input.mouse_x - pan_last_x;
                const auto dy = input.mouse_y - pan_last_y;
                pan_last_x = input.mouse_x;
                pan_last_y = input.mouse_y;

                // Direct view-to-pixel scaling is four times more responsive
                // than the old damped drag while preserving sub-cell remainders.
                pan_remainder_x += -static_cast<std::int64_t>(dx) * view.width;
                pan_remainder_y += -static_cast<std::int64_t>(dy) * view.height;
                const auto shift_x = pan_remainder_x / viewport_width;
                const auto shift_y = pan_remainder_y / viewport_height;
                pan_remainder_x %= viewport_width;
                pan_remainder_y %= viewport_height;

                pan_camera_cells(shared_state, simulation_config,
                                 static_cast<int>(shift_x), static_cast<int>(shift_y));
            }
        } else {
            pan_dragging = false;
            pan_remainder_x = 0;
            pan_remainder_y = 0;
        }

        const auto camera_now = std::chrono::steady_clock::now();'''
          app, pan_count = pan_pattern.subn(pan_replacement, app, count=1)
          if pan_count != 1:
              raise SystemExit(f'app pan replacement count was {pan_count}')
          app = app.replace(
              '        const bool player_controls = scene_has_character(scene);\n'
              '        const auto directional_input = route_directional_input(\n',
              '        const auto directional_input = route_directional_input(\n',
              1)
          edge_pattern = re.compile(
              r'        if \(over_simulation && !pan_dragging\) \{\n'
              r'            constexpr int edge_band_pixels = 28;.*?'
              r'        \}\n'
              r'        camera_direction_x = std::clamp', re.S)
          app, edge_count = edge_pattern.subn(
              '        camera_direction_x = std::clamp', app, count=1)
          if edge_count != 1:
              raise SystemExit(f'edge-pan removal count was {edge_count}')
          app = app.replace(
              '            } else if (epochengine::gui_lib::contains(layout.debug_toggle, pointer)) {\n',
              '            } else if (epochengine::gui_lib::contains(layout.pause_toggle, pointer)) {\n'
              '                const bool paused = shared_state.paused.load(std::memory_order_relaxed);\n'
              '                shared_state.paused.store(!paused, std::memory_order_release);\n'
              '            } else if (epochengine::gui_lib::contains(layout.camera_controls_toggle, pointer)) {\n'
              '                const bool camera_controls =\n'
              '                    shared_state.camera_controls.load(std::memory_order_relaxed);\n'
              '                shared_state.camera_controls.store(!camera_controls,\n'
              '                                                   std::memory_order_release);\n'
              '            } else if (epochengine::gui_lib::contains(layout.debug_toggle, pointer)) {\n',
              1)
          app = app.replace(
              '        shared_state.secondary_down.store(input.secondary_down && paint_active,\n'
              '                                           std::memory_order_relaxed);\n',
              '        shared_state.secondary_down.store(\n'
              '            input.secondary_down && paint_active && !camera_mode,\n'
              '            std::memory_order_relaxed);\n',
              1)
          app = app.replace(
              '        shared_state.deposit_resource.store(input.secondary_down && tool_active, std::memory_order_relaxed);\n',
              '        shared_state.deposit_resource.store(\n'
              '            input.secondary_down && tool_active && !camera_mode,\n'
              '            std::memory_order_relaxed);\n',
              1)
          app = app.replace(
              '        if (secondary_pressed && tool_active)\n'
              '            shared_state.deposit_resource_pressed.store(true, std::memory_order_release);\n',
              '        if (secondary_pressed && tool_active && !camera_mode)\n'
              '            shared_state.deposit_resource_pressed.store(true, std::memory_order_release);\n',
              1)
          app_path.write_text(app, encoding='utf-8')

          # Push the control mode to the fragment shader so button state is live.
          replace_once(
              'src/vulkan_renderer.cpp',
              '    std::uint32_t active_scope_mode{};\n};\nstatic_assert(sizeof(RenderPush) == 164);\n',
              '    std::uint32_t active_scope_mode{};\n'
              '    std::uint32_t camera_controls{};\n};\nstatic_assert(sizeof(RenderPush) == 168);\n')
          replace_once(
              'src/vulkan_renderer.cpp',
              '            .active_scope_mode = state.active_scope_mode.load(std::memory_order_relaxed),\n'
              '        };\n',
              '            .active_scope_mode = state.active_scope_mode.load(std::memory_order_relaxed),\n'
              '            .camera_controls = state.camera_controls.load(std::memory_order_relaxed) ? 1u : 0u,\n'
              '        };\n')
          replace_once(
              'shaders/fullscreen.frag',
              '    uint activeScopeMode;\n} renderPc;\n',
              '    uint activeScopeMode;\n'
              '    uint cameraControls;\n} renderPc;\n')
          shader_path = Path('shaders/fullscreen.frag')
          shader = shader_path.read_text(encoding='utf-8')
          control_pattern = re.compile(
              r'        uint modeWidth = max\(112u, sidebarWidth \* 46u / 100u\);.*?'
              r'        uint contentLeft = sidebarLeft \+ 5u;', re.S)
          control_replacement = '''        uint controlGap = 3u;
        uint controlLeft = sidebarLeft + 8u;
        uint controlWidth = max(1u, (sidebarWidth - 16u - controlGap * 3u) / 4u);
        uint controlLefts[4] = uint[4](
            controlLeft,
            controlLeft + controlWidth + controlGap,
            controlLeft + (controlWidth + controlGap) * 2u,
            controlLeft + (controlWidth + controlGap) * 3u);
        bool playerScene = renderPc.selectedScene == 6u ||
                           renderPc.selectedScene == 7u ||
                           renderPc.selectedScene == 8u;
        uint controlIds[4] = uint[4](
            renderPc.miningMode != 0u ? 8u : 7u,
            renderPc.paused != 0u ? 3u : 2u,
            playerScene && renderPc.cameraControls == 0u ? 141u : 140u,
            9u);
        for (uint control = 0u; control < 4u; ++control) {
            uint left = controlLefts[control];
            uint right = control == 3u ? renderPc.windowWidth - 8u : left + controlWidth;
            if (x >= left && x < right && y >= 100u && y < 122u) {
                bool enabled = (control == 1u && renderPc.paused != 0u) ||
                               (control == 2u && renderPc.cameraControls != 0u) ||
                               (control == 3u && renderPc.debugMode != 0u);
                color = enabled ? vec3(0.20, 0.38, 0.20) : vec3(0.075, 0.105, 0.145);
                if (borderPixel(x, y, left, 100u, right, 122u)) color *= 0.55;
            }
            uint length = fixedTextLength(controlIds[control]);
            int labelScale = int(right - left) >= int(length * 12u + 6u) ? 2 : 1;
            int labelWidth = int(length) * 6 * labelScale - labelScale;
            if (fixedPixel(pixel,
                ivec2(int(left + right) / 2 - labelWidth / 2,
                      111 - (7 * labelScale) / 2),
                labelScale, controlIds[control])) {
                text = true;
                color = vec3(0.95);
            }
        }

        uint contentLeft = sidebarLeft + 5u;'''
          shader, control_count = control_pattern.subn(control_replacement, shader, count=1)
          if control_count != 1:
              raise SystemExit(f'fullscreen control replacement count was {control_count}')
          shader_path.write_text(shader, encoding='utf-8')

          # Reuse fixed text slots so generated IDs remain stable.
          replace_once('tools/generate_ui_text.py', '"MMB DRAG PAN",', '"MMB/RMB PAN",')
          replace_once('tools/generate_ui_text.py', '"WASD PAN", "EDGE PAN", "PLACEMENT",',
                       '"WASD PAN", "PLAYER WASD", "PLACEMENT",')

          # Deterministic input and hit-region contracts.
          Path('tests/input_routing_contract.cpp').write_text('''#include "sandhybrid/input_routing.hpp"\n\nusing namespace sandhybrid;\n\nstatic_assert(player_wasd_enabled(true, false));\nstatic_assert(!player_wasd_enabled(true, true));\nstatic_assert(!player_wasd_enabled(false, false));\nstatic_assert(camera_wasd_enabled(true, true));\nstatic_assert(camera_wasd_enabled(false, false));\nstatic_assert(!camera_wasd_enabled(true, false));\nstatic_assert(route_directional_input(true, true, false, false, false) ==\n              DirectionalInputRouting{0, 0, -1, 0});\nstatic_assert(route_directional_input(false, true, false, false, false) ==\n              DirectionalInputRouting{-1, 0, 0, 0});\n\nint main() { return 0; }\n''', encoding='utf-8')
          replace_once(
              'CMakeLists.txt',
              '    add_executable(sandhybrid_material_contract tests/material_contract.cpp)\n',
              '    add_executable(sandhybrid_input_routing_contract tests/input_routing_contract.cpp)\n'
              '    target_include_directories(sandhybrid_input_routing_contract PRIVATE include)\n'
              '    target_compile_features(sandhybrid_input_routing_contract PRIVATE cxx_std_23)\n'
              '    sandhybrid_configure_warnings(sandhybrid_input_routing_contract)\n'
              '    add_test(NAME sandhybrid_input_routing_contract COMMAND sandhybrid_input_routing_contract)\n\n'
              '    add_executable(sandhybrid_material_contract tests/material_contract.cpp)\n')
          ui_test = Path('tests/ui_layout_contract.cpp')
          ui_text = ui_test.read_text(encoding='utf-8')
          ui_text = ui_text.replace(
              '    if (layout.simulation.size.y <= 0.0f || layout.debug_toggle.size.x < 60.0f) return 3;\n',
              '    if (layout.simulation.size.y <= 0.0f || layout.debug_toggle.size.x <= 0.0f ||\n'
              '        layout.pause_toggle.size.x <= 0.0f ||\n'
              '        layout.camera_controls_toggle.size.x <= 0.0f) return 3;\n'
              '    if (layout.mode_toggle.position.x + layout.mode_toggle.size.x >\n'
              '            layout.pause_toggle.position.x ||\n'
              '        layout.pause_toggle.position.x + layout.pause_toggle.size.x >\n'
              '            layout.camera_controls_toggle.position.x ||\n'
              '        layout.camera_controls_toggle.position.x +\n'
              '            layout.camera_controls_toggle.size.x > layout.debug_toggle.position.x) return 10;\n',
              1)
          ui_text = ui_text.replace(
              '        compact.debug_toggle.position.x < compact.simulation.size.x ||\n'
              '        compact.material_card.position.x < compact.simulation.size.x) return 9;\n',
              '        compact.pause_toggle.position.x < compact.simulation.size.x ||\n'
              '        compact.camera_controls_toggle.position.x < compact.simulation.size.x ||\n'
              '        compact.debug_toggle.position.x < compact.simulation.size.x ||\n'
              '        compact.material_card.position.x < compact.simulation.size.x) return 9;\n',
              1)
          ui_test.write_text(ui_text, encoding='utf-8')

          # Documentation and canonical mission ledger.
          readme = Path('README.md')
          text = readme.read_text(encoding='utf-8')
          text = text.replace('- Space: pause or resume\n', '- `P` or the `RUNNING`/`PAUSED` button: pause or resume\n')
          text = text.replace('- Middle-mouse drag: pan camera\n',
                              '- Middle-mouse drag: direct responsive camera pan in every scene\n'
                              '- Right-mouse drag: camera pan while `WASD PAN` mode is enabled\n')
          text = text.replace('- Move the mouse to a simulation-view edge: pan camera continuously\n', '')
          text = text.replace(
              '- `W` / `A` / `S` / `D`: pan the camera only in scenes without a player\n'
              '- Mouse-edge scrolling and middle-mouse drag remain available in every scene\n',
              '- `PLAYER WASD` / `WASD PAN` button: choose whether character-scene WASD controls the player or camera\n'
              '- `W` / `A` / `S` / `D`: pan the camera in non-player scenes and whenever `WASD PAN` is enabled\n'
              '- Middle-mouse drag always pans; right-mouse drag pans in `WASD PAN` mode\n'
              '- Mouse-edge camera movement is removed\n')
          readme.write_text(text, encoding='utf-8')

          mission_path = Path('missioncache.md')
          mission = mission_path.read_text(encoding='utf-8')
          review_note = ('8. This v2.5.4 pass reviewed every active row. Work without implementation or packaged runtime evidence remains '
                         '`OPEN`, `PARTIAL`, `REGRESSION`, or `DEFERRED`; no item is silently omitted or falsely closed.\n')
          if review_note not in mission:
              mission = mission.replace(
                  '7. During the next broad pass, attempt every active mission once. Anything unfinished or runtime-unverified remains active with evidence.\n',
                  '7. During each broad pass, attempt every active mission once. Anything unfinished or runtime-unverified remains active with evidence.\n'
                  + review_note,
                  1)
          mission = re.sub(
              r'- \*\*P0 / primary release gate:\*\* .*?\n',
              '- **P0 / primary release gate:** MC-012, MC-013, MC-017, MC-032, MC-038, MC-068, MC-074, MC-079, MC-084, MC-097, MC-105, MC-112, MC-114, MC-115, MC-116, MC-118, MC-119, and MC-120. These are the current release blockers and must pass deterministic contracts plus Windows/Linux Release packaging before publication.\n',
              mission,
              count=1)
          mission_path.write_text(mission, encoding='utf-8')

          replace_mission(
              'MC-017',
              '| MC-017 | REGRESSION | Prevent premature stabilization without blanket activation | Liquid, mud, wet material, and gas sleep only after material-specific equilibrium. Freshly reset full enclosed Atmosphere/Oxygen tiles are not marked moving merely because cell age is below eight and enter settled macro sleep immediately. Only exposed, displaced, density-sorting, heated, reacting, emitted, or otherwise disturbed media remain active. `ACTIVE TILES` measures actual tile work, never every tile inside the active-area gate. Static contracts pass; packaged observation remains required. |')
          replace_mission(
              'MC-079',
              '| MC-079 | PARTIAL | Uniform atmosphere edge equilibrium and truthful activity count | A completely Atmosphere-filled resident map reaches zero gas-edge activity and full enclosed Atmosphere/Oxygen tiles sleep on the first reset frames. Finite world edges are sealed. `ACTIVE TILES` excludes clean enclosed air and reports only genuinely active tile work. Real excess gas remains active until pressure/density equilibrium. Static contracts pass; packaged startup observation remains required. |')

          mission_path = Path('missioncache.md')
          mission = mission_path.read_text(encoding='utf-8')
          insert_after = '| MC-099 | PARTIAL | Separate Atmosphere and Fill actions | The always-visible Atmosphere control only selects balanced air. The separate Fill control alone raises the region-fill command and preserves the selected material. Eraser remains a third independent control. Static action, composition, and hit-region contracts pass; packaged runtime acceptance remains required. |\n'
          new_rows = (
              '| MC-119 | PARTIAL | Explicit pause and camera/player input controls | The top GUI provides a live `RUNNING`/`PAUSED` button and a `PLAYER WASD`/`WASD PAN` toggle. Character scenes default to player WASD; the toggle routes WASD to camera without moving the player. Non-player scenes always route WASD to camera. Pause performs no continuous simulation ticks. Static layout/routing contracts pass; packaged click and pause observation remains required. |\n'
              '| MC-120 | PARTIAL | Responsive captured camera drag without edge movement | Mouse-edge panning is removed entirely. Middle drag always pans with direct view-to-pixel scaling and retains sub-cell remainder while captured outside the viewport. In `WASD PAN` mode, right drag pans and suppresses erase/deposit; in `PLAYER WASD` mode, right mouse retains the player/build secondary tool. Static routing and source contracts pass; packaged feel and capture observation remains required. |\n')
          if '| MC-119 |' not in mission:
              if insert_after not in mission:
                  raise SystemExit('mission insertion anchor missing')
              mission = mission.replace(insert_after, insert_after + new_rows, 1)
          mission_path.write_text(mission, encoding='utf-8')

          changelog = Path('CHANGELOG.md')
          text = changelog.read_text(encoding='utf-8')
          marker = '## 2.5.4\n\n'
          notes = (
              '- Prevented freshly reset enclosed Atmosphere/Oxygen tiles from blanket activation; `ACTIVE TILES` now excludes clean enclosed air.\n'
              '- Removed mouse-edge camera movement, made middle drag four times more responsive, and retained native mouse capture outside the viewport.\n'
              '- Added live pause and `PLAYER WASD`/`WASD PAN` GUI controls; camera mode also enables right-drag panning without triggering erase/deposit.\n')
          if marker in text and notes not in text:
              text = text.replace(marker, marker + notes, 1)
          changelog.write_text(text, encoding='utf-8')

          # Strengthen static validation for the new behavior.
          validator = validator_path.read_text(encoding='utf-8')
          anchor = '    ui_text = (SHADERS / "ui_text.glsl").read_text(encoding="utf-8")\n'
          checks = '''    app_cpp = (ROOT / "src/app.cpp").read_text(encoding="utf-8")
    ui_layout_hpp = (ROOT / "include/sandhybrid/ui_layout.hpp").read_text(encoding="utf-8")
    shared_state_hpp = (ROOT / "include/sandhybrid/shared_state.hpp").read_text(encoding="utf-8")
    renderer_cpp = (ROOT / "src/vulkan_renderer.cpp").read_text(encoding="utf-8")
    generator_py = (ROOT / "tools/generate_ui_text.py").read_text(encoding="utf-8")
    for token in (
        "bool startupDynamic = cell.age < 8u &&",
        "cell.material != MAT_ATMOSPHERE",
        "cell.material != MAT_OXYGEN",
        "bool balancedAtmosphereTile = fullGas && gasEnclosed && !moving",
        "balancedAtmosphereTile;",
    ):
        if token not in tiles:
            errors.append(f"filled-atmosphere startup sleep contract missing {token!r}")
    for token in (
        "layout.pause_toggle",
        "layout.camera_controls_toggle",
        "const bool pan_button_down = input.middle_down",
        "camera_mode && input.secondary_down",
        "const auto shift_x = pan_remainder_x / viewport_width",
        "input.secondary_down && paint_active && !camera_mode",
    ):
        if token not in app_cpp:
            errors.append(f"camera/pause input contract missing {token!r}")
    if "edge_band_pixels" in app_cpp:
        errors.append("mouse-edge camera movement remains in app.cpp")
    for token in ("pause_toggle", "camera_controls_toggle", "top_control_width"):
        if token not in ui_layout_hpp:
            errors.append(f"camera/pause layout contract missing {token!r}")
    if "std::atomic_bool camera_controls{false};" not in shared_state_hpp:
        errors.append("shared camera-control mode state is missing")
    if "camera_controls = state.camera_controls.load" not in renderer_cpp:
        errors.append("camera-control mode is not forwarded to rendering")
    for token in ("MMB/RMB PAN", "PLAYER WASD"):
        if token not in generator_py:
            errors.append(f"generated control label contract missing {token!r}")
'''
          if checks not in validator:
              if anchor not in validator:
                  raise SystemExit('validator control insertion anchor missing')
              validator = validator.replace(anchor, checks + anchor, 1)
          validator_path.write_text(validator, encoding='utf-8')

          # Remove every temporary payload/applicator from the release tree.
          for path in Path('.github/patches').glob('v254.part*'):
              path.unlink(missing_ok=True)
          for path in (
              '.github/workflows/apply-active-tile-startup-fix.yml',
              '.github/workflows/apply-durable-structural-ground-deposits.yml',
              '.github/workflows/apply-durable-structural-ground-deposits-v2.yml',
              '.github/workflows/apply-v254-runtime-regressions.yml',
              '.github/workflows/trigger-v254-runtime-regressions.yml',
              '.github/workflows/apply-v254-final-closeout.yml',
          ):
              Path(path).unlink(missing_ok=True)
          PY

          python3 tools/generate_ui_text.py
          python3 -m py_compile tools/validate_shader_contracts.py
          python3 tools/validate_no_simulation_coroutines.py
          python3 tools/validate_project_branding.py
          python3 tools/validate_mission_cache.py
          python3 tools/validate_shader_contracts.py

          cmake -S . -B build/v254-final -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DSANDHYBRID_BUILD_APP=OFF \
