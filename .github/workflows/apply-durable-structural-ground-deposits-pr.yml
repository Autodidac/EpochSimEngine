name: Apply durable structural ground deposits on PR

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: durable-structural-deposits-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  apply:
    if: github.head_ref == 'agent/durable-structural-ground-deposits-v254'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Apply durable structural and geology changes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import textwrap

          workflow = Path('.github/workflows/apply-durable-structural-ground-deposits.yml')
          text = workflow.read_text(encoding='utf-8')
          marker = "          python3 - <<'PY'\n"
          start = text.index(marker) + len(marker)
          end = text.index("\n          PY", start)
          script = textwrap.dedent(text[start:end])
          exec(compile(script, str(workflow), 'exec'))
          Path('.github/workflows/apply-durable-structural-ground-deposits-pr.yml').unlink()
          PY

          python3 tools/validate_no_simulation_coroutines.py
          python3 tools/validate_project_branding.py
          python3 tools/validate_mission_cache.py
          python3 tools/validate_shader_contracts.py

          cmake -S . -B build/durable-contract -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DSANDHYBRID_BUILD_APP=OFF \
            -DSANDHYBRID_BUILD_VULKAN_RUNTIME=OFF \
            -DBUILD_TESTING=ON \
            -DSANDHYBRID_WARNINGS_AS_ERRORS=ON
          cmake --build build/durable-contract --parallel
          ctest --test-dir build/durable-contract --output-on-failure

          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'Keep structural tiles durable and seed ground deposits'
          git push origin HEAD:${{ github.head_ref }}
