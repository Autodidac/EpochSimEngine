name: SandHybrid Fix28 Bee Wave Debug Stats Release

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - "shaders/debug_stats.glsl"
      - "shaders/debug_stats.comp"
      - "tools/fix28_scene.py"
      - "tools/fix28_move.py"
      - "tools/fix28_renderer.py"
      - "tools/fix28_ui.py"
      - "tools/audit_fix28.py"
      - ".github/workflows/sandhybrid-fix28.yml"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: sandhybrid-fix28-release
  cancel-in-progress: true

jobs:
  build-test-release:
    runs-on: windows-2022
    timeout-minutes: 90

    steps:
      - name: Check out Fix28 branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Apply Fix28 ecosystem and bee corrections
        shell: pwsh
        run: |
          python tools/fix28_scene.py
          if ($LASTEXITCODE -ne 0) { throw 'Fix28 ecosystem correction failed.' }
          python tools/fix28_move.py
          if ($LASTEXITCODE -ne 0) { throw 'Fix28 bee movement correction failed.' }
          python tools/fix28_renderer.py
          if ($LASTEXITCODE -ne 0) { throw 'Fix28 renderer correction failed.' }
          python tools/fix28_ui.py
          if ($LASTEXITCODE -ne 0) { throw 'Fix28 debug UI correction failed.' }

      - name: Regenerate material and UI data
        shell: pwsh
        run: |
          python tools/generate_ui_text.py
          if ($LASTEXITCODE -ne 0) { throw 'UI/material generation failed.' }

      - name: Audit material contracts
        shell: pwsh
        run: |
          python tools/audit_material_behaviors.py
          if ($LASTEXITCODE -ne 0) { throw 'Material behavior audit failed.' }

      - name: Audit motion and ecology contracts
        shell: pwsh
        run: |
          python tools/audit_ecology_motion.py
          if ($LASTEXITCODE -ne 0) { throw 'Ecology/motion audit failed.' }

      - name: Audit Fix28 contracts
        shell: pwsh
        run: |
          python tools/audit_fix28.py
          if ($LASTEXITCODE -ne 0) { throw 'Fix28 audit failed.' }

      - name: Validate shader and CPU contracts
        shell: pwsh
        run: |
          python tools/validate_shader_contracts.py
          if ($LASTEXITCODE -ne 0) { throw 'Shader contract validation failed.' }

      - name: Bootstrap pinned vcpkg
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $vcpkgRoot = Join-Path $env:RUNNER_TEMP 'vcpkg'
          git clone --filter=blob:none https://github.com/microsoft/vcpkg.git $vcpkgRoot
          git -C $vcpkgRoot checkout 04a735608afac5844e86fc91d6ba2112cac613c1
          & (Join-Path $vcpkgRoot 'bootstrap-vcpkg.bat') -disableMetrics
          "VCPKG_ROOT=$vcpkgRoot" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Configure Windows x64 Release
        shell: pwsh
        run: |
          cmake -S . -B build/windows -G "Visual Studio 17 2022" -A x64 `
            -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake" `
            -DVCPKG_TARGET_TRIPLET=x64-windows `
            -DEPOCH_SAND_WARNINGS_AS_ERRORS=ON `
            -DEPOCH_SAND_ENABLE_VALIDATION=OFF `
            -DBUILD_TESTING=ON

      - name: Build Windows x64 and every SPIR-V shader
        shell: pwsh
        run: cmake --build build/windows --config Release --parallel

      - name: Run all C++23 contract tests
        shell: pwsh
        run: ctest --test-dir build/windows -C Release --output-on-failure

      - name: Commit verified source to main
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Remove-Item -LiteralPath 'tools/fix28_scene.py' -Force
          Remove-Item -LiteralPath 'tools/fix28_move.py' -Force
          Remove-Item -LiteralPath 'tools/fix28_renderer.py' -Force
          Remove-Item -LiteralPath 'tools/fix28_ui.py' -Force
          Remove-Item -LiteralPath 'tools/audit_fix28.py' -Force
          Remove-Item -LiteralPath 'tools/fix28_parts' -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item -LiteralPath '.github/workflows/sandhybrid-fix28.yml' -Force
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'SandHybrid Fix28: restore bee waves and add debug statistics'
          git push origin HEAD:main
          $releaseSha = git rev-parse HEAD
          "RELEASE_SHA=$releaseSha" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Package verified Windows release
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $distRoot = Join-Path $env:GITHUB_WORKSPACE 'dist'
          $stage = Join-Path $distRoot 'SandHybrid_Windows_x64_Fix28'
          $archive = Join-Path $distRoot 'SandHybrid_Windows_x64_Fix28.zip'
          Remove-Item -LiteralPath $distRoot -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Path $stage | Out-Null
          Copy-Item 'build/windows/Release/epoch_sand.exe' (Join-Path $stage 'SandHybrid.exe') -Force
          Copy-Item 'build/windows/Release/shaders' (Join-Path $stage 'shaders') -Recurse -Force
          Copy-Item 'build/windows/Release/scenes' (Join-Path $stage 'scenes') -Recurse -Force
          Copy-Item README.md, LICENSE -Destination $stage -Force
          Set-Content -LiteralPath (Join-Path $stage 'run.bat') -Value @('@echo off', 'cd /d "%~dp0"', 'SandHybrid.exe') -Encoding ascii
          Compress-Archive -Path (Join-Path $stage '*') -DestinationPath $archive -CompressionLevel Optimal
          (Get-FileHash -Algorithm SHA256 $archive).Hash.ToLowerInvariant() + '  SandHybrid_Windows_x64_Fix28.zip' |
            Set-Content -LiteralPath (Join-Path $distRoot 'SHA256SUMS.txt') -Encoding ascii
          "RELEASE_ARCHIVE=$archive" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Upload verified artifact
        uses: actions/upload-artifact@v4
        with:
          name: SandHybrid_Windows_x64_Fix28
          path: |
            dist/SandHybrid_Windows_x64_Fix28.zip
            dist/SHA256SUMS.txt
          if-no-files-found: error

      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = 'v1.4.0-fix28'
          gh release view $tag --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) { gh release delete $tag --repo $env:GITHUB_REPOSITORY --yes --cleanup-tag }
          gh release create $tag $env:RELEASE_ARCHIVE 'dist/SHA256SUMS.txt' `
            --repo $env:GITHUB_REPOSITORY `
            --target $env:RELEASE_SHA `
            --title 'SandHybrid Windows Fix28' `
            --notes 'Verified Fix28: the repaired ecosystem with the compact new hive is now the startup scene; three authored curved swarm bands and synchronized travelling bee-wave movement restore the old visual pattern while bees still forage flowers, carry pollen, return to the queen, deposit it, eat honey, and repeat; the bottom insect farm is excavated correctly with thick walls, substrate, two habitats, ants, beetles, waste and fertilizer; F3 debug adds a compact top statistics panel showing simulation step, movement pair tests, swaps, moved cells, active/structural/liquid/gas cells, active/sleeping tiles, selected-element population, bee/queen/nest/flower/pollen/honey counts and ant/beetle/habitat counts with species movement totals.'

      - name: Close trigger PR and delete branch
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr close ${{ github.event.pull_request.number }} --repo $env:GITHUB_REPOSITORY --comment 'Fix28 verified build and release completed; source was pushed directly to main.'
          git push origin --delete ${{ github.event.pull_request.head.ref }}
