name: Fix v2.5.9 workspace constexpr contract

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: fix-v259-workspace-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  fix:
    if: github.head_ref == 'agent/v259-macro-water-volcano-pressure'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/v259-macro-water-volcano-pressure
          fetch-depth: 0

      - name: Make pure workspace hit-test constexpr
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('include/sandhybrid/ui_layout.hpp')
          text = path.read_text(encoding='utf-8')
          old = '[[nodiscard]] inline std::uint32_t workspace_at(\n'
          new = '[[nodiscard]] inline constexpr std::uint32_t workspace_at(\n'
          if old not in text:
              if new in text:
                  raise SystemExit(0)
              raise SystemExit('workspace_at declaration not found')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Validate fresh headless contracts
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/validate_shader_contracts.py
          python3 tools/validate_mission_cache.py
          cmake -S . -B build/v259-constexpr -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DSANDHYBRID_BUILD_APP=OFF \
            -DSANDHYBRID_BUILD_VULKAN_RUNTIME=OFF \
            -DSANDHYBRID_WARNINGS_AS_ERRORS=ON \
            -DBUILD_TESTING=ON
          cmake --build build/v259-constexpr --parallel
          ctest --test-dir build/v259-constexpr --output-on-failure

      - name: Commit permanent source fix
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- include/sandhybrid/ui_layout.hpp; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add include/sandhybrid/ui_layout.hpp
          git commit -m 'Make workspace hit testing constexpr'
          git push origin HEAD:agent/v259-macro-water-volcano-pressure
