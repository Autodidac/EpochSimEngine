name: Build Hierarchy Linux Retry

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/build-hierarchy-linux-retry.yml

permissions:
  contents: write

jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CC: gcc-14
      CXX: g++-14
    steps:
      - uses: actions/checkout@v4
      - name: Record Linux retry run
        env:
          RUN_ID: ${{ github.run_id }}
          RUN_NUMBER: ${{ github.run_number }}
          HEAD_SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          cat > hierarchy-linux-status.json <<EOF
          {
            "run_id": ${RUN_ID},
            "run_number": ${RUN_NUMBER},
            "status": "running",
            "head_sha": "${HEAD_SHA}",
            "run_url": "${RUN_URL}"
          }
          EOF
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add hierarchy-linux-status.json
          git commit -m 'Record hierarchy Linux retry [skip ci]'
          git push origin HEAD:main
      - name: Install system build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build gcc-14 g++-14 glslc libvulkan-dev libxcb1-dev libx11-xcb-dev
      - name: Configure system build
        run: |
          cmake -S . -B build/linux-system -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_TESTING=ON \
            -DEPOCH_SAND_WARNINGS_AS_ERRORS=ON \
            -DVulkan_GLSLC_EXECUTABLE=/usr/bin/glslc
      - name: Build Release
        run: cmake --build build/linux-system --parallel
      - name: Run contracts
        run: ctest --test-dir build/linux-system --output-on-failure
      - name: Package Linux release
        run: |
          set -euo pipefail
          stage='dist/FastFreddyHierarchy_Linux_x64'
          mkdir -p "$stage"
          cp build/linux-system/epoch_sand "$stage/"
          cp -a build/linux-system/shaders "$stage/"
          cp -a build/linux-system/scenes "$stage/"
          cp README.md HIERARCHICAL_SIMULATION.md WATER_OPTIMIZATION.md LICENSE "$stage/"
          cat > "$stage/run.sh" <<'SCRIPT'
          #!/usr/bin/env bash
          set -euo pipefail
          cd "$(dirname "$0")"
          exec ./epoch_sand
          SCRIPT
          chmod +x "$stage/run.sh"
          tar -C dist -czf dist/FastFreddyHierarchy_Linux_x64.tar.gz FastFreddyHierarchy_Linux_x64
      - uses: actions/upload-artifact@v4
        with:
          name: fastfreddy-hierarchy-linux-x64-retry
          path: dist/FastFreddyHierarchy_Linux_x64.tar.gz
          if-no-files-found: error
