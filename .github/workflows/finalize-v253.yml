name: Finalize v2.5.3 mission integration

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: finalize-v253-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  finalize:
    if: github.head_ref == 'agent/finalize-missioncache-release-v253'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Reconcile mission cache and release metadata
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          cache_path = Path('missioncache.md')
          lines = cache_path.read_text(encoding='utf-8').splitlines()
          removed_ids = ('| MC-065 |', '| MC-083 |', '| MC-117 |')
          lines = [
              line for line in lines
              if not line.startswith(removed_ids)
              and 'P0 / next external handoff integration' not in line
          ]
          cache = '\n'.join(lines).rstrip() + '\n'
          marker = '| MC-070 | Reusable platform-neutral `SandHybrid::SandHybrid` core library, optional Vulkan runtime, thin demo host, installed CMake package, and downstream consumer contract. | `CHANGELOG.md`; Windows/Linux CI history. |\n'
          accepted = (
              marker
              + '| MC-065 | Deterministic simulation code has no coroutine execution path. CI rejects coroutine machinery across production C++ until bounded streaming or I/O ownership and cancellation are defined under MC-063. | `tools/validate_no_simulation_coroutines.py`; `.github/workflows/core-hygiene-contracts.yml`; CI history. |\n'
              + '| MC-083 | `SandHybrid` is the only project-owned product identity across production code, build files, workflows, docs, and tests. Proper external names and the current repository-host URL remain explicitly allowed. | `tools/validate_project_branding.py`; `HALF_WATER.md`; `.github/workflows/core-hygiene-contracts.yml`; CI history. |\n'
              + '| MC-117 | Protected handoff `agent/nonoverlap-core-hygiene` at `bf2d052a9dbd275ce968cab9453b70b26b6a2771` was reconciled onto current `main` without dropping later mission-cache work. Adam explicitly required the source branch to remain preserved. | PR #45 validation history; PR #46 integration history; Windows/Linux v2.5.3 Release CI. |\n'
          )
          if marker not in cache:
              raise SystemExit('accepted-foundation marker missing')
          cache_path.write_text(cache.replace(marker, accepted, 1), encoding='utf-8')

          cmake_path = Path('CMakeLists.txt')
          cmake = cmake_path.read_text(encoding='utf-8')
          cmake = cmake.replace('project(SandHybrid VERSION 2.5.2', 'project(SandHybrid VERSION 2.5.3')
          cmake_path.write_text(cmake, encoding='utf-8')

          changelog_path = Path('CHANGELOG.md')
          changelog = changelog_path.read_text(encoding='utf-8')
          if '## 2.5.3' not in changelog:
              section = (
                  '## 2.5.3\n\n'
                  '- Integrated the protected `agent/nonoverlap-core-hygiene` handoff while preserving its source branch.\n'
                  '- Completed MC-065 with a deterministic CI contract rejecting coroutine machinery from simulation code.\n'
                  '- Completed MC-083 with a repository-wide SandHybrid branding contract while preserving proper external EpochGui and EpochEngine names.\n'
                  '- Completed MC-117 by reconciling the handoff onto current `main` without dropping later mission-cache work.\n'
                  '- Added both core-hygiene contracts to pull-request and Windows/Linux release validation.\n\n'
              )
              changelog = changelog.replace('# Changelog\n\n', '# Changelog\n\n' + section, 1)
          changelog_path.write_text(changelog, encoding='utf-8')
          PY

          python3 tools/validate_no_simulation_coroutines.py
          python3 tools/validate_project_branding.py
          python3 tools/validate_mission_cache.py
          python3 tools/validate_shader_contracts.py

          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add missioncache.md CMakeLists.txt CHANGELOG.md
          if git diff --cached --quiet; then
            echo 'Mission integration already applied.'
            exit 0
          fi
          git commit -m 'Finalize mission integration and prepare v2.5.3'
          git push origin HEAD:${{ github.head_ref }}
