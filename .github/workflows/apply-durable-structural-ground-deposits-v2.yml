name: Apply durable structural ground deposits v2

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: durable-structural-deposits-v2-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  apply:
    if: github.head_ref == 'agent/durable-structural-ground-deposits-v254'
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Embedded structural and geology applicator source
        if: ${{ false }}
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          import textwrap

          source_workflow = Path('.github/workflows/apply-durable-structural-ground-deposits.yml')
          text = source_workflow.read_text(encoding='utf-8')
          marker = "          python3 - <<'PY'\n"
          start = text.index(marker) + len(marker)
          end = text.index("\n          PY", start)
          script = textwrap.dedent(text[start:end])

          world_start = script.index("old_world_tail = '''")
          world_end_marker = "replace_once('include/sandhybrid/world_layout.hpp', old_world_tail, new_world_tail)"
          world_end = script.index(world_end_marker, world_start) + len(world_end_marker)
          world_patch = r'''
          world_path = Path('include/sandhybrid/world_layout.hpp')
          world_text = world_path.read_text(encoding='utf-8')
          world_pattern = re.compile(
              r"    if \(zone == 0u\) \{.*?    return Material::stone;\n\}",
              re.S,
          )
          new_world_tail = """    Material geology = Material::stone;
              if (zone == 0u) {
              if (local_y < 96u) geology = Material::sand;
              else if (local_y < 232u) geology = Material::dirt;
              else if (((patch_x + patch_y * 3u) % 11u) == 0u) geology = Material::mud;
              else geology = Material::silt;
          } else if (zone == 1u) {
              if (local_y < 104u) geology = Material::dirt;
              else if (local_y < 248u) {
                  geology = ((patch_x * 5u + patch_y) % 13u) == 0u
                      ? Material::mud : Material::silt;
              } else {
                  geology = ((patch_x + patch_y) % 7u) == 0u
                      ? Material::stone : Material::sand;
              }
          } else if (local_y < 80u) {
              geology = ((patch_x * 3u + patch_y) % 9u) == 0u
                  ? Material::mud : Material::silt;
          } else if (local_y < 176u) {
              geology = Material::dirt;
          } else if (local_y < 224u && ((patch_x + patch_y * 2u) % 5u) == 0u) {
              geology = Material::sand;
          }
              return resident_ground_deposit_material(geology, x, y, depth);
          }"""
          world_text, world_count = world_pattern.subn(new_world_tail, world_text, count=1)
          if world_count != 1:
              raise SystemExit(f'world geology replacement count was {world_count}')
          world_path.write_text(world_text, encoding='utf-8')
          '''
          world_patch = textwrap.dedent(world_patch)
          script = script[:world_start] + world_patch + script[world_end:]

          glsl_start = script.index("old_glsl_tail = '''")
          glsl_end_marker = "replace_once('shaders/reset.comp', old_glsl_tail, new_glsl_tail)"
          glsl_end = script.index(glsl_end_marker, glsl_start) + len(glsl_end_marker)
          glsl_patch = r'''
          reset_path = Path('shaders/reset.comp')
          reset_text = reset_path.read_text(encoding='utf-8')
          reset_pattern = re.compile(
              r"    if \(zone == 0\) \{.*?    return MAT_STONE;\n\}",
              re.S,
          )
          new_glsl_tail = """    uint geology = MAT_STONE;
              if (zone == 0) {
              if (localY < 96) geology = MAT_SAND;
              else if (localY < 232) geology = MAT_DIRT;
              else if (((geologyPatch.x + geologyPatch.y * 3) % 11) == 0) geology = MAT_MUD;
              else geology = MAT_SILT;
          } else if (zone == 1) {
              if (localY < 104) geology = MAT_DIRT;
              else if (localY < 248)
                  geology = ((geologyPatch.x * 5 + geologyPatch.y) % 13) == 0
                      ? MAT_MUD : MAT_SILT;
              else
                  geology = ((geologyPatch.x + geologyPatch.y) % 7) == 0
                      ? MAT_STONE : MAT_SAND;
          } else if (localY < 80) {
              geology = ((geologyPatch.x * 3 + geologyPatch.y) % 9) == 0
                  ? MAT_MUD : MAT_SILT;
          } else if (localY < 176) {
              geology = MAT_DIRT;
          } else if (localY < 224 && ((geologyPatch.x + geologyPatch.y * 2) % 5) == 0) {
              geology = MAT_SAND;
          }
              return residentGroundDepositMaterial(geology, worldPosition, depth);
          }"""
          reset_text, reset_count = reset_pattern.subn(new_glsl_tail, reset_text, count=1)
          if reset_count != 1:
              raise SystemExit(f'GLSL geology replacement count was {reset_count}')
          reset_path.write_text(reset_text, encoding='utf-8')
          '''
          glsl_patch = textwrap.dedent(glsl_patch)
          script = script[:glsl_start] + glsl_patch + script[glsl_end:]

          exec(compile(script, str(source_workflow), 'exec'))
          Path('.github/workflows/apply-durable-structural-ground-deposits-v2.yml').unlink()
          PY

      - name: Apply v2.5.4 closeout and validate
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          workflow = Path('.github/workflows/apply-v254-runtime-regressions.yml')
          text = workflow.read_text(encoding='utf-8')
          marker = '        run: |\n'
          start = text.index(marker) + len(marker)
          lines = text[start:].splitlines()
          script = '\n'.join(line[10:] if line.startswith('          ') else line for line in lines) + '\n'
          validation_marker = 'python3 -m py_compile tools/validate_shader_contracts.py'
          prefix, suffix = script.split(validation_marker, 1)
          Path('/tmp/apply-v254-prefix.sh').write_text(prefix, encoding='utf-8')
          Path('/tmp/apply-v254-suffix.sh').write_text(validation_marker + suffix, encoding='utf-8')
          PY
          rm -f .github/workflows/trigger-v254-runtime-regressions.yml
          bash /tmp/apply-v254-prefix.sh

          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path('tools/validate_shader_contracts.py')
          text = path.read_text(encoding='utf-8')

          scene_block = '''    bee_swarm = (SHADERS / "bee_swarm.glsl").read_text(encoding="utf-8")
    for token in (
        "BEE_AUTHORED_WORLD_CELLS.y * 3",
        "BEE_AUTHORED_WORLD_CELLS.y * 2",
        "return beeUsesAuthoredHome(aux) ? home + beeAuthoredWorldOrigin",
    ):
        if token not in bee_swarm:
            errors.append(f"authored bee-home origin contract missing {token!r}")
    for token in (
        "bee_authored_home_slot_bit",
        "normalize_fix28_hives",
        "fix28_beehive_material",
        "beehive_shell_min_radius_squared = 28",
        "beehive_shell_max_radius_squared = 108",
    ):
        if token not in scene_image_cpp:
            errors.append(f"loaded Fix28 Beehive contract missing {token!r}")
    for token in (
        "wetGranularSinkMove",
        "fullWaterSplitSupplied",
        "gasExpansionAllows",
        "emptyGasRise",
        "emptyGasDiagonal",
    ):
        if token not in move:
            errors.append(f"wet-sand/medium settling contract missing {token!r}")
    for token in (
        "boundaryFineMedium",
        "settledFineMedium",
        "!tileHas(previous, TILE_MEDIUM_BREAKUP)",
        "settledMedium || settledFineMedium",
    ):
        if token not in tiles:
            errors.append(f"one-shot medium-boundary settling contract missing {token!r}")
'''
          scene_pattern = re.compile(
              r'\n\s*bee_swarm = \(SHADERS / "bee_swarm\.glsl"\).*?'
              r'(?=\n\s*ui_text = \(SHADERS / "ui_text\.glsl"\))', re.S)
          text, scene_count = scene_pattern.subn('\n' + scene_block, text, count=1)
          if scene_count != 1:
              raise SystemExit(f'scene validator repair count was {scene_count}')

          deposit_block = '''    for token in (
        "residentGroundHash",
        "residentGroundDepositMaterial",
        "roll < 24u) return MAT_IRON_ORE",
        "roll < 32u) return MAT_COPPER",
        "roll < 38u) return MAT_ALUMINUM",
        "depth >= 160 && roll < 41u) return MAT_URANIUM",
    ):
        if token not in reset:
            errors.append(f"resident ground deposit contract missing {token!r}")
    for token in (
        "resident_ground_hash",
        "resident_ground_deposit_material",
        "roll < 24u) return Material::iron_ore",
        "roll < 32u) return Material::copper",
        "roll < 38u) return Material::aluminum",
        "depth >= 160u && roll < 41u) return Material::uranium",
    ):
        if token not in world_layout:
            errors.append(f"CPU resident ground deposit contract missing {token!r}")
    for token in (
        "bool durableStructural = isStructural(source) && isBlockCapable(source.material);",
        "isStructural(source) && !durableStructural && !minorityStructural",
        "isStructural(source) && !durableStructural &&",
    ):
        if token not in chemistry:
            errors.append(f"durable structural chemistry contract missing {token!r}")
'''
          deposit_pattern = re.compile(
              r'\n\s*for token in \(\s*\n\s*"residentGroundHash".*?'
              r'(?=\n\s*for token in \("authoredStructuralCell")', re.S)
          text, deposit_count = deposit_pattern.subn('\n' + deposit_block, text, count=1)
          if deposit_count != 1:
              raise SystemExit(f'deposit validator repair count was {deposit_count}')

          path.write_text(text, encoding='utf-8')
          PY

          bash /tmp/apply-v254-suffix.sh
