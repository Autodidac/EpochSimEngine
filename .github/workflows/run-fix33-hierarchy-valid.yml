name: Run Fix33 Hierarchy Rebase

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/run-fix33-hierarchy-valid.yml

permissions:
  contents: write

jobs:
  rebase:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Record Fix33 run
        env:
          RUN_ID: ${{ github.run_id }}
          RUN_NUMBER: ${{ github.run_number }}
          HEAD_SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          cat > fix33-status.json <<EOF
          {
            "run_id": ${RUN_ID},
            "run_number": ${RUN_NUMBER},
            "status": "running",
            "head_sha": "${HEAD_SHA}",
            "run_url": "${RUN_URL}"
          }
          EOF
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add fix33-status.json
          git commit -m 'Record Fix33 hierarchy run [skip ci]'
          git push origin HEAD:main

      - name: Fetch and stage testbed hierarchy
        run: |
          git remote add testbed https://github.com/Autodidac/fastfreddytestbed.git
          git fetch --no-tags testbed a3b82617611d76829a5c9b76dd47d9ee938f87ad
          set +e
          git cherry-pick --no-commit a3b82617611d76829a5c9b76dd47d9ee938f87ad
          result=$?
          set -e
          if [ $result -ne 0 ]; then
            git checkout --ours shaders/chemistry.comp shaders/fullscreen.frag shaders/move.comp shaders/tiles.comp tests/material_contract.cpp
          fi
          echo "CHERRY_PICK_RESULT=${result}" >> "$GITHUB_ENV"

      - name: Extract YAML-safe semantic resolver
        run: |
          python3 - <<'PY'
          from pathlib import Path
          source = Path('.github/workflows/rebase-testbed-hierarchy.yml').read_text(encoding='utf-8')
          begin_marker = "          cat > /tmp/resolve_hierarchy.py <<'PY'\n"
          end_marker = "          PY\n\n          python3 /tmp/resolve_hierarchy.py\n"
          begin = source.index(begin_marker) + len(begin_marker)
          end = source.index(end_marker, begin)
          lines = source[begin:end].splitlines()
          script = '\n'.join(line[10:] if line.startswith('          ') else line for line in lines) + '\n'
          brittle = "def replace_once(path: str, old: str, new: str) -> None:\n    text = read(path)\n    if old not in text:\n        raise RuntimeError(f'missing marker in {path}: {old[:100]!r}')\n    write(path, text.replace(old, new, 1))\n"
          tolerant = "def replace_once(path: str, old: str, new: str) -> None:\n    import re\n    text = read(path)\n    if old in text:\n        write(path, text.replace(old, new, 1))\n        return\n    pieces = re.split(r'(\\s+)', old)\n    pattern = ''.join(r'\\s+' if piece.isspace() else re.escape(piece) for piece in pieces if piece)\n    match = re.search(pattern, text, flags=re.MULTILINE)\n    if match is None:\n        raise RuntimeError(f'missing marker in {path}: {old[:100]!r}')\n    write(path, text[:match.start()] + new + text[match.end():])\n"
          if brittle not in script:
              raise RuntimeError('unable to find resolver helper')
          Path('/tmp/resolve_hierarchy.py').write_text(script.replace(brittle, tolerant, 1), encoding='utf-8')
          PY
          python3 /tmp/resolve_hierarchy.py
          git add shaders/chemistry.comp shaders/fullscreen.frag shaders/move.comp shaders/tiles.comp tests/material_contract.cpp shaders/macro_move.comp
          if [ "$CHERRY_PICK_RESULT" != "0" ]; then git cherry-pick --quit; fi

      - name: Install validation tools
        run: |
          sudo apt-get update
          sudo apt-get install -y glslc g++-14 libvulkan-dev libxcb1-dev libx11-xcb-dev

      - name: Compile every shader and C++23 contract
        run: |
          set -euo pipefail
          mkdir -p /tmp/fastfreddy-shaders
          for shader in reset.comp paint.comp sunlight.comp tiles.comp chunks.comp chemistry.comp macro_move.comp move.comp actor.comp debug_stats.comp fullscreen.vert fullscreen.frag; do
            echo "Compiling ${shader}"
            glslc --target-env=vulkan1.2 -O -I shaders "shaders/${shader}" -o "/tmp/fastfreddy-shaders/${shader}.spv"
          done
          for source in tests/material_contract.cpp tests/behavior_contract.cpp tests/scene_image_contract.cpp; do
            g++-14 -std=c++23 -Wall -Wextra -Wpedantic -Wconversion -Wshadow -Werror -Iinclude -Ithird_party/EpochGui/include -fsyntax-only "${source}"
          done
          g++-14 -std=c++23 -Wall -Wextra -Wpedantic -Wconversion -Wshadow -Werror -Wno-missing-field-initializers -Iinclude -Ithird_party/EpochGui/include -fsyntax-only src/vulkan_renderer.cpp

      - name: Commit validated Fix33 source
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add CMakeLists.txt README.md HIERARCHICAL_SIMULATION.md include src shaders tests
          git commit -m 'SandHybrid Fix33: hierarchy on Fix32 with complete GUI'
          git pull --rebase origin main
          git push origin HEAD:main
