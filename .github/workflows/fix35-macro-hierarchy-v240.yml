name: FastFreddyTestbed Fix35 Macro Hierarchy v2.4.0

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - 'tools/apply_fix35_macro_hierarchy.py'
      - '.github/workflows/fix35-macro-hierarchy-v240.yml'

permissions:
  contents: write
  pull-requests: write
  actions: read

concurrency:
  group: fastfreddytestbed-fix35-macro-hierarchy-v240
  cancel-in-progress: true

env:
  BASE_SHA: 1e2a73a20a93fb91e230a73c0df0991ba008d4b9
  RELEASE_TAG: v2.4.0
  VCPKG_COMMIT: 04a735608afac5844e86fc91d6ba2112cac613c1

jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: control
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository }}
          ref: ${{ env.BASE_SHA }}
          fetch-depth: 0
          path: work

      - name: Apply and audit macro hierarchy source
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ((git -C work rev-parse HEAD).Trim() -ne $env:BASE_SHA) { throw 'Wrong v2.3.3 base SHA.' }
          Copy-Item control/tools/apply_fix35_macro_hierarchy.py work/tools/apply_fix35_macro_hierarchy.py -Force
          Push-Location work
          python tools/apply_fix35_macro_hierarchy.py
          if ($LASTEXITCODE -ne 0) { throw 'Macro hierarchy patch failed.' }
          Remove-Item tools/apply_fix35_macro_hierarchy.py -Force
          python tools/audit_material_behaviors.py
          if ($LASTEXITCODE -ne 0) { throw 'Material audit failed.' }
          python tools/audit_ecology_motion.py
          if ($LASTEXITCODE -ne 0) { throw 'Ecology audit failed.' }
          python tools/validate_shader_contracts.py
          if ($LASTEXITCODE -ne 0) { throw 'Shader contract audit failed.' }
          $allowed = @(
            'HALF_WATER.md','MISSION_LEDGER.md','README.md',
            'include/epoch/sand/material.hpp','include/epoch/sand/ui_text_data.hpp',
            'shaders/chemistry.comp','shaders/chunks.comp','shaders/chunks.glsl',
            'shaders/debug_stats.comp','shaders/debug_stats.glsl','shaders/fullscreen.frag',
            'shaders/macro_move.comp','shaders/material_ids.glsl','shaders/material_physics.glsl',
            'shaders/materials.glsl','shaders/move.comp','shaders/paint.comp',
            'shaders/tiles.comp','shaders/tiles.glsl','shaders/ui_text.glsl',
            'src/scene_image.cpp','src/vulkan_renderer.cpp','tests/behavior_contract.cpp',
            'tools/material_catalog.py','tools/validate_shader_contracts.py'
          ) | Sort-Object
          $changed = @((git status --porcelain=v1) | ForEach-Object { $_.Substring(3) }) | Sort-Object
          if (Compare-Object $allowed $changed) { throw "Unexpected source delta: $($changed -join ', ')" }
          $macro = Get-Content shaders/macro_move.comp -Raw
          $tiles = Get-Content shaders/tiles.comp -Raw
          $move = Get-Content shaders/move.comp -Raw
          $chem = Get-Content shaders/chemistry.comp -Raw
          $frag = Get-Content shaders/fullscreen.frag -Raw
          if ($macro -notmatch 'TILE_MACRO_MOVABLE' -or $tiles -notmatch 'CHUNK_SLEEPING') { throw 'Hierarchy gate failed.' }
          if ($move -match 'firstDrop \|\| secondDrop \|\| \(randomValue' -or $move -notmatch 'halfWaterAhead') { throw 'Liquid settling gate failed.' }
          if ($chem -notmatch 'MAT_SLUICE_BOX' -or $chem -notmatch 'inventory.y \+= 7u') { throw 'Sluice gate failed.' }
          if ($frag -notmatch 'STAT_MOVE_SWAPS' -or $frag -notmatch 'readableTileGrid') { throw 'Debug rendering gate failed.' }
          Pop-Location

      - name: Bootstrap pinned vcpkg
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = Join-Path $env:RUNNER_TEMP 'vcpkg'
          git clone --filter=blob:none https://github.com/microsoft/vcpkg.git $root
          git -C $root checkout $env:VCPKG_COMMIT
          & (Join-Path $root 'bootstrap-vcpkg.bat') -disableMetrics
          if ($LASTEXITCODE -ne 0) { throw 'vcpkg bootstrap failed.' }
          "VCPKG_ROOT=$root" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Configure Windows x64 C++23 Release
        shell: pwsh
        working-directory: work
        run: |
          cmake -S . -B build/windows -G 'Visual Studio 17 2022' -A x64 `
            -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake" `
            -DVCPKG_TARGET_TRIPLET=x64-windows -DVCPKG_HOST_TRIPLET=x64-windows `
            -DEPOCH_SAND_WARNINGS_AS_ERRORS=OFF -DEPOCH_SAND_ENABLE_VALIDATION=OFF -DBUILD_TESTING=ON
          if ($LASTEXITCODE -ne 0) { throw 'Windows configure failed.' }

      - name: Build all Vulkan shaders and C++23 targets
        shell: pwsh
        working-directory: work
        run: |
          cmake --build build/windows --config Release --parallel
          if ($LASTEXITCODE -ne 0) { throw 'Windows build failed.' }
          $shaders = @('reset.comp','paint.comp','sunlight.comp','tiles.comp','chunks.comp','chemistry.comp','macro_move.comp','move.comp','actor.comp','debug_stats.comp','fullscreen.vert','fullscreen.frag')
          foreach ($shader in $shaders) {
            if (-not (Test-Path (Join-Path 'build/windows/Release/shaders' ($shader + '.spv')))) { throw "Missing shader $shader" }
          }

      - name: Run Windows contracts
        shell: pwsh
        working-directory: work
        run: |
          ctest --test-dir build/windows -C Release --output-on-failure
          if ($LASTEXITCODE -ne 0) { throw 'Windows tests failed.' }

      - name: Package Windows
        shell: pwsh
        working-directory: work
        run: |
          $dist = Join-Path $PWD 'dist/windows'
          $stage = Join-Path $dist 'FastFreddyTestbed_Windows_x64_v2.4.0'
          $archive = Join-Path $dist 'FastFreddyTestbed_Windows_x64_v2.4.0.zip'
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item 'build/windows/Release/epoch_sand.exe' (Join-Path $stage 'FastFreddyTestbed.exe') -Force
          Copy-Item 'build/windows/Release/shaders' (Join-Path $stage 'shaders') -Recurse -Force
          Copy-Item 'build/windows/Release/scenes' (Join-Path $stage 'scenes') -Recurse -Force
          Copy-Item README.md, HALF_WATER.md, MISSION_LEDGER.md, LICENSE -Destination $stage -Force
          @('@echo off','cd /d "%~dp0"','FastFreddyTestbed.exe') | Set-Content (Join-Path $stage 'run.bat') -Encoding ascii
          Compress-Archive -Path (Join-Path $stage '*') -DestinationPath $archive -CompressionLevel Optimal -Force
          $hash = (Get-FileHash -Algorithm SHA256 $archive).Hash.ToLowerInvariant()
          "$hash  FastFreddyTestbed_Windows_x64_v2.4.0.zip" | Set-Content (Join-Path $dist 'SHA256SUMS-Windows.txt') -Encoding ascii

      - uses: actions/upload-artifact@v4
        with:
          name: FastFreddyTestbed-Windows-x64-v2.4.0
          path: |
            work/dist/windows/FastFreddyTestbed_Windows_x64_v2.4.0.zip
            work/dist/windows/SHA256SUMS-Windows.txt
          if-no-files-found: error

  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    env:
      CC: gcc-14
      CXX: g++-14
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: control
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository }}
          ref: ${{ env.BASE_SHA }}
          fetch-depth: 0
          path: work

      - name: Apply and audit macro hierarchy source
        run: |
          set -euo pipefail
          test "$(git -C work rev-parse HEAD)" = "$BASE_SHA"
          cp control/tools/apply_fix35_macro_hierarchy.py work/tools/
          cd work
          python3 tools/apply_fix35_macro_hierarchy.py
          rm -f tools/apply_fix35_macro_hierarchy.py
          python3 tools/audit_material_behaviors.py
          python3 tools/audit_ecology_motion.py
          python3 tools/validate_shader_contracts.py
          expected=$(printf '%s\n' HALF_WATER.md MISSION_LEDGER.md README.md include/epoch/sand/material.hpp include/epoch/sand/ui_text_data.hpp shaders/chemistry.comp shaders/chunks.comp shaders/chunks.glsl shaders/debug_stats.comp shaders/debug_stats.glsl shaders/fullscreen.frag shaders/macro_move.comp shaders/material_ids.glsl shaders/material_physics.glsl shaders/materials.glsl shaders/move.comp shaders/paint.comp shaders/tiles.comp shaders/tiles.glsl shaders/ui_text.glsl src/scene_image.cpp src/vulkan_renderer.cpp tests/behavior_contract.cpp tools/material_catalog.py tools/validate_shader_contracts.py | sort)
          actual=$(git status --porcelain=v1 | cut -c4- | sort)
          test "$actual" = "$expected" || { printf 'Unexpected source delta:\n%s\n' "$actual"; exit 1; }
          grep -q 'TILE_MACRO_MOVABLE' shaders/macro_move.comp
          grep -q 'CHUNK_SLEEPING' shaders/tiles.comp
          grep -q 'halfWaterAhead' shaders/move.comp
          ! grep -Eq 'firstDrop \|\| secondDrop \|\| \(randomValue' shaders/move.comp
          grep -q 'MAT_SLUICE_BOX' shaders/chemistry.comp
          grep -q 'inventory.y += 7u' shaders/chemistry.comp
          grep -q 'STAT_MOVE_SWAPS' shaders/fullscreen.frag
          grep -q 'readableTileGrid' shaders/fullscreen.frag

      - name: Install Linux prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build gcc-14 g++-14 pkg-config libvulkan-dev libxcb1-dev libx11-xcb-dev

      - name: Bootstrap pinned vcpkg
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/vcpkg"
          git clone --filter=blob:none https://github.com/microsoft/vcpkg.git "$root"
          git -C "$root" checkout "$VCPKG_COMMIT"
          "$root/bootstrap-vcpkg.sh" -disableMetrics
          echo "VCPKG_ROOT=$root" >> "$GITHUB_ENV"

      - name: Configure Linux x64 C++23 Release
        working-directory: work
        run: |
          cmake -S . -B build/linux -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE="$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake" \
            -DVCPKG_TARGET_TRIPLET=x64-linux -DVCPKG_HOST_TRIPLET=x64-linux \
            -DEPOCH_SAND_WARNINGS_AS_ERRORS=OFF -DEPOCH_SAND_ENABLE_VALIDATION=OFF -DBUILD_TESTING=ON

      - name: Build all Vulkan shaders and C++23 targets
        working-directory: work
        run: |
          set -euo pipefail
          cmake --build build/linux --parallel
          for shader in reset.comp paint.comp sunlight.comp tiles.comp chunks.comp chemistry.comp macro_move.comp move.comp actor.comp debug_stats.comp fullscreen.vert fullscreen.frag; do
            test -f "build/linux/shaders/$shader.spv"
          done

      - name: Run Linux contracts
        working-directory: work
        run: ctest --test-dir build/linux --output-on-failure

      - name: Package Linux
        working-directory: work
        run: |
          set -euo pipefail
          dist="$PWD/dist/linux"
          stage="$dist/FastFreddyTestbed_Linux_x64_v2.4.0"
          archive="$dist/FastFreddyTestbed_Linux_x64_v2.4.0.tar.gz"
          mkdir -p "$stage"
          cp build/linux/epoch_sand "$stage/FastFreddyTestbed"
          cp -R build/linux/shaders "$stage/shaders"
          cp -R build/linux/scenes "$stage/scenes"
          cp README.md HALF_WATER.md MISSION_LEDGER.md LICENSE "$stage/"
          printf '#!/usr/bin/env bash\nset -euo pipefail\ncd "$(dirname "$0")"\nexec ./FastFreddyTestbed\n' > "$stage/run.sh"
          chmod +x "$stage/run.sh" "$stage/FastFreddyTestbed"
          tar -C "$dist" -czf "$archive" FastFreddyTestbed_Linux_x64_v2.4.0
          sha256sum "$archive" | sed 's# .*/#  #' > "$dist/SHA256SUMS-Linux.txt"

      - uses: actions/upload-artifact@v4
        with:
          name: FastFreddyTestbed-Linux-x64-v2.4.0
          path: |
            work/dist/linux/FastFreddyTestbed_Linux_x64_v2.4.0.tar.gz
            work/dist/linux/SHA256SUMS-Linux.txt
          if-no-files-found: error

  release:
    needs: [windows, linux]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: control
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository }}
          ref: ${{ env.BASE_SHA }}
          fetch-depth: 0
          path: work

      - name: Materialize verified source
        run: |
          set -euo pipefail
          test "$(git -C work rev-parse HEAD)" = "$BASE_SHA"
          test "$(git -C work ls-remote origin refs/heads/main | cut -f1)" = "$BASE_SHA"
          cp control/tools/apply_fix35_macro_hierarchy.py work/tools/
          cd work
          python3 tools/apply_fix35_macro_hierarchy.py
          rm -f tools/apply_fix35_macro_hierarchy.py
          python3 tools/audit_material_behaviors.py
          python3 tools/audit_ecology_motion.py
          python3 tools/validate_shader_contracts.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'FastFreddyTestbed Fix35: chunk-first macro hierarchy, wet processing, settled water'
          release_sha=$(git rev-parse HEAD)
          git push origin HEAD:main
          echo "RELEASE_SHA=$release_sha" >> "$GITHUB_ENV"

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Verify checksums and publish v2.4.0
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          win='artifacts/FastFreddyTestbed-Windows-x64-v2.4.0'
          linux='artifacts/FastFreddyTestbed-Linux-x64-v2.4.0'
          (cd "$win" && sha256sum -c SHA256SUMS-Windows.txt)
          (cd "$linux" && sha256sum -c SHA256SUMS-Linux.txt)
          mkdir -p release
          cp "$win/FastFreddyTestbed_Windows_x64_v2.4.0.zip" release/
          cp "$linux/FastFreddyTestbed_Linux_x64_v2.4.0.tar.gz" release/
          (cd release && sha256sum FastFreddyTestbed_Windows_x64_v2.4.0.zip FastFreddyTestbed_Linux_x64_v2.4.0.tar.gz > SHA256SUMS.txt)
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 && gh release delete "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag || true
          gh release create "$RELEASE_TAG" release/FastFreddyTestbed_Windows_x64_v2.4.0.zip release/FastFreddyTestbed_Linux_x64_v2.4.0.tar.gz release/SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" --target "$RELEASE_SHA" \
            --title 'FastFreddyTestbed v2.4.0 — Chunk-First Macro Simulation' \
            --notes 'Implements the durable mission ledger and the chunk-first micro/macro hierarchy. Clean sleeping 64x64 chunks skip 8x8 scans; cached macro classes move full aligned solids, powders, liquids, and gases before bounded pixel edge repair. Cohesive solids require physical support. Wet sand, wet dirt, wet silt, and mud use canonical wet state; the new Sluice Box conserves eight wet-sand feed cells as one gold plus seven silt outputs when supplied by falling water. Equal-level random water hopping is removed, half-water coalesces deterministically and renders with stronger blended coverage, SWAPS and hierarchy skips return to debug, debug sampling runs every 16 frames, and unreadable 8x8 grid lines are omitted. Preserves v2.3.3 mobile life, conserved oxygen/CO2, suffocation, UI fixes, bee cycle, and all 12 Vulkan shaders. Windows/Linux C++23 Release builds, audits, contracts, packages, and SHA-256 checks passed.'

      - name: Remove temporary branch and close PR
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          TRIGGER_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          gh pr close ${{ github.event.pull_request.number }} --repo "$GITHUB_REPOSITORY" --comment 'v2.4.0 published; temporary controls removed.' || true
          git -C work push origin --delete "$TRIGGER_BRANCH" || true
