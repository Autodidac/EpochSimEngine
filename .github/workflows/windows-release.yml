name: Windows Release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: epoch-sand-windows-release
  cancel-in-progress: false

jobs:
  build-release:
    runs-on: windows-2022
    timeout-minutes: 90

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Validate shader contracts
        shell: pwsh
        run: |
          python tools/validate_shader_contracts.py
          if ($LASTEXITCODE -ne 0) { throw 'Shader contract validation failed.' }

      - name: Bootstrap vcpkg
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = Join-Path $env:RUNNER_TEMP 'vcpkg'
          git clone --filter=blob:none https://github.com/microsoft/vcpkg.git $root
          git -C $root checkout 04a735608afac5844e86fc91d6ba2112cac613c1
          & (Join-Path $root 'bootstrap-vcpkg.bat') -disableMetrics
          if ($LASTEXITCODE -ne 0) { throw 'vcpkg bootstrap failed.' }
          "VCPKG_ROOT=$root" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Configure Windows x64 Release
        shell: pwsh
        run: |
          cmake -S . -B build/windows -G 'Visual Studio 17 2022' -A x64 `
            -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake" `
            -DVCPKG_TARGET_TRIPLET=x64-windows `
            -DVCPKG_HOST_TRIPLET=x64-windows `
            -DEPOCH_SAND_WARNINGS_AS_ERRORS=ON `
            -DEPOCH_SAND_ENABLE_VALIDATION=OFF `
            -DBUILD_TESTING=ON
          if ($LASTEXITCODE -ne 0) { throw 'CMake configuration failed.' }

      - name: Build Windows x64 Release
        shell: pwsh
        run: |
          cmake --build build/windows --config Release --parallel
          if ($LASTEXITCODE -ne 0) { throw 'Windows build failed.' }

      - name: Run C++23 contract tests
        shell: pwsh
        run: |
          ctest --test-dir build/windows -C Release --output-on-failure
          if ($LASTEXITCODE -ne 0) { throw 'C++23 contract tests failed.' }

      - name: Package release
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $dist = Join-Path $env:GITHUB_WORKSPACE 'dist'
          $stage = Join-Path $dist 'EpochSand_Windows_x64_Fix22'
          $archive = Join-Path $dist 'EpochSand_Windows_x64_Fix22.zip'
          Remove-Item $dist -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Path $stage | Out-Null
          cmake --install build/windows --config Release --prefix $stage
          if ($LASTEXITCODE -ne 0) { throw 'Release staging failed.' }
          Copy-Item README.md, LICENSE -Destination $stage -Force
          @('@echo off', 'cd /d "%~dp0bin"', 'epoch_sand.exe') |
              Set-Content -LiteralPath (Join-Path $stage 'run.bat') -Encoding ascii
          Compress-Archive -Path (Join-Path $stage '*') -DestinationPath $archive -CompressionLevel Optimal
          $hash = (Get-FileHash -Algorithm SHA256 $archive).Hash.ToLowerInvariant()
          "EpochSand_Windows_x64_Fix22.zip  SHA256: $hash" |
              Set-Content -LiteralPath (Join-Path $dist 'SHA256SUMS.txt') -Encoding ascii

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: EpochSand_Windows_x64_Fix22
          path: |
            dist/EpochSand_Windows_x64_Fix22.zip
            dist/SHA256SUMS.txt
          if-no-files-found: error

      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = 'v1.0.0-fix22'
          gh release view $tag --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) {
              gh release delete $tag --repo $env:GITHUB_REPOSITORY --yes --cleanup-tag
          }
          gh release create $tag `
              dist/EpochSand_Windows_x64_Fix22.zip `
              dist/SHA256SUMS.txt `
              --repo $env:GITHUB_REPOSITORY `
              --target $env:GITHUB_SHA `
              --title 'EpochSand Windows Fix22' `
              --notes 'Verified Windows x64 C++23 build. Shader contracts and C++23 behavior/material tests passed before publication.'
          if ($LASTEXITCODE -ne 0) { throw 'GitHub Release publication failed.' }
