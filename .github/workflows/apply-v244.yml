name: Apply v2.4.4 GPU Stability Patch

on:
  push:
    branches:
      - agent/v244-gpu-stability

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout patch branch
        uses: actions/checkout@v4
        with:
          ref: agent/v244-gpu-stability
          fetch-depth: 0
      - name: Apply and validate patch
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/apply_v244.py
          rm -f .github/workflows/apply-v244.yml
          python3 tools/validate_shader_contracts.py
          c++ -std=c++23 -Iinclude tests/behavior_contract.cpp -o /tmp/epoch_behavior
          /tmp/epoch_behavior
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Bound resident GPU workload for v2.4.4"
          git push origin HEAD:agent/v244-gpu-stability
