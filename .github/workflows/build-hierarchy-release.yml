name: Build Hierarchical FastFreddy v2.1

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/build-hierarchy-release.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fastfreddy-hierarchy-v2-1
  cancel-in-progress: true

jobs:
  announce:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Record hierarchy build run
        env:
          RUN_ID: ${{ github.run_id }}
          RUN_NUMBER: ${{ github.run_number }}
          HEAD_SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          cat > hierarchy-build-status.json <<EOF
          {
            "run_id": ${RUN_ID},
            "run_number": ${RUN_NUMBER},
            "status": "running",
            "head_sha": "${HEAD_SHA}",
            "run_url": "${RUN_URL}"
          }
          EOF
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add hierarchy-build-status.json
          git commit -m 'Record hierarchy v2.1 build [skip ci]'
          git push origin HEAD:main

  windows:
    needs: announce
    runs-on: windows-2022
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Bootstrap pinned vcpkg
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = Join-Path $env:RUNNER_TEMP 'vcpkg'
          git clone --filter=blob:none https://github.com/microsoft/vcpkg.git $root
          git -C $root checkout 04a735608afac5844e86fc91d6ba2112cac613c1
          & (Join-Path $root 'bootstrap-vcpkg.bat') -disableMetrics
          "VCPKG_ROOT=$root" | Out-File -FilePath $env:GITHUB_ENV -Append
      - name: Configure Visual Studio project
        shell: pwsh
        run: cmake --preset windows -DBUILD_TESTING=ON -DEPOCH_SAND_WARNINGS_AS_ERRORS=ON
      - name: Build Release
        shell: pwsh
        run: cmake --build --preset windows-release --parallel
      - name: Run contracts
        shell: pwsh
        run: ctest --preset windows-release
      - name: Package Windows release
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $dist = Join-Path $env:GITHUB_WORKSPACE 'dist'
          $stage = Join-Path $dist 'FastFreddyHierarchy_Windows_x64'
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item 'build/windows/Release/epoch_sand.exe' $stage -Force
          Copy-Item 'build/windows/Release/shaders' $stage -Recurse -Force
          Copy-Item 'build/windows/Release/scenes' $stage -Recurse -Force
          Copy-Item 'README.md','HIERARCHICAL_SIMULATION.md','WATER_OPTIMIZATION.md','LICENSE' -Destination $stage -Force
          Set-Content -LiteralPath (Join-Path $stage 'run.bat') -Encoding ascii -Value @('@echo off','cd /d "%~dp0"','epoch_sand.exe')
          Compress-Archive -Path (Join-Path $stage '*') -DestinationPath (Join-Path $dist 'FastFreddyHierarchy_Windows_x64.zip') -CompressionLevel Optimal -Force
      - uses: actions/upload-artifact@v4
        with:
          name: fastfreddy-hierarchy-windows-x64
          path: dist/FastFreddyHierarchy_Windows_x64.zip
          if-no-files-found: error

  linux:
    needs: announce
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      CC: gcc-14
      CXX: g++-14
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build gcc-14 g++-14 pkg-config libvulkan-dev libxcb1-dev libx11-xcb-dev
      - name: Bootstrap pinned vcpkg
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/vcpkg"
          git clone --filter=blob:none https://github.com/microsoft/vcpkg.git "$root"
          git -C "$root" checkout 04a735608afac5844e86fc91d6ba2112cac613c1
          "$root/bootstrap-vcpkg.sh" -disableMetrics
          echo "VCPKG_ROOT=$root" >> "$GITHUB_ENV"
      - name: Configure Ninja build
        run: cmake --preset linux-release -DBUILD_TESTING=ON -DEPOCH_SAND_WARNINGS_AS_ERRORS=ON
      - name: Build Release
        run: cmake --build --preset linux-release --parallel
      - name: Run contracts
        run: ctest --test-dir build/linux-release --output-on-failure
      - name: Package Linux release
        run: |
          set -euo pipefail
          stage='dist/FastFreddyHierarchy_Linux_x64'
          mkdir -p "$stage"
          cp build/linux-release/epoch_sand "$stage/"
          cp -a build/linux-release/shaders "$stage/"
          cp -a build/linux-release/scenes "$stage/"
          cp README.md HIERARCHICAL_SIMULATION.md WATER_OPTIMIZATION.md LICENSE "$stage/"
          cat > "$stage/run.sh" <<'SCRIPT'
          #!/usr/bin/env bash
          set -euo pipefail
          cd "$(dirname "$0")"
          exec ./epoch_sand
          SCRIPT
          chmod +x "$stage/run.sh"
          tar -C dist -czf dist/FastFreddyHierarchy_Linux_x64.tar.gz FastFreddyHierarchy_Linux_x64
      - uses: actions/upload-artifact@v4
        with:
          name: fastfreddy-hierarchy-linux-x64
          path: dist/FastFreddyHierarchy_Linux_x64.tar.gz
          if-no-files-found: error

  release:
    needs: [windows, linux]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Generate checksums
        run: |
          cd dist
          sha256sum FastFreddyHierarchy_Windows_x64.zip FastFreddyHierarchy_Linux_x64.tar.gz > SHA256SUMS.txt
      - name: Publish canonical hierarchy release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete v2.1.0 --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes >/dev/null 2>&1 || true
          gh release create v2.1.0 \
            dist/FastFreddyHierarchy_Windows_x64.zip \
            dist/FastFreddyHierarchy_Linux_x64.tar.gz \
            dist/SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title 'FastFreddy Hierarchical Simulation v2.1.0' \
            --notes 'Full FastFreddy Vulkan application with canonical per-cell storage, all-or-nothing 8x8 movable macro-cells, 64x64 dirty/active/sleeping chunks, oxygen-filled atmosphere, retained terrain and liquids, fresh-water half-units, original scenes, EpochGui controls, scene I/O, and hierarchy debug statistics.'
