name: Apply camera sky-zone correction v2

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: camera-sky-zone-v2-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  apply:
    if: github.head_ref == 'agent/finalize-missioncache-release-v253'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Move authored scene to crystal-marker row
        shell: bash
        run: |
          set -euo pipefail
          git show HEAD^:.github/workflows/apply-camera-sky-zone-v2.yml > /tmp/camera-applicator-parent.yml
          python3 - <<'PY'
          from pathlib import Path
          import textwrap

          text = Path('/tmp/camera-applicator-parent.yml').read_text(encoding='utf-8')
          marker = "          python3 - <<'PY'\n"
          start = text.index(marker) + len(marker)
          end = text.index("\n          PY", start)
          script = textwrap.dedent(text[start:end])
          exec(compile(script, 'camera-sky-zone-applicator', 'exec'))
          PY

          python3 tools/validate_no_simulation_coroutines.py
          python3 tools/validate_project_branding.py
          python3 tools/validate_mission_cache.py
          python3 tools/validate_shader_contracts.py

          cmake -S . -B build/camera-contract -G Ninja -DCMAKE_BUILD_TYPE=Release -DSANDHYBRID_BUILD_APP=OFF -DSANDHYBRID_BUILD_VULKAN_RUNTIME=OFF -DBUILD_TESTING=ON -DSANDHYBRID_WARNINGS_AS_ERRORS=ON
          cmake --build build/camera-contract --parallel
          ctest --test-dir build/camera-contract --output-on-failure

          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add include/sandhybrid/world_layout.hpp shaders/reset.comp tests/world_layout_contract.cpp src/vulkan_renderer.cpp tools/validate_shader_contracts.py missioncache.md README.md scenes/README.txt CHANGELOG.md
          git commit -m 'Move authored scenes to crystal-marker camera row'
          git push origin HEAD:${{ github.head_ref }}
