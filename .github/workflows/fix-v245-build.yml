name: Fix SandHybrid v2.4.5 Renderer Compile

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  fix:
    if: github.head_ref == 'agent/restore-zoom-remove-epoch'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout source branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Correct debug collection push constant
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('src/vulkan_renderer.cpp')
          text = path.read_text(encoding='utf-8')
          old = '.reserved = collect_debug_stats ? 1u : 0u,'
          new = '.reserved = 1u,'
          if old not in text:
              if new in text:
                  print('Compile fix already applied.')
                  raise SystemExit(0)
              raise SystemExit('Expected debug push-constant line not found')
          text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')
          PY
          python3 tools/validate_shader_contracts.py
          cmake -S . -B build/contracts -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DSANDHYBRID_BUILD_APP=OFF \
            -DSANDHYBRID_WARNINGS_AS_ERRORS=ON \
            -DBUILD_TESTING=ON
          cmake --build build/contracts --parallel
          ctest --test-dir build/contracts --output-on-failure
          rm -rf build/contracts
          if git diff --quiet; then
            echo 'No source change required.'
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/vulkan_renderer.cpp
          git commit -m 'Fix debug-stat collection compile scope'
          git push origin HEAD:${{ github.head_ref }}
