name: Quick Hierarchy Check

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/quick-hierarchy-check.yml

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Record quick-check run
        env:
          RUN_ID: ${{ github.run_id }}
          RUN_NUMBER: ${{ github.run_number }}
          HEAD_SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          cat > hierarchy-quick-status.json <<EOF
          {
            "run_id": ${RUN_ID},
            "run_number": ${RUN_NUMBER},
            "status": "running",
            "head_sha": "${HEAD_SHA}",
            "run_url": "${RUN_URL}"
          }
          EOF
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add hierarchy-quick-status.json
          git commit -m 'Record hierarchy quick check [skip ci]'
          git push origin HEAD:main
      - name: Install system validation tools
        run: |
          sudo apt-get update
          sudo apt-get install -y glslc g++-14 libvulkan-dev libxcb1-dev libx11-xcb-dev
      - name: Compile all Vulkan shaders
        run: |
          set -euo pipefail
          mkdir -p /tmp/hierarchy-shaders
          for shader in reset.comp paint.comp sunlight.comp tiles.comp chunks.comp chemistry.comp macro_move.comp move.comp actor.comp debug_stats.comp fullscreen.vert fullscreen.frag; do
            echo "Compiling $shader"
            glslc --target-env=vulkan1.2 -O -I shaders "shaders/$shader" -o "/tmp/hierarchy-shaders/$shader.spv"
          done
      - name: Compile hierarchy contracts
        run: |
          g++-14 -std=c++23 -Wall -Wextra -Wpedantic -Wconversion -Wshadow -Werror \
            -Iinclude -Ithird_party/EpochGui/include -fsyntax-only tests/material_contract.cpp
