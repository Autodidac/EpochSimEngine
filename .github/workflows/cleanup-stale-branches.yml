name: Cleanup Stale Release Branches

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/cleanup-stale-branches-trigger'

permissions:
  contents: write
  pull-requests: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Close stale PRs and delete temporary branches
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          for pr in 10 11 12 13; do
            gh pr close "$pr" --repo "$GITHUB_REPOSITORY" 2>/dev/null || true
          done
          if [[ -n "${PR_NUMBER:-}" ]]; then
            gh pr close "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" 2>/dev/null || true
          fi
          branches=(
            'agent/unpack-build-release-fix22'
            'agent/verified-fix22-release'
            'run-fix22-release'
            'trigger-fix22-release'
            'transfer/fix22-zip'
            'verify/fix22-salvage'
            'finalize-fix22'
            'release/fix22'
            'release/fix22-corrected2'
            'release/corrected-terrain'
            'cleanup-fix22'
          )
          if [[ -n "${PR_HEAD:-}" ]]; then branches+=("$PR_HEAD"); fi
          for branch in "${branches[@]}"; do
            gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/$branch" 2>/dev/null || true
          done

      - name: Remove this one-time workflow
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f .github/workflows/cleanup-stale-branches.yml
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m 'Remove one-time stale branch cleanup [skip ci]'
            git push origin HEAD:main
          fi
