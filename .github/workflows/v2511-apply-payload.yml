name: Apply Validated SandHybrid v2.5.11 Integration

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: sandhybrid-v2511-apply-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  apply:
    if: github.event.pull_request.head.ref == 'agent/v2511-world-save-rewrite'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Detect pending integration
        id: detect
        shell: bash
        run: |
          if grep -q 'project(SandHybrid VERSION 2.5.11 ' CMakeLists.txt; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
          else
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          fi

      - name: Decode and apply validated integration
        if: steps.detect.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          base64 --decode tools/apply_v2511.py.gz.b64 | gzip --decompress > /tmp/apply_v2511.py
          echo 'b639612b8a8b00ee65574797a109383155d8398faa01035be154143e168ee9f1  /tmp/apply_v2511.py' | sha256sum --check
          python3 /tmp/apply_v2511.py
          rm -f tools/apply_v2511.py.gz.b64 V2511_TRIGGER.md
          git checkout HEAD -- .github/workflows/ci-release.yml
          git checkout HEAD -- .github/workflows/v2511-save-repair.yml

      - name: Install validation tools
        if: steps.detect.outputs.changed == 'true'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build

      - name: Validate exact persistence and headless library
        if: steps.detect.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python tools/validate_shader_contracts.py
          python tools/validate_v2510_contract.py
          python tools/validate_v2511_contract.py
          python tools/validate_mission_cache.py
          cmake -S . -B build-headless -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DSANDHYBRID_BUILD_APP=OFF \
            -DSANDHYBRID_BUILD_VULKAN_RUNTIME=OFF \
            -DSANDHYBRID_WARNINGS_AS_ERRORS=ON \
            -DBUILD_TESTING=ON
          cmake --build build-headless --parallel 2
          ctest --test-dir build-headless --output-on-failure

      - name: Commit validated v2.5.11 source tree
        if: steps.detect.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          rm -rf build-headless SandHybrid-source.tar.gz SandHybrid-source.tar.gz.sha256
          git config user.name 'Autodidac Release Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'SandHybrid v2.5.11 exact world save rewrite'
          git push origin HEAD:agent/v2511-world-save-rewrite
