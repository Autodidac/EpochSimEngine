name: Complete v2.5.4 source closeout

on:
  push:
    branches: [agent/durable-structural-ground-deposits-v254]
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: complete-v254-source-closeout
  cancel-in-progress: true

jobs:
  apply:
    if: github.ref == 'refs/heads/agent/durable-structural-ground-deposits-v254' || github.head_ref == 'agent/durable-structural-ground-deposits-v254'
    runs-on: ubuntu-24.04
    timeout-minutes: 35

    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/durable-structural-ground-deposits-v254
          fetch-depth: 0

      - name: Apply validated source changes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          def workflow_python(path: str) -> str:
              text = Path(path).read_text(encoding='utf-8')
              match = re.search(r"(?ms)^ {10}python3 - <<'PY'\n(.*?)^ {10}PY$", text)
              if match is None:
                  raise SystemExit(f'Python applicator block not found in {path}')
              return '\n'.join(
                  line[10:] if line.startswith('          ') else line
                  for line in match.group(1).splitlines()
              ) + '\n'

          runtime_path = '.github/workflows/apply-v254-runtime-regressions.yml'
          runtime = workflow_python(runtime_path)
          old_v2 = '''v2_path = Path('.github/workflows/apply-durable-structural-ground-deposits-v2.yml')
          v2_text = v2_path.read_text(encoding='utf-8')
          marker = "          python3 - <<'PY'\\n"
          start = v2_text.index(marker) + len(marker)
          end = v2_text.index("\\n          PY", start)
          exec(compile(textwrap.dedent(v2_text[start:end]), str(v2_path), 'exec'))
          '''
          new_v2 = '''v2_path = Path('.github/workflows/apply-durable-structural-ground-deposits-v2.yml')
          v2_text = v2_path.read_text(encoding='utf-8')
          v2_match = re.search(r"(?ms)^ {10}python3 - <<'PY'\\n(.*?)^ {10}PY$", v2_text)
          if v2_match is None:
              raise SystemExit('v2 Python applicator block not found')
          v2_script = '\\n'.join(
              line[10:] if line.startswith('          ') else line
              for line in v2_match.group(1).splitlines()
          ) + '\\n'
          exec(compile(v2_script, str(v2_path), 'exec'))
          '''
          if old_v2 not in runtime:
              raise SystemExit('nested v2 extraction block not found')
          runtime = runtime.replace(old_v2, new_v2, 1)
          exec(compile(runtime, runtime_path, 'exec'))

          final_path = '.github/workflows/apply-v254-final-closeout.yml'
          final = workflow_python(final_path)
          staged_pattern = re.compile(
              r"# Apply the staged structural/geology, wet-sand, bee-home, Fix28-load,\n"
              r"# water-edge, atmosphere-edge, mission-cache, and v2\.5\.4 metadata work\.\n"
              r"staged = Path\('\.github/workflows/apply-v254-runtime-regressions\.yml'\)\n"
              r"if staged\.exists\(\):\n(?:    .*\n)+?\n"
              r"# Repair the two validator insertions",
              re.M,
          )
          final, removed = staged_pattern.subn(
              '# Repair the two validator insertions', final, count=1)
          if removed != 1:
              raise SystemExit(f'final staged block removal count was {removed}')
          exec(compile(final, final_path, 'exec'))

          validator_path = Path('tools/validate_shader_contracts.py')
          validator = validator_path.read_text(encoding='utf-8')
          validator = validator.replace('\n  errors.append(', '\n            errors.append(')
          scene_anchor = '    scene_image_cpp = (ROOT / "src/scene_image.cpp").read_text(encoding="utf-8")\n'
          if '    move = (SHADERS / "move.comp").read_text(encoding="utf-8")\n' not in validator:
              if scene_anchor not in validator:
                  raise SystemExit('validator scene-image anchor missing')
              validator = validator.replace(
                  scene_anchor,
                  scene_anchor
                  + '    move = (SHADERS / "move.comp").read_text(encoding="utf-8")\n'
                  + '    tiles = (SHADERS / "tiles.comp").read_text(encoding="utf-8")\n',
                  1,
              )
          validator = validator.replace(
              '             "active_scope_mode"],',
              '             "active_scope_mode", "camera_controls"],',
              1,
          )
          validator = validator.replace(
              '             "activeScopeMode"],',
              '             "activeScopeMode", "cameraControls"],',
              1,
          )
          validator = validator.replace('        "edge_band_pixels = 28",\n', '', 1)
          validator_path.write_text(validator, encoding='utf-8')

          scene_path = Path('src/scene_image.cpp')
          scene = scene_path.read_text(encoding='utf-8')
          scene_pattern = re.compile(
              r'(?ms)^(?P<i>\s*)const auto material = fix28_beehive_material\(\n'
              r'\s*offset_x, offset_y, hash32\(static_cast<std::uint32_t>\(index\) \^ 0xb33u\)\);\n'
              r'\s*if \(material != Material::count\)\n'
              r'\s*materials\[index\] = static_cast<std::uint32_t>\(material\);'
          )
          def preserve_bees(match: re.Match[str]) -> str:
              i = match.group('i')
              return (
                  f'{i}const auto material = fix28_beehive_material(\n'
                  f'{i}    offset_x, offset_y, hash32(static_cast<std::uint32_t>(index) ^ 0xb33u));\n'
                  f'{i}if (material == Material::count) continue;\n'
                  f'{i}const auto existing = static_cast<Material>(materials[index]);\n'
                  f'{i}if (existing == Material::bee || existing == Material::ant ||\n'
                  f'{i}    existing == Material::beetle)\n'
                  f'{i}    continue;\n'
                  f'{i}if (material == Material::empty) {{\n'
                  f'{i}    if (legacy_hive_material(existing))\n'
                  f'{i}        materials[index] = static_cast<std::uint32_t>(Material::empty);\n'
                  f'{i}}} else if (existing == Material::empty || legacy_hive_material(existing)) {{\n'
                  f'{i}    materials[index] = static_cast<std::uint32_t>(material);\n'
                  f'{i}}}'
              )
          scene, scene_count = scene_pattern.subn(preserve_bees, scene, count=1)
          if scene_count != 1:
              raise SystemExit(f'loaded Fix28 bee-preservation replacement count was {scene_count}')
          scene_path.write_text(scene, encoding='utf-8')

          test_path = Path('tests/scene_image_contract.cpp')
          test = test_path.read_text(encoding='utf-8')
          test = test.replace(
              'constexpr std::uint32_t bee_target_none = 0xffffu;\n',
              'constexpr std::uint32_t bee_target_none = 0xffffu;\n'
              'constexpr std::uint32_t bee_authored_home_slot_bit = 0x80u;\n',
              1,
          )
          test_pattern = re.compile(
              r'(?m)^(?P<i>\s*)const auto slot = \(bee\.aux >> 15u\) & 255u;\n'
              r'\s*if \(home_x != queen_x \|\| home_y != queen_y \|\| slot != expected_slot\) return 6;'
          )
          def test_replacement(match: re.Match[str]) -> str:
              i = match.group('i')
              return (
                  f'{i}const auto packed_slot = (bee.aux >> 15u) & 255u;\n'
                  f'{i}if ((packed_slot & bee_authored_home_slot_bit) == 0u) return 6;\n'
                  f'{i}const auto slot = packed_slot & 127u;\n'
                  f'{i}if (home_x != queen_x || home_y != queen_y || slot != expected_slot) return 6;'
              )
          test, test_count = test_pattern.subn(test_replacement, test, count=1)
          if test_count != 1:
              raise SystemExit(f'scene-image bee metadata test replacement count was {test_count}')
          test_path.write_text(test, encoding='utf-8')

          Path('.github/workflows/trigger-v254-final-closeout.yml').unlink(missing_ok=True)
          PY

          python3 tools/generate_ui_text.py
          python3 -m py_compile tools/validate_shader_contracts.py
          python3 tools/validate_no_simulation_coroutines.py
          python3 tools/validate_project_branding.py
          python3 tools/validate_mission_cache.py
          python3 tools/validate_shader_contracts.py

          cmake -S . -B build/v254-final -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DSANDHYBRID_BUILD_APP=OFF \
            -DSANDHYBRID_BUILD_VULKAN_RUNTIME=OFF \
            -DBUILD_TESTING=ON \
            -DSANDHYBRID_WARNINGS_AS_ERRORS=ON
          cmake --build build/v254-final --parallel
          ctest --test-dir build/v254-final --output-on-failure

          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'Complete v2.5.4 controls, settling, and mission closeout'
          git push origin HEAD:agent/durable-structural-ground-deposits-v254
