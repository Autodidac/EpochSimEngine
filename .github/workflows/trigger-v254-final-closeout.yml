name: Trigger v2.5.4 final closeout
# Push-triggered so the branch can finish its own one-shot closeout.

on:
  push:
    branches: [agent/durable-structural-ground-deposits-v254]
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: trigger-v254-final-closeout
  cancel-in-progress: true

jobs:
  apply:
    if: github.ref == 'refs/heads/agent/durable-structural-ground-deposits-v254' || github.head_ref == 'agent/durable-structural-ground-deposits-v254'
    runs-on: ubuntu-24.04
    timeout-minutes: 35

    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/durable-structural-ground-deposits-v254
          fetch-depth: 0

      - name: Run final closeout applicator
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          workflow = Path('.github/workflows/apply-v254-final-closeout.yml')
          text = workflow.read_text(encoding='utf-8')
          old = '''              marker = "          python3 - <<'PY'\\n"
              start = staged_text.index(marker) + len(marker)
              end = staged_text.index("\\n          PY", start)
              exec(compile(textwrap.dedent(staged_text[start:end]), str(staged), 'exec'))
'''
          new = '''              staged_match = re.search(
                  r"(?ms)^ {10}python3 - <<'PY'\\n(.*?)^ {10}PY$", staged_text)
              if staged_match is None:
                  raise SystemExit('staged runtime Python block not found')
              exec(compile(textwrap.dedent(staged_match.group(1)), str(staged), 'exec'))
'''
          if old not in text:
              raise SystemExit('final closeout staged-extraction marker missing')
          text = text.replace(old, new, 1)

          marker = '        run: |\n'
          start = text.index(marker) + len(marker)
          lines = text[start:].splitlines()
          script = '\n'.join(line[10:] if line.startswith('          ') else line for line in lines) + '\n'
          Path('/tmp/v254-final-closeout.sh').write_text(script, encoding='utf-8')
          PY
          rm .github/workflows/trigger-v254-final-closeout.yml
          bash /tmp/v254-final-closeout.sh
