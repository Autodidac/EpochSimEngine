name: Run Hierarchy Patch

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/run-hierarchy-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Record patch run
        env:
          RUN_ID: ${{ github.run_id }}
          RUN_NUMBER: ${{ github.run_number }}
          HEAD_SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          cat > hierarchy-patch-status.json <<EOF
          {
            "run_id": ${RUN_ID},
            "run_number": ${RUN_NUMBER},
            "status": "running",
            "head_sha": "${HEAD_SHA}",
            "run_url": "${RUN_URL}"
          }
          EOF
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add hierarchy-patch-status.json
          git commit -m 'Record hierarchy patch run [skip ci]'
          git push origin HEAD:main
      - name: Apply hierarchy implementation
        run: python3 .github/scripts/run_hierarchy_patch.py
      - name: Commit hierarchy implementation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add CMakeLists.txt README.md HIERARCHICAL_SIMULATION.md include src shaders tests
          git commit -m 'Add movable macro-cells and sleeping chunks'
          git pull --rebase origin main
          git push origin HEAD:main

# trigger 7
