name: Run Hierarchy Patch

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/run-hierarchy-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Record patch run
        env:
          RUN_ID: ${{ github.run_id }}
          RUN_NUMBER: ${{ github.run_number }}
          HEAD_SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          cat > hierarchy-patch-status.json <<EOF
          {
            "run_id": ${RUN_ID},
            "run_number": ${RUN_NUMBER},
            "status": "running",
            "head_sha": "${HEAD_SHA}",
            "run_url": "${RUN_URL}"
          }
          EOF
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add hierarchy-patch-status.json
          git commit -m 'Record hierarchy patch run [skip ci]'
          git push origin HEAD:main
      - name: Extract committed patch program
        run: |
          python3 - <<'PY'
          from pathlib import Path
          source = Path('.github/workflows/apply-hierarchical-simulation.yml').read_text(encoding='utf-8')
          begin_marker = "          cat > /tmp/apply_hierarchy.py <<'PY'\n"
          end_marker = "          PY\n          python3 /tmp/apply_hierarchy.py\n"
          begin = source.index(begin_marker) + len(begin_marker)
          end = source.index(end_marker, begin)
          lines = source[begin:end].splitlines()
          stripped = '\n'.join(line[10:] if line.startswith('          ') else line for line in lines) + '\n'
          brittle = "def replace(path: str, old: str, new: str, count: int = 1) -> None:\n    text = read(path)\n    if old not in text:\n        raise RuntimeError(f'missing replacement marker in {path}: {old[:120]!r}')\n    text = text.replace(old, new, count)\n    write(path, text)\n"
          tolerant = "def replace(path: str, old: str, new: str, count: int = 1) -> None:\n    import re\n    text = read(path)\n    if old in text:\n        write(path, text.replace(old, new, count))\n        return\n    pieces = re.split(r'(\\s+)', old)\n    pattern = ''.join(r'\\s+' if piece.isspace() else re.escape(piece) for piece in pieces if piece)\n    matches = list(re.finditer(pattern, text, flags=re.MULTILINE))\n    if len(matches) < count:\n        raise RuntimeError(f'missing replacement marker in {path}: {old[:120]!r}')\n    for match in reversed(matches[:count]):\n        text = text[:match.start()] + new + text[match.end():]\n    write(path, text)\n"
          if brittle not in stripped:
              raise RuntimeError('Unable to replace brittle patch helper')
          stripped = stripped.replace(brittle, tolerant, 1)
          Path('/tmp/apply_hierarchy.py').write_text(stripped, encoding='utf-8')
          PY
      - name: Apply hierarchy implementation
        run: python3 /tmp/apply_hierarchy.py
      - name: Commit hierarchy implementation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add CMakeLists.txt README.md HIERARCHICAL_SIMULATION.md include src shaders tests
          git commit -m 'Add movable macro-cells and sleeping chunks'
          git pull --rebase origin main
          git push origin HEAD:main

