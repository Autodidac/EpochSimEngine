name: Fix v2.5.9 constexpr workspace bounds

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: fix-v259-workspace-bounds-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  fix:
    if: github.head_ref == 'agent/v259-macro-water-volcano-pressure'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/v259-macro-water-volcano-pressure
          fetch-depth: 0

      - name: Replace non-constexpr EpochGui hit tests
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('include/sandhybrid/ui_layout.hpp')
          text = path.read_text(encoding='utf-8')
          old = '''[[nodiscard]] inline constexpr std::uint32_t workspace_at(
              const Layout& layout, const epochengine::gui_lib::Vec2 point) noexcept {
              if (epochengine::gui_lib::contains(layout.workspace_inventory, point)) return 0u;
              if (epochengine::gui_lib::contains(layout.workspace_editor, point)) return 1u;
              if (epochengine::gui_lib::contains(layout.workspace_settings, point)) return 2u;
              if (epochengine::gui_lib::contains(layout.workspace_designer, point)) return 3u;
              return workspace_tab_count;
          }
          '''
          new = '''[[nodiscard]] inline constexpr bool contains_workspace_point(
              const epochengine::gui_lib::Rect& rect,
              const epochengine::gui_lib::Vec2 point) noexcept {
              return point.x >= rect.position.x &&
                     point.x <= rect.position.x + rect.size.x &&
                     point.y >= rect.position.y &&
                     point.y <= rect.position.y + rect.size.y;
          }

          [[nodiscard]] inline constexpr std::uint32_t workspace_at(
              const Layout& layout, const epochengine::gui_lib::Vec2 point) noexcept {
              if (contains_workspace_point(layout.workspace_inventory, point)) return 0u;
              if (contains_workspace_point(layout.workspace_editor, point)) return 1u;
              if (contains_workspace_point(layout.workspace_settings, point)) return 2u;
              if (contains_workspace_point(layout.workspace_designer, point)) return 3u;
              return workspace_tab_count;
          }
          '''
          if old not in text:
              if new in text:
                  raise SystemExit(0)
              raise SystemExit('workspace_at block not found')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Validate fresh headless contracts
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/validate_shader_contracts.py
          python3 tools/validate_mission_cache.py
          cmake -S . -B build/v259-workspace-bounds -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DSANDHYBRID_BUILD_APP=OFF \
            -DSANDHYBRID_BUILD_VULKAN_RUNTIME=OFF \
            -DSANDHYBRID_WARNINGS_AS_ERRORS=ON \
            -DBUILD_TESTING=ON
          cmake --build build/v259-workspace-bounds --parallel
          ctest --test-dir build/v259-workspace-bounds --output-on-failure

      - name: Commit permanent source fix
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- include/sandhybrid/ui_layout.hpp; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add include/sandhybrid/ui_layout.hpp
          git commit -m 'Make workspace bounds checks constexpr'
          git push origin HEAD:agent/v259-macro-water-volcano-pressure
