name: Fix SandHybrid v2.4.7 ledge shader

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  fix:
    if: github.head_ref == 'agent/fix-half-water-tiles-sluice-debug'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Correct solid ledge predicate
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('shaders/move.comp')
          text = path.read_text(encoding='utf-8')
          old = '(isCellSolid(below) && !isCellLiquid(below) && !isCellGas(below));'
          new = '(isBlockCapable(below.material) && !isCellLiquid(below) && !isCellGas(below));'
          if old in text:
              path.write_text(text.replace(old, new, 1), encoding='utf-8')
          elif new not in text:
              raise SystemExit('Expected ledge predicate not found')
          PY
          python3 tools/validate_shader_contracts.py
          cmake -S . -B build/contracts -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DSANDHYBRID_BUILD_APP=OFF \
            -DSANDHYBRID_WARNINGS_AS_ERRORS=ON \
            -DBUILD_TESTING=ON
          cmake --build build/contracts --parallel
          ctest --test-dir build/contracts --output-on-failure
          rm -rf build/contracts
          if git diff --quiet; then
            echo 'Shader fix already applied.'
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add shaders/move.comp
          git commit -m 'Fix half-water solid ledge shader predicate'
          git push origin HEAD:${{ github.head_ref }}
