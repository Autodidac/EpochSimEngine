name: Apply SandHybrid v2.5.10 repair

on:
  push:
    branches: [main]

permissions:
  contents: write
  actions: write

jobs:
  repair-main:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Extract canonical repair script
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          workflow = Path('.github/workflows/repair-v2510b.yml').read_text(encoding='utf-8')
          marker = "          python3 - <<'PY'\n"
          start = workflow.index(marker) + len(marker)
          end = workflow.index("\n          PY\n", start)
          block = workflow[start:end]
          lines = []
          for line in block.splitlines():
              lines.append(line[10:] if line.startswith('          ') else line)
          Path('/tmp/repair_v2510.py').write_text('\n'.join(lines) + '\n', encoding='utf-8')
          PY

      - name: Apply source corrections
        run: python3 /tmp/repair_v2510.py

      - name: Install validation tools
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build glslc

      - name: Validate source and shaders
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/validate_mission_cache.py
          python3 tools/validate_v2510_contract.py
          for shader in reset.comp tiles.comp macro_move.comp move.comp actor.comp fullscreen.frag; do
            glslc --target-env=vulkan1.2 -I shaders "shaders/$shader" -o "/tmp/$shader.spv"
          done
          cmake -S . -B build-headless -G Ninja \
            -DSANDHYBRID_BUILD_APP=OFF \
            -DSANDHYBRID_BUILD_VULKAN_RUNTIME=OFF \
            -DSANDHYBRID_WARNINGS_AS_ERRORS=ON \
            -DBUILD_TESTING=ON
          cmake --build build-headless --parallel 2
          ctest --test-dir build-headless --output-on-failure

      - name: Commit validated v2.5.10 source
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/repair-main-v2510.yml
          git config user.name "Autodidac Release Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "SandHybrid v2.5.10 terrain liquid and fracture recovery"
          git push origin HEAD:main

      - name: Dispatch full package and release validation
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run ci-release.yml --ref main
