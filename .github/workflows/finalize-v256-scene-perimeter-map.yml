name: Finalize v2.5.6 aligned scene and clean map

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: finalize-v256-scene-perimeter-map-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  finalize:
    if: github.head_ref == 'agent/debug-map-inventory-v256'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/debug-map-inventory-v256
          fetch-depth: 0

      - name: Apply screenshot-driven scene, shell, and map fixes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          import textwrap

          def replace_once(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one marker, found {count}: {old[:180]!r}')
              file.write_text(text.replace(old, new, 1), encoding='utf-8')

          replace_once(
              'include/sandhybrid/world_layout.hpp',
              '''    // Preserve the original 4x4-world scene coordinate while the world grows
    // only to the right. Smaller compatibility worlds remain centered.
    constexpr auto preserved_origin = pre_expansion_world_width * 3u / 2u;
''',
              '''    // A complete authored scene occupies exactly one 640-cell camera region.
    // The 16x4 world still grows only to the right; the scene begins at region 2.
    constexpr auto preserved_origin = pre_expansion_world_width * 2u;
''')

          replace_once(
              'include/sandhybrid/world_layout.hpp',
              '''    const auto horizontal_shell = (std::min)(world_width, resident_world_shell_cells);
    const bool side_shell = x < horizontal_shell || x >= world_width - horizontal_shell;
    if (y < scene_top) return Material::empty;

    const auto scene_height = scene_bottom - scene_top;
    const auto foundation = (std::min)(scene_height, authored_scene_foundation_cells);
    const auto foundation_start = scene_bottom - foundation;
    if (y < scene_bottom) {
        if (y >= foundation_start || side_shell) return Material::stone;
        return Material::empty;
    }
    if (side_shell) return Material::stone;

    const auto bottom_shell = (std::min)(world_height, resident_world_shell_cells);
''',
              '''    const auto horizontal_shell = (std::min)(world_width, resident_world_shell_cells);
    const auto top_shell = (std::min)(world_height, resident_world_shell_cells);
    const bool side_shell = x < horizontal_shell || x >= world_width - horizontal_shell;
    if (side_shell || y < top_shell) return Material::stone;
    if (y < scene_top) return Material::empty;

    const auto scene_height = scene_bottom - scene_top;
    const auto foundation = (std::min)(scene_height, authored_scene_foundation_cells);
    const auto foundation_start = scene_bottom - foundation;
    if (y < scene_bottom) {
        if (y >= foundation_start) return Material::stone;
        return Material::empty;
    }

    const auto bottom_shell = (std::min)(world_height, resident_world_shell_cells);
''')

          replace_once(
              'shaders/reset.comp',
              '''    int x = int(pc.width) >= 1600 ? 960 :
        max((int(pc.width) - AUTHORED_WORLD_CELLS.x) / 2, 0);
''',
              '''    int x = int(pc.width) >= AUTHORED_WORLD_CELLS.x * 3
        ? AUTHORED_WORLD_CELLS.x * 2
        : max((int(pc.width) - AUTHORED_WORLD_CELLS.x) / 2, 0);
''')

          replace_once(
              'shaders/bee_swarm.glsl',
              '''    int originX = int(width) >= 1600 ? 960 :
        max((int(width) - BEE_AUTHORED_WORLD_CELLS.x) / 2, 0);
''',
              '''    int originX = int(width) >= BEE_AUTHORED_WORLD_CELLS.x * 3
        ? BEE_AUTHORED_WORLD_CELLS.x * 2
        : max((int(width) - BEE_AUTHORED_WORLD_CELLS.x) / 2, 0);
''')

          replace_once(
              'shaders/reset.comp',
              '''    int horizontalShell = min(width, BRICK_SIZE);
    bool sideShell = worldPosition.x < horizontalShell ||
                     worldPosition.x >= width - horizontalShell;
    if (worldPosition.y < sceneTop) return MAT_EMPTY;

    int foundation = min(sceneBottom - sceneTop, BRICK_SIZE);
    int foundationStart = sceneBottom - foundation;
    if (worldPosition.y < sceneBottom) {
        if (worldPosition.y >= foundationStart || sideShell) return MAT_STONE;
        return MAT_EMPTY;
    }
    if (sideShell) return MAT_STONE;

    int bottomShell = min(height, BRICK_SIZE);
''',
              '''    int horizontalShell = min(width, BRICK_SIZE);
    int topShell = min(height, BRICK_SIZE);
    bool sideShell = worldPosition.x < horizontalShell ||
                     worldPosition.x >= width - horizontalShell;
    if (sideShell || worldPosition.y < topShell) return MAT_STONE;
    if (worldPosition.y < sceneTop) return MAT_EMPTY;

    int foundation = min(sceneBottom - sceneTop, BRICK_SIZE);
    int foundationStart = sceneBottom - foundation;
    if (worldPosition.y < sceneBottom) {
        if (worldPosition.y >= foundationStart) return MAT_STONE;
        return MAT_EMPTY;
    }

    int bottomShell = min(height, BRICK_SIZE);
''')

          reset_path = Path('shaders/reset.comp')
          reset = reset_path.read_text(encoding='utf-8')
          wall_pattern = re.compile(
              r'^\s*if \(\(b\.x == 0 \|\| b\.x == world\.x - 1\) && b\.y >= 2\) '
              r'material = MAT_[A-Z0-9_]+;\n', re.M)
          reset, removed = wall_pattern.subn('', reset)
          if removed < 3:
              raise SystemExit(f'expected at least three generic authored side walls, removed {removed}')
          reset_path.write_text(reset, encoding='utf-8')

          fullscreen_path = Path('shaders/fullscreen.frag')
          fullscreen = fullscreen_path.read_text(encoding='utf-8')
          fullscreen = fullscreen.replace(
              'if (!activeArea) color.rgb *= renderPc.mapMode != 0u ? 0.62 : 0.52;',
              'if (!activeArea) color.rgb *= renderPc.mapMode != 0u ? 0.82 : 0.52;', 1)
          fullscreen = fullscreen.replace(
              'float boundaryAlpha = renderPc.mapMode != 0u ? 0.38 : 0.58;',
              'float boundaryAlpha = renderPc.mapMode != 0u ? 0.22 : 0.58;', 1)
          outer = fullscreen.index('    if (renderPc.debugMode != 0u || renderPc.mapMode != 0u) {')
          start = fullscreen.index('        TileState tile = tileAt(grid);', outer)
          camera = fullscreen.index(
              '        if (renderPc.mapMode != 0u) {\n            uint cameraRight', start)
          debug_body = fullscreen[start:camera]
          debug_body = debug_body.replace(
              'if (readableTileGrid && (local.x == 0 || local.y == 0))',
              'if (readableTileGrid && !mediumCell && (local.x == 0 || local.y == 0))')
          debug_body = debug_body.replace(
              'if (chunkLocal.x == 0 || chunkLocal.y == 0)',
              'if (!mediumCell && (chunkLocal.x == 0 || chunkLocal.y == 0))')
          old_medium = '''        bool stateEdge = local.x <= 1 || local.y <= 1 || local.x >= 6 || local.y >= 6;
        if (renderPc.mapMode != 0u) {
            alpha *= mediumCell ? (stateEdge ? 0.055 : 0.0) : 0.30;
            if (!mediumCell && !stateEdge) alpha *= 0.16;
        } else if (mediumCell) {
            alpha *= stateEdge ? 0.10 : 0.0;
        }
'''
          new_medium = '''        bool stateEdge = local.x <= 1 || local.y <= 1 || local.x >= 6 || local.y >= 6;
        bool mediumMarker = local.x == 0 && local.y == 0;
        if (mediumCell) alpha *= mediumMarker ? 0.16 : 0.0;
'''
          if old_medium not in debug_body:
              raise SystemExit('medium debug marker block missing')
          debug_body = debug_body.replace(old_medium, new_medium, 1)
          old_chunk = '''        float chunkAlpha = renderPc.mapMode != 0u
            ? (mediumCell ? 0.0 : 0.045)
            : (mediumCell ? 0.0 : (chunkHas(chunk, CHUNK_SLEEPING) ? 0.10 : 0.06));
'''
          new_chunk = '''        float chunkAlpha = mediumCell ? 0.0
            : (chunkHas(chunk, CHUNK_SLEEPING) ? 0.10 : 0.06);
'''
          if old_chunk not in debug_body:
              raise SystemExit('chunk debug marker block missing')
          debug_body = debug_body.replace(old_chunk, new_chunk, 1)
          wrapped = ('        if (renderPc.debugMode != 0u && renderPc.mapMode == 0u) {\n' +
                     textwrap.indent(debug_body, '    ') +
                     '        }\n\n')
          fullscreen = fullscreen[:start] + wrapped + fullscreen[camera:]
          fullscreen_path.write_text(fullscreen, encoding='utf-8')

          world_test = Path('tests/world_layout_contract.cpp')
          text = world_test.read_text(encoding='utf-8')
          text = text.replace(
              'static_assert(authored_scene_origin_x(resident_world_width) == 960u);',
              'static_assert(authored_scene_origin_x(resident_world_width) == 1280u);', 1)
          anchor = 'static_assert(authored_scene_sky_footprint_rows == 2u);\n'
          additions = '''static_assert(authored_scene_origin_x(resident_world_width) % pre_expansion_world_width == 0u);
static_assert(resident_substrate_material(resident_world_width, resident_world_height, 0u, 0u) == Material::stone);
static_assert(resident_substrate_material(resident_world_width, resident_world_height, 5000u, 100u) == Material::empty);
static_assert(resident_substrate_material(resident_world_width, resident_world_height, 5000u, 1079u) == Material::stone);
'''
          if additions not in text:
              if anchor not in text:
                  raise SystemExit('world-layout test anchor missing')
              text = text.replace(anchor, anchor + additions, 1)
          world_test.write_text(text, encoding='utf-8')

          spawn_test = Path('tests/scene_spawn_contract.cpp')
          text = spawn_test.read_text(encoding='utf-8')
          replacements = {
              'authored_scene_origin_x(resident_world_width) == 960u':
                  'authored_scene_origin_x(resident_world_width) == 1280u',
              'SceneSpawn{1038, 847, 18u, true}': 'SceneSpawn{1358, 847, 18u, true}',
              'SceneSpawn{1040, 1044, 12u, true}': 'SceneSpawn{1360, 1044, 12u, true}',
              'SceneSpawn{1128, 920, 24u, true}': 'SceneSpawn{1448, 920, 24u, true}',
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f'spawn test marker missing: {old}')
              text = text.replace(old, new, 1)
          spawn_test.write_text(text, encoding='utf-8')

          validator = Path('tools/validate_shader_contracts.py')
          text = validator.read_text(encoding='utf-8')
          text = text.replace(
              '"mediumCell ? 0.0 : 0.045"):',
              '"renderPc.debugMode != 0u && renderPc.mapMode == 0u",\n                  "mediumMarker ? 0.16 : 0.0"):', 1)
          marker = '''    reset_shader = (SHADERS / "reset.comp").read_text(encoding="utf-8")
'''
          checks = '''    world_layout_hpp = (ROOT / "include/sandhybrid/world_layout.hpp").read_text(encoding="utf-8")
    bee_swarm_glsl = (SHADERS / "bee_swarm.glsl").read_text(encoding="utf-8")
    for token in (
        "pre_expansion_world_width * 2u",
        "AUTHORED_WORLD_CELLS.x * 2",
        "BEE_AUTHORED_WORLD_CELLS.x * 2",
        "sideShell || worldPosition.y < topShell",
        "renderPc.debugMode != 0u && renderPc.mapMode == 0u",
    ):
        if token not in world_layout_hpp + reset_shader + bee_swarm_glsl + fullscreen:
            errors.append(f"aligned scene/perimeter/map contract missing {token!r}")
    if re.search(r"b\\.x == 0 \\|\\| b\\.x == world\\.x - 1", reset_shader):
        errors.append("authored scene-local side wall remains")
'''
          if checks not in text:
              if marker not in text:
                  raise SystemExit('validator reset marker missing')
              text = text.replace(marker, marker + checks, 1)
          validator.write_text(text, encoding='utf-8')

          mission = Path('missioncache.md')
          text = mission.read_text(encoding='utf-8')
          text = text.replace(
              'MC-119, MC-120, and MC-122.',
              'MC-119, MC-120, MC-122, and MC-123.', 1)
          text, count = re.subn(
              r'^\| MC-121 \|.*$',
              '| MC-121 | PARTIAL | Independent slow-refresh fullscreen debug map | MAP renders the complete 10240x1440 resident world from a separate 4 Hz snapshot, independent from simulation LOD and the main camera. It owns separate pan/zoom state, defaults to the true 64:9 full frame, shades inactive regions lightly, draws only restrained 640x360 active-region outlines plus the live main-camera rectangle, and never paints per-tile/per-chunk debug checkerboards over the map. Moving the map never changes scheduling. Static contracts pass; packaged clarity/refresh acceptance remains required. |',
              text, count=1, flags=re.M)
          if count != 1:
              raise SystemExit(f'MC-121 replacement count was {count}')
          scene_header = '''| MC-116 | PARTIAL | Canonical backlog and one brief changelog | `missioncache.md` contains each unfinished requirement once with priority and acceptance criteria, not per-release prose. `CHANGELOG.md` is the only release-history file. Versioned release-note files, one-shot patch payloads, obsolete workflows, and completed agent branches are removed before publication. CI validates the cache and release tree. |
'''
          new_row = '| MC-123 | PARTIAL | Single-region authored scene and perimeter-only world shell | The complete 640x360 authored scene begins at aligned region origin `(1280,720)` and never straddles a camera-region boundary. Scene generation, camera reset, player spawns, bee homes, loaded-scene offsets, saves, and metadata use that same origin. Generic scene-local side walls are removed; the foundation remains continuous across the full world width; only the outer world perimeter shell remains. Static CPU/GLSL/spawn/map contracts pass; packaged scene-cycle and map observation remain required. |\n'
          if new_row not in text:
              if scene_header not in text:
                  raise SystemExit('MC-116 insertion marker missing')
              text = text.replace(scene_header, scene_header + new_row, 1)
          mission.write_text(text, encoding='utf-8')

          release_notes = Path('RELEASE_NOTES_v2.5.6.md')
          text = release_notes.read_text(encoding='utf-8')
          text = text.replace('world origin `(960,720)`', 'aligned region origin `(1280,720)`', 1)
          scene_note = '- Removes generic authored-scene side walls, extends the foundation continuously across the resident world, and retains walls only on the outer world perimeter.\n'
          map_note = '- Keeps MAP readable by suppressing per-tile/per-chunk debug checkerboards there; only restrained active-region and main-camera outlines remain.\n'
          anchor = '- Updates generated scenes, saved-scene offsets, bee homes, camera reset, scene metadata, and Gold Mine/Demolition/Frontier Base player spawns to that preserved coordinate system.\n'
          if scene_note not in text:
              text = text.replace(anchor, anchor + scene_note + map_note, 1)
          release_notes.write_text(text, encoding='utf-8')

          map_doc = Path('MAP_VIEW.md')
          text = map_doc.read_text(encoding='utf-8')
          text = text.replace(
              '- The live main-camera rectangle is drawn separately from the contiguous 4x4 simulation-active window.\n',
              '- The live main-camera rectangle is drawn separately from restrained 640x360 outlines around the contiguous 4x4 simulation-active window; tile/chunk checkerboard overlays are disabled in MAP.\n', 1)
          map_doc.write_text(text, encoding='utf-8')

          changelog = Path('CHANGELOG.md')
          text = changelog.read_text(encoding='utf-8')
          notes = (
              '- Aligned the complete authored scene to camera region origin `(1280,720)`, migrating camera reset, player spawns, bee homes, save offsets, and generated-scene metadata together.\n'
              '- Removed generic internal scene-side walls, kept a continuous full-width foundation, and limited the world shell to the outer perimeter.\n'
              '- Removed tile/chunk checkerboard status paint from MAP and reduced stable Water/Atmosphere debug status to one restrained marker per 8x8 tile.\n'
          )
          marker = '## 2.5.6\n\n'
          if notes not in text:
              text = text.replace(marker, marker + notes, 1)
          changelog.write_text(text, encoding='utf-8')
          PY

      - name: Validate shader, world, spawn, map, and headless contracts
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile tools/validate_shader_contracts.py
          python3 tools/validate_shader_contracts.py
          python3 tools/validate_mission_cache.py
          python3 tools/validate_no_simulation_coroutines.py
          python3 tools/validate_project_branding.py
          cmake -S . -B build/scene-perimeter-map -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DSANDHYBRID_BUILD_APP=OFF \
            -DSANDHYBRID_BUILD_VULKAN_RUNTIME=OFF \
            -DSANDHYBRID_WARNINGS_AS_ERRORS=ON \
            -DBUILD_TESTING=ON
          cmake --build build/scene-perimeter-map --parallel
          ctest --test-dir build/scene-perimeter-map --output-on-failure

      - name: Commit permanent fix and remove workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm -f .github/workflows/finalize-v256-scene-perimeter-map.yml
          git add -A
          git commit -m 'Align authored scene and clean map diagnostics'
          git push origin HEAD:agent/debug-map-inventory-v256
