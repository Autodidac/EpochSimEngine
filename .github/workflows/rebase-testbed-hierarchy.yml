name: Rebase Testbed Hierarchy

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/rebase-testbed-hierarchy.yml

permissions:
  contents: write

jobs:
  rebase:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Record run
        env:
          RUN_ID: ${{ github.run_id }}
          RUN_NUMBER: ${{ github.run_number }}
          HEAD_SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          cat > hierarchy-rebase-status.json <<EOF
          {
            "run_id": ${RUN_ID},
            "run_number": ${RUN_NUMBER},
            "status": "running",
            "head_sha": "${HEAD_SHA}",
            "run_url": "${RUN_URL}"
          }
          EOF
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add hierarchy-rebase-status.json
          git commit -m 'Record hierarchy rebase run [skip ci]'
          git push origin HEAD:main

      - name: Fetch testbed hierarchy commit
        run: |
          git remote add testbed https://github.com/Autodidac/fastfreddytestbed.git
          git fetch --no-tags testbed a3b82617611d76829a5c9b76dd47d9ee938f87ad

      - name: Apply hierarchy while preserving Fix32
        run: |
          set +e
          git cherry-pick --no-commit a3b82617611d76829a5c9b76dd47d9ee938f87ad
          result=$?
          set -e
          if [ $result -ne 0 ]; then
            git checkout --ours shaders/chemistry.comp shaders/fullscreen.frag shaders/move.comp shaders/tiles.comp tests/material_contract.cpp
          fi

          cat > /tmp/resolve_hierarchy.py <<'PY'
          from pathlib import Path

          def read(path: str) -> str:
              return Path(path).read_text(encoding='utf-8')

          def write(path: str, text: str) -> None:
              Path(path).write_text(text, encoding='utf-8')

          def replace_once(path: str, old: str, new: str) -> None:
              text = read(path)
              if old not in text:
                  raise RuntimeError(f'missing marker in {path}: {old[:100]!r}')
              write(path, text.replace(old, new, 1))

          # Chemistry keeps the Fix32 bee-swarm logic and adds conservative
          # chunk-neighborhood sleeping only when every adjacent chunk is asleep.
          replace_once('shaders/chemistry.comp',
              '#include "tiles.glsl"\n#include "bee_swarm.glsl"\n',
              '#include "tiles.glsl"\n#include "chunks.glsl"\n#include "bee_swarm.glsl"\n')
          replace_once('shaders/chemistry.comp',
              'layout(std430, binding = 4) readonly buffer Tiles { TileState tiles[]; };\n',
              'layout(std430, binding = 4) readonly buffer Tiles { TileState tiles[]; };\n'
              'layout(std430, binding = 7) readonly buffer Chunks { ChunkState chunks[]; };\n')
          replace_once('shaders/chemistry.comp',
