name: Rebase Testbed Hierarchy

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/rebase-testbed-hierarchy.yml

permissions:
  contents: write

jobs:
  rebase:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Record run
        env:
          RUN_ID: ${{ github.run_id }}
          RUN_NUMBER: ${{ github.run_number }}
          HEAD_SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          cat > hierarchy-rebase-status.json <<EOF
          {
            "run_id": ${RUN_ID},
            "run_number": ${RUN_NUMBER},
            "status": "running",
            "head_sha": "${HEAD_SHA}",
            "run_url": "${RUN_URL}"
          }
          EOF
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add hierarchy-rebase-status.json
          git commit -m 'Record hierarchy rebase run [skip ci]'
          git push origin HEAD:main

      - name: Fetch testbed hierarchy commit
        run: |
          git remote add testbed https://github.com/Autodidac/fastfreddytestbed.git
          git fetch --no-tags testbed a3b82617611d76829a5c9b76dd47d9ee938f87ad

      - name: Apply hierarchy commit without replacing newer FastFreddy work
        run: |
          set +e
          git cherry-pick --no-commit a3b82617611d76829a5c9b76dd47d9ee938f87ad
          result=$?
          if [ $result -ne 0 ]; then
            echo '::group::Conflicted files'
            git status --short
            echo '::endgroup::'
            echo '::group::Combined conflict diff'
            git diff --cc -- . ':(exclude)hierarchy-rebase-status.json' || true
            echo '::endgroup::'
            exit $result
          fi

      - name: Install validation tools
        run: |
          sudo apt-get update
          sudo apt-get install -y glslc g++-14

      - name: Validate shaders and contracts
        run: |
          set -euo pipefail
          mkdir -p /tmp/fastfreddy-shaders
          for shader in reset.comp paint.comp sunlight.comp tiles.comp chunks.comp chemistry.comp macro_move.comp move.comp actor.comp debug_stats.comp fullscreen.vert fullscreen.frag; do
            echo "Compiling ${shader}"
            glslc --target-env=vulkan1.2 -O -I shaders "shaders/${shader}" -o "/tmp/fastfreddy-shaders/${shader}.spv"
          done
          g++-14 -std=c++23 -Wall -Wextra -Wpedantic -Wconversion -Wshadow -Werror \
            -Iinclude -Ithird_party/EpochGui/include -fsyntax-only tests/material_contract.cpp

      - name: Commit rebased hierarchy
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add CMakeLists.txt README.md HIERARCHICAL_SIMULATION.md include src shaders tests
          git commit -m 'Rebase movable macro-cells and sleeping chunks onto Fix32'
          git pull --rebase origin main
          git push origin HEAD:main
