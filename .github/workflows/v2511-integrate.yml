name: Integrate SandHybrid v2.5.11 World Saves

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: sandhybrid-v2511-integrate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  integrate:
    if: github.event.pull_request.head.ref == 'agent/v2511-world-save-rewrite'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Detect pending integration
        id: detect
        shell: bash
        run: |
          if grep -q 'project(SandHybrid VERSION 2.5.11 ' CMakeLists.txt; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
          else
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          fi

      - name: Extract and apply canonical integration
        if: steps.detect.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          workflow = Path('.github/workflows/v2511-save-repair.yml').read_text(encoding='utf-8')
          marker = "          python3 - <<'PY'\n"
          start = workflow.index(marker) + len(marker)
          end = workflow.index("\n          PY\n", start)
          lines = []
          for line in workflow[start:end].splitlines():
              lines.append(line[10:] if line.startswith('          ') else line)
          script = '\n'.join(lines) + '\n'
          strict_save = '''if old_draw not in renderer:
    raise RuntimeError('vulkan_renderer.cpp: save routing anchor missing')
renderer = renderer.replace(old_draw, new_draw, 1)'''
          tolerant_save = '''if old_draw in renderer:
    renderer = renderer.replace(old_draw, new_draw, 1)
else:
    save_call = 'if (!needs_reset) export_authored_scene_ppm(selected_scene);'
    if save_call not in renderer:
        raise RuntimeError('vulkan_renderer.cpp: save call anchor missing')
    renderer = renderer.replace(
        save_call, 'if (!needs_reset) save_world_slot(selected_scene);', 1)
    renderer = renderer.replace(
        'else startup_log("Scene save skipped until the initial scene exists.");',
        'else startup_log("World save skipped until the initial scene exists.");', 1)'''
          strict_load = '''if old_load not in renderer:
    raise RuntimeError('vulkan_renderer.cpp: load routing anchor missing')
renderer = renderer.replace(old_load, new_load, 1)'''
          tolerant_load = '''if old_load in renderer:
    renderer = renderer.replace(old_load, new_load, 1)
else:
    load_pattern = re.compile(
        r'        bool image_loaded = false;\\n'
        r'        if \\(explicit_load\\) \\{.*?\\n'
        r'        \\}\\n\\n'
        r'        std::uint32_t image_index\\{\\};', re.S)
    replacement = new_load + '\\n\\n        std::uint32_t image_index{};'
    renderer, load_count = load_pattern.subn(replacement, renderer, count=1)
    if load_count != 1:
        raise RuntimeError(
            f'vulkan_renderer.cpp: load routing regex matched {load_count} times')'''
          if strict_save not in script or strict_load not in script:
              raise SystemExit('canonical routing patches changed unexpectedly')
          script = script.replace(strict_save, tolerant_save, 1)
          script = script.replace(strict_load, tolerant_load, 1)
          Path('/tmp/apply_v2511.py').write_text(script, encoding='utf-8')
          PY
          python3 /tmp/apply_v2511.py
          rm -f .github/workflows/v2511-integrate.yml V2511_TRIGGER.md

      - name: Install validation tools
        if: steps.detect.outputs.changed == 'true'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build

      - name: Validate headless library and persistence
        if: steps.detect.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python tools/validate_shader_contracts.py
          python tools/validate_v2510_contract.py
          python tools/validate_v2511_contract.py
          python tools/validate_mission_cache.py
          cmake -S . -B build-headless -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DSANDHYBRID_BUILD_APP=OFF \
            -DSANDHYBRID_BUILD_VULKAN_RUNTIME=OFF \
            -DSANDHYBRID_WARNINGS_AS_ERRORS=ON \
            -DBUILD_TESTING=ON
          cmake --build build-headless --parallel 2
          ctest --test-dir build-headless --output-on-failure

      - name: Commit validated integration
        if: steps.detect.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Autodidac Release Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'SandHybrid v2.5.11 exact world save rewrite'
          git push origin HEAD:agent/v2511-world-save-rewrite
