name: Apply SandHybrid v2.4.8 Patch

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'agent/soil-debug-wet-ui-v248'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Apply and validate reviewed production payload
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          chunks=(.github/v248_final_chunk_*)
          if (( ${#chunks[@]} == 0 )); then
            echo 'Final production payload already applied.'
            exit 0
          fi
          test "${#chunks[@]}" -eq 6
          cat "${chunks[@]}" > "${RUNNER_TEMP}/v248.b64"
          base64 --decode "${RUNNER_TEMP}/v248.b64" > "${RUNNER_TEMP}/v248.tar.xz"
          echo 'cc96cfdb8f1a3376cd6c64a83346308d34220a43c255d57e6247b0dd8a43d423  '"${RUNNER_TEMP}/v248.tar.xz" | sha256sum --check
          tar --extract --xz --file "${RUNNER_TEMP}/v248.tar.xz" --directory .
          rm -f .github/v248_final_chunk_*

          python3 tools/generate_ui_text.py
          python3 tools/validate_shader_contracts.py
          python3 tools/validate_mission_cache.py
          cmake -S . -B build/contracts -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DSANDHYBRID_BUILD_APP=OFF \
            -DSANDHYBRID_WARNINGS_AS_ERRORS=ON \
            -DBUILD_TESTING=ON
          cmake --build build/contracts --parallel
          ctest --test-dir build/contracts --output-on-failure
          rm -rf build/contracts

          # Workflow files are managed separately with the connector because
          # the Actions token cannot create or modify workflow definitions.
          git checkout origin/main -- .github/workflows
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'Complete SandHybrid v2.4.8 broad release pass'
          git push origin HEAD:${{ github.head_ref }}
