name: Apply SandHybrid v2.4.8 Patch

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'agent/soil-debug-wet-ui-v248'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Apply and validate reviewed patch
        shell: bash
        run: |
          set -euo pipefail
          changed=0
          if [[ -f .github/apply_v248.py ]]; then
            python3 .github/apply_v248.py
            changed=1
          fi
          if [[ -f .github/apply_v248_sep.py ]]; then
            python3 .github/apply_v248_sep.py
            changed=1
          fi
          if [[ "$changed" == 0 ]]; then
            echo 'Patch already applied.'
            exit 0
          fi
          python3 tools/generate_ui_text.py
          python3 tools/validate_shader_contracts.py
          cmake -S . -B build/contracts -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DSANDHYBRID_BUILD_APP=OFF \
            -DSANDHYBRID_WARNINGS_AS_ERRORS=ON \
            -DBUILD_TESTING=ON
          cmake --build build/contracts --parallel
          ctest --test-dir build/contracts --output-on-failure
          rm -rf build/contracts
          git checkout origin/main -- .github/workflows
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'Improve soil tools, debug cards, separators, brush defaults, launcher, and wet variants'
          git push origin HEAD:${{ github.head_ref }}
