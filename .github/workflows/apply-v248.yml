name: Apply SandHybrid v2.4.8 Source

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'agent/soil-debug-wet-reset-v248'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Apply and validate reviewed source payload
        shell: bash
        run: |
          set -euo pipefail
          payload='.github/v248_source_payload.tar.xz'
          if [[ ! -f "$payload" ]]; then
            echo 'Payload already applied.'
            exit 0
          fi
          echo 'c86d5691a4e81b0e0c4ce7687925ee772a60d081d2ed3bc4aa1270c41437bd24  '"$payload" | sha256sum --check
          tar --extract --xz --file "$payload" --directory .
          rm -f "$payload"

          python3 tools/generate_ui_text.py
          python3 tools/validate_shader_contracts.py
          cmake -S . -B build/contracts -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DSANDHYBRID_BUILD_APP=OFF \
            -DSANDHYBRID_WARNINGS_AS_ERRORS=ON \
            -DBUILD_TESTING=ON
          cmake --build build/contracts --parallel
          ctest --test-dir build/contracts --output-on-failure
          rm -rf build/contracts

          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'Repair SandHybrid tools, debug, wet states, reset, and camera controls'
          git push origin HEAD:${{ github.head_ref }}
