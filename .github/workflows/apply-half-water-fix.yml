name: Apply SandHybrid half-water regression repair

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'agent/fix-half-water-tiles-sluice-debug'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Apply and validate focused repair
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -f .github/apply_fix_half_water.py ]]; then
            echo 'Focused repair already applied.'
            exit 0
          fi
          python3 .github/apply_fix_half_water.py
          python3 tools/generate_ui_text.py
          python3 tools/validate_shader_contracts.py
          cmake -S . -B build/contracts -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DSANDHYBRID_BUILD_APP=OFF \
            -DSANDHYBRID_WARNINGS_AS_ERRORS=ON \
            -DBUILD_TESTING=ON
          cmake --build build/contracts --parallel
          ctest --test-dir build/contracts --output-on-failure
          rm -rf build/contracts
          rm .github/apply_fix_half_water.py
          git checkout origin/main -- .github/workflows
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'Fix half-water, terrain tiles, wet sluicing, and debug samples'
          git push origin HEAD:${{ github.head_ref }}
