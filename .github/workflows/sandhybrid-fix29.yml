name: SandHybrid Fix29 Camera Cursor Bees Release

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - "tools/fix29.py"
      - "tools/fix29_prepare.py"
      - "tools/fix29_compile_fix.py"
      - "tools/audit_fix29.py"
      - ".github/workflows/sandhybrid-fix29.yml"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: sandhybrid-fix29-release
  cancel-in-progress: true

jobs:
  build-test-release:
    runs-on: windows-2022
    timeout-minutes: 90

    steps:
      - name: Check out Fix29 branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Prepare whitespace-independent camera patch
        shell: pwsh
        run: |
          python tools/fix29_prepare.py
          if ($LASTEXITCODE -ne 0) { throw 'Fix29 camera matcher preparation failed.' }

      - name: Apply Fix29 camera cursor and bee corrections
        shell: pwsh
        run: |
          python tools/fix29.py
          if ($LASTEXITCODE -ne 0) { throw 'Fix29 correction failed.' }
          python tools/fix29_compile_fix.py
          if ($LASTEXITCODE -ne 0) { throw 'Fix29 GLSL compiler correction failed.' }

      - name: Regenerate material and UI data
        shell: pwsh
        run: |
          python tools/generate_ui_text.py
          if ($LASTEXITCODE -ne 0) { throw 'UI/material generation failed.' }

      - name: Audit material contracts
        shell: pwsh
        run: |
          python tools/audit_material_behaviors.py
          if ($LASTEXITCODE -ne 0) { throw 'Material behavior audit failed.' }

      - name: Audit motion and ecology contracts
        shell: pwsh
        run: |
          python tools/audit_ecology_motion.py
          if ($LASTEXITCODE -ne 0) { throw 'Ecology/motion audit failed.' }

      - name: Audit Fix29 contracts
        shell: pwsh
        run: |
          python tools/audit_fix29.py
          if ($LASTEXITCODE -ne 0) { throw 'Fix29 audit failed.' }

      - name: Validate shader and CPU contracts
        shell: pwsh
        run: |
          python tools/validate_shader_contracts.py
          if ($LASTEXITCODE -ne 0) { throw 'Shader contract validation failed.' }

      - name: Bootstrap pinned vcpkg
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $vcpkgRoot = Join-Path $env:RUNNER_TEMP 'vcpkg'
          git clone --filter=blob:none https://github.com/microsoft/vcpkg.git $vcpkgRoot
          git -C $vcpkgRoot checkout 04a735608afac5844e86fc91d6ba2112cac613c1
          & (Join-Path $vcpkgRoot 'bootstrap-vcpkg.bat') -disableMetrics
          "VCPKG_ROOT=$vcpkgRoot" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Configure Windows x64 Release
        shell: pwsh
        run: |
          cmake -S . -B build/windows -G "Visual Studio 17 2022" -A x64 `
            -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake" `
            -DVCPKG_TARGET_TRIPLET=x64-windows `
            -DEPOCH_SAND_WARNINGS_AS_ERRORS=ON `
            -DEPOCH_SAND_ENABLE_VALIDATION=OFF `
            -DBUILD_TESTING=ON

      - name: Build Windows x64 and every SPIR-V shader
        shell: pwsh
        run: cmake --build build/windows --config Release --parallel

      - name: Run all C++23 contract tests
        shell: pwsh
        run: ctest --test-dir build/windows -C Release --output-on-failure

      - name: Commit verified source to main
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Remove-Item -LiteralPath 'tools/fix29.py' -Force
          Remove-Item -LiteralPath 'tools/fix29_prepare.py' -Force
          Remove-Item -LiteralPath 'tools/fix29_compile_fix.py' -Force
          Remove-Item -LiteralPath 'tools/audit_fix29.py' -Force
          Remove-Item -LiteralPath '.github/workflows/sandhybrid-fix29.yml' -Force
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'SandHybrid Fix29: add zoom cursor editor and stable bee orbits'
          git push origin HEAD:main
          $releaseSha = git rev-parse HEAD
          "RELEASE_SHA=$releaseSha" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Package verified Windows release
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $distRoot = Join-Path $env:GITHUB_WORKSPACE 'dist'
          $stage = Join-Path $distRoot 'SandHybrid_Windows_x64_Fix29'
          $archive = Join-Path $distRoot 'SandHybrid_Windows_x64_Fix29.zip'
          Remove-Item -LiteralPath $distRoot -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Path $stage | Out-Null
          Copy-Item 'build/windows/Release/epoch_sand.exe' (Join-Path $stage 'SandHybrid.exe') -Force
          Copy-Item 'build/windows/Release/shaders' (Join-Path $stage 'shaders') -Recurse -Force
          Copy-Item 'build/windows/Release/scenes' (Join-Path $stage 'scenes') -Recurse -Force
          Copy-Item README.md, LICENSE -Destination $stage -Force
          Set-Content -LiteralPath (Join-Path $stage 'run.bat') -Value @('@echo off', 'cd /d "%~dp0"', 'SandHybrid.exe') -Encoding ascii
          Compress-Archive -Path (Join-Path $stage '*') -DestinationPath $archive -CompressionLevel Optimal
          (Get-FileHash -Algorithm SHA256 $archive).Hash.ToLowerInvariant() + '  SandHybrid_Windows_x64_Fix29.zip' |
            Set-Content -LiteralPath (Join-Path $distRoot 'SHA256SUMS.txt') -Encoding ascii
          "RELEASE_ARCHIVE=$archive" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Upload verified artifact
        uses: actions/upload-artifact@v4
        with:
          name: SandHybrid_Windows_x64_Fix29
          path: |
            dist/SandHybrid_Windows_x64_Fix29.zip
            dist/SHA256SUMS.txt
          if-no-files-found: error

      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = 'v1.5.0-fix29'
          gh release view $tag --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) { gh release delete $tag --repo $env:GITHUB_REPOSITORY --yes --cleanup-tag }
          gh release create $tag $env:RELEASE_ARCHIVE 'dist/SHA256SUMS.txt' `
            --repo $env:GITHUB_REPOSITORY `
            --target $env:RELEASE_SHA `
            --title 'SandHybrid Windows Fix29' `
            --notes 'Verified Fix29: mouse-wheel zoom is centered on the pointed world location; the sidebar has a cursor editor with circle, square, horizontal-line and vertical-line shapes plus explicit size and zoom controls; painting and cursor previews share the same shape contract; the authored bee rings use a bounded population, persistent orbit lanes and tangential wave movement instead of collapsing into a stationary knot; hive expansion, worker spawning and honey consumption are bounded; debug tile lines are less intrusive and hive counts are labeled accurately.'

      - name: Close trigger PR and delete branch
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr close ${{ github.event.pull_request.number }} --repo $env:GITHUB_REPOSITORY --comment 'Fix29 verified build and release completed; source was pushed directly to main.'
          git push origin --delete ${{ github.event.pull_request.head.ref }}
