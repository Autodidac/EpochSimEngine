          liquid_replacement = r'''int liquidColumnPressure(ivec2 position, uint material) {
    int pressure = 0;
    for (int offset = 1; offset <= 8; ++offset) {
        Cell above = moveAt(position + ivec2(0, -offset));
        bool compatible = above.material == material ||
            (isCellLiquid(above) && densityOf(above.material) >= densityOf(material));
        if (!compatible) break;
        ++pressure;
    }
    return pressure;
}

int liquidSpreadReach(uint material) {
    if (material == MAT_HONEY) return 2;
    if (material == MAT_OIL) return 4;
    if (material == MAT_ACID) return 5;
    if (material == MAT_SALTWATER || material == MAT_DIRTY_WATER) return 6;
    return 7;
}

bool liquidPathLeadsToDrop(ivec2 targetPosition, int direction, Cell source) {
    int reach = liquidSpreadReach(source.material);
    for (int offset = 1; offset <= 7; ++offset) {
        if (offset > reach) break;
        ivec2 candidate = targetPosition + ivec2(direction * offset, 0);
        if (!moveInside(candidate) || !isOpenGas(moveAt(candidate))) return false;
        if (canCellFallInto(source, moveAt(candidate + ivec2(0, 1)))) return true;
    }
    return false;
}

bool liquidCanSpread(ivec2 sourcePosition, ivec2 targetPosition,
                     Cell source, uint randomValue) {
    if (!isOpenGas(moveAt(targetPosition)) || !movementAllows(source, randomValue))
        return false;
    if (!supportedAt(sourcePosition, source)) return false;
    if (!supportedAt(targetPosition, source)) return true;

    bool sourceCovered = isCellLiquid(moveAt(sourcePosition + ivec2(0, -1)));
    bool targetCovered = isCellLiquid(moveAt(targetPosition + ivec2(0, -1)));
    if (sourceCovered != targetCovered) return sourceCovered;

    int sourcePressure = liquidColumnPressure(sourcePosition, source.material);
    int targetPressure = liquidColumnPressure(targetPosition, source.material);
    if (sourcePressure != targetPressure) return sourcePressure > targetPressure;

    int direction = targetPosition.x > sourcePosition.x ? 1 : -1;
    if (liquidPathLeadsToDrop(targetPosition, direction, source)) return true;

    Cell behind = moveAt(sourcePosition - ivec2(direction, 0));
    Cell above = moveAt(sourcePosition + ivec2(0, -1));
    bool suppliedSurface = behind.material == source.material ||
                           above.material == source.material;
    if (!suppliedSurface) return false;

    // Only the supplied frontier advances. Interior cells therefore settle,
    // while a lake or reservoir can keep feeding its edge without an age cutoff.
    ivec2 forward = targetPosition + ivec2(direction, 0);
    return moveInside(forward) && isOpenGas(moveAt(forward));
}

