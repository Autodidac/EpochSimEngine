      - name: Install validation tools
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build glslc

      - name: Validate source and shaders
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/validate_mission_cache.py
          python3 tools/validate_v2510_contract.py
          for shader in reset.comp tiles.comp macro_move.comp move.comp actor.comp fullscreen.frag; do
            glslc --target-env=vulkan1.2 -I shaders "shaders/$shader" -o "/tmp/$shader.spv"
          done
          cmake -S . -B build-headless -G Ninja \
            -DSANDHYBRID_BUILD_APP=OFF \
            -DSANDHYBRID_BUILD_VULKAN_RUNTIME=OFF \
            -DSANDHYBRID_WARNINGS_AS_ERRORS=ON \
            -DBUILD_TESTING=ON
          cmake --build build-headless --parallel 2
          ctest --test-dir build-headless --output-on-failure

      - name: Commit validated source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Autodidac Release Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "SandHybrid v2.5.10 terrain liquid and fracture recovery"
          git push origin HEAD:agent/v260-ui-collapse-laser
