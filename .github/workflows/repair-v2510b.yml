name: SandHybrid v2.5.10 source repair

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/v260-ui-collapse-laser
          fetch-depth: 0

      - name: Apply v2.5.10 source corrections
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          def load(path: str) -> str:
              return Path(path).read_text(encoding="utf-8")

          def save(path: str, text: str) -> None:
              Path(path).write_text(text, encoding="utf-8")

          def once(path: str, old: str, new: str) -> None:
              text = load(path)
              count = text.count(old)
              if count != 1:
                  raise RuntimeError(f"{path}: expected one match, found {count}: {old[:140]!r}")
              save(path, text.replace(old, new, 1))

          def all_(path: str, old: str, new: str, minimum: int = 1) -> None:
              text = load(path)
              count = text.count(old)
              if count < minimum:
                  raise RuntimeError(f"{path}: expected at least {minimum} matches, found {count}: {old!r}")
              save(path, text.replace(old, new))

          def regex_once(path: str, pattern: str, replacement: str) -> None:
              text = load(path)
              result, count = re.subn(pattern, replacement, text, count=1, flags=re.S)
              if count != 1:
                  raise RuntimeError(f"{path}: regex expected one match, found {count}: {pattern[:160]!r}")
              save(path, result)

          # ------------------------------------------------------------------
          # Canonical coherent terrain generation. Structural mineral cores are
          # complete 8x8 tiles. Broken material exists only in localized rubble
          # pockets beside a core or in curved sand-trap roofs.
          # ------------------------------------------------------------------
          save("include/sandhybrid/terrain_generation.hpp", r'''#pragma once

#include "sandhybrid/material.hpp"

#include <cstdint>

namespace sandhybrid::terrain {

inline constexpr std::uint32_t tile_size = 8u;
inline constexpr std::uint32_t vein_cluster_tiles_x = 20u;
inline constexpr std::uint32_t vein_cluster_tiles_y = 12u;
inline constexpr std::uint32_t trap_cluster_tiles_x = 28u;
inline constexpr std::uint32_t trap_cluster_tiles_y = 16u;

struct Sample final {
    Material material{Material::empty};
    bool structural{};
    bool deliberate_loose{};
    bool sand_trap{};
};

[[nodiscard]] constexpr std::uint32_t hash(
    const std::uint32_t x,
    const std::uint32_t y,
    const std::uint32_t salt = 0u) noexcept {
    auto value = x * 0x9e3779b9u ^ y * 0x85ebca6bu ^ salt * 0xc2b2ae35u;
    value ^= value >> 16u;
    value *= 0x7feb352du;
    value ^= value >> 15u;
    value *= 0x846ca68bu;
    value ^= value >> 16u;
    return value;
}

[[nodiscard]] constexpr std::int32_t absolute(const std::int32_t value) noexcept {
    return value < 0 ? -value : value;
}

[[nodiscard]] constexpr bool host_material(const Material material) noexcept {
    return material == Material::sand || material == Material::dirt ||
           material == Material::silt || material == Material::mud ||
           material == Material::stone;
}

[[nodiscard]] constexpr Material cluster_deposit(
    const std::uint32_t cluster_x,
    const std::uint32_t cluster_y,
    const std::uint32_t depth) noexcept {
    if (depth >= 160u && (hash(cluster_x, cluster_y, 0x711du) & 4095u) < 100u)
        return Material::uranium;
    if ((hash(cluster_x, cluster_y, 0xa16fu) & 4095u) < 220u)
        return Material::aluminum;
    if ((hash(cluster_x, cluster_y, 0xc077u) & 4095u) < 420u)
        return Material::copper;
    if ((hash(cluster_x, cluster_y, 0x1a0fu) & 4095u) < 900u)
        return Material::iron_ore;
    return Material::empty;
}

[[nodiscard]] constexpr bool vein_core_tile(
    const std::uint32_t tile_x,
    const std::uint32_t tile_y,
    const std::uint32_t depth) noexcept {
    const auto cluster_x = tile_x / vein_cluster_tiles_x;
    const auto cluster_y = tile_y / vein_cluster_tiles_y;
    if (cluster_deposit(cluster_x, cluster_y, depth) == Material::empty) return false;

    const auto seed = hash(cluster_x, cluster_y, 0x9b7du);
    const auto local_x = static_cast<std::int32_t>(tile_x % vein_cluster_tiles_x);
    const auto local_y = static_cast<std::int32_t>(tile_y % vein_cluster_tiles_y);
    const auto center_x = 6 + static_cast<std::int32_t>((seed >> 7u) % 8u);
    const auto center_y = 3 + static_cast<std::int32_t>((seed >> 13u) % 6u);
    const auto slope = static_cast<std::int32_t>((seed >> 19u) % 5u) - 2;
    const auto length = 6 + static_cast<std::int32_t>((seed >> 23u) % 4u);
    const auto width = 1 + static_cast<std::int32_t>((seed >> 27u) % 2u);
    const bool vertical = (seed & 1u) != 0u;

    std::int32_t along{};
    std::int32_t cross{};
    if (vertical) {
        const auto bend = static_cast<std::int32_t>(
            hash(cluster_x + static_cast<std::uint32_t>(local_y / 3 + 1),
                 cluster_y, 0x52b1u) % 3u) - 1;
        const auto line_x = center_x + ((local_y - center_y) * slope) / 5 + bend;
        along = absolute(local_y - center_y);
        cross = absolute(local_x - line_x);
    } else {
        const auto bend = static_cast<std::int32_t>(
            hash(cluster_x, cluster_y + static_cast<std::uint32_t>(local_x / 3 + 1),
                 0x52b1u) % 3u) - 1;
        const auto line_y = center_y + ((local_x - center_x) * slope) / 5 + bend;
        along = absolute(local_x - center_x);
        cross = absolute(local_y - line_y);
    }

    const auto edge_noise = static_cast<std::int32_t>(hash(tile_x, tile_y, seed) % 3u) - 1;
    return along <= length && cross <= width + edge_noise;
}

[[nodiscard]] constexpr bool vein_core_tile_signed(
    const std::int32_t tile_x,
    const std::int32_t tile_y,
    const std::uint32_t depth) noexcept {
    return tile_x >= 0 && tile_y >= 0 &&
           vein_core_tile(static_cast<std::uint32_t>(tile_x),
                          static_cast<std::uint32_t>(tile_y), depth);
}

[[nodiscard]] constexpr Material neighboring_vein_material(
    const std::uint32_t tile_x,
    const std::uint32_t tile_y,
    const std::uint32_t depth) noexcept {
    for (std::int32_t offset_y = -1; offset_y <= 1; ++offset_y) {
        for (std::int32_t offset_x = -1; offset_x <= 1; ++offset_x) {
            if (offset_x == 0 && offset_y == 0) continue;
            const auto neighbor_x = static_cast<std::int32_t>(tile_x) + offset_x;
            const auto neighbor_y = static_cast<std::int32_t>(tile_y) + offset_y;
            if (!vein_core_tile_signed(neighbor_x, neighbor_y, depth)) continue;
            return cluster_deposit(
                static_cast<std::uint32_t>(neighbor_x) / vein_cluster_tiles_x,
                static_cast<std::uint32_t>(neighbor_y) / vein_cluster_tiles_y,
                depth);
        }
    }
    return Material::empty;
}

[[nodiscard]] constexpr bool rubble_pocket_selected(
    const std::uint32_t tile_x,
    const std::uint32_t tile_y) noexcept {
    return (hash(tile_x, tile_y, 0xb04du) % 4u) == 0u;
}

[[nodiscard]] constexpr std::uint32_t rubble_distance(
    const std::uint32_t x,
    const std::uint32_t y,
    const std::uint32_t tile_x,
    const std::uint32_t tile_y) noexcept {
    const auto seed = hash(tile_x, tile_y, 0x8a21u);
    const auto center_x = 2 + static_cast<std::int32_t>((seed >> 5u) % 4u);
    const auto center_y = 2 + static_cast<std::int32_t>((seed >> 11u) % 4u);
    const auto local_x = static_cast<std::int32_t>(x % tile_size);
    const auto local_y = static_cast<std::int32_t>(y % tile_size);
    const auto dx = local_x - center_x;
    const auto dy = local_y - center_y;
    return static_cast<std::uint32_t>(dx * dx * 3 + dy * dy * 4);
}

[[nodiscard]] constexpr Material trap_resource(
    const std::uint32_t trap_cluster_x,
    const std::uint32_t trap_cluster_y,
    const std::uint32_t depth) noexcept {
    const auto roll = hash(trap_cluster_x, trap_cluster_y, 0x3a71u) & 1023u;
    if (depth >= 160u && roll < 38u) return Material::uranium;
    if (roll < 220u) return Material::copper;
    if (roll < 360u) return Material::aluminum;
    return Material::iron_ore;
}

[[nodiscard]] constexpr bool trap_selected(
    const std::uint32_t cluster_x,
    const std::uint32_t cluster_y,
    const std::uint32_t depth) noexcept {
    if (depth < 72u || depth > 320u) return false;
    return (hash(cluster_x, cluster_y, 0x6f31u) & 1023u) < 42u;
}

[[nodiscard]] constexpr Sample sample(
    const Material base_material,
    const std::uint32_t x,
    const std::uint32_t y,
    const std::uint32_t depth) noexcept {
    if (!host_material(base_material)) return {base_material, false, false, false};

    constexpr auto trap_width_cells = trap_cluster_tiles_x * tile_size;
    constexpr auto trap_height_cells = trap_cluster_tiles_y * tile_size;
    const auto trap_cluster_x = x / trap_width_cells;
    const auto trap_cluster_y = y / trap_height_cells;
    if (base_material == Material::sand &&
        trap_selected(trap_cluster_x, trap_cluster_y, depth)) {
        const auto seed = hash(trap_cluster_x, trap_cluster_y, 0x7135u);
        const auto local_x = static_cast<std::int32_t>(x % trap_width_cells);
        const auto local_y = static_cast<std::int32_t>(y % trap_height_cells);
        const auto center_x = 72 + static_cast<std::int32_t>(seed % 80u);
        const auto center_y = 48 + static_cast<std::int32_t>((seed >> 8u) % 28u);
        const auto radius_x = 28 + static_cast<std::int32_t>((seed >> 15u) % 18u);
        const auto radius_y = 16 + static_cast<std::int32_t>((seed >> 21u) % 10u);
        const auto dx = local_x - center_x;
        const auto dy = local_y - center_y;
        const auto ellipse = dx * dx * radius_y * radius_y +
                             dy * dy * radius_x * radius_x;
        const auto limit = radius_x * radius_x * radius_y * radius_y;
        if (ellipse <= limit) return {Material::empty, false, false, true};

        const auto roof_y = center_y - radius_y +
            (dx * dx * 5) / (radius_x * radius_x);
        const bool loose_roof = absolute(dx) <= radius_x &&
                                local_y >= roof_y - 4 && local_y <= roof_y + 3;
        if (loose_roof) {
            const bool concentrated = absolute(dx) * 3 < radius_x * 2;
            const bool resource_cell = concentrated &&
                (hash(x, y, 0x10c5u) % 11u) == 0u;
            return {resource_cell
                        ? trap_resource(trap_cluster_x, trap_cluster_y, depth)
                        : Material::sand,
                    false, true, true};
        }
    }

    const auto tile_x = x / tile_size;
    const auto tile_y = y / tile_size;
    const auto deposit = cluster_deposit(
        tile_x / vein_cluster_tiles_x, tile_y / vein_cluster_tiles_y, depth);
    if (deposit != Material::empty && vein_core_tile(tile_x, tile_y, depth))
        return {deposit, true, false, false};

    const auto neighboring_deposit = neighboring_vein_material(tile_x, tile_y, depth);
    if ((base_material == Material::sand || base_material == Material::silt) &&
        neighboring_deposit != Material::empty && rubble_pocket_selected(tile_x, tile_y)) {
        const auto distance = rubble_distance(x, y, tile_x, tile_y);
        if (distance <= 11u) {
            const bool resource_cell = (hash(x, y, 0x441du) % 5u) == 0u;
            return {resource_cell ? neighboring_deposit : Material::empty,
                    false, true, false};
        }
        if (distance <= 28u) return {base_material, false, true, false};
    }

    return {base_material, true, false, false};
}

} // namespace sandhybrid::terrain
''')

          save("shaders/terrain_generation.glsl", r'''#ifndef SANDHYBRID_TERRAIN_GENERATION_GLSL
#define SANDHYBRID_TERRAIN_GENERATION_GLSL

const uint TERRAIN_TILE_SIZE = 8u;
const uint TERRAIN_VEIN_CLUSTER_X = 20u;
const uint TERRAIN_VEIN_CLUSTER_Y = 12u;
const uint TERRAIN_TRAP_CLUSTER_X = 28u;
const uint TERRAIN_TRAP_CLUSTER_Y = 16u;
const uint TERRAIN_FLAG_STRUCTURAL = 1u;
const uint TERRAIN_FLAG_DELIBERATE_LOOSE = 2u;
const uint TERRAIN_FLAG_SAND_TRAP = 4u;

uint terrainHash(uvec2 p, uint salt) {
    uint value = p.x * 0x9e3779b9u ^ p.y * 0x85ebca6bu ^ salt * 0xc2b2ae35u;
    value ^= value >> 16u;
    value *= 0x7feb352du;
    value ^= value >> 15u;
    value *= 0x846ca68bu;
    value ^= value >> 16u;
    return value;
}

bool terrainHostMaterial(uint material) {
    return material == MAT_SAND || material == MAT_DIRT || material == MAT_SILT ||
           material == MAT_MUD || material == MAT_STONE;
}

uint terrainClusterDeposit(uvec2 cluster, uint depth) {
    if (depth >= 160u && (terrainHash(cluster, 0x711du) & 4095u) < 100u)
        return MAT_URANIUM;
    if ((terrainHash(cluster, 0xa16fu) & 4095u) < 220u) return MAT_ALUMINUM;
    if ((terrainHash(cluster, 0xc077u) & 4095u) < 420u) return MAT_COPPER;
    if ((terrainHash(cluster, 0x1a0fu) & 4095u) < 900u) return MAT_IRON_ORE;
    return MAT_EMPTY;
}

bool terrainVeinCoreTile(uvec2 tile, uint depth) {
    uvec2 cluster = tile / uvec2(TERRAIN_VEIN_CLUSTER_X, TERRAIN_VEIN_CLUSTER_Y);
    if (terrainClusterDeposit(cluster, depth) == MAT_EMPTY) return false;
    uint seed = terrainHash(cluster, 0x9b7du);
    ivec2 local = ivec2(tile % uvec2(TERRAIN_VEIN_CLUSTER_X, TERRAIN_VEIN_CLUSTER_Y));
    int centerX = 6 + int((seed >> 7u) % 8u);
    int centerY = 3 + int((seed >> 13u) % 6u);
    int slope = int((seed >> 19u) % 5u) - 2;
    int length = 6 + int((seed >> 23u) % 4u);
    int width = 1 + int((seed >> 27u) % 2u);
    bool vertical = (seed & 1u) != 0u;
    int along;
    int cross;
    if (vertical) {
        int bend = int(terrainHash(
            uvec2(cluster.x + uint(local.y / 3 + 1), cluster.y), 0x52b1u) % 3u) - 1;
        int lineX = centerX + ((local.y - centerY) * slope) / 5 + bend;
        along = abs(local.y - centerY);
        cross = abs(local.x - lineX);
    } else {
        int bend = int(terrainHash(
            uvec2(cluster.x, cluster.y + uint(local.x / 3 + 1)), 0x52b1u) % 3u) - 1;
        int lineY = centerY + ((local.x - centerX) * slope) / 5 + bend;
        along = abs(local.x - centerX);
        cross = abs(local.y - lineY);
    }
    int edgeNoise = int(terrainHash(tile, seed) % 3u) - 1;
    return along <= length && cross <= width + edgeNoise;
}

bool terrainVeinCoreTileSigned(ivec2 tile, uint depth) {
    return all(greaterThanEqual(tile, ivec2(0))) && terrainVeinCoreTile(uvec2(tile), depth);
}

uint terrainNeighboringVeinMaterial(uvec2 tile, uint depth) {
    for (int offsetY = -1; offsetY <= 1; ++offsetY) {
        for (int offsetX = -1; offsetX <= 1; ++offsetX) {
            if (offsetX == 0 && offsetY == 0) continue;
            ivec2 neighbor = ivec2(tile) + ivec2(offsetX, offsetY);
            if (!terrainVeinCoreTileSigned(neighbor, depth)) continue;
            return terrainClusterDeposit(
                uvec2(neighbor) / uvec2(TERRAIN_VEIN_CLUSTER_X, TERRAIN_VEIN_CLUSTER_Y), depth);
        }
    }
    return MAT_EMPTY;
}

bool terrainRubblePocketSelected(uvec2 tile) {
    return terrainHash(tile, 0xb04du) % 4u == 0u;
}

uint terrainRubbleDistance(ivec2 position, uvec2 tile) {
    uint seed = terrainHash(tile, 0x8a21u);
    ivec2 center = ivec2(2 + int((seed >> 5u) % 4u),
                         2 + int((seed >> 11u) % 4u));
    ivec2 local = ivec2(uint(position.x) % TERRAIN_TILE_SIZE,
                        uint(position.y) % TERRAIN_TILE_SIZE);
    ivec2 delta = local - center;
    return uint(delta.x * delta.x * 3 + delta.y * delta.y * 4);
}

uint terrainTrapResource(uvec2 cluster, uint depth) {
    uint roll = terrainHash(cluster, 0x3a71u) & 1023u;
    if (depth >= 160u && roll < 38u) return MAT_URANIUM;
    if (roll < 220u) return MAT_COPPER;
    if (roll < 360u) return MAT_ALUMINUM;
    return MAT_IRON_ORE;
}

bool terrainTrapSelected(uvec2 cluster, uint depth) {
    return depth >= 72u && depth <= 320u &&
           (terrainHash(cluster, 0x6f31u) & 1023u) < 42u;
}

uvec2 terrainSample(uint baseMaterial, ivec2 position, uint depth) {
    if (!terrainHostMaterial(baseMaterial)) return uvec2(baseMaterial, 0u);

    const uint trapWidthCells = TERRAIN_TRAP_CLUSTER_X * TERRAIN_TILE_SIZE;
    const uint trapHeightCells = TERRAIN_TRAP_CLUSTER_Y * TERRAIN_TILE_SIZE;
    uvec2 trapCluster = uvec2(position) / uvec2(trapWidthCells, trapHeightCells);
    if (baseMaterial == MAT_SAND && terrainTrapSelected(trapCluster, depth)) {
        uint seed = terrainHash(trapCluster, 0x7135u);
        ivec2 local = ivec2(uint(position.x) % trapWidthCells,
                            uint(position.y) % trapHeightCells);
        int centerX = 72 + int(seed % 80u);
        int centerY = 48 + int((seed >> 8u) % 28u);
        int radiusX = 28 + int((seed >> 15u) % 18u);
        int radiusY = 16 + int((seed >> 21u) % 10u);
        int dx = local.x - centerX;
        int dy = local.y - centerY;
        int ellipse = dx * dx * radiusY * radiusY + dy * dy * radiusX * radiusX;
        int limit = radiusX * radiusX * radiusY * radiusY;
        if (ellipse <= limit) return uvec2(MAT_EMPTY, TERRAIN_FLAG_SAND_TRAP);
        int roofY = centerY - radiusY + (dx * dx * 5) / (radiusX * radiusX);
        bool looseRoof = abs(dx) <= radiusX && local.y >= roofY - 4 && local.y <= roofY + 3;
        if (looseRoof) {
            bool concentrated = abs(dx) * 3 < radiusX * 2;
            bool resourceCell = concentrated && terrainHash(uvec2(position), 0x10c5u) % 11u == 0u;
            uint material = resourceCell ? terrainTrapResource(trapCluster, depth) : MAT_SAND;
            return uvec2(material, TERRAIN_FLAG_DELIBERATE_LOOSE | TERRAIN_FLAG_SAND_TRAP);
        }
    }

    uvec2 tile = uvec2(position) / TERRAIN_TILE_SIZE;
    uvec2 cluster = tile / uvec2(TERRAIN_VEIN_CLUSTER_X, TERRAIN_VEIN_CLUSTER_Y);
    uint deposit = terrainClusterDeposit(cluster, depth);
    if (deposit != MAT_EMPTY && terrainVeinCoreTile(tile, depth))
        return uvec2(deposit, TERRAIN_FLAG_STRUCTURAL);

    uint neighboringDeposit = terrainNeighboringVeinMaterial(tile, depth);
    if ((baseMaterial == MAT_SAND || baseMaterial == MAT_SILT) &&
        neighboringDeposit != MAT_EMPTY && terrainRubblePocketSelected(tile)) {
        uint distance = terrainRubbleDistance(position, tile);
        if (distance <= 11u) {
            bool resourceCell = terrainHash(uvec2(position), 0x441du) % 5u == 0u;
            return uvec2(resourceCell ? neighboringDeposit : MAT_EMPTY,
                         TERRAIN_FLAG_DELIBERATE_LOOSE);
        }
        if (distance <= 28u)
            return uvec2(baseMaterial, TERRAIN_FLAG_DELIBERATE_LOOSE);
    }

    return uvec2(baseMaterial, TERRAIN_FLAG_STRUCTURAL);
}

#endif
''')

          # ------------------------------------------------------------------
          # World substrate: preserve the authored 640x360 scene, but continue a
          # natural surface across every column outside it. Four geology layers
          # use deterministic dither bands instead of hard biome seams.
          # ------------------------------------------------------------------
          world_layout = load("include/sandhybrid/world_layout.hpp")
          world_layout = world_layout.replace(
              "    return resident_ground_host_material(material) ||\n",
              "    return material == Material::grass || resident_ground_host_material(material) ||\n",
              1)
          pattern = r'''\[\[nodiscard\]\] constexpr terrain::Sample resident_ground_sample\(.*?\n\[\[nodiscard\]\] constexpr Material resident_substrate_material\('''
          replacement = r'''[[nodiscard]] constexpr terrain::Sample resident_ground_sample(
    const Material base_material,
    const std::uint32_t x,
    const std::uint32_t y,
    const std::uint32_t depth) noexcept {
    return terrain::sample(base_material, x, y, depth);
}

[[nodiscard]] constexpr Material resident_biome_material(
    const std::uint32_t biome_index) noexcept {
    const auto roll = resident_ground_hash(biome_index, 0x4b17u) % 3u;
    return roll == 0u ? Material::dirt :
           (roll == 1u ? Material::sand : Material::silt);
}

[[nodiscard]] constexpr Material resident_transition_material(
    const Material first,
    const Material second,
    const std::int32_t signed_distance,
    const std::int32_t half_width,
    const std::uint32_t x,
    const std::uint32_t y,
    const std::uint32_t salt) noexcept {
    if (signed_distance <= -half_width) return first;
    if (signed_distance >= half_width) return second;
    const auto numerator = static_cast<std::uint32_t>(signed_distance + half_width);
    const auto denominator = static_cast<std::uint32_t>(half_width * 2);
    const auto threshold = numerator * 256u / denominator;
    return (resident_ground_hash(x / 2u, y / 2u + salt) & 255u) < threshold
        ? second : first;
}

[[nodiscard]] constexpr Material resident_surface_biome(
    const std::uint32_t world_width,
    const std::uint32_t x,
    const std::uint32_t y) noexcept {
    const auto span = (std::max)(world_width / 12u, 256u);
    const auto biome = x / span;
    const auto local = x % span;
    const auto first = resident_biome_material(biome);
    const auto second = resident_biome_material(biome + 1u);
    constexpr std::uint32_t blend_width = 96u;
    if (local + blend_width < span) return first;
    const auto signed_distance = static_cast<std::int32_t>(local) -
        static_cast<std::int32_t>(span - blend_width / 2u);
    return resident_transition_material(first, second, signed_distance,
                                        static_cast<std::int32_t>(blend_width / 2u),
                                        x, y, biome * 41u + 9u);
}

[[nodiscard]] constexpr Material resident_layer_material(
    const std::uint32_t zone,
    const std::int32_t local_y,
    const std::int32_t boundary_a,
    const std::int32_t boundary_b,
    const std::int32_t boundary_c,
    const std::uint32_t x,
    const std::uint32_t y) noexcept {
    const Material first = zone == 0u ? Material::dirt :
        (zone == 1u ? Material::sand : Material::silt);
    const Material second = zone == 0u ? Material::sand :
        (zone == 1u ? Material::silt : Material::dirt);
    const Material third = zone == 0u ? Material::silt :
        (zone == 1u ? Material::dirt : Material::stone);
    const Material fourth = Material::stone;
    constexpr std::int32_t blend = 14;
    if (local_y < boundary_a + blend)
        return resident_transition_material(first, second, local_y - boundary_a,
                                            blend, x, y, zone * 31u + 3u);
    if (local_y < boundary_b + blend)
        return resident_transition_material(second, third, local_y - boundary_b,
                                            blend, x, y, zone * 31u + 11u);
    return resident_transition_material(third, fourth, local_y - boundary_c,
                                        blend, x, y, zone * 31u + 19u);
}

[[nodiscard]] constexpr terrain::Sample resident_substrate_sample(
    const std::uint32_t world_width,
    const std::uint32_t world_height,
    const std::uint32_t x,
    const std::uint32_t y) noexcept {
    if (x >= world_width || y >= world_height || world_width == 0u || world_height == 0u)
        return {Material::empty, false, false, false};

    const auto scene_left = authored_scene_origin_x(world_width);
    const auto scene_right = (std::min)(world_width, scene_left + pre_expansion_world_width);
    const auto scene_top = authored_scene_origin_y(world_height);
    const auto scene_bottom = (std::min)(world_height, scene_top + pre_expansion_world_height);
    const auto horizontal_shell = (std::min)(world_width, resident_world_shell_cells);
    const auto top_shell = (std::min)(world_height, resident_world_shell_cells);
    const bool side_shell = x < horizontal_shell || x >= world_width - horizontal_shell;
    if (side_shell || y < top_shell) return {Material::stone, true, false, false};
    if (y < scene_top) return {Material::empty, false, false, false};

    const auto scene_height = scene_bottom - scene_top;
    const auto foundation = (std::min)(scene_height, authored_scene_foundation_cells);
    const auto foundation_start = scene_bottom - foundation;
    const bool outside_authored_scene = x < scene_left || x >= scene_right;
    if (y < scene_bottom) {
        if (y >= foundation_start) return {Material::stone, true, false, false};
        if (!outside_authored_scene) return {Material::empty, false, false, false};

        const auto nominal_surface = static_cast<std::int32_t>(scene_bottom) -
            static_cast<std::int32_t>(foundation * 2u);
        const auto surface_y = nominal_surface +
            resident_ground_boundary_offset(x, 0x63u, 5);
        if (static_cast<std::int32_t>(y) < surface_y)
            return {Material::empty, false, false, false};
        const auto biome = resident_surface_biome(world_width, x, y);
        if (static_cast<std::int32_t>(y) == surface_y && biome == Material::dirt)
            return {Material::grass, true, false, false};
        return {biome, true, false, false};
    }

    const auto bottom_shell = (std::min)(world_height, resident_world_shell_cells);
    const auto bottom_shell_start = world_height - bottom_shell;
    if (y >= bottom_shell_start) return {Material::stone, true, false, false};

    const auto lava_room = bottom_shell_start > scene_bottom
        ? bottom_shell_start - scene_bottom : 0u;
    const auto lava_thickness = (std::min)(lava_room, resident_world_lava_cells);
    const auto lava_start = bottom_shell_start - lava_thickness;
    if (y >= lava_start) return {Material::lava, false, true, false};

    const auto cap_room = lava_start > scene_bottom ? lava_start - scene_bottom : 0u;
    const auto cap_thickness = (std::min)(cap_room, resident_world_shell_cells);
    const auto lava_cap_start = lava_start - cap_thickness;
    if (y >= lava_cap_start) return {Material::stone, true, false, false};

    const auto depth = y - scene_bottom;
    const auto zone_height = pre_expansion_world_height;
    const auto zone = (std::min)(depth / zone_height, subterranean_zone_count - 1u);
    const auto local_y = static_cast<std::int32_t>(depth % zone_height);
    const auto boundary_a = 96 + resident_ground_boundary_offset(x, zone * 17u + 3u, 22);
    const auto boundary_b = 218 + resident_ground_boundary_offset(x, zone * 19u + 7u, 28);
    const auto boundary_c = 302 + resident_ground_boundary_offset(x, zone * 23u + 11u, 20);
    auto geology = resident_layer_material(zone, local_y, boundary_a, boundary_b,
                                           boundary_c, x, y);

    const auto mud_seed = resident_ground_hash(x / 32u, y / 24u + zone * 97u);
    const auto mud_local_x = static_cast<std::int32_t>(x % 32u) - 16;
    const auto mud_local_y = static_cast<std::int32_t>(y % 24u) - 12;
    if ((mud_seed & 63u) == 0u &&
        mud_local_x * mud_local_x * 9 + mud_local_y * mud_local_y * 16 < 1600)
        geology = Material::mud;

    return resident_ground_sample(geology, x, y, depth);
}

[[nodiscard]] constexpr Material resident_substrate_material('''
          world_layout, count = re.subn(pattern, replacement, world_layout, count=1, flags=re.S)
          if count != 1:
              raise RuntimeError("world_layout.hpp: failed to replace substrate policy")
          save("include/sandhybrid/world_layout.hpp", world_layout)

          reset = load("shaders/reset.comp")
          substrate_pattern = r'''// Every scene occupies the crystal-marker camera footprint:.*?\n\}\n\nbool residentSubstrateStructural'''
          substrate_replacement = r'''// Every scene occupies the crystal-marker camera footprint. Two complete
// rows above it remain sky. Outside the authored 640x360 footprint, a natural
// surface continues across every world column; beneath it, biome seams are
// dithered across broad bands instead of changing on a hard line.
uint residentBiomeMaterial(uint biomeIndex) {
    uint roll = residentGroundHash(ivec2(int(biomeIndex), 0x4b17)) % 3u;
    return roll == 0u ? MAT_DIRT : (roll == 1u ? MAT_SAND : MAT_SILT);
}

uint residentTransitionMaterial(uint first, uint second, int signedDistance,
                                int halfWidth, ivec2 position, uint salt) {
    if (signedDistance <= -halfWidth) return first;
    if (signedDistance >= halfWidth) return second;
    uint threshold = uint(signedDistance + halfWidth) * 256u / uint(halfWidth * 2);
    return (residentGroundHash(ivec2(position.x / 2, position.y / 2 + int(salt))) & 255u) < threshold
        ? second : first;
}

uint residentSurfaceBiome(ivec2 position) {
    uint span = max(pc.width / 12u, 256u);
    uint biome = uint(position.x) / span;
    uint local = uint(position.x) % span;
    uint first = residentBiomeMaterial(biome);
    uint second = residentBiomeMaterial(biome + 1u);
    const uint blendWidth = 96u;
    if (local + blendWidth < span) return first;
    int signedDistance = int(local) - int(span - blendWidth / 2u);
    return residentTransitionMaterial(first, second, signedDistance,
                                      int(blendWidth / 2u), position,
                                      biome * 41u + 9u);
}

uint residentLayerMaterial(int zone, int localY, int boundaryA, int boundaryB,
                           int boundaryC, ivec2 position) {
    uint first = zone == 0 ? MAT_DIRT : (zone == 1 ? MAT_SAND : MAT_SILT);
    uint second = zone == 0 ? MAT_SAND : (zone == 1 ? MAT_SILT : MAT_DIRT);
    uint third = zone == 0 ? MAT_SILT : (zone == 1 ? MAT_DIRT : MAT_STONE);
    const int blend = 14;
    if (localY < boundaryA + blend)
        return residentTransitionMaterial(first, second, localY - boundaryA,
                                          blend, position, uint(zone * 31 + 3));
    if (localY < boundaryB + blend)
        return residentTransitionMaterial(second, third, localY - boundaryB,
                                          blend, position, uint(zone * 31 + 11));
    return residentTransitionMaterial(third, MAT_STONE, localY - boundaryC,
                                      blend, position, uint(zone * 31 + 19));
}

uvec2 residentWorldSubstrateSample(ivec2 worldPosition) {
    int width = int(pc.width);
    int height = int(pc.height);
    int sceneLeft = authoredWorldOrigin().x;
    int sceneRight = min(width, sceneLeft + AUTHORED_WORLD_CELLS.x);
    int sceneTop = authoredWorldOrigin().y;
    int sceneBottom = min(height, sceneTop + AUTHORED_WORLD_CELLS.y);
    int horizontalShell = min(width, BRICK_SIZE);
    int topShell = min(height, BRICK_SIZE);
    bool sideShell = worldPosition.x < horizontalShell ||
                     worldPosition.x >= width - horizontalShell;
    if (sideShell || worldPosition.y < topShell)
        return uvec2(MAT_STONE, TERRAIN_FLAG_STRUCTURAL);
    if (worldPosition.y < sceneTop) return uvec2(MAT_EMPTY, 0u);

    int foundation = min(sceneBottom - sceneTop, BRICK_SIZE);
    int foundationStart = sceneBottom - foundation;
    bool outsideAuthored = worldPosition.x < sceneLeft || worldPosition.x >= sceneRight;
    if (worldPosition.y < sceneBottom) {
        if (worldPosition.y >= foundationStart)
            return uvec2(MAT_STONE, TERRAIN_FLAG_STRUCTURAL);
        if (!outsideAuthored) return uvec2(MAT_EMPTY, 0u);
        int nominalSurface = sceneBottom - foundation * 2;
        int surfaceY = nominalSurface + residentGroundBoundaryOffset(worldPosition.x, 0x63u, 5);
        if (worldPosition.y < surfaceY) return uvec2(MAT_EMPTY, 0u);
        uint biome = residentSurfaceBiome(worldPosition);
        if (worldPosition.y == surfaceY && biome == MAT_DIRT)
            return uvec2(MAT_GRASS, TERRAIN_FLAG_STRUCTURAL);
        return uvec2(biome, TERRAIN_FLAG_STRUCTURAL);
    }

    int bottomShell = min(height, BRICK_SIZE);
    int bottomShellStart = height - bottomShell;
    if (worldPosition.y >= bottomShellStart)
        return uvec2(MAT_STONE, TERRAIN_FLAG_STRUCTURAL);
    int lavaRoom = max(bottomShellStart - sceneBottom, 0);
    int lavaThickness = min(lavaRoom, BRICK_SIZE * 2);
    int lavaStart = bottomShellStart - lavaThickness;
    if (worldPosition.y >= lavaStart)
        return uvec2(MAT_LAVA, TERRAIN_FLAG_DELIBERATE_LOOSE);
    int capRoom = max(lavaStart - sceneBottom, 0);
    int capThickness = min(capRoom, BRICK_SIZE);
    int lavaCapStart = lavaStart - capThickness;
    if (worldPosition.y >= lavaCapStart)
        return uvec2(MAT_STONE, TERRAIN_FLAG_STRUCTURAL);

    int depth = worldPosition.y - sceneBottom;
    int zone = min(depth / AUTHORED_WORLD_CELLS.y, 2);
    int localY = depth % AUTHORED_WORLD_CELLS.y;
    int boundaryA = 96 + residentGroundBoundaryOffset(worldPosition.x, uint(zone * 17 + 3), 22);
    int boundaryB = 218 + residentGroundBoundaryOffset(worldPosition.x, uint(zone * 19 + 7), 28);
    int boundaryC = 302 + residentGroundBoundaryOffset(worldPosition.x, uint(zone * 23 + 11), 20);
    uint geology = residentLayerMaterial(zone, localY, boundaryA, boundaryB,
                                         boundaryC, worldPosition);

    uint mudSeed = residentGroundHash(ivec2(worldPosition.x / 32,
                                            worldPosition.y / 24 + zone * 97));
    ivec2 mudLocal = ivec2(worldPosition.x % 32 - 16, worldPosition.y % 24 - 12);
    if ((mudSeed & 63u) == 0u &&
        mudLocal.x * mudLocal.x * 9 + mudLocal.y * mudLocal.y * 16 < 1600)
        geology = MAT_MUD;
    return residentGroundSample(geology, worldPosition, depth);
}

bool residentSubstrateStructural'''
          reset, count = re.subn(substrate_pattern, substrate_replacement, reset,
                                 count=1, flags=re.S)
          if count != 1:
              raise RuntimeError("reset.comp: failed to replace resident substrate")

          # Volcano used pc.width while p is authored-local; in a 10240-wide
          # world that put the lake thousands of cells beyond the 640-cell scene.
          volcano_pattern = r'''uint volcanoMaterial\(ivec2 p\) \{.*?\n\}\nuint waterworksMaterial'''
          volcano_replacement = r'''uint volcanoMaterial(ivec2 p) {
    ivec2 world = worldBrickSize();
    ivec2 b = brickCoordinate(p);
    int floorRow = world.y - 2;
    int center = max(18, world.x * 2 / 5);
    int top = max(4, floorRow - 35);
    uint material = MAT_EMPTY;

    if (b.y >= floorRow) return MAT_STONE;
    int depth = b.y - top;
    int halfWidth = max(0, depth * 2 / 3 + 4);
    bool insideCone = b.y >= top && b.y < floorRow && abs(b.x - center) <= halfWidth;
    if (insideCone) material = MAT_STONE;

    // Large pressure reservoir and a three-brick throat keep visible lava in
    // the volcano instead of draining the scene immediately.
    ivec2 chamberCenter = ivec2(center, floorRow - 8);
    ivec2 chamberDelta = b - chamberCenter;
    bool chamberInterior = chamberDelta.x * chamberDelta.x * 2 +
                           chamberDelta.y * chamberDelta.y * 4 <= 96;
    if (chamberInterior) material = MAT_LAVA;
    if (abs(b.x - center) <= 2 && b.y >= top + 4 && b.y <= chamberCenter.y)
        material = MAT_LAVA;
    if (b.y == chamberCenter.y + 3 && abs(b.x - center) <= 3)
        material = MAT_MAGMA_VENT;

    // Open crater with a retained lava lake and a vent at its base.
    int craterCenterX = center * BRICK_SIZE + BRICK_SIZE / 2;
    int craterDx = abs(p.x - craterCenterX);
    int craterSurface = (top + 4) * BRICK_SIZE;
    int craterBed = craterSurface + 18 + max(0, 34 - craterDx) / 2;
    if (craterDx <= 44 && p.y >= craterSurface && p.y < craterBed)
        material = MAT_LAVA;
    if (craterDx <= 52 && p.y >= craterBed && p.y < craterBed + 6)
        material = MAT_STONE;
    if (p.y >= craterSurface - 10 && p.y < craterSurface && craterDx <= 48)
        material = MAT_EMPTY;
    if (p.y == craterBed - 1 && craterDx <= 6)
        material = MAT_MAGMA_VENT;

    // Natural map-scale water lake. All coordinates are authored-local.
    int authoredWidth = min(int(pc.width), AUTHORED_WORLD_CELLS.x);
    int lakeLeft = max((center + 18) * BRICK_SIZE, authoredWidth * 3 / 5);
    int lakeRight = authoredWidth - BRICK_SIZE * 3;
    int lakeCenter = (lakeLeft + lakeRight) / 2;
    int lakeHalfSpan = max(24, (lakeRight - lakeLeft) / 2);
    int lakeSurface = (floorRow - 9) * BRICK_SIZE + 2;
    int lakeFloorLimit = floorRow * BRICK_SIZE - 2;
    int lakeDx = abs(p.x - lakeCenter);
    if (lakeRight > lakeLeft && lakeDx <= lakeHalfSpan) {
        int centerFactor = lakeHalfSpan - lakeDx;
        int bowlDepth = 8 + centerFactor * 62 / max(lakeHalfSpan, 1);
        int rough = int(hash32(uint(p.x / 7) ^ pc.seed ^ 0x1a6eu) & 3u) - 1;
        int bedY = min(lakeFloorLimit, lakeSurface + bowlDepth + rough);
        if (p.y >= lakeSurface && p.y < bedY) material = MAT_WATER;
        else if (p.y >= bedY && p.y < lakeFloorLimit + 5)
            material = p.y < bedY + 6 ? MAT_DIRT : MAT_STONE;
        if (p.y == lakeSurface - 1 && lakeDx > lakeHalfSpan - BRICK_SIZE * 2)
            material = MAT_GRASS;
    }

    if (material == MAT_EMPTY && p.y < craterSurface &&
        p.y > max(8, top * BRICK_SIZE - 128) && craterDx < 118 &&
        (hash32(indexOf(p) ^ pc.seed ^ 0x51a9u) % 31u) == 0u)
        material = MAT_SMOKE;
    return material;
}
