name: Publish SandHybrid v2.4.7

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  actions: read
  pull-requests: write

jobs:
  publish:
    if: github.head_ref == 'agent/publish-v247'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout merged release source
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Verify accepted CI
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: '30723137326'
          ACCEPTED_HEAD: '1b882aed522e53441381ef049d50caae8284e568'
        shell: bash
        run: |
          set -euo pipefail
          test "$(gh run view "$RUN_ID" --repo "$GITHUB_REPOSITORY" --json conclusion --jq .conclusion)" = success
          test "$(gh run view "$RUN_ID" --repo "$GITHUB_REPOSITORY" --json headSha --jq .headSha)" = "$ACCEPTED_HEAD"

      - name: Download accepted packages and checksums
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: '30723137326'
        shell: bash
        run: |
          set -euo pipefail
          rm -rf release-assets
          mkdir -p release-assets/windows release-assets/linux
          gh run download "$RUN_ID" --repo "$GITHUB_REPOSITORY" \
            --name SandHybrid-Windows-x64-v2.4.7 --dir release-assets/windows
          gh run download "$RUN_ID" --repo "$GITHUB_REPOSITORY" \
            --name SandHybrid-Linux-x64-v2.4.7 --dir release-assets/linux
          mapfile -t packages < <(find release-assets -type f \( -name '*.zip' -o -name '*.tar.gz' \) | sort)
          test "${#packages[@]}" -eq 2
          (cd release-assets && sha256sum windows/* linux/* > SHA256SUMS.txt)
          cat release-assets/SHA256SUMS.txt

      - name: Publish and verify v2.4.7
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TARGET: 'b7bdbee7b450f7402af437705eefecc8468d7bca'
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t packages < <(find release-assets -type f \( -name '*.zip' -o -name '*.tar.gz' \) | sort)
          assets=("${packages[@]}" release-assets/SHA256SUMS.txt)
          if gh release view v2.4.7 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload v2.4.7 "${assets[@]}" --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create v2.4.7 "${assets[@]}" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$RELEASE_TARGET" \
              --title 'SandHybrid v2.4.7' \
              --notes-file RELEASE_NOTES_v2.4.7.md
          fi
          test "$(gh release view v2.4.7 --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)" = false
          test "$(gh release view v2.4.7 --repo "$GITHUB_REPOSITORY" --json isPrerelease --jq .isPrerelease)" = false
          test "$(gh release view v2.4.7 --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets | length')" -eq 3

      - name: Record release evidence
        shell: bash
        run: |
          set -euo pipefail
          if ! grep -q '^## SandHybrid v2.4.7 release evidence$' missioncache.md; then
            {
              printf '\n## SandHybrid v2.4.7 release evidence\n\n'
              printf -- '- Release tag: `v2.4.7` (`SandHybrid v2.4.7`)\n'
              printf -- '- Release target: `b7bdbee7b450f7402af437705eefecc8468d7bca`\n'
              printf -- '- Accepted Windows/Linux CI: run `30723137326`, source head `1b882aed522e53441381ef049d50caae8284e568`\n'
              printf -- '- Packages: `SandHybrid-Windows-x64-v2.4.7.zip`, `SandHybrid-Linux-x64-v2.4.7.tar.gz`, and `SHA256SUMS.txt`\n\n'
              printf '```text\n'
              cat release-assets/SHA256SUMS.txt
              printf '```\n'
              printf '\nActive cache count at publication: 72 missions — 29 PARTIAL, 27 OPEN, 15 REGRESSION, and 1 DEFERRED. Runtime-observed missions remain active until accepted in the packaged Windows Vulkan build.\n'
            } >> missioncache.md
            git config user.name github-actions[bot]
            git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            git add missioncache.md
            git commit -m 'Record SandHybrid v2.4.7 release evidence'
            git push origin HEAD:main
          fi

      - name: Close publisher PR and remove temporary branches
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        shell: bash
        run: |
          set -euo pipefail
          gh pr close "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" \
            --comment 'SandHybrid v2.4.7 published and verified; temporary branches removed.'
          git push origin --delete agent/fix-half-water-tiles-sluice-debug || true
          git push origin --delete agent/publish-v247 || true
