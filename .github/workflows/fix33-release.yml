name: SandHybrid Fix33 Release

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/fix33-release.yml

permissions:
  contents: write

env:
  SOURCE_SHA: 3f6834a7b5bc997f291b944d11159ae7371f6e75
  VCPKG_COMMIT: 04a735608afac5844e86fc91d6ba2112cac613c1

jobs:
  announce:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Record release run
        env:
          RUN_ID: ${{ github.run_id }}
          RUN_NUMBER: ${{ github.run_number }}
          HEAD_SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          cat > fix33-release-status.json <<EOF
          {
            "run_id": ${RUN_ID},
            "run_number": ${RUN_NUMBER},
            "status": "running",
            "source_sha": "${SOURCE_SHA}",
            "head_sha": "${HEAD_SHA}",
            "run_url": "${RUN_URL}"
          }
          EOF
          git config user.name 'github-actions[bot]]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add fix33-release-status.json
          git commit -m 'Record Fix33 release run [skip ci]'
          git push origin HEAD:main

  windows:
    needs: announce
    runs-on: windows-2022
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_SHA }}
      - name: Bootstrap pinned vcpkg
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = Join-Path $env:RUNNER_TEMP 'vcpkg'
          git clone --filter=blob:none https://github.com/microsoft/vcpkg.git $root
          git -C $root checkout $env:VCPKG_COMMIT
          & (Join-Path $root 'bootstrap-vcpkg.bat') -disableMetrics
          "VCPKG_ROOT=$root" | Out-File -FilePath $env:GITHUB_ENV -Append
      - name: Configure Windows Release
        shell: pwsh
        run: |
          cmake -S . -B build/windows -G "Visual Studio 17 2022" -A x64 `
            -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake" `
            -DVCPKG_TARGET_TRIPLET=x64-windows `
            -DVCPKG_HOST_TRIPLET=x64-windows `
            -DEPOCH_SAND_WARNINGS_AS_ERRORS=ON `
            -DEPOCH_SAND_ENABLE_VALIDATION=OFF `
            -DBUILD_TESTING=ON
      - name: Build Windows Release
        shell: pwsh
        run: cmake --build build/windows --config Release --parallel
      - name: Run Windows contracts
        shell: pwsh
        run: ctest --test-dir build/windows -C Release --output-on-failure
      - name: Package Windows x64
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $dist = Join-Path $env:GITHUB_WORKSPACE 'dist'
          $stage = Join-Path $dist 'SandHybrid_Windows_x64_Fix33'
          $archive = Join-Path $dist 'SandHybrid_Windows_x64_Fix33.zip'
          New-Item -ItemType Directory -Path $stage -Force | Out-Null
          Copy-Item 'build/windows/Release/epoch_sand.exe' (Join-Path $stage 'SandHybrid.exe') -Force
          Copy-Item 'build/windows/Release/shaders' (Join-Path $stage 'shaders') -Recurse -Force
          Copy-Item 'build/windows/Release/scenes' (Join-Path $stage 'scenes') -Recurse -Force
          Copy-Item README.md, HIERARCHICAL_SIMULATION.md, LICENSE -Destination $stage -Force
          Set-Content -LiteralPath (Join-Path $stage 'run.bat') -Value @('@echo off', 'cd /d "%~dp0"', 'SandHybrid.exe') -Encoding ascii
          Compress-Archive -Path (Join-Path $stage '*') -DestinationPath $archive -CompressionLevel Optimal
          $hash = (Get-FileHash -Algorithm SHA256 $archive).Hash.ToLowerInvariant()
          Set-Content -LiteralPath (Join-Path $dist 'SandHybrid_Windows_x64_Fix33.sha256') -Value "$hash  SandHybrid_Windows_x64_Fix33.zip" -Encoding ascii
      - uses: actions/upload-artifact@v4
        with:
          name: SandHybrid_Windows_x64_Fix33
          path: |
            dist/SandHybrid_Windows_x64_Fix33.zip
            dist/SandHybrid_Windows_x64_Fix33.sha256
          if-no-files-found: error

  linux:
    needs: announce
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      CC: gcc-14
      CXX: g++-14
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_SHA }}
      - name: Install Linux prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build gcc-14 g++-14 pkg-config libvulkan-dev libxcb1-dev libx11-xcb-dev
      - name: Bootstrap pinned vcpkg
        run: |
          root="$RUNNER_TEMP/vcpkg"
          git clone --filter=blob:none https://github.com/microsoft/vcpkg.git "$root"
          git -C "$root" checkout "$VCPKG_COMMIT"
          "$root/bootstrap-vcpkg.sh" -disableMetrics
          echo "VCPKG_ROOT=$root" >> "$GITHUB_ENV"
      - name: Configure Linux Release
        run: |
          cmake -S . -B build/linux -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE="$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake" \
            -DVCPKG_TARGET_TRIPLET=x64-linux \
            -DVCPKG_HOST_TRIPLET=x64-linux \
            -DEPOCH_SAND_WARNINGS_AS_ERRORS=ON \
            -DEPOCH_SAND_ENABLE_VALIDATION=OFF \
            -DBUILD_TESTING=ON \
            -DCMAKE_CXX_FLAGS=-Wno-missing-field-initializers
      - name: Build Linux Release
        run: cmake --build build/linux --parallel
      - name: Run Linux contracts
        run: ctest --test-dir build/linux --output-on-failure
      - name: Package Linux x64
        run: |
          set -euo pipefail
          mkdir -p dist/SandHybrid_Linux_x64_Fix33
          cp build/linux/epoch_sand dist/SandHybrid_Linux_x64_Fix33/SandHybrid
          cp -R build/linux/shaders dist/SandHybrid_Linux_x64_Fix33/shaders
          cp -R build/linux/scenes dist/SandHybrid_Linux_x64_Fix33/scenes
          cp README.md HIERARCHICAL_SIMULATION.md LICENSE dist/SandHybrid_Linux_x64_Fix33/
          printf '#!/usr/bin/env sh\ncd -- "$(dirname -- "$0")"\nexec ./SandHybrid "$@"\n' > dist/SandHybrid_Linux_x64_Fix33/run.sh
          chmod +x dist/SandHybrid_Linux_x64_Fix33/SandHybrid dist/SandHybrid_Linux_x64_Fix33/run.sh
          tar -C dist -czf dist/SandHybrid_Linux_x64_Fix33.tar.gz SandHybrid_Linux_x64_Fix33
          cd dist
          sha256sum SandHybrid_Linux_x64_Fix33.tar.gz > SandHybrid_Linux_x64_Fix33.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: SandHybrid_Linux_x64_Fix33
          path: |
            dist/SandHybrid_Linux_x64_Fix33.tar.gz
            dist/SandHybrid_Linux_x64_Fix33.sha256
          if-no-files-found: error

  release:
    needs: [windows, linux]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: SandHybrid_*_Fix33
          path: release
          merge-multiple: true
      - name: Publish v1.8.0-fix33
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ls -la release
          tag='v1.8.0-fix33'
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release delete "$tag" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag
          fi
          gh release create "$tag" \
            release/SandHybrid_Windows_x64_Fix33.zip \
            release/SandHybrid_Windows_x64_Fix33.sha256 \
            release/SandHybrid_Linux_x64_Fix33.tar.gz \
            release/SandHybrid_Linux_x64_Fix33.sha256 \
            --repo "$GITHUB_REPOSITORY" \
            --target "$SOURCE_SHA" \
            --title 'SandHybrid Fix33 — Hierarchical Simulation on Fix32' \
            --notes 'Fix33 starts from the current Fix32 FastFreddy source. It preserves the living biohazard bee swarm, zoomable cursor editor, readable keymap, all eight GUI material groups, and all 65 material buttons. It adds homogeneous 8x8 macro-cell bulk movement, 64x64 sleeping chunks, bounded chunk wakeups, and hierarchy diagnostics in the existing debug GUI. Windows and Linux Release builds and all C++23 contracts passed before publication.'
