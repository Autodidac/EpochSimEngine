name: Finalize SandHybrid v2.5.7 debug and trap pass

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: finalize-v257-debug-traps-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  finalize:
    if: github.head_ref == 'agent/v257-air-water-equilibrium'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/v257-air-water-equilibrium
          fetch-depth: 0

      - name: Apply cached v2.5.7 source patch
        shell: bash
        run: |
          set -euo pipefail
          cat tools/v257-debug-traps.part00 \
              tools/v257-debug-traps.part01 \
              tools/v257-debug-traps.part02 \
              tools/v257-debug-traps.part03 \
              tools/v257-debug-traps.part04 \
              tools/v257-debug-traps.part05 \
              tools/v257-debug-traps.part06 \
            | base64 --decode \
            | gzip --decompress > /tmp/v257-debug-traps.patch
          git apply --check /tmp/v257-debug-traps.patch
          git apply /tmp/v257-debug-traps.patch

      - name: Validate mission, shader, and core contracts
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/validate_shader_contracts.py
          python3 tools/validate_mission_cache.py
          python3 tools/validate_no_simulation_coroutines.py
          python3 tools/validate_project_branding.py
          cmake -S . -B build/v257-finalize -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DSANDHYBRID_BUILD_APP=OFF \
            -DSANDHYBRID_BUILD_VULKAN_RUNTIME=OFF \
            -DSANDHYBRID_WARNINGS_AS_ERRORS=ON \
            -DBUILD_TESTING=ON
          cmake --build build/v257-finalize --parallel
          ctest --test-dir build/v257-finalize --output-on-failure

      - name: Commit permanent source changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add CHANGELOG.md RELEASE_NOTES_v2.5.7.md missioncache.md \
            tools/generate_ui_text.py tools/validate_shader_contracts.py \
            include/sandhybrid/terrain_generation.hpp include/sandhybrid/ui_text_data.hpp \
            shaders/ui_text.glsl shaders/debug_stats.glsl shaders/debug_stats.comp \
            shaders/fullscreen.frag shaders/terrain_generation.glsl \
            tests/terrain_generation_contract.cpp
          git commit -m 'Complete v2.5.7 debug telemetry and trap geology'
          git push origin HEAD:agent/v257-air-water-equilibrium
