name: SandHybrid CI and Release

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sandhybrid-v256-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  prepare:
    runs-on: ubuntu-24.04
    outputs:
      needs_patch: ${{ steps.payload.outputs.needs_patch }}
    steps:
      - uses: actions/checkout@v4
      - id: payload
        name: Detect runtime evidence payload
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f tools/v256_runtime_patch.part0 && -f tools/v256_runtime_patch.part1 && -f tools/v256_runtime_patch.part2 && -f tools/v256_runtime_patch.part3 ]]; then
            echo 'needs_patch=true' >> "$GITHUB_OUTPUT"
          else
            echo 'needs_patch=false' >> "$GITHUB_OUTPUT"
          fi

  apply-evidence:
    needs: prepare
    if: >-
      github.event_name == 'pull_request' &&
      github.head_ref == 'agent/debug-map-inventory-v256' &&
      needs.prepare.outputs.needs_patch == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/debug-map-inventory-v256
          fetch-depth: 0

      - name: Apply screenshot-derived runtime fixes
        shell: bash
        run: |
          set -euo pipefail
          cat tools/v256_runtime_patch.part0 tools/v256_runtime_patch.part1 tools/v256_runtime_patch.part2 tools/v256_runtime_patch.part3 | base64 --decode | gzip --decompress > /tmp/v256-runtime.patch
          git apply --check /tmp/v256-runtime.patch
          git apply /tmp/v256-runtime.patch

      - name: Validate runtime, cache, and propagation contracts
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile tools/validate_shader_contracts.py
          python3 tools/validate_shader_contracts.py
          python3 tools/validate_mission_cache.py
          python3 tools/validate_no_simulation_coroutines.py
          python3 tools/validate_project_branding.py
          cmake -S . -B build/runtime-evidence -G Ninja -DCMAKE_BUILD_TYPE=Release -DSANDHYBRID_BUILD_APP=OFF -DSANDHYBRID_BUILD_VULKAN_RUNTIME=OFF -DSANDHYBRID_WARNINGS_AS_ERRORS=ON -DBUILD_TESTING=ON
          cmake --build build/runtime-evidence --parallel
          ctest --test-dir build/runtime-evidence --output-on-failure

      - name: Commit permanent fixes and clean payloads
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          rm -f tools/v256_scene_evidence_patch.gz.b64 tools/v256_runtime_patch.part0 tools/v256_runtime_patch.part1 tools/v256_runtime_patch.part2 tools/v256_runtime_patch.part3
          git add -A
          git commit -m 'Fix v2.5.6 load volcano ash and motion regressions'
          git push origin HEAD:agent/debug-map-inventory-v256

  build:
    needs: prepare
    if: needs.prepare.outputs.needs_patch != 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            triplet: x64-windows
            artifact: SandHybrid-Windows-x64-v2.5.6
          - os: ubuntu-24.04
            triplet: x64-linux
            artifact: SandHybrid-Linux-x64-v2.5.6
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4

      - name: Validate generated and shader contracts
        run: python tools/validate_shader_contracts.py

      - name: Validate canonical mission cache
        run: python tools/validate_mission_cache.py

      - name: Reject simulation coroutines
        run: python tools/validate_no_simulation_coroutines.py

      - name: Enforce SandHybrid branding
        run: python tools/validate_project_branding.py

      - name: Install Linux host packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libxcb1-dev

      - name: Bootstrap vcpkg
        shell: bash
        run: |
          set -euo pipefail
          root="${RUNNER_TEMP}/vcpkg"
          git clone --filter=blob:none https://github.com/microsoft/vcpkg.git "$root"
          git -C "$root" checkout 04a735608afac5844e86fc91d6ba2112cac613c1
          if [[ "${RUNNER_OS}" == "Windows" ]]; then
            "$root/bootstrap-vcpkg.bat" -disableMetrics
          else
            "$root/bootstrap-vcpkg.sh" -disableMetrics
          fi
          echo "VCPKG_ROOT=$root" >> "$GITHUB_ENV"

      - name: Configure Windows Release
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cmake -S . -B build/ci -G 'Visual Studio 17 2022' -A x64 `
            -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake" `
            -DVCPKG_TARGET_TRIPLET=${{ matrix.triplet }} `
            -DVCPKG_HOST_TRIPLET=${{ matrix.triplet }} `
            -DSANDHYBRID_WARNINGS_AS_ERRORS=ON `
            -DSANDHYBRID_ENABLE_VALIDATION=OFF `
            -DBUILD_TESTING=ON

      - name: Configure Linux Release
        if: runner.os == 'Linux'
        shell: bash
        run: |
          cmake -S . -B build/ci -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE="$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake" \
            -DVCPKG_TARGET_TRIPLET=${{ matrix.triplet }} \
            -DVCPKG_HOST_TRIPLET=${{ matrix.triplet }} \
            -DSANDHYBRID_WARNINGS_AS_ERRORS=ON \
            -DSANDHYBRID_ENABLE_VALIDATION=OFF \
            -DBUILD_TESTING=ON

      - name: Build Windows Release
        if: runner.os == 'Windows'
        run: cmake --build build/ci --config Release --parallel

      - name: Build Linux Release
        if: runner.os == 'Linux'
        run: cmake --build build/ci --parallel

      - name: Test Windows Release
        if: runner.os == 'Windows'
        run: ctest --test-dir build/ci -C Release --output-on-failure

      - name: Test Linux Release
        if: runner.os == 'Linux'
        run: ctest --test-dir build/ci --output-on-failure

      - name: Install Windows package
        if: runner.os == 'Windows'
        shell: pwsh
        run: cmake --install build/ci --config Release --prefix dist/${{ matrix.artifact }}

      - name: Install Linux package
        if: runner.os == 'Linux'
        run: cmake --install build/ci --prefix dist/${{ matrix.artifact }}

      - name: Add package documentation
        shell: bash
        run: cp README.md LICENSE LIBRARY.md REWRITE_PLAN.md missioncache.md CHANGELOG.md "dist/${{ matrix.artifact }}/"

      - name: Archive Windows package
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path 'dist/${{ matrix.artifact }}/*' -DestinationPath 'dist/${{ matrix.artifact }}.zip'

      - name: Archive Linux package
        if: runner.os == 'Linux'
        run: tar -C dist -czf 'dist/${{ matrix.artifact }}.tar.gz' '${{ matrix.artifact }}'

      - name: Upload Windows package
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.artifact }}.zip
          if-no-files-found: error

      - name: Upload Linux package
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.artifact }}.tar.gz
          if-no-files-found: error

  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Publish v2.5.6 release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mapfile -t assets < <(find dist -type f \( -name '*.zip' -o -name '*.tar.gz' \) -print | sort)
          if [[ "${#assets[@]}" -ne 2 ]]; then
            printf 'Expected two package assets, found %s\n' "${#assets[@]}" >&2
            printf '%s\n' "${assets[@]}" >&2
            exit 1
          fi
          if gh release view v2.5.6 >/dev/null 2>&1; then
            gh release upload v2.5.6 "${assets[@]}" --clobber
            gh release edit v2.5.6 \
              --title 'SandHybrid v2.5.6' \
              --notes-file CHANGELOG.md \
              --latest
          else
            gh release create v2.5.6 "${assets[@]}" \
              --target "$GITHUB_SHA" \
              --title 'SandHybrid v2.5.6' \
              --notes-file CHANGELOG.md \
              --latest
          fi

      - name: Remove completed agent branches
        shell: bash
        run: |
          git push origin --delete agent/beehive-primary-cache-release-v252 || true
          git push origin --delete agent/scene-geology-stack-v251 || true
          git push origin --delete agent/integrate-core-hygiene-release-v253 || true
          git push origin --delete agent/finalize-missioncache-release-v253 || true
          git push origin --delete agent/external-handoff-priority-note || true
          git push origin --delete agent/tmp-noop || true
          git push origin --delete agent/durable-structural-ground-deposits-v254 || true
          git push origin --delete agent/cache-foundations-v255 || true
          git push origin --delete agent/debug-map-inventory-v256 || true
          git push origin --delete agent/v256-debug-output || true
          # Preserve agent/nonoverlap-core-hygiene per Adam's explicit instruction.
