name: SandHybrid CI and Release

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    tags:
      - v2.5.19
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sandhybrid-v2518-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            triplet: x64-windows
            artifact: SandHybrid-Windows-x64-v2.5.19
          - os: ubuntu-24.04
            triplet: x64-linux
            artifact: SandHybrid-Linux-x64-v2.5.19
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4

      - name: Validate release tree
        run: python tools/validate_release_tree.py

      - name: Validate generated and shader contracts
        run: python tools/validate_shader_contracts.py

      - name: Validate v2.5.10 terrain and liquid recovery
        run: python tools/validate_v2510_contract.py

      - name: Validate v2.5.11 world persistence
        run: python tools/validate_v2511_contract.py

      - name: Validate v2.5.12 runtime and UI recovery
        run: python tools/validate_v2512_contract.py

      - name: Validate phase-one runtime recovery
        run: python tools/validate_v2513_contract.py

      - name: Validate v2.5.15 historical recovery
        run: python tools/validate_v2515_contract.py

      - name: Validate v2.5.19 Blueprint and pause recovery
        run: python tools/validate_v2516_contract.py

      - name: Validate v2.5.19 packaged state-readback recovery
        run: python tools/validate_v2517_contract.py

      - name: Validate v2.5.19 scenic tiles and fixed-step recovery
        run: python tools/validate_v2519_contract.py

      - name: Audit ecology and hive motion
        run: |
          python tools/audit_ecology_motion.py
          python tools/audit_fix34.py

      - name: Validate canonical mission cache
        run: python tools/validate_mission_cache.py

      - name: Reject simulation coroutines
        run: python tools/validate_no_simulation_coroutines.py

      - name: Enforce SandHybrid branding
        run: python tools/validate_project_branding.py

      - name: Install Linux host packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libxcb1-dev

      - name: Bootstrap vcpkg
        shell: bash
        run: |
          set -euo pipefail
          root="${RUNNER_TEMP}/vcpkg"
          git clone --filter=blob:none https://github.com/microsoft/vcpkg.git "$root"
          git -C "$root" checkout 04a735608afac5844e86fc91d6ba2112cac613c1
          if [[ "${RUNNER_OS}" == "Windows" ]]; then
            "$root/bootstrap-vcpkg.bat" -disableMetrics
          else
            "$root/bootstrap-vcpkg.sh" -disableMetrics
          fi
          echo "VCPKG_ROOT=$root" >> "$GITHUB_ENV"

      - name: Configure Windows Release
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cmake -S . -B build/ci -G 'Visual Studio 17 2022' -A x64 `
            -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake" `
            -DVCPKG_TARGET_TRIPLET=${{ matrix.triplet }} `
            -DVCPKG_HOST_TRIPLET=${{ matrix.triplet }} `
            -DSANDHYBRID_WARNINGS_AS_ERRORS=ON `
            -DSANDHYBRID_ENABLE_VALIDATION=OFF `
            -DBUILD_TESTING=ON

      - name: Configure Linux Release
        if: runner.os == 'Linux'
        shell: bash
        run: |
          cmake -S . -B build/ci -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE="$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake" \
            -DVCPKG_TARGET_TRIPLET=${{ matrix.triplet }} \
            -DVCPKG_HOST_TRIPLET=${{ matrix.triplet }} \
            -DSANDHYBRID_WARNINGS_AS_ERRORS=ON \
            -DSANDHYBRID_ENABLE_VALIDATION=OFF \
            -DBUILD_TESTING=ON

      - name: Build Windows Release
        if: runner.os == 'Windows'
        run: cmake --build build/ci --config Release --parallel

      - name: Build Linux Release
        if: runner.os == 'Linux'
        run: cmake --build build/ci --parallel

      - name: Test Windows Release
        if: runner.os == 'Windows'
        run: ctest --test-dir build/ci -C Release --output-on-failure

      - name: Test Linux Release
        if: runner.os == 'Linux'
        run: ctest --test-dir build/ci --output-on-failure

      - name: Install Windows package
        if: runner.os == 'Windows'
        shell: pwsh
        run: cmake --install build/ci --config Release --prefix dist/${{ matrix.artifact }}

      - name: Install Linux package
        if: runner.os == 'Linux'
        run: cmake --install build/ci --prefix dist/${{ matrix.artifact }}

      - name: Add package documentation
        shell: bash
        run: |
          cp README.md LICENSE LIBRARY.md REWRITE_PLAN.md missioncache.md CHANGELOG.md \
            MISSION_LEDGER.md HIERARCHICAL_SIMULATION.md HALF_WATER.md MAP_VIEW.md \
            SCENE_LAYOUT.md SAVE_LAYOUT.md RELEASE_NOTES.md VALIDATION.md \
            "dist/${{ matrix.artifact }}/"

      - name: Archive Windows package
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path 'dist/${{ matrix.artifact }}/*' -DestinationPath 'dist/${{ matrix.artifact }}.zip'

      - name: Archive Linux package
        if: runner.os == 'Linux'
        run: tar -C dist -czf 'dist/${{ matrix.artifact }}.tar.gz' '${{ matrix.artifact }}'

      - name: Generate Windows SHA-256
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $archive = 'dist/${{ matrix.artifact }}.zip'
          $checksum = "$archive.sha256"
          $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $archive).Hash.ToLowerInvariant()
          "$hash  $([System.IO.Path]::GetFileName($archive))" | Set-Content -NoNewline -LiteralPath $checksum

      - name: Generate Linux SHA-256
        if: runner.os == 'Linux'
        shell: bash
        run: |
          cd dist
          sha256sum '${{ matrix.artifact }}.tar.gz' > '${{ matrix.artifact }}.tar.gz.sha256'

      - name: Upload Windows package
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            dist/${{ matrix.artifact }}.zip
            dist/${{ matrix.artifact }}.zip.sha256
          if-no-files-found: error

      - name: Upload Linux package
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            dist/${{ matrix.artifact }}.tar.gz
            dist/${{ matrix.artifact }}.tar.gz.sha256
          if-no-files-found: error

  publish:
    if: github.event_name == 'push' && github.ref == 'refs/tags/v2.5.19'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Publish stable v2.5.19 release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mapfile -t assets < <(find dist -type f \( -name '*.zip' -o -name '*.tar.gz' -o -name '*.sha256' \) -print | sort)
          if [[ "${#assets[@]}" -ne 4 ]]; then
            printf 'Expected two packages and two checksums, found %s\n' "${#assets[@]}" >&2
            printf '%s\n' "${assets[@]}" >&2
            exit 1
          fi
          if gh release view v2.5.19 >/dev/null 2>&1; then
            gh release upload v2.5.19 "${assets[@]}" --clobber
            gh release edit v2.5.19 \
              --title 'SandHybrid v2.5.19' \
              --notes-file RELEASE_NOTES.md
          else
            gh release create v2.5.19 "${assets[@]}" \
              --verify-tag \
              --title 'SandHybrid v2.5.19' \
              --notes-file RELEASE_NOTES.md
          fi
